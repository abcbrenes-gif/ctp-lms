<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Misión Seguros · CTP Mercedes Norte</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js?v=20261030i"></script>

<style>
:root{
  --bg:#f3f6ff;--card:#fff;--ink:#1b2340;--mut:#5d6889;--line:#dfe5f5;
  --blue:#2563eb;--blue2:#1d4ed8;--blue-s:#e6eeff;
  --green:#16a34a;--green2:#22c55e;--green-s:#e3f8ea;
  --purple:#7c3aed;--purple2:#a855f7;--purple-s:#f1eaff;
  --red:#dc2626;--red-s:#fde8e8;--amber:#d97706;--amber-s:#fff4dc;
  --r:18px;--sh:0 10px 30px rgba(37,56,120,.10);
  --c1:#2563eb;--c2:#dc2626;--c3:#0d9488;--c4:#d97706;--c5:#16a34a;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Nunito","Segoe UI",system-ui,Roboto,sans-serif}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:10px 16px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--blue2),var(--blue));box-shadow:0 4px 0 #1e3a8a;transition:transform .12s,box-shadow .12s,filter .12s}
button:hover{filter:brightness(1.06)}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #1e3a8a}
button:focus-visible,.blk:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--purple);outline-offset:3px}
button:disabled{opacity:.45;cursor:not-allowed;transform:none}
button.sec{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
button.ok{background:linear-gradient(135deg,#15803d,var(--green2));box-shadow:0 4px 0 #14532d}
button.pur{background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 4px 0 #4c1d95}
button.ghost{background:transparent;color:var(--mut);box-shadow:none;padding:6px 10px}
.hidden{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
/* barra superior */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:2px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:1.1rem;margin-right:auto}
.brand .logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:1.3rem;background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff}
.stat{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:800}
.xpbar{width:140px;height:10px;border-radius:99px;background:var(--purple-s);overflow:hidden}
.xpbar>span{display:block;height:100%;background:linear-gradient(90deg,var(--purple),var(--purple2));transition:width .6s}
.streak.on{border-color:#fdba74;background:#fff7ed;color:#c2410c}
.streak.pop{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.18)}}
/* mapa de niveles */
h1{font-size:1.7rem;margin:6px 0 2px}
.sub{color:var(--mut);margin:0 0 18px}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.lvl{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:2px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;transition:transform .2s}
.lvl:not(.lock):hover{transform:translateY(-3px)}
.lvl .n{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:1.6rem;color:#fff;background:linear-gradient(135deg,var(--blue),var(--purple))}
.lvl h3{margin:0;font-size:1.05rem}
.lvl p{margin:0;color:var(--mut);font-size:.9rem}
.lvl.lock{opacity:.6}
.lvl.lock .n{background:#9aa5c4}
.lvl.done{border-color:#86efac}
.lvl.done .n{background:linear-gradient(135deg,#15803d,var(--green2))}
.prog{height:12px;background:var(--blue-s);border-radius:99px;overflow:hidden}
.prog>span{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--green2));transition:width .6s}
.lvl small{color:var(--mut);font-weight:700}
.missions{display:flex;flex-wrap:wrap;gap:6px}
.mdot{width:34px;height:34px;padding:0;border-radius:50%;font-size:.8rem;box-shadow:0 3px 0 #1e3a8a}
.mdot.done{background:linear-gradient(135deg,#15803d,var(--green2));box-shadow:0 3px 0 #14532d}
.mdot.lock{background:#c7cee3;box-shadow:0 3px 0 #9aa5c4}
/* misión */
.mhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.mhead h2{margin:0;font-size:1.25rem;margin-right:auto}
.tag{display:inline-block;font-size:.75rem;font-weight:800;padding:3px 10px;border-radius:99px;background:var(--purple-s);color:var(--purple)}
.story{background:linear-gradient(135deg,#1e3a8a,#4c1d95);color:#fff;border-radius:var(--r);padding:18px 20px;box-shadow:var(--sh);display:flex;gap:16px;align-items:flex-start}
.story .ic{font-size:2.4rem;line-height:1}
.story b{color:#fde68a}
.story p{margin:4px 0 0}
.datos{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.datos span{background:rgba(255,255,255,.14);border-radius:10px;padding:5px 10px;font-weight:800}
.game{display:grid;grid-template-columns:320px minmax(0,1fr);gap:16px;margin-top:16px;align-items:start}
@media(max-width:900px){.game{grid-template-columns:minmax(0,1fr)!important}}
.panel{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:2px solid var(--line);padding:14px}
.panel h4{margin:0 0 8px;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.bank{display:flex;flex-direction:column;gap:8px;max-height:62vh;overflow:auto;padding:2px}
@media(max-width:900px){.game>.panel:first-child{position:sticky;top:0;z-index:15}.bank{max-height:none;flex-direction:row;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:6px}.bank .blk{flex:0 0 230px;scroll-snap-align:start}.top{position:static}}
@media(max-width:620px){.col{min-height:110px}.top .wrap{gap:8px}.xpbar{width:70px}.brand div div{display:none}}
.blk{display:flex;gap:10px;align-items:center;background:#fff;border:2px solid var(--line);border-left:6px solid var(--cc,var(--c1));border-radius:14px;padding:9px 10px;cursor:grab;user-select:none;touch-action:none;transition:transform .15s,box-shadow .15s,border-color .15s;text-align:left;color:var(--ink);font-weight:700;box-shadow:0 2px 0 var(--line)}
.blk:hover{transform:translateX(3px)}
.blk.sel{border-color:var(--purple);box-shadow:0 0 0 4px var(--purple-s)}
.blk.used{opacity:.4}
.blk .cd{font-family:ui-monospace,Consolas,monospace;font-size:.78rem;background:var(--blue-s);color:var(--blue2);border-radius:8px;padding:2px 6px;white-space:nowrap}
.blk .nm{font-size:.86rem;line-height:1.2}
.blk .cl{display:block;font-size:.68rem;color:var(--cc);font-weight:900;text-transform:uppercase;letter-spacing:.04em}
.ghost-drag{position:fixed;z-index:100;pointer-events:none;transform:rotate(-3deg) scale(1.04);box-shadow:0 18px 40px rgba(0,0,0,.25);opacity:.95;width:280px}
/* comprobante */
.voucher{background:#fffef7;border:2px solid #eadfb8;border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.voucher .vh{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:#fff6d6;border-bottom:2px dashed #eadfb8;font-weight:900}
.cols{display:grid;grid-template-columns:1fr 1fr}
@media(max-width:620px){.cols{grid-template-columns:1fr}}
.col{padding:12px;min-height:200px;display:flex;flex-direction:column;gap:8px;transition:background .2s}
.col+.col{border-left:2px dashed #eadfb8}
@media(max-width:620px){.col+.col{border-left:0;border-top:2px dashed #eadfb8}}
.col .ch{display:flex;justify-content:space-between;align-items:center;font-weight:900;letter-spacing:.08em}
.col.debe .ch{color:var(--blue2)}.col.haber .ch{color:var(--purple)}
.col.over{background:#eef4ff}
.col.haber.over{background:#f5efff}
.drop{border:2px dashed #cfd7ee;border-radius:14px;padding:12px;text-align:center;color:var(--mut);font-weight:700;font-size:.86rem;background:transparent;box-shadow:none}
.drop:hover{border-color:var(--purple);color:var(--purple)}
.line{display:grid;grid-template-columns:1fr 130px 30px;gap:6px;align-items:center;background:#fff;border:2px solid var(--line);border-left:6px solid var(--cc);border-radius:12px;padding:7px 8px;animation:slide .25s ease}
@keyframes slide{from{opacity:0;transform:translateY(-6px)}}
.line .cd{font-family:ui-monospace,Consolas,monospace;font-size:.74rem;color:var(--blue2)}
.line .nm{font-size:.82rem;font-weight:700;line-height:1.15}
.line input{width:100%;font:inherit;font-weight:800;text-align:right;border:2px solid var(--line);border-radius:10px;padding:7px 8px;font-variant-numeric:tabular-nums}
.line .x{padding:0;width:30px;height:30px;border-radius:50%;background:var(--red-s);color:var(--red);box-shadow:none}
.line.good{border-color:#86efac;background:var(--green-s)}
.line.bad{border-color:#fca5a5;background:var(--red-s);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.tot{display:grid;grid-template-columns:1fr 1fr;border-top:2px dashed #eadfb8;font-weight:900;font-variant-numeric:tabular-nums}
.tot div{padding:10px 14px;display:flex;justify-content:space-between}
.tot div+div{border-left:2px dashed #eadfb8}
.balance{padding:8px 14px;text-align:center;font-weight:800;font-size:.9rem}
.balance.okb{background:var(--green-s);color:var(--green)}
.balance.nob{background:var(--amber-s);color:var(--amber)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center}
.fb{margin-top:12px;border-radius:14px;padding:12px 14px;font-weight:700;display:flex;gap:10px;align-items:flex-start}
.fb.bad{background:var(--red-s);color:#991b1b;border:2px solid #fca5a5}
.fb.ok{background:var(--green-s);color:#166534;border:2px solid #86efac}
.fb.tip{background:var(--amber-s);color:#92400e;border:2px solid #fcd34d}
.fb ul{margin:4px 0 0;padding-left:18px}
.stamp{position:absolute;right:24px;top:40%;transform:rotate(-14deg) scale(3);opacity:0;border:5px solid var(--green);color:var(--green);font-weight:900;font-size:1.4rem;letter-spacing:.1em;padding:4px 14px;border-radius:12px;background:rgba(255,255,255,.85);pointer-events:none}
.stamp.on{animation:stamp .55s forwards}
@keyframes stamp{to{transform:rotate(-14deg) scale(1);opacity:1}}
/* nivel 1 */
.code{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.seg{min-width:72px;border:2px dashed #b8c3e6;border-radius:14px;padding:8px;text-align:center;background:#fff;color:var(--ink);box-shadow:none}
.seg .d{font-family:ui-monospace,Consolas,monospace;font-size:1.5rem;font-weight:900;color:var(--blue2)}
.seg .lb{display:block;min-height:22px;font-size:.78rem;font-weight:800;color:var(--purple)}
.seg.good{border-style:solid;border-color:var(--green);background:var(--green-s)}
.seg.bad{border-style:solid;border-color:var(--red);background:var(--red-s)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{background:var(--purple-s);color:var(--purple);box-shadow:0 3px 0 #ddd0fb;border:2px solid #ddd0fb}
.chip.sel{background:var(--purple);color:#fff}
.chip.used{opacity:.35}
.bins{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media(max-width:860px){.bins{grid-template-columns:repeat(2,1fr)}}
.bin{border:2px dashed var(--cc);border-radius:16px;padding:10px;min-height:140px;background:#fff;display:flex;flex-direction:column;gap:6px;color:var(--ink);box-shadow:none;text-align:left;font-weight:600}
.bin .bt{font-weight:900;color:var(--cc);text-align:center}
.bin.over{background:var(--blue-s)}
.mini{font-size:.78rem;border:2px solid var(--line);border-left:5px solid var(--cc,#9aa5c4);border-radius:10px;padding:5px 7px;background:#fff}
.mini.good{border-color:#86efac;background:var(--green-s)}
.mini.bad{border-color:#fca5a5;background:var(--red-s)}
.quiz{display:flex;flex-direction:column;gap:10px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.opt{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);text-align:left}
.opt.good{background:var(--green-s);border-color:var(--green)}
.opt.bad{background:var(--red-s);border-color:var(--red)}
/* manual */
dialog{border:0;border-radius:22px;padding:0;width:min(860px,94vw);max-height:88vh;box-shadow:0 30px 80px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(20,26,60,.45);backdrop-filter:blur(3px)}
.mh{display:flex;align-items:center;gap:10px;padding:14px 18px;background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff}
.mh h3{margin:0;margin-right:auto}
.mtabs{display:flex;gap:6px;flex-wrap:wrap;padding:10px 18px 0}
.mtabs button{background:var(--blue-s);color:var(--blue2);box-shadow:none;padding:7px 12px}
.mtabs button.on{background:var(--blue);color:#fff}
.mbody{padding:14px 18px 20px;overflow:auto;max-height:calc(88vh - 120px)}
.mbody table{width:100%;border-collapse:collapse;font-size:.88rem}
.mbody td,.mbody th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.mbody .cd{font-family:ui-monospace,Consolas,monospace;color:var(--blue2);white-space:nowrap}
.rule{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:10px 0}
.rule div{border-radius:14px;padding:12px;border:2px solid var(--line)}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:200}
html,body{overflow-x:hidden}
.toast{max-width:90vw;text-align:center;position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:800;z-index:150;transition:transform .35s}
.toast.on{transform:translateX(-50%) translateY(0)}
.toast:empty{display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div class="top"><div class="wrap">
  <div class="brand"><div class="logo">🛡️</div><div>Misión Seguros<div style="font-size:.72rem;color:var(--mut);font-weight:700">Contabilidad de seguros · Plan SUGESE</div></div></div>
  <div class="stat" title="Experiencia acumulada">⭐ <span id="xpTxt">0 XP</span><div class="xpbar" aria-hidden="true"><span id="xpBar" style="width:0"></span></div></div>
  <div class="stat streak" id="streak" title="Racha de respuestas correctas seguidas">🔥 <span id="streakTxt">0</span></div>
  <button class="pur" id="btnManual">📖 Manual de Pistas</button>
  <button class="sec" id="btnSonido" aria-pressed="true" title="Sonido">🔊</button>
  <a href="index.html" class="stat" style="text-decoration:none;color:var(--ink)">← Plataforma</a>
</div></div>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="sr" id="live" aria-live="assertive"></div>

  <div class="mh"><h3 id="manualTit">📖 Manual de Pistas</h3><button class="sec" id="cerrarManual">Cerrar ✕</button></div>
  <div class="mtabs" id="mtabs"></div>
  <div class="mbody" id="mbody"></div>
</dialog>

<script>
"use strict";
// ═══════════════════════════════════════════════════════════════════════
// Datos: tomados únicamente de la «Guía de Contabilidad de Seguros» (SUGESE)
// ═══════════════════════════════════════════════════════════════════════
const CLASES={1:{n:"Activo",c:"var(--c1)",aum:"D"},2:{n:"Pasivo",c:"var(--c2)",aum:"H"},3:{n:"Patrimonio",c:"var(--c3)",aum:"H"},4:{n:"Gasto",c:"var(--c4)",aum:"D"},5:{n:"Ingreso",c:"var(--c5)",aum:"H"}};
const PLAN=[
 ["1.010","Disponibilidades (Bancos / Caja)"],
 ["1.020.020","Inversiones disponibles para la venta"],
 ["1.040.030.010","Primas por cobrar, seguro directo — Tomadores"],
 ["1.040.030.020","Primas por cobrar, seguro directo — Intermediarios"],
 ["1.040.040","Primas vencidas"],
 ["1.040.080.030","Derechos de cobro con agentes e intermediarios de seguros"],
 ["1.050.010","Cuenta corriente coaseguro"],
 ["1.060.010.010","Participación del reaseguro cedido en la provisión para primas no devengadas"],
 ["1.060.010.020","Participación del reaseguro retrocedido en la provisión para primas no devengadas"],
 ["1.090.020.040","Comisiones diferidas de contratos de seguros y reaseguro aceptado"],
 ["2.050.010.010","Provisión para primas no devengadas — Seguro directo"],
 ["2.050.020.010","Provisión para insuficiencia de primas — Seguro directo"],
 ["2.050.030.010","Provisión matemática — Seguro directo"],
 ["2.050.040.010","Siniestros liquidados y no pagados — Seguro directo"],
 ["2.050.040.030","Siniestros liquidados y controvertidos por el asegurado"],
 ["2.050.040.050","Siniestros en proceso de liquidación — Seguro directo"],
 ["2.050.050.010","Provisión para siniestros ocurridos y no reportados (IBNR) — Seguro directo"],
 ["2.050.060.010","Provisión para participación en beneficios y extornos — Seguro directo"],
 ["2.060.010.010","Reaseguro cedido (cuentas acreedoras)"],
 ["2.060.010.020","Reaseguro retrocedido (cuentas acreedoras)"],
 ["2.070.010.010","Obligaciones con asegurados — Primas extornadas"],
 ["2.070.020","Obligaciones con agentes e intermediarios"],
 ["2.070.020.010","Obligaciones con agentes e intermediarios — Comisiones por pagar"],
 ["2.080.010.080","Comisiones diferidas de contratos de reaseguro cedido y retrocedido"],
 ["3.010","Patrimonio neto y reservas de capital (3.010 a 3.080)"],
 ["4.020.010.010","Siniestros pagados — Seguro directo"],
 ["4.020.030.010","Participación en beneficios y extornos — Seguro directo"],
 ["4.030.010.010","Gastos por comisiones seguro directo — Sobre primas emitidas"],
 ["4.030.010.070","Ajustes por comisiones diferidas"],
 ["4.040.010.010","Primas cedidas por reaseguro cedido"],
 ["4.070","Gastos de administración"],
 ["4.080.010.010","Ajustes a provisiones técnicas (gasto) — Primas no devengadas e insuficiencia de primas"],
 ["4.080.010.020","Ajustes a provisiones técnicas (gasto) — Provisiones matemáticas"],
 ["4.080.010.030","Ajustes a provisiones técnicas (gasto) — Provisiones para siniestros"],
 ["4.080.010.040","Ajustes a provisiones técnicas (gasto) — Participación en beneficios y extornos"],
 ["4.080.010.070","Participación del reaseguro en las provisiones técnicas (gasto)"],
 ["5.020.010.010","Primas emitidas — Seguro directo (netas de extornos y anulaciones)"],
 ["5.030.010.010","Comisiones sobre primas cedidas"],
 ["5.030.010.040","Comisiones reaseguro cedido — Ajustes por comisiones diferidas"],
 ["5.030.020.010","Comisiones sobre primas retrocedidas"],
 ["5.030.020.040","Comisiones reaseguro retrocedido — Ajustes por comisiones diferidas"],
 ["5.040","Siniestros recuperados"],
 ["5.070.010.010","Ajustes a provisiones técnicas (ingreso) — Primas no devengadas e insuficiencia de primas"],
 ["5.070.010.020","Ajustes a provisiones técnicas (ingreso) — Provisión matemática, seguro directo"],
 ["5.070.010.030","Ajustes a provisiones técnicas (ingreso) — Provisiones para siniestros"],
 ["5.070.010.040","Ajustes a provisiones técnicas (ingreso) — Participación en beneficios y extornos"],
 ["5.070.010.070","Participación del reaseguro en las provisiones técnicas (ingreso)"]
].map(([cod,nom])=>({cod,nom,cl:+cod[0]}));
const CTA=Object.fromEntries(PLAN.map(a=>[a.cod,a]));

// Asientos: [código, "D"|"H", monto]
const NIVELES=[
 {id:1,ic:"🔢",t:"El código de 14 dígitos y la clasificación",d:"Descifra la estructura del código contable y clasifica las cuentas por su clase.",misiones:[
   {id:"1-1",tipo:"codigo",t:"Descifra el código",ic:"🧩",historia:"¡Bienvenido a la aseguradora! Antes de registrar, necesitas leer el idioma de las cuentas. Coloca cada etiqueta sobre su parte del código.",cod:["1","040","030","010","M","001"]},

const SES=(()=>{try{return JSON.parse(sessionStorage.getItem("ctp_lms_session_v2")||"null")}catch(e){return null}})();
const ES_DOCENTE=!!(SES&&SES.role==="docente")||/[?&]docente=1/.test(location.search);
const KEY="mision_seguros_v1_"+((SES&&SES.id)||"invitado");
let EST={xp:0,racha:0,mejorRacha:0,hechas:{},sonido:true};
try{Object.assign(EST,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){}
const guardar=()=>{try{localStorage.setItem(KEY,JSON.stringify(EST))}catch(e){}};
const TODAS=NIVELES.flatMap(n=>n.misiones);
const XP_MAX=TODAS.length*100;
const nivelDe=mid=>NIVELES.find(n=>n.misiones.some(m=>m.id===mid));
const hechasNivel=n=>n.misiones.filter(m=>EST.hechas[m.id]).length;
const nivelAbierto=n=>ES_DOCENTE||n.id===1||hechasNivel(NIVELES[n.id-2])===NIVELES[n.id-2].misiones.length;
const misionAbierta=(n,i)=>ES_DOCENTE||(nivelAbierto(n)&&(i===0||EST.hechas[n.misiones[i-1].id]));

const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>"₡"+Math.round(n).toLocaleString("es-CR");
const num=v=>{let s=String(v||"").replace(/[₡\s]/g,"");if(!s)return 0;
  if(/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(s))s=s.replace(/\./g,"").replace(",",".");else if(/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(s))s=s.replace(/,/g,"");else s=s.replace(",",".");
  const n=Number(s);return isFinite(n)?n:NaN};
const clase=cod=>CLASES[+String(cod)[0]];
const nomLado=l=>l==="D"?"Debe":"Haber";
function anunciar(t){$("#live").textContent=t}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.k);toast.k=setTimeout(()=>e.classList.remove("on"),2600)}

// ═══ Barra de progreso ═══
function pintarStats(salto){
  $("#xpTxt").textContent=EST.xp+" XP";$("#xpBar").style.width=Math.min(100,100*EST.xp/XP_MAX)+"%";
  const s=$("#streak");$("#streakTxt").textContent=EST.racha;s.classList.toggle("on",EST.racha>=2);
  if(salto){s.classList.remove("pop");void s.offsetWidth;s.classList.add("pop")}
  $("#btnSonido").textContent=EST.sonido?"🔊":"🔇";$("#btnSonido").setAttribute("aria-pressed",String(EST.sonido));
}
function acierto(mid,intentos){
  const nueva=!EST.hechas[mid];
  const gana=nueva?Math.max(40,100-20*(intentos-1)):10;
  EST.xp+=gana;EST.racha++;EST.mejorRacha=Math.max(EST.mejorRacha,EST.racha);
  if(nueva)EST.hechas[mid]={xp:gana,intentos,fecha:new Date().toISOString()};
  guardar();pintarStats(true);confeti();sonar("ok");return gana;
}
function fallo(){EST.racha=0;guardar();pintarStats();sonar("bad")}

// ═══ Sonido y confeti ═══
let AC=null;
function sonar(tipo){if(!EST.sonido)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const notas=tipo==="ok"?[523,659,784,1047]:tipo==="bad"?[220,180]:[660];
  notas.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=tipo==="bad"?"sawtooth":"triangle";o.frequency.value=f;

function confeti(){

  const col=["#2563eb","#16a34a","#7c3aed","#f59e0b","#ec4899","#06b6d4"];
  const P=Array.from({length:150},()=>({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*6+4,c:col[Math.random()*col.length|0],a:Math.random()*6,va:(Math.random()-.5)*.3}));
  let t=0;(function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});

// ═══ Arrastrar y soltar (mouse y dedo) + tocar para colocar ═══
// Cualquier elemento con data-drag se puede arrastrar sobre un data-drop.
// Tocar un bloque lo selecciona; tocar después una zona lo coloca ahí.
let SEL=null;
function seleccionar(el){document.querySelectorAll(".sel").forEach(e=>e.classList.remove("sel"));SEL=el&&el!==SEL?el:null;if(SEL){SEL.classList.add("sel");anunciar("Seleccionaste "+(SEL.dataset.lbl||SEL.textContent.trim())+". Ahora toca dónde colocarlo.")}}
let SOLTAR=null;
function activarArrastre(root,alSoltar){
  SOLTAR=alSoltar;if(root.dataset.arrastreListo)return;root.dataset.arrastreListo="1";alSoltar=(a,b)=>SOLTAR&&SOLTAR(a,b);
  root.addEventListener("pointerdown",e=>{
    const el=e.target.closest("[data-drag]");if(!el||e.button>0||e.target.closest("input,.x"))return;
    const x0=e.clientX,y0=e.clientY;let g=null,over=null;
    const mover=ev=>{
      if(!g&&Math.hypot(ev.clientX-x0,ev.clientY-y0)<8)return;
      if(!g){g=el.cloneNode(true);g.classList.add("ghost-drag");g.classList.remove("sel");g.style.width=Math.min(300,el.offsetWidth)+"px";document.body.appendChild(g);try{el.setPointerCapture(e.pointerId)}catch(_){}}
      g.style.left=ev.clientX-20+"px";g.style.top=ev.clientY-20+"px";
      g.style.display="none";const z=document.elementFromPoint(ev.clientX,ev.clientY);g.style.display="";
      const d=z&&z.closest("[data-drop]");if(d!==over){over&&over.classList.remove("over");over=d;over&&over.classList.add("over")}
    };
    const fin=()=>{removeEventListener("pointermove",mover);removeEventListener("pointerup",fin);removeEventListener("pointercancel",fin);
      if(g){g.remove();over&&over.classList.remove("over");if(over){SEL=null;document.querySelectorAll(".sel").forEach(x=>x.classList.remove("sel"));alSoltar(el,over);sonar("tic")}
        el.dataset.arrastrado="1";setTimeout(()=>delete el.dataset.arrastrado,50)}};
    addEventListener("pointermove",mover);addEventListener("pointerup",fin);addEventListener("pointercancel",fin);
  });
  root.addEventListener("click",e=>{
    const el=e.target.closest("[data-drag]");
    if(el&&!e.target.closest("input,.x")){if(el.dataset.arrastrado)return;seleccionar(el);return}
    const d=e.target.closest("[data-drop]");
    if(d&&SEL&&!e.target.closest("input,.x")){const s=SEL;seleccionar(null);alSoltar(s,d);sonar("tic")}
  });
}

function banco(m){
  const ok=[...new Set(m.lineas.map(l=>l[0]))];
  const sim=PLAN.filter(a=>!ok.includes(a.cod)).map(a=>{let s=0;ok.forEach(c=>{if(a.cod.slice(0,5)===c.slice(0,5))s+=3;if(a.cod.slice(0,9)===c.slice(0,9))s+=3;if(a.cl===+c[0])s+=1;
    const w=CTA[c].nom.toLowerCase().split(/\W+/).filter(x=>x.length>5);if(w.some(x=>a.nom.toLowerCase().includes(x)))s+=2});return {a,s:s+((m.id.charCodeAt(0)*a.cod.length)%7)/10}});
  sim.sort((x,y)=>y.s-x.s);
  const dist=sim.slice(0,Math.max(5,9-ok.length)).map(x=>x.a.cod);
  let seed=[...m.id].reduce((t,c)=>t*31+c.charCodeAt(0),7);const rnd=()=>((seed=(seed*9301+49297)%233280)/233280);
  return [...ok,...dist].sort(()=>rnd()-.5);
}

    const pistas=[];const marca={};
    st.lineas.forEach((l,i)=>{const e=esperado.find(x=>x.cod===l.cod),a=CTA[l.cod],k=clase(l.cod);
      if(!e){marca[i]="bad";pistas.push(`La cuenta <b>${l.cod} ${esc(a.nom)}</b> no participa en esta transacción.`);return}
      if(e.lado!==l.lado){marca[i]="bad";const aum=k.aum===e.lado;pistas.push(`¡Casi! <b>${esc(a.nom)}</b> es ${k.n==="Patrimonio"?"parte del":"un"} <b>${k.n}</b>: aquí ${aum?"aumenta":"disminuye"}, por eso va al <b>${nomLado(e.lado)}</b>.`);return}
      if(Math.abs(num(l.monto)-e.monto)>0.5){marca[i]="bad";pistas.push(`<b>${esc(a.nom)}</b> está en el lado correcto, pero revisa el monto con los datos de la misión.`);return}
      marca[i]="good"});
    const faltan=esperado.filter(e=>!st.lineas.some(l=>l.cod===e.cod));
    faltan.forEach(e=>pistas.push(`Falta una cuenta en el <b>${nomLado(e.lado)}</b>. Pista: busca una cuenta de <b>${clase(e.cod).n}</b> (clase ${e.cod[0]}).`));
    const {d,h}=totales();
    if(d!==h)pistas.push(`La partida doble no cuadra: el Debe suma ${fmt(d)} y el Haber ${fmt(h)}.`);
    if(!pistas.length){st.sellado=true;const g=acierto(m.id,st.intentos);
      st.fb=`<div class="fb ok">🎉 ¡Asiento sellado! +${g} XP ${st.intentos===1?"· ¡a la primera! 🌟":""}<br><small>${esc(m.tip)}</small></div>`;pintar();anunciar("Asiento correcto. Ganaste "+g+" XP");return}
    fallo();
    st.fb=`<div class="fb bad">🤔 <div>Revisa esto:<ul>${pistas.slice(0,3).map(p=>`<li>${p}</li>`).join("")}</ul></div></div>`;
    pintar();Object.entries(marca).forEach(([i,c])=>{const el=document.querySelector(`.line[data-i="${i}"]`);el&&el.classList.add(c)});
    anunciar("El asiento tiene errores. Revisa las pistas.");
  };
  activarArrastre($("#app"),(el,zona)=>{const L=zona.closest("[data-drop]").dataset.drop;if(L==="D"||L==="H")colocar(el.dataset.cta,L)});
  pintar();
}

// ═══ Manual de pistas ═══
const MAN={

    <table><thead><tr><th>Código</th><th>Cuenta</th><th>Clase</th></tr></thead><tbody id="planBody">${PLAN.map(a=>`<tr data-q="${esc((a.cod+" "+a.nom).toLowerCase())}"><td class="cd">${a.cod}</td><td>${esc(a.nom)}</td><td style="color:${CLASES[a.cl].c};font-weight:800">${CLASES[a.cl].n}</td></tr>`).join("")}</tbody></table>`,
  doble:()=>`<p><b>Partida doble:</b> en todo asiento, la suma del <b>Debe</b> es igual a la suma del <b>Haber</b>.</p>
    <div class="rule"><div style="background:var(--blue-s)"><b>Aumentan en el DEBE</b><br>1 · Activos<br>4 · Gastos<br><small>Disminuyen en el Haber</small></div>
    <div style="background:var(--purple-s)"><b>Aumentan en el HABER</b><br>2 · Pasivos<br>3 · Patrimonio<br>5 · Ingresos<br><small>Disminuyen en el Debe</small></div></div>
    <p><b>Truco:</b> una <i>constitución</i> o <i>aumento</i> de provisión técnica es gasto (4.080) contra pasivo (2.050). Una <i>reversión</i>, <i>liberación</i> o <i>disminución</i> rebaja el pasivo (2.050) contra ingreso (5.070).</p>`,
  codigo:()=>`<p>El catálogo usa un código de <b>14 dígitos</b> que va de lo general a lo detallado:</p>
    <table><tbody>${ETIQ_COD.map((e,i)=>`<tr><td><b>${e}</b></td><td>${DIG_COD[i]}</td></tr>`).join("")}</tbody></table>
    <p>Ejemplo: <span class="cd">1 . 040 . 030 . 010 . M . 001</span> → clase 1 (Activo), grupo 040, cuenta 030, subcuenta 010, moneda M y cuenta analítica 001.</p>
    <p><b>Clases:</b> 1 Activos · 2 Pasivos · 3 Patrimonio · 4 Gastos · 5 Ingresos.</p>`,
  reglas:()=>`<h4>Primas</h4><ul><li>Al vender un seguro se contabiliza la <b>totalidad</b> de la prima del periodo de cobertura, haya o no pago fraccionado.</li><li>Se contabiliza el gasto total por comisiones del mediador y se periodifica durante la cobertura.</li><li>El ingreso por primas se periodifica con la <b>Provisión para primas no devengadas</b>.</li></ul>
    <h4>Ciclo de un siniestro</h4><ol><li><b>Notificación:</b> se constituye una provisión estimada.</li><li><b>Ajuste:</b> la estimación sube o baja con nueva información.</li><li><b>Liquidación / pago:</b> se fija la indemnización y se paga, o se rechaza si no hay cobertura.</li></ol>
    <h4>Provisión matemática</h4><p>Valor neto de las obligaciones del asegurador por seguros sobre la vida a la fecha de cierre.</p>
    <h4>Reaseguro</h4><p>Es el «seguro de las aseguradoras»: la entidad cedente transfiere parte de sus grandes riesgos a una reaseguradora.</p>`
};
const MTABS=[["plan","📚 Plan de cuentas"],["doble","⚖️ Partida doble"],["codigo","🔢 Código de 14 dígitos"],["reglas","📌 Reglas clave"]];
function abrirManual(t){t=t||"plan";$("#mtabs").innerHTML=MTABS.map(([k,l])=>`<button class="${k===t?"on":""}" data-mt="${k}">${l}</button>`).join("");$("#mbody").innerHTML=MAN[t]();
  document.querySelectorAll("[data-mt]").forEach(b=>b.onclick=()=>abrirManual(b.dataset.mt));
  const q=$("#buscaPlan");if(q)q.oninput=()=>{const v=q.value.toLowerCase().trim();document.querySelectorAll("#planBody tr").forEach(r=>r.hidden=v&&!r.dataset.q.includes(v))};
  const d=$("#manual");if(!d.open)d.showModal()}
$("#btnManual").onclick=()=>abrirManual();
$("#cerrarManual").onclick=()=>$("#manual").close();
$("#manual").addEventListener("click",e=>{if(e.target===$("#manual"))$("#manual").close()});
$("#btnSonido").onclick=()=>{EST.sonido=!EST.sonido;guardar();pintarStats()};

pintarStats();render();
try{bitacoraRegistrar("seguros")}catch(e){}
</script>
