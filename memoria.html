<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Memoria Contable · CTP Mercedes Norte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js?v=20261029e"></script>
<script src="js/actividades.js?v=20261029e"></script>
<script src="js/memoria-pdf.js?v=20261029e"></script>
<script src="js/memoria-dividir.js?v=20261029e"></script>
<style>
/* Layout: consola de juego — panel de métricas arriba, tablero al centro, barra de respuesta fija abajo. Un solo look oscuro a propósito. */
:root{
  --bg:#0b0d17; --panel:#121527; --panel-2:#181c33; --line:#262b4a;
  --fg:#e7e9ff; --muted:#8b90b8;
  --cyan:#29e7ff; --magenta:#ff3dbb; --amber:#ffc23d;
  --ok:#35f28b; --bad:#ff4d5e;
  --display:"Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{
  margin:0; background:var(--bg); color:var(--fg); font-family:var(--body); font-size:15px; line-height:1.45;
  background-image:
    radial-gradient(60rem 30rem at 85% -10%, color-mix(in oklab, var(--magenta) 16%, transparent), transparent 70%),
    radial-gradient(50rem 30rem at -10% 110%, color-mix(in oklab, var(--cyan) 12%, transparent), transparent 70%),
    linear-gradient(var(--bg), var(--bg));
  background-attachment:fixed;
}
.wrap{max-width:1080px; margin:0 auto; padding-block:20px 120px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); display:flex; flex-direction:column; gap:16px}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--cyan); outline-offset:2px}

/* Encabezado */
.top{display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:12px}
.brand h1{font-family:var(--display); font-weight:700; font-size:clamp(1.6rem, 4vw, 2.3rem); letter-spacing:.02em; margin:0; line-height:1; text-wrap:balance}
.brand h1 span{color:var(--cyan); text-shadow:0 0 18px color-mix(in oklab, var(--cyan) 60%, transparent)}
.brand p{margin:6px 0 0; color:var(--muted); font-size:.9rem}
.controls{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.select, .btn{
  background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:9px 12px; cursor:pointer;
  transition:border-color .2s, box-shadow .2s, transform .1s;
}
.btn:hover,.select:hover{border-color:var(--cyan)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(90deg, var(--magenta), color-mix(in oklab, var(--magenta) 55%, var(--cyan))); border:0; color:#0b0d17; font-weight:700; font-family:var(--display); letter-spacing:.04em}
.btn.ghost{background:transparent}

/* HUD */
.hud{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:10px}
.stat{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:10px 14px; min-width:0}
.stat .k{font-family:var(--display); text-transform:uppercase; letter-spacing:.12em; font-size:.68rem; color:var(--muted)}
.stat .v{font-family:var(--mono); font-weight:700; font-size:clamp(1.25rem, 3.4vw, 1.7rem); font-variant-numeric:tabular-nums; line-height:1.2}
.stat.score .v{color:var(--cyan)}
.stat.combo .v{color:var(--amber)}
.stat.combo.hot{border-color:var(--amber); box-shadow:0 0 0 1px var(--amber) inset, 0 0 24px color-mix(in oklab, var(--amber) 30%, transparent)}
.combo-x{font-size:.75em; color:var(--muted)}
.bump{animation:bump .35s ease}
#puntos,#combo{display:inline-block; transform-origin:left center}
@keyframes bump{40%{transform:scale(1.18)}}
.progress{height:8px; background:var(--panel); border:1px solid var(--line); border-radius:99px; overflow:hidden}
.progress i{display:block; height:100%; width:0; background:linear-gradient(90deg, var(--cyan), var(--magenta)); box-shadow:0 0 12px var(--cyan); transition:width .5s cubic-bezier(.2,.8,.2,1)}
.progress-row{display:flex; align-items:center; gap:10px; font-family:var(--mono); font-size:.8rem; color:var(--muted)}
.progress-row .progress{flex:1}

/* Tablero */
.board{display:grid; gap:12px; grid-template-columns:repeat(auto-fill, minmax(clamp(96px, 15vw, 150px), 1fr)); perspective:1100px}
.card{position:relative; aspect-ratio:3/4; max-width:100%; border:0; padding:0; background:none; cursor:pointer; border-radius:16px}
.card:disabled{cursor:default}
.inner{position:absolute; inset:0; transform-style:preserve-3d; transition:transform .55s cubic-bezier(.2,.8,.2,1); border-radius:16px}
.card.flip .inner{transform:rotateY(180deg)}
.face{position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; border-radius:16px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; padding:10px; text-align:center}
.back{
  background:
    repeating-linear-gradient(45deg, transparent 0 10px, color-mix(in oklab, var(--cyan) 7%, transparent) 10px 11px),
    linear-gradient(160deg, var(--panel-2), var(--panel));
  border:1px solid var(--line);
}
.back .chip{font-family:var(--mono); font-weight:700; font-size:clamp(1rem,3vw,1.3rem); color:color-mix(in oklab, var(--cyan) 70%, var(--fg)); letter-spacing:.1em}
.back .sub{font-family:var(--display); font-size:.62rem; letter-spacing:.2em; color:var(--muted); text-transform:uppercase}
.card:not(:disabled):hover .back{border-color:var(--cyan); box-shadow:0 0 20px color-mix(in oklab, var(--cyan) 25%, transparent)}
.front{transform:rotateY(180deg); background:linear-gradient(170deg, #1d2240, #141831); border:1px solid color-mix(in oklab, var(--magenta) 55%, var(--line))}
.front .ico{font-size:clamp(2rem, 7vw, 3.1rem); line-height:1; filter:drop-shadow(0 4px 12px rgba(0,0,0,.5))}
.front .hint{font-size:clamp(.68rem, 1.7vw, .8rem); color:var(--muted); line-height:1.3}
.front .slots{font-family:var(--mono); font-size:.66rem; color:color-mix(in oklab, var(--magenta) 70%, var(--fg)); letter-spacing:.08em; word-break:break-word}
.front .solved{display:none; font-family:var(--display); font-weight:700; font-size:clamp(.72rem, 1.9vw, .92rem); color:var(--ok); line-height:1.15}
.card.active .front{border-color:var(--magenta); box-shadow:0 0 0 1px var(--magenta) inset, 0 0 26px color-mix(in oklab, var(--magenta) 45%, transparent)}
.card.done .front{border-color:var(--ok); box-shadow:0 0 0 1px var(--ok) inset, 0 0 22px color-mix(in oklab, var(--ok) 35%, transparent)}
.card.done .front .hint,.card.done .front .slots{display:none}
.card.done .front .solved{display:block}
.card.ok .front{animation:glow .9s ease}
.card.bad .inner{animation:shake .45s ease}
.card.bad .front{border-color:var(--bad); box-shadow:0 0 0 1px var(--bad) inset, 0 0 24px color-mix(in oklab, var(--bad) 45%, transparent)}
@keyframes glow{0%{box-shadow:0 0 0 0 var(--ok)}40%{box-shadow:0 0 0 6px color-mix(in oklab, var(--ok) 60%, transparent), 0 0 40px var(--ok)}100%{box-shadow:0 0 0 1px var(--ok) inset, 0 0 22px color-mix(in oklab, var(--ok) 35%, transparent)}}
@keyframes shake{0%,100%{transform:rotateY(180deg) translateX(0)}20%{transform:rotateY(180deg) translateX(-9px)}40%{transform:rotateY(180deg) translateX(8px)}60%{transform:rotateY(180deg) translateX(-6px)}80%{transform:rotateY(180deg) translateX(4px)}}
.toast{position:absolute; left:50%; top:8px; transform:translateX(-50%); font-family:var(--display); font-weight:700; font-size:.78rem; padding:3px 9px; border-radius:99px; white-space:nowrap; pointer-events:none; z-index:3; animation:pop 1.1s ease forwards}
.toast.ok{background:var(--ok); color:#06140c}
.toast.bad{background:var(--bad); color:#1a0508}
@keyframes pop{0%{opacity:0; transform:translate(-50%,6px) scale(.8)}20%{opacity:1; transform:translate(-50%,-4px) scale(1.05)}80%{opacity:1}100%{opacity:0; transform:translate(-50%,-14px)}}

/* Barra de respuesta */
.answer{
  position:fixed; left:0; right:0; bottom:0; z-index:20;
  padding-block:12px calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
  background:color-mix(in oklab, var(--bg) 88%, transparent); backdrop-filter:blur(10px); border-top:1px solid var(--line);
  transform:translateY(110%); transition:transform .3s cubic-bezier(.2,.8,.2,1);
}
.answer.show{transform:none}
.answer form{max-width:1080px; margin:0 auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.answer .tag{font-family:var(--display); font-size:.7rem; letter-spacing:.14em; text-transform:uppercase; color:var(--magenta); flex-basis:100%}
.answer input{flex:1 1 14rem; min-width:0; background:var(--panel); border:1px solid var(--magenta); border-radius:12px; padding:12px 14px; font-family:var(--mono); font-size:1.05rem; box-shadow:0 0 18px color-mix(in oklab, var(--magenta) 25%, transparent)}
.answer input.err{border-color:var(--bad); animation:shake2 .4s}
@keyframes shake2{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.answer .msg{font-size:.82rem; color:var(--muted); min-height:1.2em; flex-basis:100%}

/* Modales */
.overlay{position:fixed; inset:0; z-index:40; display:grid; place-items:center; padding:16px; background:rgba(5,6,14,.72); backdrop-filter:blur(6px)}
.modal{width:min(560px, 100%); max-height:90vh; overflow:auto; background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:22px; box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal h2{font-family:var(--display); margin:0 0 4px; font-size:1.5rem}
.medal{display:flex; align-items:center; gap:14px; margin:14px 0}
.medal .m{font-size:3.2rem; line-height:1; filter:drop-shadow(0 0 18px color-mix(in oklab, var(--amber) 60%, transparent))}
.medal b{font-family:var(--display); font-size:1.3rem; display:block}
.medal span{color:var(--muted); font-size:.88rem}
.grid2{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px; margin:12px 0 18px}
.modal .row{display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap}
.modal textarea{width:100%; min-height:15rem; background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:10px; font-family:var(--mono); font-size:.8rem; line-height:1.5; resize:vertical}
.modal p{color:var(--muted); font-size:.88rem}
.modal code{font-family:var(--mono); color:var(--cyan)}
.note{color:var(--muted); font-size:.8rem}
.note.err{color:var(--bad)}

@media (max-width:640px){
  .hud{grid-template-columns:repeat(2, minmax(0,1fr))}
  .board{gap:8px; grid-template-columns:repeat(3, minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){
  .inner{transition:none}
  .card.ok .front,.card.bad .inner,.bump,.toast,.answer input.err{animation:none}
}

/* Imagen en la carta */
.front .pic{width:100%; flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:center}
.front .pic img{max-width:100%; max-height:100%; object-fit:contain; border-radius:10px; background:#fff1}
.card.done .front .pic{flex:1 1 auto}
.qty{display:flex; align-items:center; gap:6px; background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:4px 6px 4px 12px}
.qty label{font-size:.8rem; color:var(--muted)}
.qty input{width:4.2rem; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:5px 6px; font-family:var(--mono); text-align:center}
.qty .btn{padding:5px 9px; font-size:.8rem}
.badge-doc{font-family:var(--display); font-size:.65rem; letter-spacing:.14em; text-transform:uppercase; color:var(--amber); border:1px solid var(--amber); border-radius:99px; padding:2px 8px}
/* Editor del docente */
.modal.ancho{width:min(900px, 100%)}
.ed-top{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:10px 0}
.ed-top input[type=text]{flex:1 1 14rem; min-width:0; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:9px 10px}
.drop{display:block; border:2px dashed color-mix(in oklab, var(--cyan) 50%, var(--line)); border-radius:14px; padding:16px; text-align:center; color:var(--muted); cursor:pointer; transition:background .2s}
.drop.over{background:color-mix(in oklab, var(--cyan) 10%, transparent)}
.drop b{color:var(--cyan)}
.ed-lista{display:flex; flex-direction:column; gap:8px; margin-top:12px}
.ed-fila{display:grid; grid-template-columns:64px minmax(0,1fr) auto; gap:10px; align-items:center; background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:8px}
.ed-fila .th{width:64px; height:64px; border-radius:10px; background:var(--panel-2); display:grid; place-items:center; overflow:hidden; font-size:2rem; cursor:pointer}
.ed-fila .th img{width:100%; height:100%; object-fit:cover}
.ed-campos{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:6px; min-width:0}
.ed-campos input{min-width:0; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:7px 8px; font-size:.85rem}
.ed-campos input.falta{border-color:var(--bad)}
.ed-fila .quitar{background:transparent; border:1px solid var(--line); border-radius:8px; color:var(--bad); padding:6px 9px; cursor:pointer}
.confirm{display:flex; gap:8px; align-items:center; flex-wrap:wrap; background:color-mix(in oklab, var(--bad) 12%, transparent); border:1px solid var(--bad); border-radius:10px; padding:8px 10px; margin-top:8px; font-size:.85rem}
@media (max-width:640px){ .ed-campos{grid-template-columns:1fr} .ed-fila{grid-template-columns:56px minmax(0,1fr) auto} .ed-fila .th{width:56px;height:56px} }

/* Plataforma: inicio, panel del docente e instrumento */
h2,h3{font-family:var(--display); text-wrap:balance}
h3{margin:18px 0 8px; font-size:1.05rem; color:var(--cyan); letter-spacing:.03em}
a.btn{text-decoration:none; display:inline-flex; align-items:center}
.btn.big{font-size:1.1rem; padding:12px 22px}
.row{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.note.ok{color:var(--ok)}
.inicio{background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:28px; text-align:center; max-width:720px; margin:20px auto}
.inicio h2{font-size:1.6rem; margin:0 0 8px}
.inicio p{color:var(--muted)}
.estado-nota{background:color-mix(in oklab, var(--cyan) 10%, transparent); border:1px solid color-mix(in oklab, var(--cyan) 40%, var(--line)); border-radius:12px; padding:10px 12px; color:var(--fg)!important}
.panel-doc{background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:18px; display:flex; flex-direction:column; gap:10px}
.panel-doc h2 .mep{font-size:.8rem; color:var(--magenta)}
.panel-doc input:not([type=checkbox]):not([type=radio]), .panel-doc select, .panel-doc textarea{background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:9px 10px; min-width:0}
.panel-doc textarea{width:100%; font-family:var(--body); font-size:.88rem; resize:vertical}
.ia-box{border:2px dashed color-mix(in oklab, var(--magenta) 60%, var(--line)); background:color-mix(in oklab, var(--magenta) 7%, transparent); border-radius:14px; padding:12px}
.grid-ins{display:grid; grid-template-columns:repeat(auto-fit, minmax(12rem, 1fr)); gap:10px}
.grid-ins.dos{grid-template-columns:repeat(auto-fit, minmax(16rem, 1fr))}
.fld{display:flex; flex-direction:column; gap:4px; font-size:.82rem; font-weight:600}
.ind{border:1px solid var(--line); border-radius:14px; padding:10px; background:var(--panel-2)}
.ind-top{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.ind-top .num{display:grid; place-items:center; width:2.2rem; height:2.2rem; border-radius:10px; background:var(--magenta); color:#0b0d17; font-weight:800; font-family:var(--display)}
.ind-top select{flex:1 1 14rem}
.pts{display:flex; align-items:center; gap:6px; font-size:.82rem; font-weight:600}
.pts input{width:4.2rem}
.ind details{margin:8px 0 0 2.7rem}
.ind summary{cursor:pointer; font-weight:700; color:var(--cyan); font-size:.85rem}
.nivel{display:flex; gap:8px; align-items:flex-start; margin-top:6px; flex-wrap:wrap}
.nv{flex:0 0 8.5rem; border-radius:8px; padding:6px 8px; font-weight:700; font-size:.8rem}
.nv-avanzado{background:color-mix(in oklab, var(--ok) 22%, transparent); color:var(--ok)}
.nv-intermedio{background:color-mix(in oklab, var(--amber) 22%, transparent); color:var(--amber)}
.nv-inicial{background:color-mix(in oklab, var(--bad) 22%, transparent); color:#ff8f9a}
.nivel textarea{flex:1 1 16rem}
.ind .quitar{background:transparent; border:1px solid var(--line); border-radius:8px; color:var(--bad); padding:6px 9px; cursor:pointer}
.barra-guardar{position:sticky; bottom:0; z-index:5; display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:flex-end; padding-block:10px 4px; background:var(--panel); border-top:1px solid var(--line); margin-top:6px}
.chk{display:flex; gap:8px; align-items:center; font-size:.9rem}
.qty span{font-size:.8rem; color:var(--muted)}
.ins-datos{background:var(--panel-2); border:1px solid var(--line); border-radius:12px; padding:10px 12px; font-size:.88rem; display:grid; gap:4px; margin:10px 0}
.tabla-wrap{overflow-x:auto}
table.ins{width:100%; border-collapse:collapse; font-size:.82rem}
table.ins th, table.ins td{border:1px solid var(--line); padding:7px; vertical-align:top; text-align:left}
table.ins th{background:var(--panel-2); font-family:var(--display)}
table.ins th.nv-avanzado{color:var(--ok)} table.ins th.nv-intermedio{color:var(--amber)} table.ins th.nv-inicial{color:#ff8f9a}
table.ins td.c{text-align:center}
.modal code{font-family:var(--mono); color:var(--cyan)}
.panel-doc code{font-family:var(--mono); color:var(--cyan)}
.acciones-carta{display:flex; flex-direction:column; gap:6px; align-items:flex-end}
.acciones-carta .btn{padding:6px 9px; font-size:.8rem}
.div-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:12px; margin-top:10px}
.div-tile{background:var(--panel-2); border:1px solid var(--line); border-radius:14px; padding:10px; display:flex; flex-direction:column; gap:6px; min-width:0}
.div-tile.off{opacity:.45}
.div-tile input:not([type=checkbox]){background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:7px 8px; font-size:.85rem; min-width:0}
.div-tile input.falta{border-color:var(--bad)}
.div-vista{position:relative; border-radius:8px; overflow:hidden; touch-action:none; background:#fff; isolation:isolate}
.div-vista canvas{display:block; width:100%; height:auto}
.div-som{position:absolute; left:0; right:0; background:repeating-linear-gradient(45deg, rgba(8,10,20,.86) 0 8px, rgba(8,10,20,.74) 8px 16px); pointer-events:none; display:flex; align-items:center; justify-content:center}
.div-som::after{content:"no se muestra"; font-family:var(--display); font-size:.7rem; letter-spacing:.12em; text-transform:uppercase; color:#ffffffb0}
.div-som.arriba{top:0}
.div-som.abajo{bottom:0}
.div-linea{position:absolute; left:0; right:0; height:16px; margin-top:-8px; cursor:ns-resize; z-index:2}
.div-linea::after{content:""; position:absolute; left:0; right:0; top:7px; height:3px; background:var(--magenta); box-shadow:0 0 8px var(--magenta)}
.div-linea::before{content:"⇕"; position:absolute; right:6px; top:-4px; font-size:14px; color:#fff; background:var(--magenta); border-radius:6px; padding:0 5px; line-height:22px}
.expl{grid-column:1 / -1; font-size:.78rem; color:var(--muted)}
.expl summary{cursor:pointer}
.expl div{padding:4px 2px 0}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header class="top">
    <div class="brand">
      <h1>MEMORIA <span>CONTABLE</span></h1>
      <p id="subtitulo">CTP Mercedes Norte · Contabilidad</p>
    </div>
    <div class="controls" id="controles"></div>
  </header>
  <div id="vista"><p class="note">Cargando…</p></div>
</div>

<div class="answer" id="respuesta">
  <form id="formRespuesta" autocomplete="off">
    <span class="tag" id="tagCarta">Carta activa</span>
    <input id="campo" type="text" placeholder="Escribí el concepto…" aria-label="Respuesta" spellcheck="false" autocapitalize="off" autocomplete="off">
    <button class="btn primary" type="submit">RESPONDER</button>
    <button class="btn ghost" type="button" id="pista">Pista −25</button>
    <button class="btn ghost" type="button" id="soltar">Soltar</button>
    <span class="msg" id="msg"></span>
  </form>
</div>

<div class="overlay" id="modal" hidden>
  <div class="modal ancho" role="dialog" aria-modal="true" id="modalCaja"></div>
</div>

<script>
// ─────────────────────────────────────────────────────────────────────────
// Memoria Contable — juego de memoria y escritura rápida (trabajo cotidiano)
//   memoria.html?trabajo=ID&docente=1  → el docente sube cartas, define la
//                                          evaluación (formato MEP) y prueba
//   memoria.html?trabajo=ID&est=ID      → el estudiante juega; al terminar el
//                                          tablero la nota se guarda sola
// Usa la misma base de datos de la plataforma (sb, de js/config.js) y las
// funciones de js/actividades.js (niveles MEP, guardar nota del indicador).
// ─────────────────────────────────────────────────────────────────────────
(() => {
  const $ = s => document.querySelector(s);
  const esc = t => String(t == null ? "" : t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const norm = t => String(t || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase()
    .replace(/[^a-z0-9\s]/g, " ").replace(/\s+/g, " ").trim();
  const params = new URLSearchParams(location.search);
  const TRABAJO_ID = Number(params.get("trabajo")) || null;
  let sesion = null;
  try { sesion = JSON.parse(sessionStorage.getItem("ctp_lms_session_v2")); } catch (e) {}
  const ES_DOCENTE = params.get("docente") === "1" && sesion && sesion.role === "docente";
  const EST_ID = (sesion && sesion.role === "estudiante" && sesion.id) || params.get("est") || null;

  const AUTO = [
    ["memoria_dominio_pct", "Automático: % de conceptos bien al primer intento"],
    ["memoria_precision_pct", "Automático: % de respuestas correctas"],
    ["memoria_autonomia_pct", "Automático: % de cartas sin pista"],
    ["memoria_rapidez_pct", "Automático: tiempo promedio por carta"],
    ["", "Lo califico yo (a mano, por nivel)"]
  ];
  const NIVELES = [["avanzado", "Avanzado", 3], ["intermedio", "Intermedio", 2], ["inicial", "Inicial", 1]];
  const nivelesDe = c => tiraderaNivelesDe(c);

  let T = null;          // trabajo (fila de trabajos_cotidianos)
  let C = {};            // contenido_actividad
  let ENTREGA = null;    // actividades_estudiante del estudiante

  async function cargarTrabajo() {
    const { data, error } = await sb.from("trabajos_cotidianos").select("*").eq("id", TRABAJO_ID).maybeSingle();
    if (error || !data) throw new Error("No se encontró el trabajo.");
    T = data; C = data.contenido_actividad || {};
    if (C.estrategia !== "juego_memoria") throw new Error("Este trabajo no es de Memoria Contable.");
    C.memoria_cartas = C.memoria_cartas || [];
    C.memoria_cfg = { cantidad: 12, cuenta: "primero", pistas: true, ...(C.memoria_cfg || {}) };
    C.criterios = C.criterios || [];
    $("#subtitulo").textContent = T.titulo;
    document.title = "Memoria Contable · " + T.titulo;
  }
  // Guarda cambios sobre la versión más reciente del contenido (no pisa lo de otros).
  async function guardarContenido(cambios) {
    const { data: actual } = await sb.from("trabajos_cotidianos").select("contenido_actividad").eq("id", T.id).maybeSingle();
    const nuevo = { ...((actual && actual.contenido_actividad) || C), ...cambios };
    const { error } = await sb.from("trabajos_cotidianos").update({ contenido_actividad: nuevo }).eq("id", T.id);
    if (error) throw error;
    C = nuevo; T.contenido_actividad = nuevo;
  }

  // ───── Modal ─────
  function abrirModal(html) { $("#modalCaja").innerHTML = html; $("#modal").hidden = false; }
  function cerrarModal() { $("#modal").hidden = true; $("#modalCaja").innerHTML = ""; }
  $("#modal").addEventListener("click", e => { if (e.target.id === "modal") cerrarModal(); });

  function instrumentoHTML(criterios, I) {
    I = { ...MEMORIA_INSTRUMENTO_BASE, ...(I || {}) };
    const total = criterios.reduce((a, c) => a + (Number(c.puntos_max) || 0), 0);
    const dato = (k, v) => v ? `<div><b>${k}:</b> ${esc(v)}</div>` : "";
    return `<h2>📋 Evaluación · ${esc(T.titulo)}</h2>
      <p class="note">${esc(I.tipo)} · Componente: ${esc(I.componente)} · CTP Mercedes Norte</p>
      <div class="ins-datos">${dato("Subárea", I.subarea)}${dato("Unidad de estudio / tema", I.unidad)}${dato("Resultado de aprendizaje", I.resultado)}${dato("Indicador de logro", I.indicador)}</div>
      <div class="tabla-wrap"><table class="ins"><thead><tr><th>Indicador / criterio de desempeño</th>${NIVELES.map(([k, et, v]) => `<th class="nv-${k}">${et} (${v})</th>`).join("")}<th>Puntos</th></tr></thead><tbody>
      ${criterios.map((c, i) => { const nv = nivelesDe(c); return `<tr><td><b>${i + 1}. ${esc(c.nombre)}</b><br><small class="note">${c.auto ? "Se calcula solo con tu partida." : "Lo califica el docente."}</small></td>${NIVELES.map(([k]) => `<td>${esc(nv[k] || "")}</td>`).join("")}<td class="c"><b>${c.puntos_max}</b></td></tr>`; }).join("")}
      <tr><td colspan="4" style="text-align:right"><b>Total de puntos</b></td><td class="c"><b>${total}</b></td></tr></tbody></table></div>
      <p class="note" style="margin-top:10px">Escala: Avanzado = 3 · Intermedio = 2 · Inicial = 1 · Sin evidencia = 0. Calificación = puntos obtenidos × 100 ÷ ${total}. ${C.memoria_cfg.cuenta === "mejor" ? "Cuenta tu mejor partida completa." : "Cuenta tu primera partida completa; las siguientes son de práctica."}</p>`;
  }

  // ═════════════════════ MODO DOCENTE ═════════════════════
  let pestana = "cartas", EDC = null, EDE = null, EDI = null, cambiarIdx = null;

  function vistaDocente() {
    $("#controles").innerHTML = `
      <button class="btn ${pestana === "cartas" ? "primary" : "ghost"}" data-tab="cartas" type="button">🃏 Cartas</button>
      <button class="btn ${pestana === "eval" ? "primary" : "ghost"}" data-tab="eval" type="button">📋 Evaluación (MEP)</button>
      <button class="btn ${pestana === "cfg" ? "primary" : "ghost"}" data-tab="cfg" type="button">⚙️ Partida</button>
      <button class="btn ghost" data-tab="probar" type="button">▶ Probar</button>
      <a class="btn ghost" href="index.html" data-volver>← Plataforma</a>`;
    $("#controles").querySelectorAll("[data-tab]").forEach(b => b.addEventListener("click", () => {
      if (b.dataset.tab === "probar") { if (!C.memoria_cartas.length) { aviso("Primero suba cartas y guárdelas.", true); return; } pantallaInicio(true); return; }
      pestana = b.dataset.tab; vistaDocente();
    }));
    if (pestana === "cartas") pintarCartas();
    else if (pestana === "eval") pintarEvaluacion();
    else pintarConfig();
  }
  const aviso = (t, err) => { const n = $("#nota"); if (n) { n.className = "note" + (err ? " err" : " ok"); n.innerHTML = t; } };

  // --- Cartas ---
  const conceptoDeArchivo = n => {
    const t = n.replace(/\.[a-z0-9]+$/i, "").replace(/^[\d\s._-]+(?=[a-záéíóúñ])/i, "").replace(/[_\-.]+/g, " ").replace(/\s+/g, " ").trim();
    return t ? t[0].toUpperCase() + t.slice(1) : "";
  };
  function achicar(file) {
    return new Promise((ok, mal) => {
      const im = new Image(), url = URL.createObjectURL(file);
      im.onerror = () => { URL.revokeObjectURL(url); mal(new Error(file.name + " no es una imagen válida")); };
      im.onload = () => {
        const k = Math.min(1, 640 / Math.max(im.width, im.height));
        const cv = document.createElement("canvas");
        cv.width = Math.max(1, Math.round(im.width * k)); cv.height = Math.max(1, Math.round(im.height * k));
        cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height);
        URL.revokeObjectURL(url);
        cv.toBlob(b => b ? ok(b) : mal(new Error("No se pudo procesar " + file.name)), "image/webp", 0.82);
      };
      im.src = url;
    });
  }
  async function subirImagen(file) { return subirBlob(await achicar(file), file.name); }
  async function subirBlob(blob, nombre) {
    const ruta = `memoria/${T.id}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.webp`;
    const { error } = await sb.storage.from("materiales").upload(ruta, blob, { contentType: "image/webp" });
    if (error) throw new Error("No se pudo subir " + (nombre || "la imagen") + ": " + error.message);
    return sb.storage.from("materiales").getPublicUrl(ruta).data.publicUrl;
  }
  function pintarCartas() {
    if (!EDC) EDC = JSON.parse(JSON.stringify(C.memoria_cartas));
    $("#vista").innerHTML = `
      <section class="panel-doc">
        <p class="note">Suba sus <b>láminas</b> (una imagen con varios cuadros: título, dibujo y explicación) o un <b>PDF</b>. La plataforma separa cada cuadro como una carta que muestra <b>solo el dibujo</b>: el título pasa a ser el <b>concepto</b> que el estudiante escribe y la explicación, la pista. Antes de crear las cartas usted revisa cada recorte. Las cartas que ya subió se pueden separar con <b>✂️ Dividir</b>. La validación ignora mayúsculas, tildes y espacios.</p>
        <label class="drop" id="drop" for="archivos"><b>📄 Subir láminas, imágenes o PDF</b> · arrástrelos aquí o toque para elegir (puede elegir varios a la vez)
          <input id="archivos" type="file" accept="application/pdf,.pdf,image/*" multiple hidden></label>
        <input id="cambiarImg" type="file" accept="image/*" hidden>
        <div class="row" style="justify-content:space-between; margin-top:10px"><span class="note">${EDC.length} carta${EDC.length === 1 ? "" : "s"}</span><button class="btn ghost" type="button" id="emoji">+ Carta con emoji</button></div>
        <div class="ed-lista" id="lista">${EDC.length ? EDC.map((c, i) => `
          <div class="ed-fila">
            <button type="button" class="th" data-cambiar="${i}" title="Cambiar imagen" aria-label="Cambiar imagen de la carta ${i + 1}">${c.img ? `<img alt="" src="${esc(c.img)}">` : esc(c.ico || "❔")}</button>
            <div class="ed-campos">
              <input data-campo="concepto" data-i="${i}" value="${esc(c.concepto)}" placeholder="Concepto exacto *" aria-label="Concepto de la carta ${i + 1}" class="${(c.concepto || "").trim() ? "" : "falta"}">
              <input data-campo="pista" data-i="${i}" value="${esc(c.pista)}" placeholder="Pista corta (opcional)" aria-label="Pista de la carta ${i + 1}">
              <input data-campo="otras" data-i="${i}" value="${esc(c.otras)}" placeholder="Otras respuestas válidas; separadas por ;" aria-label="Otras respuestas de la carta ${i + 1}">
              ${c.img ? "" : `<input data-campo="ico" data-i="${i}" value="${esc(c.ico)}" placeholder="Emoji" aria-label="Emoji de la carta ${i + 1}">`}
              ${c.explicacion ? `<details class="expl"><summary>Explicación del PDF</summary><div>${esc(c.explicacion)}</div></details>` : ""}
            </div>
            <span class="acciones-carta">${c.img ? `<button type="button" class="btn ghost" data-dividir="${i}" title="Separar esta imagen en varias cartas o quitarle el título">✂️ Dividir</button>` : ""}<button type="button" class="quitar" data-quitar="${i}" aria-label="Quitar carta ${i + 1}">✕</button></span>
          </div>`).join("") : `<p class="note">Todavía no hay cartas. Suba imágenes arriba.</p>`}</div>
        <div class="barra-guardar"><span class="note" id="nota"></span><button class="btn primary" type="button" id="guardarCartas">💾 GUARDAR CARTAS</button></div>
      </section>`;
    const lista = $("#lista");
    lista.querySelectorAll("[data-campo]").forEach(inp => inp.addEventListener("input", () => { EDC[inp.dataset.i][inp.dataset.campo] = inp.value; if (inp.dataset.campo === "concepto") inp.classList.toggle("falta", !inp.value.trim()); }));
    lista.querySelectorAll("[data-quitar]").forEach(b => b.addEventListener("click", () => { EDC.splice(Number(b.dataset.quitar), 1); pintarCartas(); aviso("Carta quitada. Toque Guardar para confirmar."); }));
    lista.querySelectorAll("[data-dividir]").forEach(b => b.addEventListener("click", async () => {
      const i = Number(b.dataset.dividir), c = EDC[i];
      aviso("Abriendo la imagen…");
      try {
        const lienzo = await memoriaLienzoDe(c.img);
        const hechas = await memoriaDividirLamina({ lienzo, nombre: c.concepto || "Imagen " + (i + 1), tema: T.titulo, subir: bl => subirBlob(bl, "carta") });
        if (hechas.length) { EDC.splice(i, 1, ...hechas); pintarCartas(); aviso(`Se reemplazó por ${hechas.length} carta(s). Toque <b>Guardar cartas</b>.`); } else aviso("");
      } catch (e) { aviso(esc(e.message || e), true); }
    }));
    lista.querySelectorAll("[data-cambiar]").forEach(b => b.addEventListener("click", () => { cambiarIdx = Number(b.dataset.cambiar); $("#cambiarImg").click(); }));
    $("#emoji").addEventListener("click", () => { EDC.push({ img: "", ico: "📌", concepto: "", pista: "", otras: "" }); pintarCartas(); });
    const agregar = async files => {
      const todos = [...files];
      const pdfs = todos.filter(f => f.type === "application/pdf" || /\.pdf$/i.test(f.name));
      const fs = todos.filter(f => f.type.startsWith("image/"));
      const resumen = [], avisos = [];
      // PDF: cada imagen con su explicación de abajo → una carta.
      for (const f of pdfs) {
        try {
          const { cartas, avisos: av, laminas } = await memoriaExtraerCartasDePdf(f, m => aviso(`${esc(f.name)}: ${m}`));
          avisos.push(...av);
          // Páginas que son una sola imagen (lámina o escaneo): se dividen en cuadros.
          for (const lam of laminas) {
            const hechas = await memoriaDividirLamina({ lienzo: lam.lienzo, nombre: `${f.name} · página ${lam.pagina}`, tema: T.titulo, subir: b => subirBlob(b, f.name) });
            EDC.push(...hechas);
            if (hechas.length) resumen.push(`${hechas.length} carta${hechas.length === 1 ? "" : "s"} de la página ${lam.pagina}`);
          }
          if (!cartas.length) { if (!laminas.length) avisos.push(`${f.name}: no se encontraron imágenes con su explicación.`); continue; }
          aviso(`${esc(f.name)}: buscando el concepto de cada explicación…`);
          const ia = await memoriaConceptosDeTextos(cartas.map(c => c.texto), T.titulo);
          let n = 0;
          for (let k = 0; k < cartas.length; k++) {
            aviso(`${esc(f.name)}: subiendo imágenes… ${++n}/${cartas.length}`);
            const img = await subirBlob(cartas[k].blob, f.name);
            EDC.push({ img, ico: "", concepto: ia[k].concepto || "", pista: ia[k].pista || "", otras: ia[k].otras || "", explicacion: (cartas[k].texto || "").replace(/\n/g, " ").trim() });
          }
          resumen.push(`${cartas.length} carta${cartas.length === 1 ? "" : "s"} de ${f.name}`);
        } catch (e) { avisos.push(`${f.name}: ${e.message || e}`); }
      }
      // Imágenes: cada una se revisa en el divisor (una lámina con varios
      // cuadros → varias cartas; una imagen simple → 1 carta sin el título).
      let n = 0;
      for (const f of fs) {
        aviso(`Abriendo ${esc(f.name)} (${++n}/${fs.length})…`);
        try {
          const lienzo = await memoriaLienzoDe(f);
          const hechas = await memoriaDividirLamina({ lienzo, nombre: f.name, tema: T.titulo, subir: b => subirBlob(b, f.name) });
          hechas.forEach(h => { if (!h.concepto) h.concepto = conceptoDeArchivo(f.name); });
          EDC.push(...hechas);
          if (hechas.length) resumen.push(`${hechas.length} carta${hechas.length === 1 ? "" : "s"} de ${f.name}`);
        } catch (e) { avisos.push(`${f.name}: ${e.message || e}`); }
      }
      pintarCartas();
      const sinConcepto = EDC.filter(c => !(c.concepto || "").trim()).length;
      aviso((resumen.length ? `Se agregaron ${resumen.join(" y ")}. ` : "") + (sinConcepto ? `<b>${sinConcepto} carta(s) sin concepto</b> (en rojo): escríbalo. ` : "") + "Revise los conceptos y toque <b>Guardar cartas</b>." + (avisos.length ? `<br>⚠️ ${avisos.map(esc).join("<br>⚠️ ")}` : ""), !resumen.length && avisos.length);
    };
    $("#archivos").addEventListener("change", e => { agregar(e.target.files); e.target.value = ""; });
    $("#cambiarImg").addEventListener("change", async e => {
      const f = e.target.files[0]; e.target.value = ""; if (!f || cambiarIdx === null) return;
      aviso("Subiendo imagen…");
      try { EDC[cambiarIdx].img = await subirImagen(f); pintarCartas(); aviso("Imagen cambiada. Toque Guardar cartas."); } catch (err) { aviso(esc(err.message), true); }
    });
    const drop = $("#drop");
    ["dragenter", "dragover"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add("over"); }));
    ["dragleave", "drop"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove("over"); }));
    drop.addEventListener("drop", e => agregar(e.dataTransfer.files));
    $("#guardarCartas").addEventListener("click", async ev => {
      const limpio = EDC.map(c => ({ img: c.img || "", ico: (c.ico || "").trim(), concepto: (c.concepto || "").trim(), pista: (c.pista || "").trim(), otras: (c.otras || "").trim(), ...(c.explicacion ? { explicacion: c.explicacion } : {}) }));
      const falta = limpio.findIndex(c => !c.concepto);
      if (falta >= 0) { aviso(`Falta el concepto de la carta ${falta + 1}.`, true); return; }
      if (limpio.some(c => !c.img && !c.ico)) { aviso("Cada carta necesita una imagen o un emoji.", true); return; }
      ev.target.disabled = true; aviso("Guardando…");
      try { await guardarContenido({ memoria_cartas: limpio }); EDC = null; pintarCartas(); aviso(`✓ Guardado: ${limpio.length} cartas. Los estudiantes ya las ven.`); }
      catch (e) { ev.target.disabled = false; aviso("No se pudo guardar: " + esc(e.message || e), true); }
    });
  }

  // --- Evaluación (formato MEP) ---
  function pintarEvaluacion() {
    if (!EDE) EDE = C.criterios.map(c => ({ nombre: c.nombre, puntos_max: Number(c.puntos_max) || 3, auto: c.auto || "", niveles: nivelesDe(c) }));
    if (!EDI) EDI = { ...MEMORIA_INSTRUMENTO_BASE, unidad: T.titulo, ...(C.memoria_instrumento || {}) };
    const campo = (k, et, ph) => `<label class="fld">${et}<input data-ins="${k}" value="${esc(EDI[k] || "")}" placeholder="${esc(ph)}"></label>`;
    const sel = (k, et, ops) => `<label class="fld">${et}<select data-ins="${k}">${ops.map(o => `<option ${EDI[k] === o ? "selected" : ""}>${o}</option>`).join("")}</select></label>`;
    const total = EDE.reduce((a, c) => a + (Number(c.puntos_max) || 0), 0);
    $("#vista").innerHTML = `
      <section class="panel-doc">
        <div class="row" style="justify-content:space-between"><h2 style="margin:0">📋 Evaluación de esta partida <small class="mep">(formato MEP)</small></h2>
          <span class="row"><button class="btn ghost" type="button" id="verEst">👁️ Ver como la ven los estudiantes</button><button class="btn ghost" type="button" id="sugeridos">↺ Indicadores sugeridos</button></span></div>
        <div class="ia-box">
          <span><b>✨ Mejorar con IA</b> <span class="note">— redacta los indicadores (verbo + contenido + condición) y la evidencia de cada nivel según el tema y el resultado de aprendizaje. Usted revisa la propuesta antes de usarla.</span></span>
          <div class="row" style="margin-top:8px"><input id="iaIndic" maxlength="400" placeholder="Indicaciones para la IA (opcional). Ej.: enfocar en tributos aduaneros, lenguaje sencillo" style="flex:1 1 16rem"><button class="btn primary" type="button" id="iaTodos">✨ Mejorar todos los niveles</button></div>
          <span class="note" id="iaEstado"></span>
        </div>
        <p class="note">Solo usted define la evaluación. Instrumento técnicamente elaborado según el programa de estudio, el Reglamento de Evaluación de los Aprendizajes y los lineamientos del MEP (ETP): cada indicador de logro con la evidencia de sus niveles (Avanzado 3 · Intermedio 2 · Inicial 1; 0 si no presenta evidencia). Calificación = puntos obtenidos × 100 ÷ total.</p>
        <h3>Datos del instrumento</h3>
        <div class="grid-ins">${sel("componente", "Componente", ["Trabajo cotidiano", "Tareas", "Proyecto"])}${sel("tipo", "Tipo de instrumento", ["Escala de desempeño", "Rúbrica", "Lista de cotejo"])}${campo("subarea", "Subárea", "Ej.: Gestión tributaria")}${campo("unidad", "Unidad de estudio / tema", "Ej.: Impuesto de salida")}</div>
        <div class="grid-ins dos">${campo("resultado", "Resultado de aprendizaje (del programa)", "Copie el resultado de aprendizaje del programa de estudio")}${campo("indicador", "Indicador de logro (del programa)", "Copie el indicador de logro del programa")}</div>
        <h3>Indicadores y criterios de desempeño</h3>
        ${EDE.map((c, i) => `<div class="ind">
          <div class="ind-top"><span class="num">${i + 1}</span>
            <input data-nombre="${i}" value="${esc(c.nombre)}" placeholder="Indicador: verbo + contenido + condición" style="flex:1 1 16rem">
            <label class="pts">Puntos <input data-max="${i}" type="number" min="1" max="20" value="${c.puntos_max}"></label>
            <select data-auto="${i}">${AUTO.map(([v, t]) => `<option value="${v}" ${v === c.auto ? "selected" : ""}>${t}</option>`).join("")}</select>
            <button class="quitar" type="button" data-quitar-ind="${i}" aria-label="Quitar indicador ${i + 1}">✕</button></div>
          <details open><summary>Niveles de desempeño (evidencia de cada nivel)</summary>
            ${NIVELES.map(([k, et, v]) => `<label class="nivel"><span class="nv nv-${k}">${et} (${v})</span><textarea data-nivel="${i}" data-k="${k}" rows="2">${esc(c.niveles[k] || "")}</textarea></label>`).join("")}
            <button class="btn ghost" type="button" data-ia="${i}" style="margin-top:6px">✨ Mejorar este indicador con IA</button>
            ${c.iaNota ? `<div class="note ok">✨ ${esc(c.iaNota)}</div>` : ""}
          </details></div>`).join("")}

  function barajar(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  function comenzar() {

  const el = id => $(`.card[data-id="${id}"]`);
  function voltear(id) {

  function taparActiva() { const b = el(S.activa); if (b) b.classList.remove("flip", "active", "bad"); S.activa = null; }
  function ocultarRespuesta() { $("#respuesta").classList.remove("show"); $("#campo").blur(); }
  function toast(b, t, tipo) { const x = document.createElement("span"); x.className = "toast " + tipo; x.textContent = t; b.appendChild(x); setTimeout(() => x.remove(), 1150); }
  const FRASES = ["¡Acierto!", "¡Excelente!", "¡Exacto!", "¡Crack!", "¡Bien ahí!"];

    } else {

  const mmss = ms => { const s = Math.floor(ms / 1000); return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); };

  let ctx = null;
  function sonido(ok) {
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime;
      o.type = ok ? "triangle" : "sawtooth"; o.frequency.setValueAtTime(ok ? 660 : 180, t); o.frequency.exponentialRampToValueAtTime(ok ? 1320 : 90, t + .18);
      g.gain.setValueAtTime(.08, t); g.gain.exponentialRampToValueAtTime(.0001, t + .25); o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + .26);
    } catch (e) {}
  }

  // ───── Final: métricas, indicadores MEP y nota ─────
  function medir() {
    const n = S.cartas.length, seg = (S.fin - S.inicio) / 1000, spc = seg / n;
    const primer = S.cartas.filter(c => c.fallos === 0 && !c.pistaUsada).length;
    const sinPista = S.cartas.filter(c => !c.pistaUsada).length;
    return { cartas: n, aciertos: S.aciertos, intentos: S.intentos, pistas: S.pistas, segundos: Math.round(seg), segundos_por_carta: spc,
      memoria_dominio_pct: primer / n * 100, memoria_precision_pct: S.intentos ? S.aciertos / S.intentos * 100 : 0,
      memoria_autonomia_pct: sinPista / n * 100, memoria_rapidez_pct: spc <= 12 ? 100 : spc <= 20 ? 72 : spc <= 30 ? 47 : 20,
      precision_pct: S.intentos ? S.aciertos / S.intentos * 100 : 0, puntos_juego: S.puntos, fecha: new Date().toISOString() };

  function calificar(m) {
    const previos = ENTREGA && Array.isArray(ENTREGA.respuestas) ? ENTREGA.respuestas : [];
    const puntos = C.criterios.map((c, i) => {
      const max = Number(c.puntos_max) || 3;
      if (c.auto && m[c.auto] != null) return Math.round(puntajeDesdePorcentaje(m[c.auto]) / 3 * max);
      return previos[i] != null ? Number(previos[i]) : 0; // indicador a mano: lo pone el docente
    });
    const porcentaje = porcentajeDesdeCriterios(C.criterios, puntos);
    return { puntos, porcentaje, puntaje: puntajeDesdePorcentaje(porcentaje) };
  }

  async function terminar() {
    S.fin = Date.now(); clearInterval(S.reloj); pintarTiempo();

    if (!S.prueba && EST_ID) {
      const mem = (ENTREGA && ENTREGA.datos_prueba && ENTREGA.datos_prueba.memoria) || { partidas: [] };
      const partidas = [...(mem.partidas || []), { ...m, porcentaje: nota.porcentaje, puntaje: nota.puntaje }].slice(-30);
      const cal = mem.calificada;
      const cuenta = !cal || (C.memoria_cfg.cuenta === "mejor" && nota.porcentaje > (ENTREGA.porcentaje || 0));
      try {
        if (cuenta) {
          const datos = { memoria: { ...mem, partidas, calificada: { ...m, porcentaje: nota.porcentaje } } };
          const { error } = await guardarNotaManualActividad(T, EST_ID, nota.puntaje, { respuestas: nota.puntos, porcentaje: nota.porcentaje, datos_prueba: datos });

          if (error) throw error;

      } catch (e) { estadoGuardado = "error:" + (e.message || e); }

  function mostrarFinal(m, nota, estado) {
    const prec = m.precision_pct;
    let r;
    if (prec >= 90 && m.segundos_por_carta <= 12 && m.pistas === 0) r = ["🏆", "Leyenda", "Precisión de élite y muy rápido. Dominás el tema."];
    else if (prec >= 80) r = ["🥇", "Oro", "Muy buen dominio de los conceptos."];
    else if (prec >= 65) r = ["🥈", "Plata", "Vas bien; repasá los que fallaste."];
    else if (prec >= 50) r = ["🥉", "Bronce", "Repasá los conceptos y volvé a intentarlo."];
    else r = ["🎯", "En entrenamiento", "Estudiá el tema y jugá otra vez para subir de rango."];
    const nivelTxt = p => { const max = 3; return p >= max ? "Avanzado" : p === 2 ? "Intermedio" : p === 1 ? "Inicial" : "Sin evidencia"; };
    const filas = C.criterios.map((c, i) => `<tr><td>${esc(c.nombre)}</td><td class="c">${c.auto ? esc(nivelTxt(Math.round(nota.puntos[i] / (Number(c.puntos_max) || 3) * 3))) : "Lo califica el docente"}</td><td class="c"><b>${nota.puntos[i]}</b>/${c.puntos_max}</td></tr>`).join("");
    const falladas = S.cartas.filter(c => c.fallos > 0 || c.pistaUsada).map(c => c.concepto);
    const msgEstado = estado === "nota" ? `<p class="estado-nota">✓ Nota guardada en la plataforma: <b>${nota.puntaje}/3</b> (${Math.round(nota.porcentaje)} %).</p>`
      : estado === "practica" ? `<p class="estado-nota">Partida de práctica guardada. Tu nota sigue siendo <b>${ENTREGA && ENTREGA.puntaje != null ? ENTREGA.puntaje : "—"}/3</b>.</p>`
      : estado === "prueba" ? `<p class="note">Modo prueba del docente: con esta partida la nota sería ${nota.puntaje}/3 (${Math.round(nota.porcentaje)} %). No se guardó.</p>`
      : estado === "sin" ? `<p class="note err">No se identificó al estudiante: entrá desde la plataforma para que se guarde la nota.</p>`
      : `<p class="note err">No se pudo guardar la nota (${esc(estado.slice(6))}). Avisale al profe.</p>`;
    abrirModal(`
      <h2>Tablero completo</h2>
      <div class="medal"><div class="m">${r[0]}</div><div><b>${r[1]}</b><span>${r[2]}</span></div></div>
      <div class="grid2">
        <div class="stat score"><div class="k">Puntos del juego</div><div class="v">${m.puntos_juego.toLocaleString("es-CR")}</div></div>
        <div class="stat"><div class="k">Tiempo final</div><div class="v">${mmss(m.segundos * 1000)}</div></div>
        <div class="stat"><div class="k">Efectividad</div><div class="v">${Math.round(prec)}%</div></div>
        <div class="stat combo"><div class="k">Mejor racha</div><div class="v">${S.mejorCombo}</div></div>
      </div>
      ${msgEstado}
      <div class="tabla-wrap"><table class="ins"><thead><tr><th>Indicador</th><th>Nivel</th><th>Puntos</th></tr></thead><tbody>${filas}</tbody></table></div>
      <p class="note">${m.aciertos} aciertos en ${m.intentos} intentos · ${m.pistas} pista${m.pistas === 1 ? "" : "s"}.${falladas.length ? " Para repasar: " + esc(falladas.join(", ")) + "." : " ¡Sin fallos!"} Los puntos del juego no son la nota.</p>
      <div class="row" style="justify-content:flex-end; margin-top:14px">${S.prueba ? `<button class="btn ghost" type="button" id="aEditar">← Volver a editar</button>` : `<a class="btn ghost" href="index.html" data-volver>← Volver a la plataforma</a>`}<button class="btn primary" type="button" id="otraVez">JUGAR DE NUEVO</button></div>`);
    $("#otraVez").addEventListener("click", () => { cerrarModal(); pantallaInicio(S.prueba); });
    if ($("#aEditar")) $("#aEditar").addEventListener("click", () => { cerrarModal(); vistaDocente(); });
  }

  // "Volver" regresa a la página anterior de la plataforma (tema o subtema).
  document.addEventListener("click", e => {
    const a = e.target.closest("[data-volver]");
    if (a && document.referrer && document.referrer.startsWith(location.origin) && history.length > 1) { e.preventDefault(); history.back(); }
  });

  // ═════════════════════ ARRANQUE ═════════════════════
  (async () => {
    try {
      if (!TRABAJO_ID) {
        $("#vista").innerHTML = `<section class="inicio"><h2>Abrí el juego desde la plataforma</h2><p>Entrá al trabajo de Memoria Contable en tu tema o subtema y tocá «🧠 Jugar Memoria Contable».</p><a class="btn primary" href="index.html">Ir a la plataforma</a></section>`;
        return;
      }
      await cargarTrabajo();
      if (params.get("docente") === "1") {
        if (!ES_DOCENTE) { $("#vista").innerHTML = `<section class="inicio"><h2>Solo para el docente</h2><p>Iniciá sesión como docente en la plataforma y abrí «🧠 Cartas y evaluación» desde el trabajo.</p><a class="btn primary" href="index.html">Ir a la plataforma</a></section>`; return; }
        vistaDocente(); return;
      }
      if (T.habilitado === false) { $("#vista").innerHTML = `<section class="inicio"><h2>Todavía no está habilitado</h2><p>El profe aún no ha habilitado este juego.</p><a class="btn ghost" href="index.html">← Volver</a></section>`; return; }
      if (!C.memoria_cartas.length) { $("#vista").innerHTML = `<section class="inicio"><h2>El profe aún está preparando las cartas</h2><p>Volvé a intentarlo en un rato.</p><a class="btn ghost" href="index.html">← Volver</a></section>`; return; }
      if (EST_ID) {
        const { data } = await sb.from("actividades_estudiante").select("*").eq("trabajo_id", T.id).eq("estudiante_id", EST_ID).maybeSingle();
        ENTREGA = data || null;
      }
      pantallaInicio(sesion && sesion.role === "docente");
    } catch (e) {
      $("#vista").innerHTML = `<section class="inicio"><h2>No se pudo abrir el juego</h2><p>${esc(e.message || e)}</p><a class="btn ghost" href="index.html" data-volver>← Volver a la plataforma</a></section>`;
    }
  })();
})();

</script>
</body>
</html>
