<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Declaración del IVA</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="img/logo-ctp-mercedes-norte.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#F5F7FB;--surface:#fff;--surface2:#F1F4F9;--ink:#0F172A;--muted:#5B6B80;--line:#DCE3EE;
  --accent:#4F46E5;--accent2:#7C3AED;--accent-soft:#EEF0FF;
  --debe:#2457B8;--haber:#C2501C;--ok:#1E8A4C;--okbg:#E3F7EA;--bad:#C23A3A;--badbg:#FDECEC;--warn:#A86F00;--warnbg:#FFF6DB;
  --m1:#4F46E5;--m2:#0E8A7E;--m3:#C2501C;--m4:#7C3AED;
  --f:"Plus Jakarta Sans",Inter,"Segoe UI",system-ui,sans-serif;--fn:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --shadow:0 6px 20px rgba(15,23,42,.08);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1020;--surface:#121A30;--surface2:#182340;--ink:#E8EDFB;--muted:#9AA9CC;--line:#26324F;--accent-soft:#1E2550;
  --debe:#7FA6F0;--haber:#F08A5A;--ok:#5ACB89;--okbg:#173A28;--bad:#F07A7A;--badbg:#3E1C1C;--warn:#E0B048;--warnbg:#3A2E10;--shadow:0 6px 20px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1020;--surface:#121A30;--surface2:#182340;--ink:#E8EDFB;--muted:#9AA9CC;--line:#26324F;--accent-soft:#1E2550;
  --debe:#7FA6F0;--haber:#F08A5A;--ok:#5ACB89;--okbg:#173A28;--bad:#F07A7A;--badbg:#3E1C1C;--warn:#E0B048;--warnbg:#3A2E10;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f);padding-bottom:80px}
.wrap{max-width:1240px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left)) 0 max(16px,env(safe-area-inset-right))}
h1,h2,h3,h4{margin:0;line-height:1.2}
.num,input.n{font-family:var(--fn);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
button,.btn{font:600 .9rem var(--f);border:0;border-radius:10px;padding:9px 14px;cursor:pointer;background:var(--accent);color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
button.sec,.btn.sec{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
button.ghost{background:transparent;color:var(--muted);border:1px dashed var(--line)}
button.sm{padding:5px 10px;font-size:.8rem}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 40%,transparent);outline-offset:1px}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0;width:100%}
input.n{text-align:right}
input.ok,select.ok{border-color:var(--ok);background:var(--okbg)}
input.bad,select.bad{border-color:var(--bad);background:var(--badbg)}
/* barra superior */
.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top .wrap{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding-block:10px}
@media(max-width:700px){.top{position:static}.mod .i{display:none}}
.brand{display:flex;gap:10px;align-items:center;margin-right:auto}
.brand img{height:44px;width:auto}
.brand b{font-size:1.2rem;font-weight:800;display:block}
.brand small{color:var(--muted);font-size:.8rem}
.caso{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.caso label{font-size:.78rem;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.caso select{width:auto}.caso input{width:110px}
/* módulos */
.mods{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:16px 0}
@media(max-width:820px){.mods{grid-template-columns:repeat(2,minmax(0,1fr))!important}.mod{min-width:0;padding:10px}.mod .t{font-size:.9rem;overflow-wrap:anywhere}}
.mod{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 14px;text-align:left;color:var(--ink);display:block;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s}
.mod:hover{transform:translateY(-2px)}
.mod.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 8%,var(--surface))}
.mod .t{display:flex;gap:8px;align-items:center;font-weight:800;font-size:1rem}
.mod .i{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--c);color:#fff;font-size:1.1rem;flex:none}
.mod small{display:block;color:var(--muted);font-size:.78rem;margin-top:4px}
.bar{height:6px;border-radius:9px;background:var(--surface2);margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--c);border-radius:9px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card h3{font-size:1.05rem;margin-bottom:6px}
.empresa{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;margin-bottom:10px}
.empresa b{font-size:1.05rem}
.chip{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.chip.A{background:#e0f2f1;color:#0f766e}.chip.P{background:#fdeee5;color:#c2410c}.chip.PT{background:#f3e8ff;color:#7e22ce}.chip.I{background:#e5f6ec;color:#1f8f55}.chip.C{background:#fff4d6;color:#a16207}.chip.G{background:#fde7ef;color:#be185d}
table{border-collapse:collapse;width:100%}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700}
td.r,th.r{text-align:right}
.scroll{overflow-x:auto}
.fb{border-radius:10px;padding:10px 12px;margin-top:10px;font-size:.9rem}
.fb.ok{background:var(--okbg);color:var(--ok)}.fb.bad{background:var(--badbg);color:var(--bad)}.fb.warn{background:var(--warnbg);color:var(--warn)}
.fb ul{margin:4px 0 0;padding-left:1.2rem}
.acc{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.sol{margin-top:12px;border:2px dashed var(--accent);border-radius:12px;padding:10px 12px;background:var(--accent-soft)}
.sol h4{font-size:.9rem;margin-bottom:6px}
/* módulo 1 */
.m1{display:grid;grid-template-columns:250px minmax(0,1fr);gap:14px}
@media(max-width:860px){.m1{grid-template-columns:minmax(0,1fr)}}
.tlist{display:flex;flex-direction:column;gap:6px;max-height:70vh;overflow:auto}
@media(max-width:860px){.tlist{flex-direction:row;max-height:none;overflow-x:auto;padding-bottom:4px}.tlist button{flex:none}}
.tlist button{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);justify-content:flex-start;text-align:left;font-weight:600}
.tlist button.on{border-color:var(--m1);background:var(--accent-soft)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line);flex:none}.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}
.trx{font-size:1.02rem;background:var(--surface2);border-left:4px solid var(--m1);border-radius:10px;padding:12px 14px;margin:8px 0 12px}
.lines td{padding:4px}.lines td.x{width:36px}
.tots{display:flex;gap:16px;justify-content:flex-end;font-weight:700;margin-top:6px;font-size:.9rem}
.tots .d{color:var(--debe)}.tots .h{color:var(--haber)}
details.catal summary{cursor:pointer;font-weight:700;color:var(--accent)}
.catal-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:2px 16px;font-size:.84rem;margin-top:8px}
/* asiento estilo SAP Business One */
.sap{border:1px solid #b9c6d6;border-radius:10px;overflow:hidden;background:var(--surface)}
.sap-tit{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(#f4f7fb,#e3eaf3);border-bottom:1px solid #b9c6d6;padding:8px 12px;font-weight:800;color:#1c3d6e}
:root[data-theme="dark"] .sap-tit{background:var(--surface2);color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sap-tit{background:var(--surface2);color:var(--ink)}}
.sap-n{font-weight:600;font-size:.9rem}
.sap-hd{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 12px;padding:10px 12px;border-bottom:1px solid var(--line)}
@media(max-width:700px){.sap-hd{grid-template-columns:minmax(0,1fr)}}
.sap-hd label{display:flex;flex-direction:column;gap:3px;font-size:.78rem;font-weight:700;color:var(--muted)}
.sap-hd small{font-weight:400}
.sap-hd .sap-com{grid-column:1/-1}
.sap-grid th{background:var(--surface2)}
.sap-grid td.nm{font-size:.88rem}
.sap-pie{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);background:var(--surface2);font-size:.86rem}
.sap-nota{font-size:.76rem;color:var(--muted);padding:6px 12px;border-top:1px solid var(--line)}
.sap-pie .dif{padding:3px 10px;border-radius:8px;background:var(--surface)}.sap-pie .dif.ok{background:var(--okbg);color:var(--ok)}.sap-pie .dif.bad{background:var(--badbg);color:var(--bad)}
/* libro mayor en columnas */
.lm-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap;border-bottom:3px solid var(--ink);padding-bottom:8px;margin-bottom:6px}
table.lm td input{padding:5px 6px;font-size:.86rem}
.lm-todas{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(460px,100%),1fr));gap:14px}
.lm-todas table{font-size:.82rem}
.t-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;border-bottom:3px solid var(--ink);padding-bottom:6px;margin-bottom:4px}
.t-hd small{display:block;color:var(--muted);font-size:.74rem}.t-hd b{font-size:.95rem}
/* asientos a la mano (panel fijo) */
.m2lay{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;align-items:start}
@media(max-width:1000px){.m2lay{grid-template-columns:minmax(0,1fr)}.dpanel{position:static!important;max-height:420px!important;order:-1}}
.dpanel{position:sticky;top:84px;max-height:calc(100vh - 100px);overflow:auto;background:var(--surface);border:2px solid var(--m1);border-radius:14px;padding:10px;box-shadow:var(--shadow)}
.dp-hd{position:sticky;top:-10px;background:var(--surface);padding:4px 0 8px;margin-bottom:4px;border-bottom:1px solid var(--line);z-index:1}
.dp-hd b{display:block}.dp-hd small{color:var(--muted);font-size:.74rem}
.dp-as{border-bottom:1px dashed var(--line);padding:6px 0}
.dp-t{display:flex;gap:8px;align-items:center;font-size:.8rem;margin-bottom:2px}.dp-t .dp-ok,.dp-t .dp-ej{margin-left:auto}
.dp-as table{font-size:.76rem}.dp-as td{padding:2px 4px;border:0}.dp-as td.d{color:var(--debe)}.dp-as td.h{color:var(--haber)}
.cchips{display:flex;flex-wrap:wrap;gap:6px}.cchips button{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);font-family:var(--fn)}.cchips button.on{border-color:var(--m2);background:color-mix(in srgb,var(--m2) 12%,var(--surface))}
.tam{display:block;font-size:.74rem;color:var(--m2);font-weight:700;margin:2px 0 4px}
.m2lay .tgrid{grid-template-columns:repeat(auto-fill,minmax(min(380px,100%),1fr))}
/* modo digital */
.modo{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.modo button{border-radius:0;background:var(--surface);color:var(--ink)}.modo button.on{background:var(--m2);color:#fff}
.pick-bar{position:sticky;top:76px;z-index:6;background:#fff8db;color:#5c4400;border:2px solid #ffd43b;border-radius:12px;padding:8px 12px;margin-bottom:10px;font-size:.9rem}
:root[data-theme="dark"] .pick-bar{background:#3a2e10;color:#ffe9a8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pick-bar{background:#3a2e10;color:#ffe9a8}}
@media(max-width:700px){.pick-bar{top:0}}
tr.pickable{cursor:pointer}tr.pickable:hover td{background:color-mix(in srgb,var(--m2) 10%,transparent)}
tr.pickable.sel td{background:#ffe066!important;color:#14213d}tr.pickable.usado{opacity:.45}
tr.pickable:focus-visible{outline:3px solid var(--m2)}
.drop{cursor:copy;border-radius:8px}.drop.armado{outline:2px dashed var(--m2);outline-offset:-2px;background:color-mix(in srgb,var(--m2) 7%,transparent)}
.drop.armado:hover{background:color-mix(in srgb,var(--m2) 18%,transparent)}
/* balanza tipo Excel */
.xl-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 6px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.xl-fx{font-style:italic;font-weight:800;color:var(--m3);font-family:var(--fn)}
.xl-bar #fxDir{min-width:36px;font-family:var(--fn)}.xl-bar #fx{flex:1 1 260px;font-family:var(--fn)}
table.xl th.xl-n{width:30px;text-align:center;color:var(--muted);background:var(--surface2);font-family:var(--fn)}
table.xl tr.xl-let th{text-align:center;background:var(--surface2);font-family:var(--fn);padding:2px}
table.xl th.aux,table.xl td.aux{background:color-mix(in srgb,var(--m3) 6%,transparent)}
table.xl .xl-nom{font-size:.78rem;padding:4px 6px}
table.xl tr.xl-tot td{border-top:2px solid var(--ink)}
.row.rcc{grid-template-columns:minmax(0,1fr) minmax(110px,190px) minmax(90px,150px) 30px}
@media(max-width:620px){.row.rcc{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 30px}.row.rcc input{grid-column:1/3}}
tr.subc td{font-size:.84rem;color:var(--muted);padding-left:22px}tr.subc td:first-child{padding-left:22px}
/* actividades, facturas y diálogos */
.act-bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;border:2px solid #ffd43b;background:linear-gradient(135deg,#fff8db,var(--surface));margin-top:16px}
:root[data-theme="dark"] .act-bar{background:var(--surface)}
.act-bar small{display:block;color:var(--muted);font-size:.84rem}
.ab-btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.ab-ok{background:var(--okbg);color:var(--ok);font-weight:800;border-radius:999px;padding:6px 12px}
.entres{display:flex;flex-direction:column;gap:10px;margin:10px 0}.entres-g{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;font-size:.9rem}.entres-g b{justify-self:end}.entres-g .entbar{grid-column:1/-1}
.entcards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}@media(max-width:900px){.entcards{grid-template-columns:repeat(2,minmax(0,1fr))}}
.entcard{display:flex;flex-direction:column;align-items:stretch;gap:3px;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);cursor:pointer;font:inherit;min-width:0}
.entcard.on{border:2px solid var(--accent);box-shadow:var(--shadow)}.entcard:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.entcard-t{font-weight:700;font-size:.84rem}.entcard-n{font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}.entcard-n small{font-size:.95rem;color:var(--muted);font-weight:600}
.entcard-s{font-size:.76rem;color:var(--muted)}.entcard-s b{color:var(--ink)}
.entbar{display:block;height:6px;border-radius:4px;background:var(--surface2);overflow:hidden}.entbar i{display:block;height:100%;background:var(--accent)}
.hubbox>summary{cursor:pointer;list-style-position:inside}.hub-top{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-top:10px}.hub-top label{display:flex;flex-direction:column;font-size:.8rem;font-weight:600;color:var(--muted);min-width:220px}
.resn{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:8px 12px}.resn>summary{cursor:pointer;font-weight:800}.resn-t th{font-size:.78rem}.resn-p td{border-top:2px solid var(--ink)}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.bad{background:var(--badbg);color:var(--bad)}.chip.warn{background:var(--warnbg);color:var(--warn)}
.ia-box{background:var(--accent-soft);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:.88rem}.ev-h{margin:14px 0 4px}
.ejs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}@media(max-width:700px){.ejs{grid-template-columns:minmax(0,1fr)}}.ej{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.84rem;min-width:0}.ejt{width:100%;margin-top:4px}.ejt td{padding:2px 4px;border-bottom:1px solid var(--line)}
.hub-f{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px}
.hub-f small{display:block;color:var(--muted);font-size:.8rem}.hub-g{margin:14px 0 2px;font-size:.92rem}.hub-g small{font-weight:600;color:var(--muted)}
dialog#dlgT{border:0;border-radius:16px;padding:16px;width:min(960px,96vw);max-height:92vh;overflow:auto;background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog#dlgT::backdrop{background:rgba(15,23,42,.55)}
.dlg-hd{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:8px}
.ins-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:8px 12px}
.ins-g label,#dlgB>label{display:flex;flex-direction:column;gap:3px;font-size:.8rem;font-weight:700;color:var(--muted)}
#dlgB textarea{font:inherit;font-size:.84rem;width:100%;padding:6px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.na-mods{border:1px solid var(--line);border-radius:10px;margin-top:10px;display:flex;flex-wrap:wrap;gap:6px 16px}.na-mods label{display:flex;gap:6px;align-items:center;font-size:.9rem}.na-mods input{width:auto}
.ins table{border-collapse:collapse;width:100%;font-size:.82rem}.ins td,.ins th{border:1px solid var(--line);padding:5px;vertical-align:top}
.fe{border:2px solid #9fb3c8;border-radius:12px;background:#fff;color:#14213d;margin:10px 0 14px;overflow:hidden;font-size:.86rem}
.fe-hd{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;background:#eef3f9;padding:10px 12px;border-bottom:1px solid #c8d4e2}
.fe-hd b{display:block;font-size:1rem;letter-spacing:.02em}.fe-hd small{display:block;color:#4a5b70}.fe-clave{font-size:.7rem;word-break:break-all}.fe-f{text-align:right}
.fe-partes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:8px 14px;padding:10px 12px;border-bottom:1px solid #e3e9f1}
.fe-partes small{display:block;font-size:.68rem;font-weight:800;color:#6b7c90;letter-spacing:.06em}.fe-partes span{display:block;color:#4a5b70;font-size:.8rem}
.fe-t th{background:#f6f8fb;color:#4a5b70}.fe-t td,.fe-t th{padding:5px 8px;border-bottom:1px solid #e3e9f1;color:#14213d}
.fe-res{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,320px);gap:12px;padding:10px 12px;align-items:end}
@media(max-width:620px){.fe-res{grid-template-columns:minmax(0,1fr)}}
.fe-res td{padding:3px 6px;border:0;color:#14213d}.fe-res tr.fe-tot td{font-weight:900;border-top:2px solid #14213d;font-size:.95rem}
body.sinrev #rev1,body.sinrev #pista,body.sinrev #revA,body.sinrev #revAll,body.sinrev #rev2,body.sinrev #rev3,body.sinrev #revEF,body.sinrev [data-sol]{display:none!important}
body.bloq #mod input,body.bloq #mod select{pointer-events:none;background:var(--surface2)}
body.bloq #mod [data-quitar],body.bloq #mod #mas,body.bloq #mod [data-ta],body.bloq #mod [data-tq],body.bloq #mod [data-ra],body.bloq #mod [data-rq],body.bloq #mod #lmMas,body.bloq #mod [data-lmq],body.bloq #mod #addCol,body.bloq #mod #delCol{display:none}
/* T de mayor */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:12px}
.tcard{border:2px solid var(--line);border-radius:14px;background:var(--surface);padding:10px}
.tcard.ok{border-color:var(--ok)}.tcard.bad{border-color:var(--bad)}

<body>
<header class="top"><div class="wrap">
  <div class="brand"><img src="img/logo-ctp-mercedes-norte.png" alt="Escudo del CTP Mercedes Norte" width="31" height="44">
    <div><b>Declaración del IVA · Formulario 150 <span class="pill">Prototipo 2027</span></b><small>Facturas al diario · Balanza · Crédito fiscal y proporcionalidad · Formulario 150 (TRIBU-CR) · Liquidación</small></div></div>
  <div class="caso" id="caso"></div>
</div></header>
<main class="wrap" id="app"><p class="muted">Cargando…</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js?v=20261105h"></script>
<script src="js/actividades.js?v=20261114e"></script>
<script>
/* ══════════════════════════════════════════════════════════════════════
   Declaración del IVA · Formulario 150 (TRIBU-CR). Prototipo 2027.
   Un caso = una empresa (comercial o de servicios) y las facturas de un mes.
     1. Facturas al diario (subcuentas por tarifa)   2. Balanza de comprobación   3. Crédito fiscal y proporcionalidad
     3. Formulario 150        4. Asientos del IVA (ventas, compras, liquidación y pago)
   Niveles: 1 tarifa única 13 % · 2 varias tarifas (compras identificadas)
            3 proporcionalidad (prorrata provisional) · 4 diciembre (liquidación anual)
   La solución la calcula la plataforma con las reglas de la Ley 9635 (simplificadas).
   ══════════════════════════════════════════════════════════════════════ */
const SES=(()=>{try{return JSON.parse(sessionStorage.getItem("ctp_lms_session_v2")||"null")}catch(e){return null}})();
const DOCENTE=!!(SES&&SES.role==="docente");
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const NF=new Intl.NumberFormat("es-CR",{maximumFractionDigits:2});
const fm=n=>(n<0?"(":"")+"₡"+NF.format(Math.abs(n))+(n<0?")":"");
const fn=n=>n==null?"":(n<0?"(":"")+NF.format(Math.abs(n))+(n<0?")":"");
function monto(v){if(v==null)return null;let s=String(v).trim();if(!s)return null;let neg=/^\(.*\)$/.test(s)||/^-/.test(s);
  s=s.replace(/[₡%\s()+-]/g,"");s=s.includes(",")?s.replace(/\./g,"").replace(",","."):/^\d+\.\d{1,2}$/.test(s)?s:s.replace(/\./g,"");if(!s||isNaN(+s))return NaN;return neg?-(+s):+s}
const montoO0=v=>{const x=monto(v);return x==null?0:x};
const cerca=(a,b,t)=>a!=null&&!isNaN(a)&&Math.abs(a-b)<=(t==null?1:t)+1e-9;
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const ANIO=2027,MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","setiembre","octubre","noviembre","diciembre"];
const fechaCR=iso=>iso?iso.slice(8,10)+"/"+iso.slice(5,7)+"/"+iso.slice(0,4):"";
const pct2=x=>NF.format(Math.round(x*10000)/100)+" %";

/* ── Tipos de venta (como en la sección II del formulario 150) ── */
const TV={v13:{n:"Ventas afectas al 13 % (derecho a crédito pleno)",c:"Ventas al 13 %",tar:13,pleno:true},
  v1:{n:"Ventas afectas al 1 % (derecho a crédito pleno)",c:"Ventas al 1 %",tar:1,pleno:true},
  ecd:{n:"Ventas exentas y no sujetas con derecho a crédito pleno",c:"Exentas con derecho",tar:0,pleno:true},
  v4:{n:"Ventas afectas al 4 %",c:"Ventas al 4 %",tar:4},
  v2:{n:"Ventas afectas al 2 %",c:"Ventas al 2 %",tar:2},
  esd:{n:"Ventas exentas sin derecho a crédito",c:"Exentas sin derecho",tar:0,sin:true}};
const ORD_V=["v13","v1","ecd","v4","v2","esd"];
// Tarifa aplicada al crédito: pleno = la de la compra; tarifa reducida = la menor; sin derecho = 0
const limite=(tc,s)=>TV[s].pleno?tc:TV[s].sin?0:Math.min(tc,TV[s].tar);
const CASILLA_C={c13:"Compras al 13 %",c4:"Compras al 4 %",c2:"Compras al 2 %",c1:"Compras al 1 %",csr:"Adquiridos a otros regímenes (simplificado)",cex:"Bienes y servicios exentos"};
const TIPO_EMP={comercial:"Empresa comercial",servicios:"Empresa de servicios"};
const NIVELES={1:"1 · Tarifa única (13 %)",2:"2 · Varias tarifas (compras identificadas)",3:"3 · Proporcionalidad (prorrata)",4:"4 · Diciembre: liquidación anual"};

/* ── Catálogo de cuentas para el IVA ── */
// Subcuentas por tarifa: así la balanza de comprobación da los datos de la declaración
const SUB=[["13","13 %"],["04","4 %"],["02","2 %"],["01","1 %"]],SUBV=[...SUB.map(([k,t])=>[k,"gravadas al "+t]),["ED","exentas con derecho a crédito"],["ES","exentas sin derecho a crédito"]];
const SUF_V={v13:"13",v4:"04",v2:"02",v1:"01",ecd:"ED",esd:"ES"},SUF_T={13:"13",4:"04",2:"02",1:"01"};
const CAT=[["1101","Caja"],["1102","Bancos"],["1103","Cuentas por cobrar"],["1104","Inventario de mercadería"],...SUB.map(([k,t])=>["1106."+k,"IVA soportado (crédito fiscal) "+t]),["1107","Suministros"],["1108","IVA saldo a favor"],["1109","Retenciones de IVA por tarjetas (pago a cuenta)"],
  ["2101","Cuentas por pagar"],...SUB.map(([k,t])=>["2103."+k,"IVA por pagar (débito fiscal) "+t]),["2104","IVA por pagar a Hacienda (liquidación)"],
  ...SUBV.map(([k,t])=>["4101."+k,"Ventas "+t]),...SUBV.map(([k,t])=>["4102."+k,"Ingresos por servicios "+t]),["6102","Gasto de alquiler"],["6103","Gasto de servicios públicos"],["6104","Gasto de publicidad"],["6107","Gasto de mantenimiento"],["6108","Gasto de papelería y útiles"],["6110","Gasto por IVA no acreditable"]];
const nom=c=>(CAT.find(x=>x[0]===c)||[c,c])[1];

/* ── Textos del generador ── */
const EMP={comercial:["Farmacia y Súper La Esperanza S.A.","Agroveterinaria El Roble S.A.","Comercial Santa Lucía S.A.","Abastecedor Mercedes Norte S.A."],
  servicios:["Centro Médico y Academia Horizonte S.A.","Servicios Integrales Mercedes S.A.","Clínica y Capacitaciones Santa Lucía S.A.","Multiservicios El Roble S.A."]};
const TV_TXT={comercial:{v13:[["Electrodomésticos y artículos para el hogar","Unid",18000],["Artículos de limpieza y cuidado personal","Unid",2400],["Herramientas y materiales de construcción","Unid",9500]],
    v1:[["Arroz, frijoles y huevos (canasta básica tributaria)","Unid",1800],["Alimento para ganado (insumo agropecuario)","Saco",14500]],
    v2:[["Medicamentos con registro sanitario","Unid",6800]],ecd:[["Mercadería vendida a un cliente del exterior (exportación)","Unid",25000]],
    esd:[["Sillas de ruedas y equipo ortopédico (venta exenta)","Unid",95000]]},
  servicios:{v13:[["Mantenimiento de computadoras","Serv",28000],["Asesoría contable mensual","Serv",85000],["Diseño publicitario","Serv",60000]],
    v4:[["Consulta médica privada","Serv",35000],["Terapia física (sesión)","Serv",22000]],
    v2:[["Curso de inglés (educación privada, mensualidad)","Serv",48000]],ecd:[["Asesoría a una empresa del exterior (exportación de servicios)","Serv",150000]],
    esd:[["Alquiler de apartamento para vivienda (monto exento)","Mes",240000]]}};
// Compras que se pueden identificar con un tipo de venta: [detalle, tarifa, cuenta]
const COMP_ID={comercial:{v13:[["Mercadería para la venta: artículos para el hogar",13,"1104"],["Mercadería para la venta: herramientas",13,"1104"]],
    v1:[["Arroz y frijoles para la venta (canasta básica)",1,"1104"],["Alimento para ganado para la venta",1,"1104"]],
    v2:[["Medicamentos para la venta",2,"1104"],["Bolsas y empaques para despachar medicamentos",13,"1107"]],
    esd:[["Sillas de ruedas para la venta (compra exenta)",0,"1104"]]},
  servicios:{v13:[["Repuestos y materiales para el mantenimiento de computadoras",13,"1107"],["Licencias de software para el servicio de soporte",13,"1107"]],
    v4:[["Materiales médicos desechables para la consulta",13,"1107"],["Medicamentos que se aplican en la consulta",2,"1107"]],
    v2:[["Material didáctico impreso para los cursos de inglés",13,"1107"]],
    esd:[["Pintura y reparaciones del apartamento que se alquila",13,"6107"]]}};
const COMP_GEN=[["Alquiler del local",13,"6102"],["Electricidad, agua e internet del local",13,"6103"],["Publicidad en redes sociales",13,"6104"],["Papelería y útiles de oficina",13,"6108"]];
const CLIENTES=["Distribuidora El Sol S.A.","María Fernanda Rojas Mora","Inversiones Tico Verde S.A.","José Pablo Vargas Solís","Hotel Brisas del Norte S.A.","Cliente de contado","Ana Lucía Jiménez Castro","Constructora Las Palmas S.A."];
const PROVEEDORES=["Importadora Central S.A.","Distribuidora Nacional S.A.","Droguería del Valle S.A.","Mayoreo Agrícola S.A.","Inmobiliaria Mercedes S.A.","CNFL / ESPH","Publicidad Digital CR S.A.","Librería Universal S.A."];
const MEDIO_N={efectivo:"Efectivo",tarjeta:"Tarjeta",transferencia:"Transferencia",sinpe:"SINPE Móvil"};

function finDeMes(m){return new Date(ANIO,m,0).getDate()}
function plazoDe(m){// día 15 natural del mes siguiente; si cae sábado o domingo pasa al lunes
  let y=m===12?ANIO+1:ANIO,mm=m===12?1:m+1,d=new Date(y,mm-1,15);while(d.getDay()===0||d.getDay()===6)d.setDate(d.getDate()+1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}

/* ── Generador del caso ── */
function generarCaso(seed,nivel,emp){nivel=+nivel||1;emp=emp==="servicios"?"servicios":"comercial";
  const R=rng(seed),pick=a=>a[Math.floor(R()*a.length)],m=(a,b,st=1000)=>Math.round((a+R()*(b-a))/st)*st;
  const N3=Math.min(nivel,3),mes=nivel===4?12:3;
  const SET={comercial:{1:["v13"],2:["v13","v1","v2"],3:["v13","v1","v2","esd"]},servicios:{1:["v13"],2:["v13","v4","v2"],3:["v13","v4","v2","esd"]}}[emp][N3];
  const empresa=pick(EMP[emp]),F=[];
  // Ventas: al menos una de cada tipo del caso
  const nV=nivel===1?5:nivel===2?6:7,tiposV=[...SET];while(tiposV.length<nV)tiposV.push(R()<.65?"v13":pick(SET));
  tiposV.forEach(s=>{const x=pick(TV_TXT[emp][s]),q=Math.max(1,Math.round((s==="v13"?600e3:330e3)*(.6+R()*1.4)/x[2])),desc=R()<.3?pick([5,10]):0,cred=R()<.25;
    F.push({tipo:"venta",cat:s,tar:TV[s].tar,lin:[{d:x[0],u:x[1],q,p:Math.round(x[2]*(.85+R()*.3)/10)*10,desc}],cont:pick(CLIENTES),cond:cred?"credito":"contado",plazo:cred?pick([15,30]):0,medio:cred?"":pick(["efectivo","transferencia","tarjeta","sinpe","tarjeta"])})});
  // Compras identificadas
  SET.forEach(s=>COMP_ID[emp][s].forEach(([d,t,cta])=>{const q=Math.max(1,Math.round(m(80e3,400e3)/ (t===0?60000:8000)));const p=Math.round((t===0?60000:8000)*(.8+R()*.5)/10)*10;
    F.push({tipo:"compra",tar:t,cta,cat:t?"c"+t:"cex",dest:nivel===1||t===0?null:s,lin:[{d,u:"Unid",q,p,desc:R()<.25?5:0}],cont:pick(PROVEEDORES),cond:R()<.4?"credito":"contado",plazo:30,medio:"transferencia"})}));
  // Compras generales (se usan en todas las ventas)
  if(nivel!==2)(nivel===1?[COMP_GEN[0],COMP_GEN[1],COMP_GEN[3]]:COMP_GEN.slice(0,3)).forEach(([d,t,cta])=>F.push({tipo:"compra",tar:t,cta,cat:"c13",dest:nivel===1?null:"ni",lin:[{d,u:"Serv",q:1,p:m(d.startsWith("Alquiler")?250e3:60e3,d.startsWith("Alquiler")?450e3:180e3,500),desc:0}],cont:pick(PROVEEDORES),cond:"contado",medio:"transferencia"}));
  // Compra a un proveedor del régimen simplificado (no desglosa IVA: no da crédito)
  F.push({tipo:"compra",tar:0,cta:"6107",cat:"csr",dest:null,simp:true,lin:[{d:"Reparación menor del local (proveedor en régimen simplificado)",u:"Serv",q:1,p:m(25e3,90e3,500),desc:0}],cont:"Taller de soldadura Don Beto (régimen simplificado)",cond:"contado",medio:"sinpe"});
  // Días y consecutivos
  const dias=F.map(()=>2+Math.floor(R()*(finDeMes(mes)-3)));F.forEach((f,i)=>{f.dia=dias[i]});F.sort((a,b)=>a.dia-b.dia||(a.tipo>b.tipo?-1:1));
  let nf=Math.floor(R()*900)+100;F.forEach((f,i)=>{f.n=i+1;f.consec=(f.tipo==="venta"?"00100001"+(f.simp?"04":"01"):"00100001"+(f.simp?"04":"01"))+String(f.tipo==="venta"?nf++:Math.floor(R()*9e9)+1e9).padStart(10,"0");
    f.fecha=`${ANIO}-${String(mes).padStart(2,"0")}-${String(f.dia).padStart(2,"0")}`;
    f.base=f.lin.reduce((a,l)=>a+Math.round(l.q*l.p*(1-l.desc/100)),0);f.iva=Math.round(f.base*f.tar/100);f.total=f.base+f.iva;
    f.ret=f.tipo==="venta"&&f.medio==="tarjeta"?Math.round(f.base*.06):0});
  // Datos del año (proporción provisional y liquidación)
  const ant={},p={};let enenov=null;
  if(nivel>=3){SET.forEach(s=>ant[s]=m(s==="v13"?40e6:8e6,s==="v13"?70e6:22e6,10000));const T=Object.values(ant).reduce((a,b)=>a+b,0);
    SET.forEach(s=>p[s]=Math.round(ant[s]/T*10000)/10000);const dif=1-Object.values(p).reduce((a,b)=>a+b,0);p.v13=Math.round((p.v13+dif)*10000)/10000}
  if(nivel===4){enenov={v:{},baseNi:m(9e6,16e6,10000)};SET.forEach(s=>enenov.v[s]=Math.round(ant[s]*(.7+R()*.7)*11/12/10000)*10000);enenov.ivaNi=Math.round(enenov.baseNi*.13)}
  const sfa=nivel>=2&&R()<.45?m(20e3,140e3):0;
  return calcular({seed,nivel,emp,empresa,mes,F,SET,ant,p,enenov,sfa})}

// Reparte un IVA no identificado entre los tipos de venta según una proporción
function repartir(iva,prop,SET){const filas=[];let acum=0;const L=SET.filter(s=>prop[s]>0);
  L.forEach((s,i)=>{const is=i===L.length-1?iva-acum:Math.round(iva*prop[s]);acum+=is;const lim=limite(13,s),cr=Math.round(is*lim/13);filas.push({s,p:prop[s],iva:is,lim,cred:cr,gasto:is-cr})});return filas}

function calcular(c){const F=c.F;
  const V={};F.filter(f=>f.tipo==="venta").forEach(f=>{const x=V[f.cat]||(V[f.cat]={base:0,iva:0});x.base+=f.base;x.iva+=f.iva});
  const CT={};F.filter(f=>f.tipo==="compra").forEach(f=>{const x=CT[f.cat]||(CT[f.cat]={base:0,iva:0});x.base+=f.base;x.iva+=f.iva});
  const D=Object.values(V).reduce((a,x)=>a+x.iva,0),S=Object.values(CT).reduce((a,x)=>a+x.iva,0);
  // Compras identificadas (o todas, si la empresa vende a una sola tarifa)
  const ID={};F.filter(f=>f.tipo==="compra"&&f.tar>0&&f.dest!=="ni").forEach(f=>{const k=f.tar+"|"+(f.dest||"v13");const x=ID[k]||(ID[k]={tar:f.tar,dest:f.dest||"v13",base:0,iva:0});x.base+=f.base;x.iva+=f.iva});
  const ident=Object.values(ID).sort((a,b)=>b.tar-a.tar||ORD_V.indexOf(a.dest)-ORD_V.indexOf(b.dest)).map(x=>{const lim=limite(x.tar,x.dest),cred=lim===x.tar?x.iva:Math.round(x.base*lim/100);return {...x,lim,cred,gasto:x.iva-cred}});
  const NI=F.filter(f=>f.dest==="ni"),ni={base:NI.reduce((a,f)=>a+f.base,0),iva:NI.reduce((a,f)=>a+f.iva,0)};
  ni.filas=c.nivel>=3?repartir(ni.iva,c.p,c.SET):[];
  const C=ident.reduce((a,x)=>a+x.cred,0)+ni.filas.reduce((a,x)=>a+x.cred,0),G=S-C;
  // Liquidación anual (diciembre)
  let LQ=null;if(c.nivel===4){const E=c.enenov,anio={},pd={};c.SET.forEach(s=>anio[s]=E.v[s]+((V[s]||{}).base||0));const T=Object.values(anio).reduce((a,b)=>a+b,0);
    c.SET.forEach(s=>pd[s]=Math.round(anio[s]/T*10000)/10000);const dif=1-Object.values(pd).reduce((a,b)=>a+b,0);pd.v13=Math.round((pd.v13+dif)*10000)/10000;
    const credEnenov=repartir(E.ivaNi,c.p,c.SET).reduce((a,x)=>a+x.cred,0),ivaAnio=E.ivaNi+ni.iva,filasDef=repartir(ivaAnio,pd,c.SET);
    const def=filasDef.reduce((a,x)=>a+x.cred,0),aplic=credEnenov+ni.filas.reduce((a,x)=>a+x.cred,0);
    LQ={anio,pd,totAnio:T,credEnenov,ivaAnio,filasDef,def,aplic,L:def-aplic}}
  const L=LQ?LQ.L:0,neto=D-C,periodo=neto-L,ret=F.reduce((a,f)=>a+f.ret,0),fin=periodo-ret-c.sfa;
  const R={D,S,C,G,neto,L,periodo,ret,sfa:c.sfa,fin,pagar:Math.max(0,fin),plazo:plazoDe(c.mes)};
  const caso={...c,V,CT,ident,ni,LQ,R};caso.diario=F.map(f=>asientoFactura(f,c.emp));caso.balanza=balanzaDe(caso.diario);caso.form=formulario(caso);caso.asientos=asientos(caso);return caso}
const netos=lin=>{const o={};lin.forEach(([k,v])=>{if(v)o[k]=(o[k]||0)+v});Object.keys(o).forEach(k=>{if(Math.abs(o[k])<.5)delete o[k]});return o};
// Asiento de diario de una factura (+ débito, − crédito)
function asientoFactura(f,emp){if(f.tipo==="venta"){const cob=f.cond==="credito"?"1103":f.medio==="efectivo"?"1101":"1102";
    return netos([[cob,f.total-f.ret],["1109",f.ret],[(emp==="servicios"?"4102.":"4101.")+SUF_V[f.cat],-f.base],f.iva?["2103."+SUF_T[f.tar],-f.iva]:["",0]])}
  const pag=f.cond==="credito"?"2101":f.medio==="efectivo"?"1101":"1102";
  return netos([[f.cta,f.simp?f.total:f.base],f.iva?["1106."+SUF_T[f.tar],f.iva]:["",0],[pag,-f.total]])}
// Balanza de comprobación de los movimientos del mes (sumas y saldos)
function balanzaDe(D){const B={};D.forEach(n=>Object.entries(n).forEach(([c,v])=>{const x=B[c]||(B[c]={d:0,h:0});v>0?x.d+=v:x.h-=v}));
  const ord=Object.keys(B).sort((a,b)=>CAT.findIndex(x=>x[0]===a)-CAT.findIndex(x=>x[0]===b));
  const filas=ord.map(c=>{const x=B[c],sd=Math.max(0,x.d-x.h),sa=Math.max(0,x.h-x.d);return {c,d:x.d,h:x.h,sd,sa}});
  const T=k=>filas.reduce((a,x)=>a+x[k],0);return {filas,tot:{d:T("d"),h:T("h"),sd:T("sd"),sa:T("sa")}}}

/* ── Formulario 150: casillas que aplican a este caso (como en TRIBU-CR) ── */
function formulario(c){const {V,CT,R}=c,L=[],add=(sec,k,n,v,o)=>L.push({sec,k,n,v,...(o||{})});
  const grav=ORD_V.filter(s=>V[s]&&TV[s].tar>0).sort((a,b)=>TV[b].tar-TV[a].tar);
  grav.forEach(s=>{add("I","vt"+TV[s].tar,`Total ventas a ${TV[s].tar} %`,V[s].base);add("I","vi"+TV[s].tar,`Monto de impuesto a ${TV[s].tar} %`,V[s].iva)});
  const tg=grav.reduce((a,s)=>a+V[s].base,0);add("I","vgg","Total ventas generales gravadas",tg);add("I","vgi","Ventas generales. Monto de impuesto",R.D);
  if(V.ecd)add("I","vecd","Total ventas exentas con derecho a crédito pleno",V.ecd.base);if(V.esd)add("I","vesd","Total ventas exentas sin derecho a crédito",V.esd.base);
  add("I","vtot","Total ventas generales",Object.values(V).reduce((a,x)=>a+x.base,0));
  [13,4,2,1].filter(t=>CT["c"+t]).forEach(t=>{add("II","ct"+t,`Total compras a ${t} %`,CT["c"+t].base);add("II","ci"+t,`Impuesto soportado a ${t} %`,CT["c"+t].iva)});
  if(c.nivel>=3)c.SET.forEach(s=>add("II","pp_"+s,`Proporción provisional · ${TV[s].n}`,c.p[s]*100,{pct:1}));
  const conIva=[13,4,2,1].reduce((a,t)=>a+((CT["c"+t]||{}).base||0),0),sin=((CT.csr||{}).base||0)+((CT.cex||{}).base||0);
  add("II","ccon","Total compras con IVA soportado del periodo",conIva);
  if(CT.csr)add("II","csr","Bienes y servicios adquiridos a otros regímenes",CT.csr.base);if(CT.cex)add("II","cex","Bienes y servicios exentos",CT.cex.base);
  add("II","csin","Total compras sin IVA soportado o no acreditable del periodo",sin);add("II","ctot","Total compras del periodo",conIva+sin);
  add("II","tcf","Total crédito fiscal del periodo",R.C);add("II","tgu","Total importe de gasto para utilidades",R.G);add("II","tis","Total impuesto soportado del periodo",R.S);
  if(c.LQ){add("III","lqd","Crédito fiscal generado según proporción definitiva",c.LQ.def);add("III","lqa","Crédito fiscal aplicado durante el año según proporción provisional",c.LQ.aplic);
    add("III","lqf","Saldo a favor por aplicación de la liquidación final de la proporcionalidad",Math.max(0,R.L));add("III","lqx","Saldo deudor por aplicación de la liquidación final de la proporcionalidad",Math.max(0,-R.L))}
  add("IV","sf","Saldo a favor",Math.max(0,-R.neto));add("IV","in","Impuesto neto (saldo deudor)",Math.max(0,R.neto));
  add("IV","sfp","Saldo a favor del periodo",Math.max(0,-R.periodo));add("IV","ip","Impuesto del periodo (saldo deudor)",Math.max(0,R.periodo));
  add("V","idt","Impuesto determinado",Math.max(0,R.periodo));add("V","ret","Retenciones pago a cuenta del impuesto",R.ret);add("V","sfa","Saldo a favor de periodos anteriores",R.sfa);
  add("V","if","Impuesto final (saldo deudor)",Math.max(0,R.fin));add("V","sff","Saldo a favor final",Math.max(0,-R.fin));
  add("VI","imp","Importe a pagar",R.pagar);add("VI","int","Intereses",0);add("VI","tdp","Total deuda a pagar",R.pagar);
  return L}
const SECCIONES={I:"I. Ventas y otras operaciones del periodo",II:"II. Compras y créditos del periodo",III:"III. Liquidación de créditos por regla de proporcionalidad",IV:"IV. Determinación del impuesto por operaciones gravadas",V:"V. Determinación del impuesto final",VI:"VI. Liquidación de la deuda tributaria"};

/* ── Asientos esperados (saldo neto por cuenta: + débito, − crédito) ── */
function asientos(c){const R=c.R,A=[],fin=`${ANIO}-${String(c.mes).padStart(2,"0")}-${finDeMes(c.mes)}`;
  const deb=[13,4,2,1].filter(t=>c.V&&Object.keys(c.V).some(s=>TV[s].tar===t)).map(t=>["2103."+SUF_T[t],Object.keys(c.V).filter(s=>TV[s].tar===t).reduce((a,s)=>a+c.V[s].iva,0)]);
  const sop=[13,4,2,1].filter(t=>c.CT["c"+t]).map(t=>["1106."+SUF_T[t],-c.CT["c"+t].iva]);
  A.push({k:"a3",t:"Liquidación del IVA del mes",fecha:fin,g:`Cierre del IVA de ${MESES[c.mes-1]}: se cancelan los saldos de IVA por pagar (débito fiscal) y de IVA soportado (crédito fiscal) de cada tarifa que muestra la balanza, el IVA que no se puede acreditar pasa a gasto${c.LQ?" (con el ajuste de la liquidación anual de la proporcionalidad)":""}, se aplican las retenciones${R.sfa?" y el saldo a favor anterior":""}, y queda el impuesto por pagar o el saldo a favor.`,
    n:netos([...deb,...sop,["6110",R.G-R.L],["1109",-R.ret],["1108",-R.sfa],R.fin>=0?["2104",-R.fin]:["1108",-R.fin]])});
  if(R.pagar>0)A.push({k:"a4",t:"Pago del IVA",fecha:R.plazo,g:`Pago del impuesto en TRIBU-CR a más tardar el ${fechaCR(R.plazo)}, con transferencia desde la cuenta bancaria.`,n:netos([["2104",R.pagar],["1102",-R.pagar]])});
  return A}

/* ── Guía: cómo se declara el IVA en el formulario 150 ── */
function verGuia(){abrirDlg("📘 Cómo se declara el IVA · Formulario 150 (TRIBU-CR)",`<div class="guia">
  <p>La declaración del IVA del régimen general es el <b>formulario 150</b> de TRIBU-CR (antes D-104). Es <b>mensual</b> y se presenta y paga a más tardar el <b>día 15 natural del mes siguiente</b> (si cae en fin de semana, el siguiente día hábil).</p>
  <ol><li><b>Débito fiscal</b>: IVA de las ventas del mes, separado por tarifa (13 %, 4 %, 2 %, 1 %) y las ventas exentas o no sujetas (con o sin derecho a crédito).</li>
  <li><b>Impuesto soportado</b>: IVA de las facturas de compra. Las compras a proveedores del régimen simplificado o exentas no traen IVA soportado.</li>
  <li><b>Crédito fiscal</b>: la parte del IVA soportado que se puede restar.
    <ul><li>Si la empresa vende todo al 13 % o al 1 %, o con derecho a crédito pleno: todo el IVA soportado es crédito.</li>
    <li><b>Tarifa reducida</b> (4 % o 2 %): la compra destinada a esas ventas solo da crédito hasta esa tarifa (tarifa aplicada = la menor). El resto es <b>gasto para utilidades</b>.</li>
    <li><b>Ventas sin derecho a crédito</b> (exentas sin derecho): sus compras no dan crédito.</li>
    <li><b>Compras no identificadas</b> (alquiler, electricidad, publicidad…: sirven a todas las ventas): se reparten con la <b>proporción provisional</b> = ventas de cada tipo del año anterior ÷ total de ventas del año anterior.</li></ul></li>
  <li><b>Diciembre</b>: se calcula la <b>proporción definitiva</b> con las ventas reales del año y se compara el crédito definitivo con el aplicado durante el año: la diferencia es un saldo a favor o un saldo deudor por la liquidación de la proporcionalidad.</li>
  <li><b>Impuesto final</b> = débito − crédito (± liquidación) − retenciones de tarjetas (pago a cuenta) − saldo a favor de periodos anteriores.</li></ol>
  <h4>Del diario a la declaración</h4><p>Cada factura se registra en el diario con <b>subcuentas por tarifa</b> (Ventas gravadas al 13 %, IVA por pagar 13 %, IVA soportado 13 %…). La balanza de comprobación suma esas subcuentas y de ahí se cargan las ventas y el IVA en el formulario 150.</p><h4>Asientos del IVA</h4><div class="scroll"><table><tbody>
  <tr><td>Venta</td><td>Débito: Caja, Bancos o CxC (y Retenciones de IVA por tarjetas) · Crédito: Ventas / Ingresos por servicios e <b>IVA por pagar (débito fiscal)</b></td></tr>
  <tr><td>Compra</td><td>Débito: Inventario, Suministros o Gasto y <b>IVA soportado (crédito fiscal)</b> · Crédito: Bancos o CxP</td></tr>
  <tr><td>Liquidación</td><td>Débito: IVA por pagar (débito fiscal) y Gasto por IVA no acreditable · Crédito: IVA soportado, Retenciones, IVA saldo a favor e <b>IVA por pagar a Hacienda</b> (o débito a IVA saldo a favor si el resultado es a favor)</td></tr>
  <tr><td>Pago</td><td>Débito: IVA por pagar a Hacienda · Crédito: Bancos</td></tr></tbody></table></div>
  <p class="ayuda">Simulador para clase: no se conecta con Hacienda. Algunas casillas del formulario real (casinos, sistema especial de fábrica y aduanas, pago diferido, bienes de capital) no se incluyen.</p></div><div class="acc"><button type="button" id="gOk">Entendido</button></div>`);$("#gOk").onclick=cerrarDlg}

const opsDest=()=>[...CASO.SET.map(s=>[s,"Identificada: para "+TV[s].c.toLowerCase()]),["ni","No identificada (sirve a todas las ventas)"],["na","No aplica (no trae IVA)"]];

  $$("[data-f]").forEach(x=>x.onclick=()=>{ST.m1.sel=+x.dataset.f;guardar();pintarM1()});
  $("#ant").onclick=()=>{ST.m1.sel=i-1;guardar();pintarM1()};$("#sig").onclick=()=>{ST.m1.sel=i+1;guardar();pintarM1()};
  ligarEditor(pintarM1);$("#rev1").onclick=()=>{revisarM1();pintarM1()};ligarSol(pintarM1)}
function revisarM1(){const F=CASO.F;let b=0,n=0,ok=0;

  $("#revB").onclick=()=>{revisarMB();pintarMB()};ligarSol(pintarMB)}
function revisarMB(){const B=CASO.balanza;let b=0,n=0;const chk=(p,v)=>{const ok=cerca(montoO0(getPath(ST,p)),v,1);RES[p]=ok;n++;if(ok)b++};
  B.filas.forEach(x=>["d","h","sd","sa"].forEach(k=>chk(`mb.${x.c.replace(".","_")}.${k}`,x[k])));["d","h","sd","sa"].forEach(k=>chk(`mb.tot.${k}`,B.tot[k]));
  RES.mbmsg=`<span class="fb ${b===n?"ok":"bad"}">${b===n?"✅ ¡Balanza correcta! Sumas iguales y saldos iguales.":`❌ ${b} de ${n} casillas correctas.`}</span>`;ponerNota("mb",100*b/n)}

/* ══════════ MÓDULO 2 · Crédito fiscal y proporcionalidad ══════════ */
function pintarM2(){const C=CASO,R=C.R,s2=ST.sol.m2;
  const tablaCT=`<div class="scroll"><table><thead><tr><th>Compras por tarifa</th><th class="r">Total compras</th><th class="r">Impuesto soportado</th></tr></thead><tbody>${[13,4,2,1].filter(t=>C.CT["c"+t]).map(t=>`<tr><td>Compras al ${t} %</td><td class="r num">${fn(C.CT["c"+t].base)}</td><td class="r num">${fn(C.CT["c"+t].iva)}</td></tr>`).join("")}<tr><td><b>Total</b></td><td></td><td class="r num"><b>${fn(R.S)}</b></td></tr></tbody></table></div>`;
  const ident=C.ident.map((x,i)=>`<tr><td>Compras al ${x.tar} % ${C.nivel===1?"":"→ "+TV[x.dest].c.toLowerCase()}</td><td class="r num">${fn(x.base)}</td><td class="r num">${fn(x.iva)}</td><td>${inp(`m2.id.${i}.lim`,"%")}</td><td>${inp(`m2.id.${i}.cred`,"₡")}</td><td>${inp(`m2.id.${i}.gasto`,"₡")}</td>${s2?`<td class="sol num">${x.lim} % · ${fn(x.cred)} · ${fn(x.gasto)}</td>`:""}</tr>`).join("");
  let html=`<div class="card"><h3>⚖️ Crédito fiscal del periodo</h3>${listaFacturas()}<p class="ayuda">Del IVA soportado, ¿cuánto se puede restar como <b>crédito fiscal</b> y cuánto pasa a <b>gasto para utilidades</b>?${C.nivel===1?" La empresa vende todo al 13 %: el crédito es pleno.":""}</p>${tablaCT}
    <h4 class="ev-h">${C.nivel===1?"Crédito por tarifa de compra":"Compras identificadas (se sabe a qué venta van)"}</h4>
    <p class="ayuda">Tarifa aplicada: si la venta tiene derecho a crédito pleno (13 %, 1 % o exenta con derecho) es la tarifa de la compra; si la venta es al 4 % o al 2 %, es la menor entre la de la compra y la de la venta; si la venta no tiene derecho a crédito, es 0. Crédito = base × tarifa aplicada. Gasto = IVA soportado − crédito.</p>
    <div class="scroll"><table><thead><tr><th>Compras</th><th class="r">Base</th><th class="r">IVA soportado</th><th>Tarifa aplicada</th><th>Crédito fiscal</th><th>Gasto para utilidades</th>${s2?"<th>Solución</th>":""}</tr></thead><tbody>${ident||'<tr><td colspan="6" class="muted">No hay compras identificadas con IVA.</td></tr>'}</tbody></table></div>`;
  if(C.nivel>=3){const tA=Object.values(C.ant).reduce((a,b)=>a+b,0);
    html+=`<h4 class="ev-h">Proporción provisional (ventas del año anterior)</h4><p class="ayuda">Proporción de cada tipo = ventas de ese tipo ÷ total de ventas del año anterior. Escríbala en porcentaje con dos decimales.</p>
    <div class="scroll"><table><thead><tr><th>Tipo de venta</th><th class="r">Ventas ${ANIO-1}</th><th>Proporción provisional</th>${s2?"<th>Solución</th>":""}</tr></thead><tbody>${C.SET.map(s=>`<tr><td>${TV[s].n}</td><td class="r num">${fn(C.ant[s])}</td><td>${inp("m2.pp."+s,"%")}</td>${s2?`<td class="sol num">${pct2(C.p[s])}</td>`:""}</tr>`).join("")}<tr><td><b>Total</b></td><td class="r num"><b>${fn(tA)}</b></td><td class="num"><b>100 %</b></td></tr></tbody></table></div>
    <h4 class="ev-h">Compras no identificadas al 13 %: base ${fm(C.ni.base)} · IVA soportado ${fm(C.ni.iva)}</h4><p class="ayuda">IVA de cada tipo = IVA soportado × proporción (redondee al colón; el último tipo lleva lo que falta). Crédito = IVA del tipo × tarifa aplicada ÷ 13.</p>
    <div class="scroll"><table><thead><tr><th>Con proporción de…</th><th>IVA soportado</th><th>Crédito fiscal</th><th>Gasto para utilidades</th>${s2?"<th>Solución</th>":""}</tr></thead><tbody>${C.ni.filas.map(x=>`<tr><td>${TV[x.s].n}</td><td>${inp("m2.ni."+x.s+".iva","₡")}</td><td>${inp("m2.ni."+x.s+".cred","₡")}</td><td>${inp("m2.ni."+x.s+".gasto","₡")}</td>${s2?`<td class="sol num">${fn(x.iva)} · ${fn(x.cred)} · ${fn(x.gasto)}</td>`:""}</tr>`).join("")}</tbody></table></div>`}
  if(C.LQ){const Q=C.LQ,E=C.enenov;
    html+=`<h4 class="ev-h">📅 Liquidación anual de la proporcionalidad (declaración de diciembre)</h4><p class="ayuda">Ventas del año = enero a noviembre + diciembre (sus facturas). Proporción definitiva = ventas del tipo ÷ total del año. Con ella se reparte el IVA de las compras no identificadas de todo el año (${fm(E.ivaNi)} de enero a noviembre + ${fm(C.ni.iva)} de diciembre = ${fm(Q.ivaAnio)}).</p>
    <div class="scroll"><table><thead><tr><th>Tipo de venta</th><th class="r">Enero a noviembre</th><th>Ventas del año</th><th>Proporción definitiva</th>${s2?"<th>Solución</th>":""}</tr></thead><tbody>${C.SET.map(s=>`<tr><td>${TV[s].n}</td><td class="r num">${fn(E.v[s])}</td><td>${inp("m2.lq.a."+s,"₡")}</td><td>${inp("m2.lq.p."+s,"%")}</td>${s2?`<td class="sol num">${fn(Q.anio[s])} · ${pct2(Q.pd[s])}</td>`:""}</tr>`).join("")}</tbody></table></div>
    <div class="ins-g" style="margin-top:8px"><label>Crédito fiscal generado según proporción definitiva${inp("m2.lq.def","₡")}</label><label>Crédito aplicado durante el año (enero a noviembre: ${fm(Q.credEnenov)} + diciembre)${inp("m2.lq.apl","₡")}</label>
      <label>Saldo a favor por la liquidación${inp("m2.lq.sf","₡")}</label><label>Saldo deudor por la liquidación${inp("m2.lq.sd","₡")}</label></div>
    ${s2?`<p class="sol">Definitivo ${fm(Q.def)} − aplicado ${fm(Q.aplic)} = ${Q.L>=0?"saldo a favor":"saldo deudor"} de ${fm(Math.abs(Q.L))}.</p>`:""}`}
  html+=`<h4 class="ev-h">Totales del periodo</h4><div class="ins-g"><label>Total crédito fiscal del periodo${inp("m2.tc","₡")}</label><label>Total importe de gasto para utilidades${inp("m2.tg","₡")}</label></div>${s2?`<p class="sol">Crédito ${fm(R.C)} · Gasto ${fm(R.G)} (suman el IVA soportado ${fm(R.S)}).</p>`:""}
    <div class="acc"><span id="m2msg" style="flex:1">${RES.m2msg||""}</span>${solBtn("m2")}<button type="button" class="revbtn" id="rev2">✔️ Revisar</button></div></div>`;
  $("#mod").innerHTML=html;$("#rev2").onclick=()=>{revisarM2();pintarM2()};ligarSol(pintarM2)}
function revisarM2(){const C=CASO,g=p=>getPath(ST,p);let b=0,n=0;const chk=(p,v,t)=>{const ok=cerca(montoO0(g(p)),v,t);RES[p]=ok;n++;if(ok)b++};
  C.ident.forEach((x,i)=>{chk(`m2.id.${i}.lim`,x.lim,0);chk(`m2.id.${i}.cred`,x.cred,2);chk(`m2.id.${i}.gasto`,x.gasto,2)});
  if(C.nivel>=3){C.SET.forEach(s=>chk("m2.pp."+s,C.p[s]*100,.011));C.ni.filas.forEach(x=>{chk(`m2.ni.${x.s}.iva`,x.iva,2);chk(`m2.ni.${x.s}.cred`,x.cred,3);chk(`m2.ni.${x.s}.gasto`,x.gasto,3)})}
  if(C.LQ){const Q=C.LQ;C.SET.forEach(s=>{chk("m2.lq.a."+s,Q.anio[s],1);chk("m2.lq.p."+s,Q.pd[s]*100,.011)});chk("m2.lq.def",Q.def,8);chk("m2.lq.apl",Q.aplic,8);chk("m2.lq.sf",Math.max(0,Q.L),10);chk("m2.lq.sd",Math.max(0,-Q.L),10)}
  chk("m2.tc",C.R.C,5);chk("m2.tg",C.R.G,5);
  RES.m2msg=`<span class="fb ${b===n?"ok":"bad"}">${b===n?"✅ ¡Crédito fiscal correcto!":`❌ ${b} de ${n} casillas correctas.`}</span>`;ponerNota("m2",100*b/n)}

/* ══════════ MÓDULO 3 · Formulario 150 ══════════ */
function pintarM3(){const C=CASO,s3=ST.sol.m3,L=C.form;
  $("#mod").innerHTML=`<div class="card tribu"><div class="tribu-hd"><div><b>TRIBU-CR · Declaraciones</b><small>Formulario 150 · Impuesto al Valor Agregado (régimen general)</small></div><div class="tribu-dat"><span>Cédula 3-101-${String(C.seed).slice(0,6)}</span><span>${esc(C.empresa)}</span><span>Periodo: <b>${String(C.mes).padStart(2,"0")}/${ANIO}</b></span></div></div>

function revisarM3(){const C=CASO;let b=0,n=0;C.form.forEach(x=>{const p="m3."+x.k,ok=cerca(montoO0(getPath(ST,p)),x.v,x.pct?.011:8);RES[p]=ok;n++;if(ok)b++});

/* ══════════ MÓDULO 4 · Asientos del IVA ══════════ */
const opsCta=()=>CAT.filter(([c])=>!(CASO.emp==="servicios"&&c.startsWith("4101"))&&!(CASO.emp==="comercial"&&c.startsWith("4102"))).map(([c,n])=>[c,c+" · "+n]);
function filasP(p){const L=getPath(ST,p);if(Array.isArray(L)&&L.length)return L;const nl=[{c:"",d:"",h:""},{c:"",d:"",h:""},{c:"",d:"",h:""}];setPath(ST,p,nl);return nl}
const filasA=k=>filasP("m4."+k);
// Tabla editable de un asiento (cuenta, debe, haber), guardada en la ruta p
function editorAsiento(p){const L=filasP(p),td=L.reduce((x,l)=>x+montoO0(l.d),0),th=L.reduce((x,l)=>x+montoO0(l.h),0);
  return `<div class="scroll"><table class="asi-t"><thead><tr><th>Cuenta</th><th class="r">Debe</th><th class="r">Haber</th><th></th></tr></thead><tbody>
    ${L.map((l,j)=>`<tr><td>${sel(`${p}.${j}.c`,opsCta(),"— Cuenta —")}</td><td>${inp(`${p}.${j}.d`,"Debe")}</td><td>${inp(`${p}.${j}.h`,"Haber")}</td><td><button type="button" class="ghost sm" data-q="${p}|${j}" aria-label="Quitar línea">✕</button></td></tr>`).join("")}
    <tr class="asi-tot"><td><button type="button" class="ghost sm" data-mas="${p}">＋ Línea</button> ${td||th?(Math.abs(td-th)<.5?'<span class="ok-t">✓ Cuadra</span>':'<span class="warn">⚠️ No cuadra</span>'):""}</td><td class="r num">${fn(td)}</td><td class="r num">${fn(th)}</td><td></td></tr></tbody></table></div>`}
function ligarEditor(rep){$$("[data-mas]").forEach(b=>b.onclick=()=>{filasP(b.dataset.mas).push({c:"",d:"",h:""});guardar();rep()});
  $$("[data-q]").forEach(b=>b.onclick=()=>{const [p,j]=b.dataset.q.split("|");const L=filasP(p);if(L.length>1)L.splice(+j,1);guardar();rep()})}
// Compara un asiento con el esperado: cuentas con el monto correcto
function compararAsiento(p,n){const L=filasP(p),net={};L.forEach(l=>{if(!l.c)return;net[l.c]=(net[l.c]||0)+montoO0(l.d)-montoO0(l.h)});
  const ks=new Set([...Object.keys(n),...Object.keys(net).filter(k=>Math.abs(net[k])>.5)]);let bien=0;ks.forEach(k=>{if(cerca(net[k]||0,n[k]||0,2))bien++});
  L.forEach((l,j)=>{if(l.c)RES[`${p}.${j}.c`]=cerca(net[l.c]||0,n[l.c]||0,2)});return {bien,tot:ks.size}}
function pintarM4(){const C=CASO,s4=ST.sol.m4;
  $("#mod").innerHTML=`<div class="card"><h3>✍️ Liquidación y pago del IVA de ${mesTxt()}</h3>${listaFacturas()}<p class="ayuda">Las ventas y las compras ya quedaron en el diario (módulo 1). Ahora cierre el IVA con los saldos de la <b>balanza</b> y el resultado del <b>formulario 150</b>.${C.R.sfa?` La empresa tiene en <b>1108 IVA saldo a favor</b> ${fm(C.R.sfa)} de periodos anteriores, que se aplica en esta declaración.`:""}</p>
    ${C.asientos.map((a,i)=>`<div class="asi ${RES["m4."+a.k]===true?"ok":RES["m4."+a.k]===false?"bad":""}"><div class="asi-hd"><b>${i+1}. ${a.t}</b><span class="muted">${fechaCR(a.fecha)}</span></div><p class="ayuda" style="margin:2px 0 6px">${esc(a.g)}</p>
      ${editorAsiento("m4."+a.k)}${s4?`<div class="sol"><b>Solución</b>${solAsiento(a)}</div>`:""}</div>`).join("")}
    ${C.R.pagar>0?"":`<p class="fb ok">Este mes el resultado es <b>saldo a favor</b> (${fm(-C.R.fin)}): no hay pago. Queda en 1108 IVA saldo a favor para los meses siguientes.</p>`}
    <div class="acc"><span id="m4msg" style="flex:1">${RES.m4msg||""}</span>${solBtn("m4")}<button type="button" class="revbtn" id="rev4">✔️ Revisar asientos</button></div></div>`;
  ligarEditor(pintarM4);$("#rev4").onclick=()=>{revisarM4();pintarM4()};ligarSol(pintarM4)}
const solAsiento=a=>`<table class="asi-t">${Object.entries(a.n).sort((x,y)=>(y[1]>0)-(x[1]>0)).map(([c,v])=>`<tr><td>${c} · ${esc(nom(c))}</td><td class="r num">${v>0?fn(v):""}</td><td class="r num">${v<0?fn(-v):""}</td></tr>`).join("")}</table>`;
function revisarM4(){let b=0,n=0,ok=0;CASO.asientos.forEach(a=>{const r=compararAsiento("m4."+a.k,a.n),todo=r.bien===r.tot;RES["m4."+a.k]=todo;if(todo)ok++;b+=r.bien;n+=r.tot});
  RES.m4msg=`<span class="fb ${ok===CASO.asientos.length?"ok":"bad"}">${ok===CASO.asientos.length?"✅ ¡Asientos correctos!":`❌ ${ok} de ${CASO.asientos.length} asientos correctos (${b} de ${n} cuentas con el monto correcto).`}</span>`;ponerNota("m4",100*b/Math.max(1,n))}

async function cargarActividad(){
  try{if(!HAY_BD())throw new Error(SES?"No se pudo conectar con la plataforma. Revise el internet y recargue.":"Entre a la plataforma con su usuario y abra la Declaración del IVA desde ahí.");
    const {data:t,error}=await sb.from("trabajos_cotidianos").select("*").eq("id",ACTV.id).maybeSingle();if(error)throw error;
    if(!t||(t.contenido_actividad||{}).estrategia!==ESTR_T)throw new Error("No se encontró esta actividad de la Declaración del IVA.");
    ACTV.t=t;const C=t.contenido_actividad;
    if(ACTV.modo==="estudiante"&&t.habilitado===false)throw new Error("Su profe todavía no ha abierto esta actividad (o ya la cerró).");
    KEYV=`iva_act_${t.id}_${ACTV.modo==="estudiante"?EST_ID:ACTV.modo}`;
    let loc=null;try{loc=JSON.parse(localStorage.getItem(KEYV)||"null")}catch(e){}
    ST=loc&&loc.v===1?loc:estadoNuevo(C.iva_seed,C.iva_nivel,C.iva_emp);
    if(ACTV.modo==="estudiante"||ACTV.modo==="ver"){const est=ACTV.modo==="ver"?QSa.get("est"):EST_ID;
      const {data:en}=await sb.from("actividades_estudiante").select("*").eq("trabajo_id",t.id).eq("estudiante_id",est).maybeSingle();
      ACTV.entrega=en||null;const R=en&&en.datos_prueba&&en.datos_prueba.iva;
      if(ACTV.modo==="ver"){if(!R||!R.st)throw new Error("Este estudiante todavía no ha trabajado en esta actividad.");ST=R.st;
        const {data:es}=await sb.from("estudiantes").select("nombre, apellido1, apellido2").eq("id",est).maybeSingle();ACTV.nombre=es?[es.nombre,es.apellido1,es.apellido2].filter(Boolean).join(" "):String(est)}
      else if(R&&R.st&&(!ST.guardado_en||(R.guardado_en||"")>ST.guardado_en))ST=R.st;
      ACTV.bloq=!!(en&&en.completado&&TIPOS_T[C.iva_tipo||"general"].nota)}
    CASO=generarCaso(C.iva_seed,C.iva_nivel,C.iva_emp);if(!modsAct().includes(ST.mod))ST.mod=modsAct()[0];
    if(ACTV.modo==="ver"||ST.fin)calificarTodo();
  }catch(e){ACTV.error=e.message||String(e)}
  ACTV.listo=true;pintar()}

async function crearActividadT(D,titulo,c){const T=TIPOS_T[D.tipo],hoy=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10),desc=descAct(c);

  let ind=null;
  if(T.nota){const {data:ex}=await sb.from("indicadores").select("id,letra").eq("materia_id",D.materia).eq("categoria",T.nota);
    const usadas=new Set((ex||[]).map(e=>String(e.letra||"").trim().toUpperCase().replace(/\d+$/,"")));let i=0,letra="";for(;;){let n=i,l="";do{l=String.fromCharCode(65+(n%26))+l;n=Math.floor(n/26)-1}while(n>=0);if(!usadas.has(l)){letra=l;break}i++}
    const r=await sb.from("indicadores").insert({materia_id:D.materia,categoria:T.nota,letra,descripcion:desc,puntaje_maximo:3,fecha_evaluacion:D.fecha||hoy,orden:(ex||[]).length+1}).select().maybeSingle();
    if(r.error||!r.data)throw new Error(r.error?r.error.message:"no se pudo crear el indicador");ind=r.data;
    const niv=[[0,"Sin evidencia","No presenta el trabajo o tiene correcto menos del 35 % de lo solicitado."],[1,"Inicial","Tiene correcto entre el 35 % y el 59 % de la clasificación, el crédito fiscal, el formulario 150 o los asientos solicitados."],[2,"Intermedio","Tiene correcto entre el 60 % y el 84 % de la clasificación, el crédito fiscal, el formulario 150 o los asientos solicitados."],[3,"Avanzado","Tiene correcto el 85 % o más de la clasificación, el crédito fiscal, el formulario 150 o los asientos solicitados."]];
    try{await sb.from("criterios_indicador").insert(niv.map(([puntaje,nivel,d])=>({indicador_id:ind.id,puntaje,nivel,descripcion:d})))}catch(e){}}
  const C={estrategia:ESTR_T,iva_tipo:D.tipo,materia_id:D.materia,iva_desc:desc,iva_modulos:D.mods,iva_seed:D.seed,iva_nivel:D.nivel,iva_emp:D.emp,fecha_entrega:["tarea","casa"].includes(D.tipo)&&D.fecha?D.fecha:null,criterios,

  const porT={};HUB.ae.forEach(a=>{(porT[a.trabajo_id]=porT[a.trabajo_id]||{})[a.estudiante_id]=a});
  const st={},nAct={};CATS_T.forEach(k=>{const L=delMat.filter(t=>catT(t)===k&&cuentaT(t));nAct[k]=L.length+" actividad"+(L.length===1?"":"es");st[k]=statCat(L.flatMap(t=>ES.map(e=>({t,a:(porT[t.id]||{})[e.id]}))))});
  if(!HUB.cat||!CATS_T.includes(HUB.cat))HUB.cat=CATS_T.find(k=>delMat.some(t=>catT(t)===k))||"evaluativa";
  const T=TIPOS_T[HUB.cat],G=delMat.filter(t=>catT(t)===HUB.cat);
  const fila=t=>{const C=t.contenido_actividad||{},T=TIPOS_T[C.iva_tipo||"general"],R=porT[t.id]||{},ent=ES.filter(e=>R[e.id]&&R[e.id].completado).length;return `<div class="hub-f"><div style="flex:1;min-width:220px"><b>${T.ic} ${esc(t.titulo)}</b><small>${T.et} · ${C.iva_emp==="servicios"?"🛠️ Servicios":"🛒 Comercial"} · ${NIVELES[C.iva_nivel||1]} · módulos ${(C.iva_modulos||[]).map(m=>m.slice(1)).join(", ")}${C.fecha_entrega?` · entrega ${fechaCR(C.fecha_entrega)}`:""}${t.indicador_id?" · con indicador en la Rúbrica":""}</small><small>📥 ${ent} de ${ES.length} ${T.nota?"entregaron":"terminaron"}</small></div>
    <span class="chip">${t.habilitado===false?"⏸️ Cerrada":"🟢 Abierta"}</span><a class="btn sec sm" href="iva-150.html?a=${t.id}">👁️ Ver y probar</a><button type="button" class="sm ${t.habilitado===false?"":"sec"}" data-hab="${t.id}">${t.habilitado===false?"▶ Abrir":"⏸️ Cerrar"}</button><button type="button" class="sec sm" data-ent="${t.id}">📥 Entregas</button><button type="button" class="sm" data-ins="${t.id}">📋 Evaluación (MEP)</button></div>`};
  return `<details class="card hubbox" ${HUB.abierto?"open":""} id="hubBox"><summary><h3 style="display:inline">📚 Actividades y evaluación · Declaración del IVA</h3></summary>
    <div class="hub-top"><label>Materia y sección<select id="hubMat">${HUB.mats.map(m=>`<option value="${m.id}" ${Number(m.id)===Number(HUB.mat)?"selected":""}>${esc(m.nombre)}${m.seccion?" · "+esc(m.seccion):""}</option>`).join("")}</select></label><span class="muted" style="font-size:.85rem">${ES.length} estudiante${ES.length===1?"":"s"}</span><span style="flex:1"></span><button type="button" id="hubNueva">✨ Nueva actividad</button></div>
    ${tarjetasCat(st,HUB.cat,"grupo",nAct)}
    <h4 class="hub-g">${T.ic} ${T.pl} <small>· ${T.desc}</small></h4>
    ${G.map(fila).join("")||`<p class="muted" style="margin:6px 0">No hay ${T.pl.toLowerCase()} en esta materia. Créela con ✨ Nueva actividad.</p>`}
    ${resumenNotasT(G.filter(cuentaT),ES,porT,T)}
    <p class="ayuda" style="margin:10px 0 0">Cada actividad trae las facturas de un mes de una <b>empresa comercial</b> o <b>de servicios</b>, en el nivel que usted escoja (tarifa única, tarifas reducidas, proporcionalidad o liquidación de diciembre). Todo el grupo recibe el mismo caso. Se crean <b>cerradas</b>: ábralas con ▶ Abrir. Las evaluativas y las tareas crean su indicador en la Rúbrica y la nota se pone sola al entregar.</p></details>`}
// «📊 Resumen de notas finales»: resultado de cada estudiante en cada actividad del tipo elegido
function resumenNotasT(G,ES,porT,T){if(!G.length||!ES.length)return "";
  const celda=(t,e)=>{const a=(porT[t.id]||{})[e.id],p=pctDe(a);if(p!=null){const C=t.contenido_actividad||{},nt=TIPOS_T[C.iva_tipo||"general"].nota;return `<td class="r num"><b style="color:${colorPct(p)}">${p} %</b>${nt?`<br><small class="muted">${a.puntaje!=null?a.puntaje:nivelDe(p)}/3 pts</small>`:""}</td>`}
    if(a)return '<td class="r"><small class="muted">⏳ en curso</small></td>';return vencida(t)?'<td class="r"><span style="color:var(--bad)" title="No realizado">❌</span></td>':'<td class="r muted">—</td>'};
  const filas=ES.map(e=>{const ns=G.map(t=>pctDe((porT[t.id]||{})[e.id])).filter(v=>v!=null),pr=ns.length?Math.round(ns.reduce((a,b)=>a+b,0)/ns.length):null;
    return `<tr><td><b>${esc(e.n)}</b></td>${G.map(t=>celda(t,e)).join("")}<td class="r num"><b>${pr!=null?pr+" %":"—"}</b></td></tr>`}).join("");
  const prom=t=>{const ns=ES.map(e=>pctDe((porT[t.id]||{})[e.id])).filter(v=>v!=null);return ns.length?Math.round(ns.reduce((a,b)=>a+b,0)/ns.length)+" %":"—"};
  return `<details class="resn" ${HUB.resAbierto?"open":""} id="hubRes"><summary>📊 Resumen de notas finales · ${T.pl}</summary>
    <p class="muted" style="margin:6px 0;font-size:.85rem">Resultado de cada estudiante (porcentaje de aciertos de los módulos de la actividad).${T.nota?" Debajo, los puntos del indicador en la Rúbrica (escala MEP: 85 % o más = 3 · 60–84 % = 2 · 35–59 % = 1).":" Este tipo de práctica no lleva nota."} ❌ = no realizado (pasó la fecha de entrega).</p>
    <div class="scroll"><table class="resn-t"><thead><tr><th>Estudiante</th>${G.map(t=>`<th class="r" title="${esc(t.titulo)}">${esc(t.titulo.length>28?t.titulo.slice(0,26)+"…":t.titulo)}</th>`).join("")}<th class="r">Promedio</th></tr></thead>
    <tbody>${filas}<tr class="resn-p"><td><b>Promedio del grupo</b></td>${G.map(t=>`<td class="r num"><b>${prom(t)}</b></td>`).join("")}<td></td></tr></tbody></table></div></details>`}
function ligarHub(){const n=$("#hubNueva");if(n)n.onclick=nuevaActividad;
  const hb=$("#hubBox");if(hb)hb.ontoggle=()=>{HUB.abierto=hb.open};const hr=$("#hubRes");if(hr)hr.ontoggle=()=>{HUB.resAbierto=hr.open};
  const hm=$("#hubMat");if(hm)hm.onchange=async()=>{HUB.mat=+hm.value;HUB.cat=null;await cargarEstMat(HUB.mat);pintar()};
  $$("#hubBox [data-cat]").forEach(b=>b.onclick=()=>{HUB.cat=b.dataset.cat;pintar()});
  $$("[data-hab]").forEach(b=>b.onclick=async()=>{const t=HUB.lista.find(x=>x.id===+b.dataset.hab);b.disabled=true;const {error}=await sb.from("trabajos_cotidianos").update({habilitado:t.habilitado===false}).eq("id",t.id);
    if(error){alert("No se pudo cambiar: "+error.message);b.disabled=false;return}t.habilitado=t.habilitado===false;toast(t.habilitado?"🟢 Abierta para los estudiantes":"⏸️ Cerrada");pintar()});
  $$("[data-ent]").forEach(b=>b.onclick=()=>verEntregasT(HUB.lista.find(x=>x.id===+b.dataset.ent)));
  $$("[data-ins]").forEach(b=>b.onclick=()=>editarEvaluacionT(HUB.lista.find(x=>x.id===+b.dataset.ins)))}
async function verEntregasT(t){const C=t.contenido_actividad||{},T=TIPOS_T[C.iva_tipo||"general"],crit=critAct(t);abrirDlg("📥 Entregas · "+t.titulo,'<p class="muted">Cargando…</p>');
  const [{data:ae},{data:em}]=await Promise.all([sb.from("actividades_estudiante").select("estudiante_id,completado,puntaje,porcentaje,datos_prueba,actualizado_en").eq("trabajo_id",t.id),sb.from("estudiante_materias").select("estudiante_id").eq("materia_id",C.materia_id)]);
  const ids=[...new Set([...(em||[]).map(x=>x.estudiante_id),...(ae||[]).map(x=>x.estudiante_id)])];
  const {data:es}=ids.length?await sb.from("estudiantes").select("id,nombre,apellido1,apellido2").in("id",ids):{data:[]};
  const por={};(ae||[]).forEach(a=>por[a.estudiante_id]=a);
  const filas=(es||[]).map(e=>({e,n:[e.apellido1,e.apellido2,e.nombre].filter(Boolean).join(" "),a:por[e.id]})).sort((x,y)=>x.n.localeCompare(y.n,"es"));
  $("#dlgB").innerHTML=`<p class="ayuda">${T.ic} ${T.et}${T.nota?` · la nota pasa sola a ${esc(T.nota)} cuando el estudiante entrega`:" · sin nota"}. Toque 👁️ para ver el trabajo de cada estudiante.</p><div class="scroll"><table><thead><tr><th>Estudiante</th><th>Estado</th>${crit.map((c,i)=>`<th class="r" title="${esc(c.nombre)}">Ind. ${i+1}</th>`).join("")}<th class="r">${T.nota?"Nota":"Resultado"}</th><th></th></tr></thead><tbody>
    ${filas.map(({e,n,a})=>{const met=a&&a.datos_prueba&&a.datos_prueba.iva&&a.datos_prueba.iva.metricas;return `<tr><td>${esc(n)}</td><td>${a?a.completado?(T.nota?"✅ Entregó":"✅ Terminó"):"⏳ En curso":"— No ha entrado"}</td>${crit.map(c=>`<td class="r num">${met&&met[c.auto]!=null?Math.round(met[c.auto])+" %":"—"}</td>`).join("")}<td class="r num"><b>${a&&a.completado?(T.nota?(a.puntaje!=null?a.puntaje+"/3":"—"):(a.porcentaje!=null?Math.round(a.porcentaje)+" %":"—")):"—"}</b></td><td>${a?`<a class="btn sec sm" href="iva-150.html?a=${t.id}&est=${encodeURIComponent(e.id)}&docente=1">👁️</a>`:""}</td></tr>`}).join("")||'<tr><td colspan="9" class="muted">No hay estudiantes en esta materia.</td></tr>'}</tbody></table></div>`}
/* ── Vista del estudiante sin actividad: sus actividades abiertas ── */
let CAT_EST=null;
async function pintarHubEstudiante(){$("#caso").innerHTML="";$("#app").innerHTML='<p class="muted" style="margin-top:20px">Cargando sus actividades…</p>';
  if(!HAY_BD()){$("#app").innerHTML=`<div class="card" style="margin-top:20px"><h3>🧾 Declaración del IVA</h3><p class="muted">Entre a la plataforma con su usuario y abra la Declaración del IVA desde ahí.</p><a class="btn" href="index.html">Ir a la plataforma</a></div>`;return}
  try{const [{data:L},{data:em}]=await Promise.all([sb.from("trabajos_cotidianos").select("id,titulo,habilitado,contenido_actividad").eq("contenido_actividad->>estrategia",ESTR_T).order("id",{ascending:false}),sb.from("estudiante_materias").select("materia_id").eq("estudiante_id",EST_ID)]);
    const mis=(em||[]).map(x=>Number(x.materia_id)),ab=(L||[]).filter(t=>mis.includes(Number((t.contenido_actividad||{}).materia_id)));
    const {data:ae}=ab.length?await sb.from("actividades_estudiante").select("trabajo_id,completado,puntaje,porcentaje").eq("estudiante_id",EST_ID).in("trabajo_id",ab.map(t=>t.id)):{data:[]};
    const mias={};(ae||[]).forEach(a=>mias[a.trabajo_id]=a);const vis=ab.filter(t=>t.habilitado!==false||mias[t.id]);
    const st={};CATS_T.forEach(k=>st[k]=statCat(vis.filter(t=>catT(t)===k).map(t=>({t,a:mias[t.id]}))));
    if(!CAT_EST)CAT_EST=CATS_T.find(k=>vis.some(t=>catT(t)===k&&!(mias[t.id]&&mias[t.id].completado)))||CATS_T.find(k=>st[k].tot)||"evaluativa";
    const T=TIPOS_T[CAT_EST],G=vis.filter(t=>catT(t)===CAT_EST);
    const estado=(t,a)=>a&&a.completado?`<span class="chip ok">✅ ${T.nota?"Entregada":"Terminada"}</span>`:vencida(t)?`<span class="chip bad">❌ No realizada</span>`:t.habilitado===false?`<span class="chip">🔒 Cerrada</span>`:a?`<span class="chip warn">⏳ En curso</span>`:`<span class="chip">🆕 Pendiente</span>`;
    const resultado=a=>{const p=pctDe(a);return p==null?'<span class="muted">—</span>':`<b style="color:${colorPct(p)}">${p} %</b>${T.nota?`<br><small class="muted">Nota ${a.puntaje!=null?a.puntaje:nivelDe(p)}/3 · ${["Sin evidencia","Inicial","Intermedio","Avanzado"][a.puntaje!=null?a.puntaje:nivelDe(p)]}</small>`:""}`};
    const accion=(t,a)=>t.habilitado===false&&!(a&&a.completado)?'<span class="muted">—</span>':`<a class="btn sm ${a&&a.completado?"sec":""}" href="iva-150.html?a=${t.id}">${a&&a.completado?(T.nota?"👁️ Ver lo que entregué":"👁️ Ver resultados y soluciones"):a?"▶ Seguir":"▶ Empezar"}</a>`;
    $("#app").innerHTML=`<div class="card" style="margin-top:16px"><h3>🧾 Mis trabajos de la Declaración del IVA</h3><p class="ayuda">Prácticas y tareas que abrió su profe: registre las facturas del mes en el diario, arme la balanza de comprobación, calcule el crédito fiscal, llene el formulario 150 y liquide el IVA. <button type="button" class="ghost sm" id="verEstr2">📘 Cómo se declara</button></p>
      ${tarjetasCat(st,CAT_EST,"yo")}
      <h4 class="hub-g">${T.ic} ${T.pl} <small>· ${T.desc}</small></h4>
      ${G.length?`<div class="scroll"><table class="tbl-est"><thead><tr><th>Práctica</th><th>Empresa</th><th>Fecha de entrega</th><th>Estado</th><th class="r">Resultado</th><th>Solución</th></tr></thead><tbody>
        ${G.map(t=>{const C=t.contenido_actividad||{},a=mias[t.id];return `<tr><td><b>${esc(t.titulo)}</b></td><td>${C.iva_emp==="servicios"?"🛠️ Servicios":"🛒 Comercial"}</td><td>${C.fecha_entrega?fechaCR(C.fecha_entrega):'<span class="muted">—</span>'}</td><td>${estado(t,a)}</td><td class="r num">${resultado(a)}</td><td>${accion(t,a)}</td></tr>`}).join("")}</tbody></table></div>`:`<p class="muted">No tiene ${T.pl.toLowerCase()} por ahora.</p>`}
      <p class="ayuda" style="margin-top:10px">${T.nota?"📋 Al entregar, la plataforma revisa todo y la nota (escala MEP 0 a 3) pasa sola a la Rúbrica. Las soluciones no se muestran en las que llevan nota.":TIPOS_T[CAT_EST].rev?"Puede revisar, ver pistas y soluciones mientras trabaja.":"Como en el examen: al terminar ve su resultado y las soluciones."}</p></div>`;
    $$("#app [data-cat]").forEach(b=>b.onclick=()=>{CAT_EST=b.dataset.cat;pintarHubEstudiante()});const ve=$("#verEstr2");if(ve)ve.onclick=verGuia}
  catch(e){$("#app").innerHTML=`<div class="card"><p class="fb bad">No se pudieron cargar sus actividades: ${esc(e.message||e)}</p></div>`}}
document.addEventListener("input",e=>{const p=e.target.dataset&&e.target.dataset.p;if(!p||e.target.tagName==="SELECT")return;setPath(ST,p,e.target.value);e.target.classList.remove("ok","bad");guardar()});
document.addEventListener("change",e=>{if(document.body.classList.contains("bloq")&&e.target.closest&&e.target.closest("#mod"))return;const p=e.target.dataset&&e.target.dataset.p;if(!p||(e.target.tagName!=="SELECT"&&e.target.type!=="date"))return;setPath(ST,p,e.target.value);e.target.classList.remove("ok","bad");guardar()});
if(ACTV.id)cargarActividad();
pintar();
</script>
