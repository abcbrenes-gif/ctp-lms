<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Planeamiento didáctico · CTP Mercedes Norte</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js?v=20261030i"></script>
<script src="js/programa-contabilidad.js?v=20261111a"></script>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#17202a;--mut:#5d6b78;--line:#d9e0e6;--pri:#0e6e5c;--pri2:#e3f3ef;--bad:#c0392b;--bad2:#fbeaea;--warn:#a66a00;--warn2:#fff4dc;--ok:#1e8449;--ok2:#e7f6ec;--sh:0 1px 3px rgba(0,0,0,.08),0 4px 14px rgba(0,0,0,.05)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11161b;--card:#1a2128;--tx:#e8edf1;--mut:#9aa8b4;--line:#2d3842;--pri:#38c2a3;--pri2:#173a33;--bad:#ff7b6b;--bad2:#3a1f1d;--warn:#f2b84b;--warn2:#3a2f17;--ok:#5fd38d;--ok2:#17331f;--sh:0 1px 3px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#11161b;--card:#1a2128;--tx:#e8edf1;--mut:#9aa8b4;--line:#2d3842;--pri:#38c2a3;--pri2:#173a33;--bad:#ff7b6b;--bad2:#3a1f1d;--warn:#f2b84b;--warn2:#3a2f17;--ok:#5fd38d;--ok2:#17331f;--sh:0 1px 3px rgba(0,0,0,.4)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 "Segoe UI",system-ui,Roboto,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
header.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
header.top .wrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px}
.brand{font-weight:800;margin-right:auto;display:flex;align-items:center;gap:8px}
.brand small{display:block;font-weight:500;color:var(--mut);font-size:.75rem}
h1,h2,h3{line-height:1.25;margin:0 0 8px}h1{font-size:1.5rem}h2{font-size:1.2rem}h3{font-size:1.05rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--sh);margin:0 0 14px}
.muted{color:var(--mut)}.small{font-size:.85rem}
button,.btn{font:inherit;font-weight:600;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:9px;padding:8px 14px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
button:hover{border-color:var(--pri)}
button.pri{background:var(--pri);border-color:var(--pri);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.pri{color:#06201a}}
button.danger{color:var(--bad);border-color:var(--bad)}
button.sm{padding:4px 10px;font-size:.85rem}
button:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
label.f,div.f{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.88rem}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%}
textarea{min-height:60px;resize:vertical}
input[type=checkbox],input[type=radio]{width:auto}
.chip{display:inline-block;font-size:.78rem;font-weight:700;padding:2px 9px;border-radius:999px;border:1px solid var(--line);background:var(--bg)}
.chip.ok{background:var(--ok2);color:var(--ok);border-color:transparent}.chip.warn{background:var(--warn2);color:var(--warn);border-color:transparent}.chip.bad{background:var(--bad2);color:var(--bad);border-color:transparent}.chip.pri{background:var(--pri2);color:var(--pri);border-color:transparent}
.tbl{overflow:auto}table{border-collapse:collapse;width:100%;font-size:.9rem}th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}th{background:var(--bg);font-size:.8rem;text-transform:uppercase;letter-spacing:.03em;color:var(--mut)}
td.r,th.r{text-align:right}
.parte{border-left:4px solid var(--pri);padding-left:12px;margin:18px 0}
.item{border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0;background:var(--card)}
.item .q{font-weight:600;margin:0 0 8px;white-space:pre-wrap}
.opc{display:flex;gap:10px;align-items:flex-start;padding:7px 9px;border:1px solid var(--line);border-radius:8px;margin:5px 0;cursor:pointer}
.opc:hover{border-color:var(--pri)}.opc input{margin-top:4px}
.opc.sel{border-color:var(--pri);background:var(--pri2)}
.ed-item{border:1px dashed var(--line);border-radius:10px;padding:10px;margin:8px 0}
.barra{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:2px solid var(--pri);padding:8px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.reloj{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.15rem}
.reloj.poco{color:var(--bad)}
.ok-t{color:var(--ok);font-weight:700}.bad-t{color:var(--bad);font-weight:700}
.aviso{border-radius:10px;padding:10px 12px;margin:0 0 12px;background:var(--warn2);color:var(--tx);border:1px solid var(--warn)}
.aviso.ok{background:var(--ok2);border-color:var(--ok)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--tx);width:min(900px,96vw);max-height:90vh;padding:0}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog .dh{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:8px}
dialog .db{padding:14px 16px}
.no-sel{user-select:none;-webkit-user-select:none}
.no-sel input,.no-sel textarea{user-select:text;-webkit-user-select:text}
table.sheet{font-size:.85rem}table.sheet input{min-width:96px;text-align:right;padding:5px 7px}
table.sheet td.ok{background:var(--ok2)}table.sheet td.bad{background:var(--bad2)}
.as-game{display:grid;grid-template-columns:minmax(220px,1fr) 1.4fr;gap:12px}@media(max-width:760px){.as-game{grid-template-columns:1fr}}
.as-panel,.as-vou{border:1px solid var(--line);border-radius:12px;padding:10px}.as-bank{display:flex;flex-direction:column;gap:6px;max-height:430px;overflow:auto}
.as-blk{display:flex;gap:8px;align-items:center;border:2px solid var(--line);border-left:6px solid var(--cc);border-radius:10px;padding:6px 8px;cursor:pointer;user-select:none;background:var(--card)}
.as-blk.pick{outline:3px solid var(--pri);outline-offset:1px}.as-blk.used{opacity:.45}.as-blk .cd,.as-lin .cd{font:700 .74rem ui-monospace,monospace;color:var(--cc)}.as-blk .nm,.as-lin .nm{font-size:.84rem;font-weight:600}
.as-blk .cl{display:block;font-size:.68rem;font-weight:800;text-transform:uppercase;color:var(--cc)}
.as-vh{font-weight:800;margin-bottom:6px}.as-cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}.as-col{border:2px dashed var(--line);border-radius:10px;padding:6px;min-height:110px}
.as-ch{font-weight:800;text-align:center;letter-spacing:.08em;margin-bottom:4px}.as-lin{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-left:5px solid var(--cc);border-radius:8px;padding:5px 6px;margin:4px 0;background:var(--card);flex-wrap:wrap}
.as-lin input{width:110px;text-align:right;padding:4px 6px}.as-lin.ok{background:var(--ok2)}.as-lin.bad{background:var(--bad2)}.as-lin.warn{background:var(--warn2)}
.as-drop{width:100%;border-style:dashed;margin-top:4px;font-size:.8rem}.as-tot{display:flex;justify-content:space-between;gap:8px;margin-top:8px;font-size:.88rem;flex-wrap:wrap}
.as-bal{margin-top:6px;padding:6px 8px;border-radius:8px;font-weight:700;font-size:.86rem;background:var(--bg,#f1f5f9)}.as-bal.okb{background:var(--ok2)}.as-bal.nob{background:var(--warn2)}
.liq-parte{border:1px solid var(--line);border-left:5px solid var(--c,var(--pri));border-radius:10px;padding:10px 12px;margin:10px 0}
.liq-paso{display:flex;gap:10px;align-items:center;justify-content:space-between;border-bottom:1px dashed var(--line);padding:6px 0}.liq-paso input{max-width:190px;text-align:right}
.hidden{display:none!important}
@media (max-width:600px){.wrap{padding:12px}.card{padding:12px}}
@media print{header.top,.noprint{display:none!important}body{background:#fff;color:#000}.card{box-shadow:none;border:0}}
.pl-ra{border:1px solid var(--line);border-left:5px solid var(--pri);border-radius:12px;padding:14px;margin:14px 0;background:var(--card)}
.pl-ra.off{opacity:.55;border-left-color:var(--line)}
.pl-ra h3{display:flex;gap:8px;align-items:flex-start}
.pl-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:14px}@media(max-width:820px){.pl-cols{grid-template-columns:minmax(0,1fr)}}
.pl-fijo{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.9rem}
.pl-fijo ul{margin:4px 0 0 18px;padding:0}
.pl-est{display:flex;gap:6px;align-items:flex-start;margin:5px 0}
.pl-est b{flex:none;min-width:2.2rem;padding-top:7px}
.pl-est textarea{min-height:44px}
.pl-lbl{font-weight:700;font-size:.82rem;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin:10px 0 4px}
.pl-badge{font-size:.72rem;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--pri2);color:var(--pri)}
@media print{.noprint{display:none!important}body{background:#fff}}
</style>
</head>
<body>
<header class="top noprint"><div class="wrap">
  <div class="brand">📘 <span>Planeamiento didáctico<small>Plan de práctica pedagógica · ETP · MEP</small></span></div>
  <span id="quien" class="muted small"></span>
  <a class="btn" href="index.html">← Plataforma</a>
</div></header>
<main class="wrap" id="app"><p class="muted">Cargando…</p></main>
<script>
// ═══════════════════════════════════════════════════════════════════
// Planeamiento didáctico (ETP): plan de práctica pedagógica por unidad de estudio,
// según las «Orientaciones para la planificación pedagógica 2026» (DETCE, MEP) y el
// formato del programa de estudio (CSE 2020). El resultado de aprendizaje y los
// saberes esenciales vienen del programa (js/programa-contabilidad.js) y se respetan;
// la IA propone estrategias D/ y E/, evidencias e indicadores, y el docente edita.
// Se guarda en trabajos_cotidianos (habilitado:false, estrategia "plan_practica").
// ═══════════════════════════════════════════════════════════════════
const SES=(()=>{try{return JSON.parse(sessionStorage.getItem("ctp_lms_session_v2")||"null")}catch(e){return null}})();
const DOC=!!(SES&&SES.role&&SES.role!=="estudiante");
const ESTR="plan_practica";
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const lineas=t=>String(t||"").split("\n").map(x=>x.trim()).filter(Boolean);
function toast(t){const d=document.createElement("div");d.textContent=t;d.style.cssText="position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#17202a;color:#fff;padding:10px 16px;border-radius:10px;z-index:99;font-weight:600";document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
const PROG=window.PROGRAMA_ETP||[];
const COMPETENCIAS=["Autoaprendizaje","Autocontrol","Capacidad de negociación","Compromiso ético","Comunicación asertiva","Comunicación oral y escrita","Creatividad e innovación","Discernimiento y responsabilidad","Juicio y toma de decisiones","Liderazgo","Orientación de servicio al cliente","Pensamiento crítico","Proactividad","Solución de problemas","Trabajo en equipo"];
// Herramientas de la plataforma que la IA puede proponer como técnica o recurso.
const APPS_IA=["Aula Contable: empresas, catálogo de cuentas, libro diario, mayor, balanza, estados financieros y planillas con su asiento (cargas sociales y provisiones)","Liquidaciones laborales: cálculo paso a paso de preaviso, cesantía, aguinaldo y vacaciones","Ruta Laboral CR: misiones sobre contratos, jornadas, vacaciones, preaviso, cesantía y liquidación","Misión Seguros: asientos de seguros con el plan de cuentas SUGESE","La Tiradera: juego de preguntas en vivo por equipos","Juego de memoria de conceptos técnicos","Exámenes en la plataforma con autocorrección"];
const S={planes:[],mats:[],cur:null,sucio:false};

async function cargar(){
  const [{data:p},{data:m}]=await Promise.all([
    sb.from("trabajos_cotidianos").select("id,titulo,fecha,contenido_actividad").eq("contenido_actividad->>estrategia",ESTR).order("id",{ascending:false}),
    sb.from("materias").select("*").order("id")]);
  S.planes=p||[];S.mats=m||[];
}
async function guardar(t){
  const C={estrategia:ESTR,plan:t.plan};
  const titulo="Plan de práctica · "+(t.plan.enc.unidad||"sin unidad");
  if(t.id){const {error}=await sb.from("trabajos_cotidianos").update({titulo,contenido_actividad:C}).eq("id",t.id);if(error)throw error;return t}
  const {data,error}=await sb.from("trabajos_cotidianos").insert({titulo,fecha:new Date().toISOString().slice(0,10),tipo_actividad:"rubrica_directa",habilitado:false,contenido_actividad:C}).select("*").maybeSingle();
  if(error)throw error;return {id:data.id,plan:t.plan};
}
function nuevoPlan(u,materia){
  return {enc:{institucion:"CTP Mercedes Norte",docente:"Andrés Brenes Conejo",nivel:u.nivel,especialidad:u.especialidad,modalidad:u.modalidad,campo:u.campo,subarea:u.subarea,unidad:u.unidad,
      tiempo:u.horas?`${u.horas} horas${u.semanas?" · "+u.semanas+" semanas":""}`:"",competencia:u.competencia||"",eje:u.eje||"",curso:String(new Date().getFullYear()),periodo:"",seccion:materia?materia.seccion||"":"",materia_id:materia?materia.id:null},
    unidadId:u.id,recursos:"Aula de computadoras con conexión a internet, plataforma del colegio (ctp-lms), proyector, hoja electrónica, calculadora, programa de estudio y legislación vigente.",
    ras:u.ras.map(r=>({n:r.n,on:true,ra:r.ra,saberes:r.saberes.slice(),indProg:r.indicadores.slice(),est:[],evid:{conocimiento:[],desempeno:[],producto:[]},ind:[],horas:""}))};
}

// ── Lista ──
function vLista(){
  const porNivel={};PROG.forEach(u=>{(porNivel[u.nivel]=porNivel[u.nivel]||[]).push(u)});
  $("#app").innerHTML=`<div class="card"><h1>📘 Planeamiento didáctico</h1>
    <p class="muted" style="margin:0">Plan de práctica pedagógica por unidad de estudio, con el formato del programa de estudio (CSE) y las orientaciones 2026 de la DETCE. El resultado de aprendizaje y los saberes esenciales vienen del programa; usted y la IA completan las estrategias D/ y E/, las evidencias, los indicadores y el tiempo.</p></div>
   <div class="card"><h2>＋ Nuevo plan de práctica</h2>
    <div class="grid">
      <label class="f">Unidad de estudio<select id="nu-u">${Object.entries(porNivel).map(([n,us])=>`<optgroup label="${esc(n)}">${us.map(u=>`<option value="${esc(u.id)}">${esc(u.subarea)} · ${esc(u.unidad)} (${u.horas||"?"} h)</option>`).join("")}</optgroup>`).join("")}</select></label>
      <label class="f">Sección (opcional)<select id="nu-m"><option value="">—</option>${S.mats.map(m=>`<option value="${m.id}">${esc(m.seccion||"")} · ${esc(String(m.nombre||"").trim())}</option>`).join("")}</select></label>
    </div>
    <p class="small muted">Por ahora están cargadas las unidades de 10.° y 12.° de Contabilidad (programa 2020). Las de 11.° se agregan cuando suba el programa.</p>
    <button class="pri" id="nu-crear">Crear plan</button></div>
   <div class="card"><h2>Mis planes</h2>${S.planes.length?`<div class="tbl"><table><thead><tr><th>Unidad</th><th>Nivel</th><th>Sección</th><th>Avance</th><th></th></tr></thead><tbody>${S.planes.map(t=>{const p=t.contenido_actividad.plan,on=p.ras.filter(r=>r.on),listos=on.filter(r=>r.est.length).length;
      return `<tr><td><b>${esc(p.enc.unidad)}</b><br><small class="muted">${esc(p.enc.subarea)}</small></td><td>${esc(p.enc.nivel)}</td><td>${esc(p.enc.seccion||"—")}</td><td>${listos}/${on.length} resultados con estrategias</td>
      <td class="row"><a class="btn sm" href="#/plan/${t.id}">✏️ Abrir</a><button class="sm" data-borrar="${t.id}">🗑</button></td></tr>`}).join("")}</tbody></table></div>`:'<p class="muted">Todavía no tiene planes.</p>'}</div>`;
  $("#nu-crear").onclick=async()=>{const u=PROG.find(x=>x.id===$("#nu-u").value);const m=S.mats.find(x=>String(x.id)===$("#nu-m").value);if(!u)return;
    $("#nu-crear").disabled=true;try{const t=await guardar({plan:nuevoPlan(u,m)});await cargar();location.hash="#/plan/"+t.id}catch(e){toast("No se pudo crear: "+e.message);$("#nu-crear").disabled=false}};
  $$("[data-borrar]").forEach(b=>b.onclick=async()=>{const t=S.planes.find(x=>x.id===+b.dataset.borrar);if(!confirm(`¿Borrar el plan de «${t.contenido_actividad.plan.enc.unidad}»? No se puede deshacer.`))return;
    const {error}=await sb.from("trabajos_cotidianos").delete().eq("id",t.id);if(error)return toast(error.message);await cargar();vLista()});
}

// ── Editor ──
let tGuardar=null;
function sucio(){S.sucio=true;$("#pl-estado")&&($("#pl-estado").textContent="Cambios sin guardar…");clearTimeout(tGuardar);tGuardar=setTimeout(guardarYa,1500)}
async function guardarYa(){clearTimeout(tGuardar);if(!S.cur)return;try{S.cur=await guardar(S.cur);S.sucio=false;$("#pl-estado")&&($("#pl-estado").textContent="✓ Guardado")}catch(e){$("#pl-estado")&&($("#pl-estado").textContent="❌ No se guardó: "+e.message)}}
window.addEventListener("beforeunload",e=>{if(S.sucio){e.preventDefault();e.returnValue=""}});

function encHTML(e){const f=(k,l,ph)=>`<label class="f">${l}<input data-enc="${k}" value="${esc(e[k]||"")}" placeholder="${esc(ph||"")}"></label>`;
  return `<div class="grid">${f("institucion","Institución educativa")}${f("docente","Nombre del docente")}${f("nivel","Nivel")}${f("especialidad","Especialidad")}${f("modalidad","Modalidad")}${f("campo","Campo detallado")}${f("subarea","Subárea")}${f("unidad","Unidad de estudio")}${f("tiempo","Tiempo estimado")}
   <label class="f">Competencia para el desarrollo humano<input data-enc="competencia" list="dl-comp" value="${esc(e.competencia||"")}"></label>${f("eje","Eje de la política educativa")}${f("curso","Curso lectivo")}${f("periodo","Período / bimestre","p. ej. II Período")}${f("seccion","Sección")}</div>
   <datalist id="dl-comp">${COMPETENCIAS.map(c=>`<option value="${esc(c)}">`).join("")}</datalist>`}

// Los saberes que terminan en «:» son títulos de grupo: van en negrita y sin viñeta.
const sabLi=a=>a.map(s=>/:\s*$/.test(s)?`<li style="list-style:none;margin-left:-14px;font-weight:700">${esc(s)}</li>`:`<li>${esc(s)}</li>`).join("");
function raHTML(r,i){
  const est=k=>r.est.map((x,j)=>x.quien!==k?"":`<div class="pl-est"><b>${k}/</b><textarea data-est="${i}|${j}" rows="2">${esc(x.texto)}</textarea><button class="sm" data-estdel="${i}|${j}" title="Quitar">✕</button></div>`).join("");
  const ev=(k,l)=>`<label class="f">${l} <textarea data-ev="${i}|${k}" rows="2" placeholder="Una evidencia por renglón">${esc((r.evid[k]||[]).join("\n"))}</textarea></label>`;
  return `<section class="pl-ra ${r.on?"":"off"}" id="ra-${i}">
   <h3><label class="row" style="gap:6px"><input type="checkbox" data-on="${i}" ${r.on?"checked":""}> <span>Resultado de aprendizaje ${r.n}</span></label> <span class="pl-badge">del programa</span></h3>
   ${r.on?`<div class="pl-cols"><div>
     <div class="pl-lbl">Resultado de aprendizaje</div><div class="pl-fijo">${esc(r.ra)}</div>
     <div class="pl-lbl">Saberes esenciales</div><div class="pl-fijo"><ul>${sabLi(r.saberes)}</ul></div>
     <details class="small" style="margin-top:6px"><summary style="cursor:pointer">✎ Corregir el texto tomado del PDF del programa</summary>
       <p class="muted">Use esto solo si el PDF partió o unió renglones. El texto debe quedar igual al programa.</p>
       <label class="f">Resultado de aprendizaje<textarea data-rafix="${i}" rows="2">${esc(r.ra)}</textarea></label>
       <label class="f">Saberes esenciales (uno por renglón)<textarea data-sabfix="${i}" rows="8">${esc(r.saberes.join("\n"))}</textarea></label></details>
     ${r.indProg.length?`<details class="small" style="margin-top:6px"><summary style="cursor:pointer">Indicadores de logro del programa (${r.indProg.length})</summary><ul>${r.indProg.map(s=>`<li>${esc(s)}</li>`).join("")}</ul></details>`:""}
   </div><div>
     <div class="row" style="justify-content:space-between"><div class="pl-lbl" style="margin:0">Estrategias para la mediación pedagógica</div><button class="sm pri" data-ia="${i}">✨ Proponer con IA</button></div>
     <div class="small muted">Verbo en tercera persona + contenido + técnica didáctica. D/ = lo que hace el docente · E/ = lo que hace el estudiante.</div>
     <div class="pl-lbl">Docente</div>${est("D")}<button class="sm" data-estadd="${i}|D">＋ D/</button>
     <div class="pl-lbl">Estudiante</div>${est("E")}<button class="sm" data-estadd="${i}|E">＋ E/</button>
     <div class="pl-lbl">Evidencias de aprendizaje</div><div class="grid">${ev("conocimiento","Conocimiento")}${ev("desempeno","Desempeño")}${ev("producto","Producto")}</div>
     <div class="pl-lbl">Indicadores de logro (del docente)</div><textarea data-ind="${i}" rows="3" placeholder="Verbo + contenido + condición; uno por renglón">${esc(r.ind.join("\n"))}</textarea>
     <div class="row" style="margin-top:8px"><label class="f" style="flex-direction:row;align-items:center;gap:6px">Tiempo estimado <input type="number" min="0" data-horas="${i}" value="${esc(r.horas)}" style="width:6rem"> horas</label></div>
   </div></div>`:""}
  </section>`}

function vEditor(id){
  const t=S.planes.find(x=>x.id===+id);if(!t){$("#app").innerHTML='<p>No se encontró el plan. <a href="#/">Volver</a></p>';return}
  S.cur={id:t.id,plan:t.contenido_actividad.plan};const p=S.cur.plan;
  const horasT=p.ras.filter(r=>r.on).reduce((a,r)=>a+(+r.horas||0),0);
  $("#app").innerHTML=`<div class="row noprint" style="justify-content:space-between;margin-bottom:10px"><a class="btn" href="#/">← Mis planes</a>
     <span id="pl-estado" class="small muted">✓ Guardado</span>
     <span class="row"><button class="pri" id="pl-iatodo">✨ Proponer todo con IA</button><button id="pl-ver">👁 Vista del plan</button><button id="pl-word">⬇ Word</button></span></div>
   <div class="card"><h2>Plan de práctica pedagógica</h2>${encHTML(p.enc)}</div>
   <div class="card small muted" style="margin-top:-4px">Tiempo planificado: <b>${horasT}</b> horas${p.enc.tiempo?` de ${esc(p.enc.tiempo)}`:""}. Marque los resultados de aprendizaje que va a desarrollar en este plan.</div>
   ${p.ras.map(raHTML).join("")}
   <div class="card"><h3>Recursos</h3><p class="small muted">Espacio físico, materiales, equipo y herramientas (lo pide el programa de estudio).</p><textarea id="pl-rec" rows="3">${esc(p.recursos||"")}</textarea></div>`;
  ligar();
}
function ligar(){const p=S.cur.plan,rep=()=>{const y=scrollY;vEditor(S.cur.id);scrollTo(0,y)};
  $$("[data-enc]").forEach(el=>el.oninput=()=>{p.enc[el.dataset.enc]=el.value;sucio()});
  $$("[data-on]").forEach(el=>el.onchange=()=>{p.ras[+el.dataset.on].on=el.checked;sucio();sync();rep()});
  $$("[data-rafix]").forEach(el=>el.onchange=()=>{p.ras[+el.dataset.rafix].ra=el.value.trim();sucio();sync();rep()});
  $$("[data-sabfix]").forEach(el=>el.onchange=()=>{p.ras[+el.dataset.sabfix].saberes=lineas(el.value);sucio();sync();rep()});
  $$("[data-est]").forEach(el=>el.oninput=()=>{const [i,j]=el.dataset.est.split("|").map(Number);p.ras[i].est[j].texto=el.value.replace(/^[DE]\s*\/\s*/i,"");sucio()});
  $$("[data-estdel]").forEach(el=>el.onclick=()=>{const [i,j]=el.dataset.estdel.split("|").map(Number);p.ras[i].est.splice(j,1);sucio();sync();rep()});
  $$("[data-estadd]").forEach(el=>el.onclick=()=>{const [i,k]=el.dataset.estadd.split("|");p.ras[+i].est.push({quien:k,texto:""});sucio();sync();rep()});
  $$("[data-ev]").forEach(el=>el.oninput=()=>{const [i,k]=el.dataset.ev.split("|");p.ras[+i].evid[k]=lineas(el.value);sucio()});
  $$("[data-ind]").forEach(el=>el.oninput=()=>{p.ras[+el.dataset.ind].ind=lineas(el.value);sucio()});
  $$("[data-horas]").forEach(el=>el.oninput=()=>{p.ras[+el.dataset.horas].horas=el.value;sucio()});
  $("#pl-rec").oninput=e=>{p.recursos=e.target.value;sucio()};
  $$("[data-ia]").forEach(b=>b.onclick=()=>proponer([+b.dataset.ia]));
  $("#pl-iatodo").onclick=()=>proponer(p.ras.map((r,i)=>r.on?i:-1).filter(i=>i>=0));
  $("#pl-ver").onclick=()=>verPlan(false);$("#pl-word").onclick=()=>verPlan(true);
}
function sync(){S.planes=S.planes.map(t=>t.id===S.cur.id?{...t,contenido_actividad:{estrategia:ESTR,plan:S.cur.plan}}:t)}

async function proponer(idx){const p=S.cur.plan;
  const sinTocar=idx.filter(i=>!p.ras[i].est.length);
  if(idx.length>1&&sinTocar.length<idx.length&&!confirm(`${idx.length-sinTocar.length} resultado(s) ya tienen estrategias. ¿Reemplazarlas también? (Cancelar = solo los vacíos)`))idx=sinTocar;
  if(!idx.length)return toast("Todos ya tienen estrategias.");
  const unidadH=parseInt(p.enc.tiempo)||0,porRa=unidadH&&p.ras.filter(r=>r.on).length?Math.round(unidadH/p.ras.filter(r=>r.on).length):0;
  const ind=prompt("Indicaciones para la IA (opcional), p. ej. «usar Aula Contable en la práctica» o «trabajo en parejas»:","")||"";
  for(const i of idx){const r=p.ras[i];toast(`✨ Redactando resultado ${r.n}…`);
    const box=$("#ra-"+i);if(box)box.style.opacity=".6";
    try{let d=null;
      for(let k=0;k<2&&!d;k++){const res=await fetch("/api/plan-practica-ia",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({especialidad:p.enc.especialidad,nivel:p.enc.nivel,subarea:p.enc.subarea,unidad:p.enc.unidad,competencia:p.enc.competencia,eje:p.enc.eje,ra:r.ra,saberes:r.saberes,indicadores:r.indProg,horas:+r.horas||porRa,apps:APPS_IA,indicaciones:ind})});
        const j=await res.json().catch(()=>({error:"Respuesta inválida"}));if(res.ok)d=j;else if(!j.reintentar)throw new Error(j.error||"Error")}
      if(!d)throw new Error("La IA está ocupada; intente de nuevo.");
      r.est=d.estrategias;r.evid=d.evidencias;r.ind=d.indicadores;if(d.horas)r.horas=String(d.horas);
      sync();await guardarYa();
    }catch(e){toast(`Resultado ${r.n}: ${e.message}`)}
  }
  const y=scrollY;vEditor(S.cur.id);scrollTo(0,y);toast("Listo: revise y ajuste lo que propuso la IA.");
}

// ── Vista oficial / Word ──
function planTablaHTML(p){const e=p.enc,td='style="border:1px solid #555;padding:5px 7px;vertical-align:top"',th='style="border:1px solid #555;padding:5px 7px;background:#e8eef0;text-align:center"';
  const li=a=>a.length?`<ul style="margin:0;padding-left:16px">${a.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:"";
  return `<h2 style="text-align:center;margin:0 0 4px">PLAN DE PRÁCTICA PEDAGÓGICA</h2>
  <table style="width:100%;border-collapse:collapse;font-size:10.5pt;margin-bottom:8px"><tr><td ${td}><b>Institución educativa:</b> ${esc(e.institucion)}</td><td ${td}><b>Nombre del docente:</b> ${esc(e.docente)}</td><td ${td}><b>Nivel:</b> ${esc(e.nivel)}${e.seccion?` · Sección ${esc(e.seccion)}`:""}</td></tr>
   <tr><td ${td}><b>Especialidad:</b> ${esc(e.especialidad)}</td><td ${td}><b>Modalidad:</b> ${esc(e.modalidad)}</td><td ${td}><b>Campo detallado:</b> ${esc(e.campo)}</td></tr>
   <tr><td ${td}><b>Subárea:</b> ${esc(e.subarea)}</td><td ${td}><b>Unidad de estudio:</b> ${esc(e.unidad)}</td><td ${td}><b>Tiempo estimado:</b> ${esc(e.tiempo)}</td></tr>
   <tr><td ${td}><b>Competencias para el desarrollo humano:</b> ${esc(e.competencia)}</td><td ${td}><b>Eje de la política educativa:</b> ${esc(e.eje)}</td><td ${td}><b>Curso lectivo:</b> ${esc(e.curso)}${e.periodo?` · ${esc(e.periodo)}`:""}</td></tr></table>
  <table style="width:100%;border-collapse:collapse;font-size:10pt"><thead><tr><th ${th} style="width:16%">Resultados de aprendizaje</th><th ${th} style="width:20%">Saberes esenciales</th><th ${th}>Estrategias para la mediación pedagógica</th><th ${th} style="width:18%">Evidencias de aprendizaje</th><th ${th} style="width:7%">Tiempo estimado (horas)</th></tr></thead><tbody>
  ${p.ras.filter(r=>r.on).map(r=>`<tr><td ${td}>${r.n}. ${esc(r.ra)}</td><td ${td}><ul style="margin:0;padding-left:16px">${sabLi(r.saberes)}</ul></td>
    <td ${td}>${r.est.filter(x=>x.quien==="D").map(x=>`<p style="margin:0 0 4px">D/ ${esc(x.texto)}</p>`).join("")}${r.est.filter(x=>x.quien==="E").map(x=>`<p style="margin:0 0 4px">E/ ${esc(x.texto)}</p>`).join("")}
      ${r.ind.length?`<p style="margin:6px 0 2px"><b>Indicadores de logro:</b></p>${li(r.ind)}`:""}</td>
    <td ${td}>${[["conocimiento","Conocimiento"],["desempeno","Desempeño"],["producto","Producto"]].map(([k,n])=>(r.evid[k]||[]).length?`<p style="margin:0 0 2px"><b>${n}:</b></p>${li(r.evid[k])}`:"").join("")}</td>
    <td ${td} style="text-align:center">${esc(r.horas)}</td></tr>`).join("")}</tbody></table>
  ${p.recursos?`<p style="font-size:10pt;margin-top:8px"><b>Recursos:</b> ${esc(p.recursos)}</p>`:""}`}
async function verPlan(word){await guardarYa();const p=S.cur.plan,html=planTablaHTML(p);
  if(word){const doc=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>Plan de práctica</title><style>@page{size:landscape;margin:1.5cm}body{font-family:Arial,sans-serif}</style></head><body>${html}</body></html>`;
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["﻿"+doc],{type:"application/msword"}));a.download=`Plan de práctica - ${p.enc.unidad}.doc`;document.body.appendChild(a);a.click();a.remove();return}
  const w=open("","_blank");if(!w)return toast("Permita las ventanas emergentes.");
  w.document.write(`<html><head><meta charset="utf-8"><title>Plan de práctica · ${esc(p.enc.unidad)}</title><style>@page{size:landscape;margin:1.2cm}body{font-family:Arial,sans-serif;padding:16px;color:#000}@media print{button{display:none}}</style></head><body><p style="text-align:center"><button onclick="print()" style="font:inherit;padding:8px 14px">🖨️ Imprimir</button></p>${html}</body></html>`);w.document.close();
}

async function ruta(){if(!DOC){$("#app").innerHTML='<div class="card"><h2>Solo para docentes</h2><p>Ingrese a la plataforma con su usuario de docente y vuelva a abrir el Planeamiento didáctico.</p><a class="btn" href="index.html">Ir a la plataforma</a></div>';return}
  if(S.sucio)await guardarYa();
  const h=location.hash||"#/";const m=h.match(/^#\/plan\/(\d+)/);
  if(!S.planes.length&&!S.mats.length)await cargar();
  if(m)vEditor(m[1]);else{await cargar();vLista()}
}
window.addEventListener("hashchange",ruta);ruta();
</script>
