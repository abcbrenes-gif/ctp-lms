<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Auditoría · Unidades de estudio</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="img/logo-ctp-mercedes-norte.png">
<style>
:root{--bg:#F5F7FB;--sf:#fff;--ink:#0F172A;--mut:#5B6B80;--line:#DCE3EE;--pri:#1F3864;--soft:#EEF3FB;--ok:#DDF1DC;--wa:#FFF2D6}
@media (prefers-color-scheme:dark){:root{--bg:#0B1020;--sf:#121A30;--ink:#E8EDFB;--mut:#9AA9CC;--line:#26324F;--pri:#9DB7F5;--soft:#17213B;--ok:#173A28;--wa:#3A2E10}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,"Segoe UI",system-ui,sans-serif;padding-bottom:90px}
header{background:#14213d;color:#fff;padding:16px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}header h1{margin:0;font-size:1.3rem}header p{margin:2px 0 0;opacity:.85;font-size:.9rem}
.pill{background:#ffd43b;color:#14213d;border-radius:999px;padding:2px 10px;font-size:.72rem;font-weight:800;vertical-align:middle}
main{max-width:1000px;margin:0 auto;padding:16px}.card{background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:18px;margin:0 0 16px}
h2{margin:0 0 6px;font-size:1.2rem;color:var(--pri)}h3{margin:14px 0 6px;font-size:.95rem}
.muted{color:var(--mut);font-size:.86rem}.aviso{background:var(--wa);border-radius:10px;padding:8px 12px;font-size:.88rem;margin:8px 0}
.btn{display:inline-block;background:#1d63e8;color:#fff;border:0;border-radius:10px;padding:9px 14px;font:600 .9rem inherit;text-decoration:none;cursor:pointer;margin:4px 6px 4px 0}.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}.tabs button{border:1px solid var(--line);background:var(--sf);color:var(--ink);border-radius:999px;padding:7px 14px;font:600 .88rem inherit;cursor:pointer}.tabs button[aria-pressed=true]{background:#1d63e8;color:#fff;border-color:#1d63e8}
details.lec{border:1px solid var(--line);border-radius:12px;margin:8px 0;background:var(--sf)}details.lec>summary{cursor:pointer;padding:10px 14px;list-style:none;display:flex;gap:10px;align-items:center}details.lec>summary::-webkit-details-marker{display:none}
details.lec[open]>summary{border-bottom:1px solid var(--line)}.lbody{padding:4px 16px 14px}
.num{font-weight:800;color:var(--pri);min-width:2.6em}.tit{flex:1;font-weight:600}.chip{font-size:.72rem;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap;background:var(--soft)}.chip.ok{background:var(--ok)}.chip.wa{background:var(--wa)}
.ind{background:var(--soft);border-left:4px solid #1d63e8;border-radius:8px;padding:8px 12px;margin:8px 0}
.tiempo{display:flex;height:22px;border-radius:8px;overflow:hidden;font-size:.7rem;font-weight:700;color:#fff;margin:8px 0}.tiempo span{display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden}
ul{margin:4px 0;padding-left:20px}li{margin:3px 0}
table{border-collapse:collapse;width:100%;font-size:.86rem;margin:6px 0}th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}thead th{background:#1F3864;color:#fff}
.q{margin:4px 0}.q summary{cursor:pointer}.q div{color:var(--mut);padding:2px 0 2px 16px}
@media print{header .pill,.btn,.tabs,#volver-plataforma{display:none!important}body{background:#fff;padding:0;color:#000}.card,details.lec{border:0;break-inside:avoid}details.lec>summary{padding:6px 0}.lbody{padding:0}}
</style>
</head>
<body>
<header><img src="img/logo-ctp-mercedes-norte.png" alt="Escudo del CTP Mercedes Norte" width="38" height="54">
<div><h1>📘 Auditoría · Unidades de estudio <span class="pill">2027 · solo profe</span></h1><p>Según el programa de estudio del MEP · cada lección de 30 a 45 minutos</p></div></header>
<main id="app"><p class="muted">Cargando…</p></main>
<script src="js/auditoria-unidades-datos.js?v=20261117a"></script>
<script>
(function(){
var s=null;try{s=JSON.parse(sessionStorage.getItem("ctp_lms_session_v2")||"null")}catch(e){}
var app=document.getElementById("app");
if(!(s&&s.role==="docente")){app.innerHTML='<section class="card"><h2>Solo para el profe</h2><p class="muted">Esta sección se abre desde la plataforma, en <b>📅 2027</b>, con la sesión del docente.</p><a class="btn" href="index.html">Ir a la plataforma</a></section>';return}
var U=window.AUD_UNIDADES||[],sel=+(location.hash.replace("#u","")||1);
var esc=function(t){return String(t==null?"":t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
function reparto(m){var c=m<=30?[8,7,12,3]:m<=35?[10,8,13,4]:m<=40?[12,8,15,5]:[12,10,18,5];var t=c.reduce(function(a,b){return a+b},0);c[2]+=m-t;return c}
function leccion(l){
  var head='<summary><span class="num">'+esc(l.id)+'</span><span class="tit">'+esc(l.tit)+'</span><span class="chip">⏱ '+l.min+' min</span><span class="chip '+(l.dev?"ok":"wa")+'">'+(l.dev?"Desarrollada":"Por desarrollar")+'</span></summary>';
  if(!l.dev)return '<details class="lec">'+head+'<div class="lbody"><p><b>Contenidos del programa:</b> '+esc(l.contenidos)+'</p><p><b>Trabajo del estudiante:</b> '+esc(l.trabajo.tipo)+'</p><p class="muted">Esta lección se desarrolla en la próxima etapa.</p></div></details>';
  var r=reparto(l.min);
  return '<details class="lec">'+head+'<div class="lbody">'+
   '<p class="muted"><b>Contenidos del programa:</b> '+esc(l.contenidos)+'</p>'+
   '<div class="ind"><b>Indicador:</b> '+esc(l.ind)+'</div>'+
   '<div class="tiempo" title="Distribución del tiempo"><span style="flex:'+r[0]+';background:#1d63e8">Explicación '+r[0]+'′</span><span style="flex:'+r[1]+';background:#0e7490">Formación '+r[1]+'′</span><span style="flex:'+r[2]+';background:#7c3aed">Trabajo '+r[2]+'′</span><span style="flex:'+r[3]+';background:#b45309">Cierre '+r[3]+'′</span></div>'+
   '<h3>1. Explicación</h3><ul>'+l.explica.map(function(x){return"<li>"+x+"</li>"}).join("")+'</ul>'+
   '<h3>2. Formación (práctica guiada)</h3><p>'+esc(l.formacion)+'</p>'+
   '<h3>3. Trabajo del estudiante · '+esc(l.trabajo.tipo)+'</h3><p>'+esc(l.trabajo.txt)+'</p>'+
   '<h3>4. Cierre</h3>'+l.cierre.map(function(q){return'<details class="q"><summary>'+esc(q[0])+'</summary><div>'+esc(q[1])+'</div></details>'}).join("")+
   '<h3>Instrumento (escala de desempeño)</h3><div style="overflow-x:auto"><table><thead><tr><th>Indicador</th><th>Inicial (1)</th><th>Intermedio (2)</th><th>Avanzado (3)</th></tr></thead><tbody><tr><td>'+esc(l.ind)+'</td><td>'+esc(l.niveles[0])+'</td><td>'+esc(l.niveles[1])+'</td><td>'+esc(l.niveles[2])+'</td></tr></tbody></table></div><p class="muted">0 = sin evidencia.</p>'+
   '</div></details>'}
function pintar(){
  var u=U.find(function(x){return x.n===sel})||U[0];
  var dev=u.lecciones.filter(function(l){return l.dev}).length,tot=u.lecciones.reduce(function(a,l){return a+l.min},0);
  app.innerHTML='<div class="tabs">'+U.map(function(x){return'<button data-u="'+x.n+'" aria-pressed="'+(x.n===u.n)+'">Unidad '+x.n+'</button>'}).join("")+'</div>'+
   '<section class="card"><h2>Unidad '+u.n+'</h2><p><b>Resultado de aprendizaje:</b> '+esc(u.ra)+'</p>'+
   (u.raPendiente?'<p class="aviso">El texto exacto de este resultado de aprendizaje no se ve en las capturas: está redactado provisionalmente a partir de los indicadores del plan.</p>':'')+
   '<p class="muted">'+(u.horas?'Tiempo del programa: '+u.horas+' horas · ':'')+u.lecciones.length+' lecciones · '+String(Math.round(tot/60*10)/10).replace('.',',')+' horas reloj · '+dev+' de '+u.lecciones.length+' desarrolladas</p>'+
   '<p class="muted"><b>Evaluación según el plan:</b> '+esc(u.evaluacion)+'</p>'+
   (u.indMEP.length?'<details class="q"><summary>Indicadores del plan del MEP</summary><div><ul>'+u.indMEP.map(function(x){return"<li>"+esc(x)+"</li>"}).join("")+'</ul></div></details>':'')+
   '<button class="btn sec" id="abrir">Abrir todas</button><button class="btn sec" onclick="print()">🖨️ Imprimir unidad</button></section>'+
   u.lecciones.map(leccion).join("");
  app.querySelectorAll("[data-u]").forEach(function(b){b.onclick=function(){sel=+b.dataset.u;location.hash="u"+sel;pintar();scrollTo(0,0)}});
  document.getElementById("abrir").onclick=function(){var d=app.querySelectorAll("details.lec"),a=[].some.call(d,function(x){return!x.open});d.forEach(function(x){x.open=a});this.textContent=a?"Cerrar todas":"Abrir todas"};
}
pintar();
})();
</script>
<script src="js/volver-plataforma.js?v=20261116a"></script>
</body>
</html>
