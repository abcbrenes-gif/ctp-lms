<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<title>Planilla Opoly · CTP Mercedes Norte</title>
<style>
:root{--bg:#0b1020;--bg2:#131a33;--card:#182041;--line:#2a3566;--tx:#e8ecff;--mut:#9aa6d6;--ok:#22c55e;--bad:#ef4444;--warn:#f59e0b;--ac:#7c6cff;--ac2:#4f46e5;--rx:52deg;--rz:0deg;--cell:96px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:radial-gradient(1200px 700px at 50% -10%,#1d2a63 0%,var(--bg) 60%);color:var(--tx);font:14px/1.4 Inter,system-ui,Segoe UI,Roboto,sans-serif}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:10px 16px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--ac2),var(--ac));box-shadow:0 6px 18px rgba(79,70,229,.35)}
button:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
button.sec{background:var(--card);border:1px solid var(--line);box-shadow:none;color:var(--tx)}
button.good{background:linear-gradient(135deg,#16a34a,#22c55e)}
button.bad{background:linear-gradient(135deg,#dc2626,#ef4444)}
input,select{font:inherit;background:var(--bg2);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:10px 12px;width:100%}
.hidden{display:none!important}
.screen{min-height:100%}
/* entrada */
#entry{display:grid;place-items:center;padding:20px}
.hero{max-width:520px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.hero h1{margin:0 0 4px;font-size:1.8rem;background:linear-gradient(90deg,#a5b4fc,#f0abfc);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);margin:0 0 16px}
.hero .row{display:flex;gap:10px;margin-top:12px}
.hero label{display:block;font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:700;margin:12px 0 4px}
.msg{margin-top:12px;color:var(--warn);min-height:18px}
/* juego */
header.top{display:flex;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:rgba(11,16,32,.7);backdrop-filter:blur(8px);flex-wrap:wrap}
header.top b{font-size:1.05rem}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:700}
.main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;padding:14px;align-items:start}
@media(max-width:1000px){.main{grid-template-columns:1fr}}
.stage{position:relative;height:min(78vh,740px);perspective:1500px;overflow:hidden;border-radius:22px;background:radial-gradient(600px 400px at 50% 40%,#1a2556,#0e1430);border:1px solid var(--line);display:grid;place-items:center}
.board{position:relative;width:calc(var(--cell)*7);height:calc(var(--cell)*7);transform-style:preserve-3d;transform:scale(var(--k,1)) rotateX(var(--rx)) rotateZ(var(--rz));transition:transform .15s}
.center{position:absolute;left:var(--cell);top:var(--cell);width:calc(var(--cell)*5);height:calc(var(--cell)*5);border-radius:18px;background:linear-gradient(135deg,#1b2a6b,#3b2a7a);display:grid;place-items:center;text-align:center;box-shadow:inset 0 0 60px rgba(0,0,0,.35)}
.center .in{transform:rotateZ(calc(var(--rz)*-1));font-weight:800;font-size:2rem;letter-spacing:.04em;line-height:1.1;background:linear-gradient(90deg,#c7d2fe,#f5d0fe);-webkit-background-clip:text;background-clip:text;color:transparent}
.center small{display:block;font-size:.9rem;color:#c7d2fe;-webkit-text-fill-color:#c7d2fe;font-weight:600;margin-top:6px}
.tile{position:absolute;width:calc(var(--cell) - 4px);height:calc(var(--cell) - 4px);border-radius:12px;background:#1f2a55;border:2px solid #34428a;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:visible;transform-style:preserve-3d}
.tile .in{transform:rotateZ(calc(var(--rz)*-1));display:flex;flex-direction:column;align-items:center;gap:1px;padding:2px;pointer-events:none}

.tile .ic{font-size:1.5rem;line-height:1}
.tile .nm{font-size:.7rem;font-weight:700;line-height:1.1;max-width:84px}
.tile .pr{font-size:.66rem;color:var(--mut)}
.tile.corner{background:#2b2f6e}
.tile.owned{border-color:var(--oc);box-shadow:0 0 0 2px var(--oc) inset}
.tile.cur{border-color:#fff;animation:glow 1s infinite alternate}
@keyframes glow{to{box-shadow:0 0 22px 4px rgba(255,255,255,.5)}}
.bld{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;transform-style:preserve-3d;transform:translateZ(1px);pointer-events:none}
.bld>div{position:absolute;background:var(--oc);width:34px;height:var(--h,30px);left:0;top:calc((34px - var(--h,30px))/2)}
.bld .f{transform:translate3d(0,17px,calc(var(--h,30px)/2)) rotateX(90deg);filter:brightness(.8)}
.bld .b{transform:translate3d(0,-17px,calc(var(--h,30px)/2)) rotateX(90deg);filter:brightness(.6)}
.bld .l{transform:translate3d(-17px,0,calc(var(--h,30px)/2)) rotateZ(90deg) rotateX(90deg);filter:brightness(.7)}
.bld .r{transform:translate3d(17px,0,calc(var(--h,30px)/2)) rotateZ(90deg) rotateX(90deg);filter:brightness(.9)}
.bld .t{height:34px;top:0;transform:translateZ(var(--h,30px));filter:brightness(1.15)}
.pawn{position:absolute;width:0;height:0;transform-style:preserve-3d;transition:left .24s ease,top .24s ease}
.pawn .body{position:absolute;left:-14px;top:-40px;width:28px;height:40px;transform-origin:50% 100%;transform:translateZ(2px) rotateZ(calc(var(--rz)*-1)) rotateX(calc(var(--rx)*-1))}
.pawn .head{position:absolute;left:3px;top:0;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--pc) 55%,#000 140%);box-shadow:0 0 0 2px #0006}
.pawn .trunk{position:absolute;left:5px;top:18px;width:18px;height:22px;border-radius:9px 9px 3px 3px;background:linear-gradient(90deg,var(--pc),#0008)}
.pawn .sh{position:absolute;left:-12px;top:-5px;width:24px;height:10px;border-radius:50%;background:#0007;transform:translateZ(1px)}
.pawn.act .head{animation:bob .6s infinite alternate}
@keyframes bob{to{transform:translateY(-6px)}}
.viewctl{position:absolute;right:10px;bottom:10px;display:flex;gap:6px;z-index:5}
.viewctl button{padding:6px 10px;border-radius:10px}
/* lateral */
.side{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.pl{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;border:1px solid transparent}
.pl.turn{border-color:var(--pc);background:rgba(255,255,255,.05)}
.pl.out{opacity:.4;text-decoration:line-through}
.pl .dot{width:18px;height:18px;border-radius:50%;background:var(--pc);flex:none}
.pl .nm{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .mn{font-weight:800;font-variant-numeric:tabular-nums}
.pl small{display:block;color:var(--mut);font-weight:500}
.dicebox{display:flex;align-items:center;gap:18px;justify-content:center;padding:10px}
.dwrap{width:64px;height:64px;perspective:420px}
.die{position:relative;width:64px;height:64px;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.2,.8,.2,1)}
.die div{position:absolute;inset:0;display:grid;place-items:center;font-size:2.7rem;line-height:1;background:#fff;color:#111;border-radius:12px;backface-visibility:hidden;border:1px solid #cbd5e1}
.die .f1{transform:translateZ(32px)}.die .f6{transform:rotateY(180deg) translateZ(32px)}.die .f2{transform:rotateY(90deg) translateZ(32px)}.die .f5{transform:rotateY(-90deg) translateZ(32px)}.die .f3{transform:rotateX(90deg) translateZ(32px)}.die .f4{transform:rotateX(-90deg) translateZ(32px)}

.q .txt{font-size:.95rem;margin-bottom:10px}
.opt{display:block;width:100%;text-align:left;margin-top:6px;background:var(--bg2);border:1px solid var(--line);box-shadow:none;font-weight:600}

.opt.right{background:#14532d;border-color:var(--ok)}
.opt.wrong{background:#7f1d1d;border-color:var(--bad)}
.bar{height:6px;border-radius:6px;background:var(--bg2);overflow:hidden;margin-bottom:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--warn),var(--bad));width:100%;transition:width .3s linear}
.ev{border-left:4px solid var(--ac);padding:6px 10px;background:var(--bg2);border-radius:8px;margin-top:8px;font-size:.88rem}
.ev.ok{border-color:var(--ok)}.ev.bad{border-color:var(--bad)}
.ev small{display:block;color:var(--mut);margin-top:4px}
#log{max-height:150px;overflow:auto;font-size:.8rem;color:var(--mut)}
#log div{padding:2px 0;border-bottom:1px dashed #ffffff14}
.big{font-size:2.2rem;font-weight:900;letter-spacing:.2em;text-align:center;padding:6px 0;background:var(--bg2);border-radius:12px;border:1px dashed var(--line)}
.rank{display:flex;justify-content:space-between;padding:8px 10px;border-radius:10px;background:var(--bg2);margin-top:6px;font-weight:700}
.rank:first-child{background:linear-gradient(90deg,#854d0e,#ca8a04)}
.recw{max-width:1100px;margin:0 auto;padding:20px}
.recw table{width:100%;border-collapse:collapse;background:var(--card);border-radius:14px;overflow:hidden;margin:8px 0}
.recw th,.recw td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:.88rem;vertical-align:top}
.recw th{color:var(--mut);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em}
.recw td.r,.recw th.r{text-align:right}
.recw tr.clk{cursor:pointer}.recw tr.clk:hover td{background:rgba(124,108,255,.12)}
.recw .ok{color:var(--ok);font-weight:800}.recw .no{color:var(--bad);font-weight:800}
.recw .kp{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}.recw .kp div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 16px}
.recw .kp small{display:block;color:var(--mut);font-size:.7rem;text-transform:uppercase;font-weight:700}.recw .kp b{font-size:1.3rem}
.recw .ex{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
.recw .ex small{color:var(--mut)}
.recw label.ck{display:flex;gap:6px;align-items:center;font-size:.85rem}.recw label.ck input{width:auto}
</style>
</head>

<div id="entry" class="screen">
 <div class="hero">

<div id="game" class="screen hidden">

 <div class="main">

   <div class="viewctl"><button class="sec" data-v="l" title="Girar a la izquierda">↺</button><button class="sec" data-v="r" title="Girar a la derecha">↻</button><button class="sec" data-v="u" title="Más inclinado">⤒</button><button class="sec" data-v="d" title="Menos inclinado">⤓</button><button class="sec" data-v="0" title="Restablecer vista">⌖</button></div></div>
  <aside class="side">

   <div class="card" id="action"></div>

  </aside>
 </div>
</div>

  return {text:`Durante el período diciembre–noviembre, una colaboradora ganó ${fmt(S)} mensuales y ${fmt(E)} en comisiones en total. ¿Cuánto es su aguinaldo?`,...o,explain:`Total devengado = ${fmt(S)} × 12 + ${fmt(E)} = ${fmt(tot)}. Aguinaldo = ${fmt(tot)} ÷ 12 = ${fmt(a)}.`}},
 function vacaciones(){const S=rnd(16,56)*25000,D=rnd(3,11),v=D*S/30;
  const o=opts(v,[D*S/22,D*S/26,D*S/12],fmt);
  return {text:`Un trabajador gana ${fmt(S)} al mes y le quedan ${D} días de vacaciones pendientes al terminar su contrato. ¿Cuánto se le paga por ellas?`,...o,explain:`Salario diario = ${fmt(S)} ÷ 30 = ${fmt(S/30)}. Vacaciones = ${D} × ${fmt(S/30)} = ${fmt(v)}.`}},
 function extras(){const S=rnd(16,56)*25000,H=rnd(3,12),h=S/30/8,m=h*1.5*H;
  const o=opts(m,[h*H,h*2*H,h*1.25*H],fmt);
  return {text:`Salario mensual ${fmt(S)} (jornada diurna de 8 horas, mes de 30 días). El colaborador trabajó ${H} horas extra. ¿Cuánto se le paga por ellas?`,...o,explain:`Valor hora = ${fmt(S)} ÷ 30 ÷ 8 = ${fmt(h)}. Cada hora extra = ${fmt(h)} × 1,5. Total = ${H} × ${fmt(h*1.5)} = ${fmt(m)}.`}},
 function cesantia(){const Y=rnd(2,7),S=rnd(16,48)*25000,c=cesantiaDias(Y),diario=S/30,m=c.dias*diario;
  const o=opts(m,[20*Y*diario,c.dias*S/26,m+30*diario],fmt);
  return {text:`Despido con responsabilidad patronal. El trabajador laboró exactamente ${Y} años y ganaba ${fmt(S)} mensuales (sin cambios). Tarifa de cesantía: ${String(c.tarifa).replace(".",",")} días por año. ¿Cuánto le corresponde de cesantía?`,...o,explain:`Días = ${String(c.tarifa).replace(".",",")} × ${Y} años = ${String(c.dias).replace(".",",")} días. Salario diario = ${fmt(S)} ÷ 30 = ${fmt(diario)}. Cesantía = ${fmt(m)}.`}},
 function preaviso(){const M=pick([4,8,15,30]),d=M<6?7:M<12?15:30;
  const set=shuffle([7,15,30,60]),ans=set.indexOf(d);
  return {text:`Un trabajador con ${M} meses de servicio es despedido con responsabilidad patronal. ¿Cuántos días de preaviso corresponden?`,options:set.map(x=>x+" días"),answer:ans,explain:`3–6 meses: 7 días · 6–12 meses: 15 días · 1 año o más: 30 días. Con ${M} meses = ${d} días.`}},
 function conceptual(){const c=pick(CONC),correct=c[1][c[2]],list=shuffle(c[1]);return {text:c[0],options:list,answer:list.indexOf(correct),explain:c[3]}}];
const TIPOS=["Salario neto y CCSS","Aguinaldo","Vacaciones","Horas extra","Cesantía","Preaviso","Conceptos legales"];

const cur=()=>G.players[G.turn];
const active=()=>G.players.filter(p=>!p.out);
function publish(){G.ver=(G.ver||0)+1;G.now=Date.now();if(!LOCAL)try{sessionStorage.setItem("opoly_host",JSON.stringify({G,PRIV}))}catch(e){}
 if(!LOCAL&&ch)ch.send({type:"broadcast",event:"m",payload:{t:"state",s:G}});SKEW=0;applyState(G)}
function logl(t){G.log.push(t);if(G.log.length>40)G.log.shift()}
function evt(text,kind,explain){G.event={text,kind:kind||"",explain:explain||"",n:(G.event?G.event.n:0)+1};logl(text)}
function createRoom(){
 const code=Array.from({length:4},()=>"ABCDEFGHJKLMNPQRSTUVWXYZ"[rnd(0,23)]).join("");
 G={code,hostId:ME.pid,phase:"lobby",players:[{id:ME.pid,name:ME.name,color:COLORS[0],pos:0,money:START,out:false,skip:0,conn:true}],turn:0,round:1,maxRounds:10,owners:{},dice:[1,1],rollId:0,q:null,event:null,log:[],ver:0,deadline:0};

function hostHandle(m){
 if(!G)return;
 if(m.t==="hello"){publish();return}
 if(m.t==="join"){let p=G.players.find(x=>x.id===m.pid);
  if(p){p.conn=true;p.name=String(m.name||p.name).slice(0,24)}
  else if(G.phase==="lobby"&&G.players.length<MAXP){G.players.push({id:m.pid,name:String(m.name||"Jugador").slice(0,24),color:COLORS[G.players.length],pos:0,money:START,out:false,skip:0,conn:true});logl("Se unió "+String(m.name||"Jugador").slice(0,24))}
  else if(!p){return}
  publish();return}
 if(m.t==="start"){if(m.pid===G.hostId&&G.phase==="lobby"&&G.players.length>=2){G.maxRounds=[8,12,16].includes(+m.rounds)?+m.rounds:10;G.gid=G.code+"-"+Date.now().toString(36);G.phase="roll";G.turn=0;G.round=1;G.deadline=Date.now()+T_ROLL;evt("¡Comienza el juego! Turno de "+cur().name);publish()}return}
 const p=G.players[G.turn];if(!p||p.id!==m.pid)return;
 if(m.t==="roll"&&G.phase==="roll"){doRoll()}
 else if(m.t==="answer"&&G.phase==="question"&&Number.isInteger(m.i)&&m.i>=0&&m.i<4){resolveAnswer(m.i)}
 else if(m.t==="buy"&&G.phase==="buy"){resolveBuy(!!m.yes)}
 else return;
 publish()}
function doRoll(){
 const p=cur(),d1=rnd(1,6),d2=rnd(1,6),old=p.pos;p.pos=(p.pos+d1+d2)%24;G.dice=[d1,d2];G.rollId++;
 let extra="";if(p.pos<old){p.money+=PASS;extra=" Pasó por la salida: cobra "+fmt(PASS)+"."}
 logl(`${p.name} sacó ${d1}+${d2}.${extra}`);
 land(p)}
function land(p){
 const t=TILES[p.pos],o=G.owners[t.i];
 if(t.k==="empresa"){
  if(o===p.id){p.money+=10000;evt(`${p.name} cobra ${fmt(10000)} de dividendos de ${t.name}.`,"ok");return endTurn()}
  const q=genQuestion();PRIV={answer:q.answer,explain:q.explain,tipo:q.tipo};
  G.q={tile:t.i,tipo:q.tipo,kind:o?"def":"adq",text:q.text,options:q.options,price:t.price,rent:t.rent,owner:o||null};
  G.phase="question";G.deadline=Date.now()+T_Q;G.event=null;
  logl(o?`${p.name} cayó en ${t.name} (de ${nameOf(o)}): debe defenderse.`:`${p.name} cayó en ${t.name}: caso de planilla.`);return}
 if(t.k==="carta"){const c=pick(CARDS);
  if(c[2]==="skip"){p.skip=1;evt(`${p.name}: ${c[0]}`,"bad")}
  else if(c[2]==="collect"){let tot=0;G.players.forEach(x=>{if(x.id!==p.id&&!x.out){x.money-=10000;tot+=10000}});p.money+=tot;evt(`${p.name}: ${c[0]}`,"ok")}
  else{p.money+=c[1];evt(`${p.name}: ${c[0]} (${c[1]>0?"+":""}${fmt(c[1])})`,c[1]>0?"ok":"bad")}
  return endTurn()}
 if(t.k==="ccss"){p.money-=CCSS_TAX;evt(`${p.name} paga ${fmt(CCSS_TAX)} de cuotas a la CCSS.`,"bad");return endTurn()}
 if(t.k==="insp"){p.skip=1;evt(`${p.name} cae en Inspección: pierde su próximo turno.`,"bad");return endTurn()}
 if(t.k==="salida"){evt(`${p.name} cae en la Salida.`);return endTurn()}
 evt(`${p.name} descansa un momento.`);endTurn()}
const nameOf=id=>(G.players.find(x=>x.id===id)||{}).name||"?";
function resolveAnswer(i,timeout){
 const p=cur(),q=G.q,ok=!timeout&&i===PRIV.answer,t=TILES[q.tile],correctTxt=q.options[PRIV.answer];
 G.q.picked=i;G.q.correct=PRIV.answer;
 (G.hist=G.hist||[]).push({pid:p.id,tipo:PRIV.tipo||"",modo:q.kind==="adq"?"Adquirir empresa":"Defender empresa",empresa:t.name,pregunta:q.text,opciones:q.options,elegida:timeout?null:i,correcta:PRIV.answer,ok,sinResponder:!!timeout,explicacion:PRIV.explain,hora:new Date().toISOString()});
 if(q.kind==="adq"){
  if(ok){p.money+=BONUS;G.phase="buy";G.deadline=Date.now()+T_BUY;G.event={text:`✅ ¡Correcto! ${p.name} gana ${fmt(BONUS)} de bonificación y puede adquirir ${t.name}.`,kind:"ok",explain:PRIV.explain,n:(G.event?G.event.n:0)+1};logl(G.event.text);return}
  p.money-=FINE;evt(`❌ ${p.name} falló (respuesta: ${correctTxt}). Multa de ${fmt(FINE)}.`,"bad",PRIV.explain);return endTurn()}
 const pay=ok?Math.round(q.rent/2):q.rent,own=G.players.find(x=>x.id===q.owner);
 p.money-=pay;if(own)own.money+=pay;
 evt(ok?`✅ ${p.name} defendió bien el caso y paga solo ${fmt(pay)} a ${nameOf(q.owner)}.`:`❌ ${p.name} falló (respuesta: ${correctTxt}) y paga ${fmt(pay)} a ${nameOf(q.owner)}.`,ok?"ok":"bad",PRIV.explain);endTurn()}
function resolveBuy(yes){
 const p=cur(),q=G.q,t=TILES[q.tile];
 if(yes&&p.money>=t.price){p.money-=t.price;G.owners[t.i]=p.id;G.event={text:`🏢 ${p.name} adquirió ${t.name} por ${fmt(t.price)}.`,kind:"ok",explain:G.event?G.event.explain:"",n:G.event.n+1};logl(G.event.text)}
 else{G.event={text:`${p.name} decidió no comprar ${t.name}.`,kind:"",explain:G.event?G.event.explain:"",n:G.event.n+1};logl(G.event.text)}
 endTurn(true)}
function endTurn(keepEvent){
 G.q&&(G.q.done=true);
 // quiebras
 G.players.forEach(x=>{if(!x.out&&x.money<0){x.out=true;Object.keys(G.owners).forEach(k=>{if(G.owners[k]===x.id)delete G.owners[k]});logl(`💥 ${x.name} quedó en quiebra.`)}});
 if(active().length<=1){return finish()}
 let n=G.turn,wrapped=false,guard=0;
 do{const prev=n;n=(n+1)%G.players.length;if(n<=prev)wrapped=true;
  const pl=G.players[n];if(pl.out)continue;
   if(pl.skip>0){pl.skip--;logl(`${pl.name} pierde su turno.`);continue}
  break}while(++guard<20);
 if(wrapped)G.round++;
 if(G.round>G.maxRounds)return finish();
 G.turn=n;G.phase="roll";G.deadline=Date.now()+T_ROLL;if(!keepEvent&&false)G.event=null}
function patrimonio(p){return p.money+Object.keys(G.owners).filter(k=>G.owners[k]===p.id).reduce((s,k)=>s+TILES[k].price,0)}
function finish(){G.phase="end";G.deadline=0;G.ranking=G.players.map(p=>({id:p.id,name:p.name,total:patrimonio(p),out:p.out})).sort((a,b)=>b.total-a.total);evt(`🏆 ¡Fin del juego! Gana ${G.ranking[0].name} con ${fmt(G.ranking[0].total)}.`,"ok")}
function botAct(now){
 const p=cur();if(!p||!p.bot||!["roll","question","buy"].includes(G.phase))return false;
 if(!G._bw){G._bw=now+(G.phase==="question"?2500:1300);return false}
 if(now<G._bw)return false;G._bw=0;
 if(G.phase==="roll")doRoll();
 else if(G.phase==="question"){const a=PRIV.answer;resolveAnswer(Math.random()<0.65?a:(a+rnd(1,3))%4)}
 else resolveBuy(p.money>=TILES[G.q.tile].price+50000);
 publish();return true}
function hostTick(){
 if(!G||!IS_HOST)return;const now=Date.now();if(botAct(now))return;
 if(["roll","question","buy"].includes(G.phase)){const p=cur();
  const gone=p&&!p.conn&&!p.bot,late=G.deadline&&now>G.deadline;
  if(late||(gone&&now>G.deadline-(G.phase==="roll"?T_ROLL:G.phase==="question"?T_Q:T_BUY)+4000)){
   if(G.phase==="roll")doRoll();else if(G.phase==="question")resolveAnswer(PRIV?(PRIV.answer+1)%4:0,true);else resolveBuy(false);
   publish()}}}

   ${host?`<label style="font-size:.75rem;color:var(--mut)">RONDAS</label><select id="rondas"><option value="8">Partida corta (8)</option><option value="12" selected>Partida normal (12)</option><option value="16">Partida larga (16)</option></select><button id="bStart" style="width:100%;margin-top:10px" ${G.players.length<2?"disabled":""}>${G.players.length<2?"Esperando jugadores…":"Iniciar juego"}</button>`:`<p>Esperando a que el anfitrión inicie…</p>`}`;
 }else if(G.phase==="end"){
  h=`<h3 style="margin:0 0 6px">🏆 Resultado final</h3>${G.ranking.map((r,i)=>`<div class="rank"><span>${i+1}. ${esc(r.name)}${r.out?" 💥":""}</span><span>${fmt(r.total)}</span></div>`).join("")}<p style="color:var(--mut);font-size:.8rem">Patrimonio = dinero + valor de tus empresas.</p>${evH}
   <div class="ev ${V.rec==="ok"?"ok":V.rec==="err"?"bad":""}">${V.rec==="ok"?"✅ Tu registro de ejercicios quedó guardado.":V.rec==="err"?"⚠️ No se pudo guardar tu registro: "+esc(V.recMsg||""):V.rec==="noaplica"?"Esta partida no se guardó porque no iniciaste sesión como estudiante.":"Guardando tu registro…"}</div>
   <button class="sec" style="width:100%;margin-top:10px" id="bVerReg">📊 Ver mi registro</button>`;
 }else if(G.phase==="roll"){
  h=`${G.deadline?`<div class="bar"><i id="tbar"></i></div>`:""}<b>${esc(cur().name)}${myTurn?" (¡es tu turno!)":""}</b>
   <button id="bRoll" style="width:100%;margin-top:8px" ${myTurn?"":"disabled"}>🎲 ${myTurn?"Tirar dados":"Esperando a "+esc(cur().name)}</button>${evH}`;
 }else if(G.phase==="question"&&G.q){
  const q=G.q,t=TILES[q.tile],mine=myTurn,tag=q.kind==="adq"?"Caso de planilla: resuélvelo para adquirir la empresa":"Defiende tu caso: si aciertas pagas solo la mitad de la renta";
  h=`<div class="q"><div class="bar"><i id="tbar"></i></div><h3>${t.ic} ${esc(t.name)} · ${fmt(q.price)}</h3><div style="color:var(--mut);font-size:.8rem;margin-bottom:6px">${tag}</div><div class="txt">${esc(q.text)}</div>
   ${q.options.map((o,i)=>`<button class="opt" data-a="${i}" ${mine&&q.picked===undefined?"":"disabled"}>${"ABCD"[i]}) ${esc(o)}</button>`).join("")}
   ${mine?"":`<p style="color:var(--mut)">${esc(cur().name)} está resolviendo…</p>`}</div>`;
 }else if(G.phase==="buy"&&G.q){
  const t=TILES[G.q.tile],can=me()&&me().money>=t.price;
  h=`<div class="bar"><i id="tbar"></i></div>${evH}<h3 style="margin:10px 0 4px">${t.ic} ${esc(t.name)}</h3><p style="margin:0 0 8px">Precio: <b>${fmt(t.price)}</b> · renta ${fmt(t.rent)}</p>
   ${myTurn?`<div style="display:flex;gap:8px"><button class="good" id="bBuy" style="flex:1" ${can?"":"disabled"}>${can?"Comprar":"Sin fondos"}</button><button class="sec" id="bNo" style="flex:1">No comprar</button></div>`:`<p style="color:var(--mut)">${esc(cur().name)} decide si compra…</p>`}`;
 }
 A.innerHTML=h;
 const sel=$("rondas");if(sel){sel.value=V.rondas||"12";sel.onchange=()=>V.rondas=sel.value}
 const vr=$("bVerReg");if(vr)vr.onclick=()=>abrirRegistro();
 const bs=$("bStart");if(bs)bs.onclick=()=>send({t:"start",rounds:+($("rondas").value)});
 const br=$("bRoll");if(br&&myTurn)br.onclick=()=>{br.disabled=true;send({t:"roll"})};
 A.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{A.querySelectorAll(".opt").forEach(x=>x.disabled=true);send({t:"answer",i:+b.dataset.a})});
 const bb=$("bBuy");if(bb)bb.onclick=()=>send({t:"buy",yes:true});const bn=$("bNo");if(bn)bn.onclick=()=>send({t:"buy",yes:false});
 tickBar()}
function tickBar(){const b=$("tbar");if(!b||!G||!G.deadline)return;const tot=G.phase==="roll"?T_ROLL:G.phase==="question"?T_Q:T_BUY;const left=G.deadline+SKEW-Date.now();b.style.width=Math.max(0,Math.min(100,left/tot*100))+"%"}
setInterval(tickBar,500);

/* ===================== Entrada y arranque ===================== */
function nombre(){const n=$("nm").value.trim();if(!n){$("emsg").textContent="Escribe tu nombre.";return null}ME.name=n.slice(0,24);try{localStorage.setItem("opoly_name",ME.name)}catch(e){}return ME.name}
$("bCrear").onclick=()=>{if(!nombre())return;ME.pid=getPid();IS_HOST=true;const code=createRoom();
 openChannel(code,()=>{TICK=setInterval(hostTick,1000);publish();history.replaceState(null,"","?sala="+code)})};
function unirse(code){if(!nombre())return;code=String(code||"").toUpperCase().trim();if(code.length!==4){$("emsg").textContent="El código tiene 4 letras.";return}
 ME.pid=getPid();IS_HOST=false;$("emsg").textContent="Conectando…";
 openChannel(code,()=>{send({t:"join",name:ME.name});send({t:"hello"});setTimeout(()=>{if(!G)$("emsg").textContent="No se encontró la sala "+code+". Revisa el código o pide al anfitrión que la cree."},6000)})}
$("bDemo").onclick=()=>{if(!nombre())return;ME.pid=getPid();IS_HOST=true;LOCAL=true;const code=createRoom();
 G.players.push({id:"bot1",name:"🤖 Bot Ana",color:COLORS[1],pos:0,money:START,out:false,skip:0,conn:true,bot:true},{id:"bot2",name:"🤖 Bot Beto",color:COLORS[2],pos:0,money:START,out:false,skip:0,conn:true,bot:true});
 G.demo=true;G.gid=code+"-"+Date.now().toString(36);G.maxRounds=8;G.phase="roll";G.deadline=Date.now()+T_ROLL;evt("Modo demo: juegas contra 2 bots. ¡Tira los dados!");
 TICK=setInterval(hostTick,700);publish()};
$("bUnir").onclick=()=>unirse($("cod").value);
$("cod").addEventListener("keydown",e=>{if(e.key==="Enter")unirse($("cod").value)});
$("bLink").onclick=()=>{const u=location.origin+location.pathname+"?sala="+(G?G.code:"");(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>{$("bLink").textContent="¡Copiado!";setTimeout(()=>$("bLink").textContent="Copiar enlace",1500)}).catch(()=>prompt("Copia este enlace:",u))};
$("bSalir").onclick=()=>{if(confirm("¿Salir de la partida?")){try{sessionStorage.removeItem("opoly_host")}catch(e){}location.href=location.pathname}};
document.querySelectorAll(".viewctl button").forEach(b=>b.onclick=()=>{const v=b.dataset.v;if(v==="l")V.rz-=20;else if(v==="r")V.rz+=20;else if(v==="u")V.rx=Math.min(75,V.rx+8);else if(v==="d")V.rx=Math.max(20,V.rx-8);else{V.rx=52;V.rz=0}setView()});
(()=>{const st=$("stage");let drag=null;st.addEventListener("pointerdown",e=>{if(e.target.closest("button"))return;drag={x:e.clientX,y:e.clientY};st.setPointerCapture(e.pointerId)});
 st.addEventListener("pointermove",e=>{if(!drag)return;V.rz+=(e.clientX-drag.x)*.4;V.rx=Math.max(20,Math.min(75,V.rx-(e.clientY-drag.y)*.2));drag={x:e.clientX,y:e.clientY};setView()});
 st.addEventListener("pointerup",()=>drag=null)})();

/* ===================== Registro de ejercicios ===================== */
const RG={rows:[],docente:false,est:null,verDemo:false,seccion:"",vista:"lista"};
async function cargarRegistros(solo){
 const st=sb.storage.from("materiales"),out=[];
 let folders;
 if(solo)folders=[safeId(solo)];
 else{const {data,error}=await st.list("opoly-registros",{limit:1000});if(error)throw error;folders=(data||[]).map(x=>x.name)}
 await Promise.all(folders.map(async f=>{
  const {data}=await st.list("opoly-registros/"+f,{limit:1000});
  await Promise.all((data||[]).filter(x=>/\.json$/.test(x.name)).map(async x=>{
   try{const u=st.getPublicUrl(`opoly-registros/${f}/${x.name}`).data.publicUrl;const r=await fetch(u+"?t="+Date.now());out.push(await r.json())}catch(e){}}))}));
 return out}
async function abrirRegistro(){
 const s=sesion();RG.docente=s.role==="docente";RG.est=null;RG.vista="lista";
 $("entry").classList.add("hidden");$("game").classList.add("hidden");$("rec").classList.remove("hidden");
 $("recT").textContent=RG.docente?"📊 Registro de ejercicios de los estudiantes":"📊 Mi registro de ejercicios";
 $("recB").innerHTML='<p style="color:var(--mut)">Cargando…</p>';
 if(!RG.docente&&!(s.role==="estudiante"&&s.id)){$("recB").innerHTML='<p>Inicia sesión como estudiante en el LMS para ver tu registro.</p>';return}
 try{RG.rows=await cargarRegistros(RG.docente?null:s.id);if(!RG.docente)RG.est=String(s.id);pintarRegistro()}
 catch(e){$("recB").innerHTML='<p class="no">No se pudo cargar el registro: '+esc(e&&e.message||e)+'</p>'}}
function agrupar(){
 const m={};RG.rows.filter(r=>RG.verDemo||!r.demo).filter(r=>!RG.seccion||r.seccion===RG.seccion).forEach(r=>{
  const e=m[r.estudiante_id]=m[r.estudiante_id]||{id:r.estudiante_id,nombre:r.nombre,seccion:r.seccion,partidas:[],ej:0,ok:0,sin:0,tipos:{},ult:""};
  e.partidas.push(r);r.ejercicios.forEach(x=>{e.ej++;if(x.ok)e.ok++;if(x.sinResponder)e.sin++;const t=e.tipos[x.tipo||"—"]=e.tipos[x.tipo||"—"]||{n:0,ok:0};t.n++;if(x.ok)t.ok++});
  if(r.fecha>e.ult)e.ult=r.fecha});
 return Object.values(m).sort((a,b)=>String(a.nombre).localeCompare(String(b.nombre)))}
const pc=(a,b)=>b?Math.round(a*100/b)+" %":"—";
const fdt=d=>d?new Date(d).toLocaleString("es-CR",{dateStyle:"short",timeStyle:"short"}):"";
function tiposTabla(t){const k=Object.keys(t);if(!k.length)return "";return `<table><thead><tr><th>Tema</th><th class="r">Ejercicios</th><th class="r">Aciertos</th><th class="r">%</th></tr></thead><tbody>${k.sort().map(x=>`<tr><td>${esc(x)}</td><td class="r">${t[x].n}</td><td class="r">${t[x].ok}</td><td class="r"><b>${pc(t[x].ok,t[x].n)}</b></td></tr>`).join("")}</tbody></table>`}
function detalleEst(e){
 return `<div class="kp"><div><small>Partidas</small><b>${e.partidas.length}</b></div><div><small>Ejercicios</small><b>${e.ej}</b></div><div><small>Aciertos</small><b>${e.ok}</b></div><div><small>% de acierto</small><b>${pc(e.ok,e.ej)}</b></div><div><small>Sin responder</small><b>${e.sin}</b></div></div>
 <h3>Rendimiento por tema</h3>${tiposTabla(e.tipos)||"<p>Sin ejercicios todavía.</p>"}
 <h3>Partidas y ejercicios</h3>${e.partidas.sort((a,b)=>b.fecha.localeCompare(a.fecha)).map(p=>`<div class="ex"><b>${fdt(p.fecha)}</b> · ${p.demo?"Demo":"Sala "+esc(p.sala)} · Puesto ${p.posicion}.º de ${p.jugadores.length} · Patrimonio ${fmt(p.total)}<br><small>Jugaron: ${p.jugadores.map(esc).join(", ")}</small>
  <table><thead><tr><th>#</th><th>Tema</th><th>Ejercicio</th><th>Su respuesta</th><th>Correcta</th><th></th></tr></thead><tbody>${p.ejercicios.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.tipo)}<br><small>${esc(x.modo)} · ${esc(x.empresa)}</small></td><td>${esc(x.pregunta)}<br><small>📖 ${esc(x.explicacion)}</small></td><td>${x.elegida==null?"<i>Sin responder</i>":esc(x.opciones[x.elegida])}</td><td>${esc(x.opciones[x.correcta])}</td><td class="${x.ok?"ok":"no"}">${x.ok?"✓":"✗"}</td></tr>`).join("")||'<tr><td colspan="6">Sin ejercicios en esta partida.</td></tr>'}</tbody></table></div>`).join("")}`}
function pintarRegistro(){
 const all=agrupar(),secs=[...new Set(RG.rows.map(r=>r.seccion).filter(Boolean))].sort();
 $("recF").innerHTML=(RG.docente?`<select id="rgSec" style="width:auto"><option value="">Todas las secciones</option>${secs.map(x=>`<option ${x===RG.seccion?"selected":""}>${esc(x)}</option>`).join("")}</select>`:"")+`<label class="ck"><input type="checkbox" id="rgDemo" ${RG.verDemo?"checked":""}> Incluir partidas de demo</label>`;
 const sel=$("rgSec");if(sel)sel.onchange=()=>{RG.seccion=sel.value;RG.est=null;pintarRegistro()};
 $("rgDemo").onchange=e=>{RG.verDemo=e.target.checked;pintarRegistro()};
 if(!RG.docente||RG.est){const e=all.find(x=>String(x.id)===String(RG.est));
  $("recB").innerHTML=(RG.docente?`<button class="sec" id="rgAtras">← Todos los estudiantes</button><h2>${e?esc(e.nombre):""} <small style="color:var(--mut)">${e?esc(e.seccion):""}</small></h2>`:"")+(e?detalleEst(e):"<p>Todavía no hay partidas guardadas. Cuando termines una partida (no demo) aparecerá aquí.</p>");
  const a=$("rgAtras");if(a)a.onclick=()=>{RG.est=null;pintarRegistro()};return}
 const tot={n:0,ok:0};all.forEach(e=>{tot.n+=e.ej;tot.ok+=e.ok});
 $("recB").innerHTML=`<div class="kp"><div><small>Estudiantes</small><b>${all.length}</b></div><div><small>Partidas</small><b>${all.reduce((s,e)=>s+e.partidas.length,0)}</b></div><div><small>Ejercicios</small><b>${tot.n}</b></div><div><small>Acierto general</small><b>${pc(tot.ok,tot.n)}</b></div></div>
  ${all.length?`<table><thead><tr><th>Estudiante</th><th>Sección</th><th class="r">Partidas</th><th class="r">Ejercicios</th><th class="r">Aciertos</th><th class="r">%</th><th>Última partida</th></tr></thead><tbody>${all.map(e=>`<tr class="clk" data-e="${esc(e.id)}"><td><b>${esc(e.nombre)}</b></td><td>${esc(e.seccion)}</td><td class="r">${e.partidas.length}</td><td class="r">${e.ej}</td><td class="r">${e.ok}</td><td class="r"><b>${pc(e.ok,e.ej)}</b></td><td>${fdt(e.ult)}</td></tr>`).join("")}</tbody></table><p style="color:var(--mut);font-size:.8rem">Toca un estudiante para ver cada ejercicio que hizo.</p>`:"<p>Aún no hay partidas guardadas.</p>"}`;
 $("recB").querySelectorAll("tr.clk").forEach(tr=>tr.onclick=()=>{RG.est=tr.dataset.e;pintarRegistro();scrollTo(0,0)})}
$("recCsv").onclick=()=>{
 const rows=[["Estudiante","Sección","Fecha","Partida","Puesto","Tema","Modo","Empresa","Ejercicio","Respuesta del estudiante","Respuesta correcta","Resultado"]];
 RG.rows.filter(r=>RG.verDemo||!r.demo).filter(r=>!RG.seccion||r.seccion===RG.seccion).filter(r=>RG.docente||true).forEach(r=>r.ejercicios.forEach(x=>rows.push([r.nombre,r.seccion,fdt(r.fecha),r.demo?"Demo":r.sala,r.posicion,x.tipo,x.modo,x.empresa,x.pregunta,x.elegida==null?"Sin responder":x.opciones[x.elegida],x.opciones[x.correcta],x.ok?"Correcto":"Incorrecto"])));
 const csv="﻿"+rows.map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\r\n");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="registro-planilla-opoly.csv";a.click()};
$("recBack").onclick=()=>{$("rec").classList.add("hidden");if(V.shown)$("game").classList.remove("hidden");else $("entry").classList.remove("hidden")};
$("bReg").onclick=abrirRegistro;
(function(){const s=sesion();if(s.role==="docente")$("bReg").textContent="📊 Registro de ejercicios de los estudiantes"})();
window.addEventListener("resize",fitBoard);
(function init(){
 const s=sesion();let n="";try{n=localStorage.getItem("opoly_name")||""}catch(e){}
 $("nm").value=s.nombre||n||"";
 const q=new URLSearchParams(location.search).get("sala");if(q)$("cod").value=q.toUpperCase();
 // el anfitrión puede refrescar la página y retomar su sala
 try{const sv=JSON.parse(sessionStorage.getItem("opoly_host")||"null");
  if(sv&&sv.G&&sv.G.hostId===getPid()&&sv.G.phase!=="end"&&(!q||q.toUpperCase()===sv.G.code)){ME.pid=getPid();ME.name=(sv.G.players.find(p=>p.id===ME.pid)||{}).name||"Anfitrión";IS_HOST=true;G=null;
   const keep=sv.G;PRIV=sv.PRIV;openChannel(keep.code,()=>{G=keep;G.players.forEach(p=>{if(p.id!==ME.pid)p.conn=true});G.deadline=G.deadline?Date.now()+15000:0;VER=G.ver||0;TICK=setInterval(hostTick,1000);publish()});return}}catch(e){}
})();
</script>
