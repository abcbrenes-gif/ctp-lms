<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#17202a;--mut:#5d6b78;--line:#d9e0e6;--pri:#0e6e5c;--pri2:#e3f3ef;--bad:#c0392b;--bad2:#fbeaea;--warn:#a66a00;--warn2:#fff4dc;--ok:#1e8449;--ok2:#e7f6ec;--sh:0 1px 3px rgba(0,0,0,.08),0 4px 14px rgba(0,0,0,.05)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11161b;--card:#1a2128;--tx:#e8edf1;--mut:#9aa8b4;--line:#2d3842;--pri:#38c2a3;--pri2:#173a33;--bad:#ff7b6b;--bad2:#3a1f1d;--warn:#f2b84b;--warn2:#3a2f17;--ok:#5fd38d;--ok2:#17331f;--sh:0 1px 3px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#11161b;--card:#1a2128;--tx:#e8edf1;--mut:#9aa8b4;--line:#2d3842;--pri:#38c2a3;--pri2:#173a33;--bad:#ff7b6b;--bad2:#3a1f1d;--warn:#f2b84b;--warn2:#3a2f17;--ok:#5fd38d;--ok2:#17331f;--sh:0 1px 3px rgba(0,0,0,.4)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 "Segoe UI",system-ui,Roboto,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
header.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
header.top .wrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px}
.brand{font-weight:800;margin-right:auto;display:flex;align-items:center;gap:8px}
.brand small{display:block;font-weight:500;color:var(--mut);font-size:.75rem}
h1,h2,h3{line-height:1.25;margin:0 0 8px}h1{font-size:1.5rem}h2{font-size:1.2rem}h3{font-size:1.05rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--sh);margin:0 0 14px}
.muted{color:var(--mut)}.small{font-size:.85rem}
button,.btn{font:inherit;font-weight:600;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:9px;padding:8px 14px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
button:hover{border-color:var(--pri)}
button.pri{background:var(--pri);border-color:var(--pri);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.pri{color:#06201a}}
button.danger{color:var(--bad);border-color:var(--bad)}
button.sm{padding:4px 10px;font-size:.85rem}
button:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
label.f,div.f{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.88rem}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%}
textarea{min-height:60px;resize:vertical}
input[type=checkbox],input[type=radio]{width:auto}
.chip{display:inline-block;font-size:.78rem;font-weight:700;padding:2px 9px;border-radius:999px;border:1px solid var(--line);background:var(--bg)}
.chip.ok{background:var(--ok2);color:var(--ok);border-color:transparent}.chip.warn{background:var(--warn2);color:var(--warn);border-color:transparent}.chip.bad{background:var(--bad2);color:var(--bad);border-color:transparent}.chip.pri{background:var(--pri2);color:var(--pri);border-color:transparent}
.tbl{overflow:auto}table{border-collapse:collapse;width:100%;font-size:.9rem}th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}th{background:var(--bg);font-size:.8rem;text-transform:uppercase;letter-spacing:.03em;color:var(--mut)}
td.r,th.r{text-align:right}
.parte{border-left:4px solid var(--pri);padding-left:12px;margin:18px 0}
.item{border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0;background:var(--card)}
.item .q{font-weight:600;margin:0 0 8px;white-space:pre-wrap}
.opc{display:flex;gap:10px;align-items:flex-start;padding:7px 9px;border:1px solid var(--line);border-radius:8px;margin:5px 0;cursor:pointer}
.opc:hover{border-color:var(--pri)}.opc input{margin-top:4px}
.opc.sel{border-color:var(--pri);background:var(--pri2)}
.ed-item{border:1px dashed var(--line);border-radius:10px;padding:10px;margin:8px 0}
.barra{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:2px solid var(--pri);padding:8px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.reloj{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.15rem}
.reloj.poco{color:var(--bad)}
.ok-t{color:var(--ok);font-weight:700}.bad-t{color:var(--bad);font-weight:700}
.aviso{border-radius:10px;padding:10px 12px;margin:0 0 12px;background:var(--warn2);color:var(--tx);border:1px solid var(--warn)}
.aviso.ok{background:var(--ok2);border-color:var(--ok)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--tx);width:min(900px,96vw);max-height:90vh;padding:0}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog .dh{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:8px}
dialog .db{padding:14px 16px}
.no-sel{user-select:none;-webkit-user-select:none}
.no-sel input,.no-sel textarea{user-select:text;-webkit-user-select:text}
table.sheet{font-size:.85rem}table.sheet input{min-width:96px;text-align:right;padding:5px 7px}
table.sheet td.ok{background:var(--ok2)}table.sheet td.bad{background:var(--bad2)}
.as-game{display:grid;grid-template-columns:minmax(220px,1fr) 1.4fr;gap:12px}@media(max-width:760px){.as-game{grid-template-columns:1fr}}
.as-panel,.as-vou{border:1px solid var(--line);border-radius:12px;padding:10px}.as-bank{display:flex;flex-direction:column;gap:6px;max-height:430px;overflow:auto}
.as-blk{display:flex;gap:8px;align-items:center;border:2px solid var(--line);border-left:6px solid var(--cc);border-radius:10px;padding:6px 8px;cursor:pointer;user-select:none;background:var(--card)}
.as-blk.pick{outline:3px solid var(--pri);outline-offset:1px}.as-blk.used{opacity:.45}.as-blk .cd,.as-lin .cd{font:700 .74rem ui-monospace,monospace;color:var(--cc)}.as-blk .nm,.as-lin .nm{font-size:.84rem;font-weight:600}
.as-blk .cl{display:block;font-size:.68rem;font-weight:800;text-transform:uppercase;color:var(--cc)}
.as-vh{font-weight:800;margin-bottom:6px}.as-cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}.as-col{border:2px dashed var(--line);border-radius:10px;padding:6px;min-height:110px}
.as-ch{font-weight:800;text-align:center;letter-spacing:.08em;margin-bottom:4px}.as-lin{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-left:5px solid var(--cc);border-radius:8px;padding:5px 6px;margin:4px 0;background:var(--card);flex-wrap:wrap}
.as-lin input{width:110px;text-align:right;padding:4px 6px}.as-lin.ok{background:var(--ok2)}.as-lin.bad{background:var(--bad2)}.as-lin.warn{background:var(--warn2)}
.as-drop{width:100%;border-style:dashed;margin-top:4px;font-size:.8rem}.as-tot{display:flex;justify-content:space-between;gap:8px;margin-top:8px;font-size:.88rem;flex-wrap:wrap}
.as-bal{margin-top:6px;padding:6px 8px;border-radius:8px;font-weight:700;font-size:.86rem;background:var(--bg,#f1f5f9)}.as-bal.okb{background:var(--ok2)}.as-bal.nob{background:var(--warn2)}
.liq-parte{border:1px solid var(--line);border-left:5px solid var(--c,var(--pri));border-radius:10px;padding:10px 12px;margin:10px 0}
.liq-paso{display:flex;gap:10px;align-items:center;justify-content:space-between;border-bottom:1px dashed var(--line);padding:6px 0}.liq-paso input{max-width:190px;text-align:right}
.hidden{display:none!important}
@media (max-width:600px){.wrap{padding:12px}.card{padding:12px}}
@media print{header.top,.noprint{display:none!important}body{background:#fff;color:#000}.card{box-shadow:none;border:0}}
</style>

<body>
<header class="top noprint"><div class="wrap">
  <div class="brand">📝 <span>Exámenes<small>CTP Mercedes Norte · Contabilidad</small></span></div>
  <span id="quien" class="muted small"></span>
  <a class="btn" href="index.html">← Plataforma</a>
</div></header>
<main class="wrap" id="app"><p class="muted">Cargando…</p></main>
<dialog id="dlg"><div class="dh"><b id="dlgT" style="margin-right:auto"></b><button class="sm" id="dlgX">✕ Cerrar</button></div><div class="db" id="dlgB"></div></dialog>

<script>
"use strict";
// ═══════════════════════════════════════════════════════════════════
// Exámenes: el profe arma el examen (borrador), lo revisa como estudiante
// y después lo publica en la sección. Se califica con puntos reales y
// aporta su propio porcentaje en «Pruebas» (no es indicador: no lleva letra
// ni resultado de aprendizaje).
// Se guarda en trabajos_cotidianos (contenido_actividad.estrategia = "examen_modulo")
// y las respuestas en actividades_estudiante.
// ═══════════════════════════════════════════════════════════════════
const SES=(()=>{try{return JSON.parse(sessionStorage.getItem("ctp_lms_session_v2")||"null")}catch(e){return null}})();
const DOC=!!(SES&&SES.role&&SES.role!=="estudiante"),EST_ID=SES&&SES.role==="estudiante"?String(SES.id):null;
const ESTR="examen_modulo";
const EXAMENES_ESTUDIANTES=false;
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nl=s=>esc(s).replace(/\n/g,"<br>");
const uid=()=>Math.random().toString(36).slice(2,10);
const clone=o=>JSON.parse(JSON.stringify(o));
const NF=new Intl.NumberFormat("es-CR",{maximumFractionDigits:2});
const fmtPts=n=>NF.format(Math.round((+n||0)*100)/100);
const fmtFH=iso=>{if(!iso)return"—";try{return new Date(iso).toLocaleString("es-CR",{weekday:"short",day:"numeric",month:"short",hour:"numeric",minute:"2-digit"})}catch(e){return iso}};
const aLocal=iso=>{if(!iso)return"";const d=new Date(iso);const p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`};
const deLocal=v=>v?new Date(v).toISOString():null;
const hoyISO=()=>{const d=new Date(),p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`};
function toast(t){const d=document.createElement("div");d.textContent=t;d.style.cssText="position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#17202a;color:#fff;padding:10px 16px;border-radius:10px;z-index:99;font-weight:600;box-shadow:0 4px 18px rgba(0,0,0,.3)";document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
const dlg=$("#dlg");$("#dlgX").onclick=()=>dlg.close();
function abrirDlg(t,html){$("#dlgT").textContent=t;$("#dlgB").innerHTML=html;if(!dlg.open)dlg.showModal()}

const TIPOS={
  sel:{ic:"🔘",n:"Selección única",ins:"Lea cada enunciado y seleccione la opción correcta. Cada respuesta correcta vale 1 punto."},
  pareo:{ic:"🔗",n:"Correspondencia",ins:"Relacione cada enunciado de la columna A con la respuesta de la columna B que le corresponde. Cada respuesta se utiliza una sola vez y hay respuestas que no se utilizan. Cada relación correcta vale 1 punto."},
  corta:{ic:"✏️",n:"Respuesta corta",ins:"Escriba en forma breve lo que se solicita en cada enunciado."},
  num:{ic:"🔢",n:"Resolución de ejercicios",ins:"Resuelva cada ejercicio con los datos que se le brindan y anote el resultado."},
  des:{ic:"📝",n:"Respuesta restringida o resolución de problemas (se califica a mano)",ins:"Resuelva lo que se solicita. Se califica con la escala que acompaña cada ítem."},
  fv:{ic:"✅",n:"Falso o verdadero (no está en los lineamientos del MEP)",ins:"Seleccione si el enunciado es verdadero o falso."},
  mp:{ic:"🧾",n:"Ejercicio de planilla (machote de Aula de Conta)",ins:"Complete el machote de la planilla y el machote del asiento igual que en Aula de Conta. Use dos decimales; se acepta una diferencia de ₡1 por redondeo."},
  lq:{ic:"⚖️",n:"Ejercicio de liquidación (machote de Liquidaciones laborales)",ins:"Con los datos del caso, escriba el resultado de cada paso igual que en Liquidaciones laborales."},
  as:{ic:"📒",n:"Asientos de seguros (como en Misión Seguros)",ins:"Lea cada situación de la aseguradora y registre el asiento: tome cada cuenta del banco de cuentas del plan SUGESE, colóquela en el Debe o en el Haber y escriba su monto. Cada cuenta en su lado correcto vale 1 punto y cada monto correcto vale 1 punto. Verifique que la partida doble quede cuadrada."}
};
// Aplicaciones de la plataforma que un reto puede pedir abrir.
const APPS={"Liquidaciones laborales":"liquidaciones.html","Aula de Conta":"aula-contable.html","Ruta Laboral CR":"laboral.html","Misión Seguros":"seguros.html","La Tiradera":"tiradera.html","Planilla Opoly":"planilla-opoly.html"};
const urlApp=n=>{const k=Object.keys(APPS).find(x=>norm(x)===norm(n)||norm(n).includes(norm(x).split(" ")[0]));if(!k)return null;let u=APPS[k];if(k==="Aula de Conta"&&EST_ID)u+="?como_estudiante="+encodeURIComponent(EST_ID);return u};
const appNombre=n=>Object.keys(APPS).find(x=>norm(x)===norm(n)||norm(n).includes(norm(x).split(" ")[0]))||n;
const LQ_CASO=()=>({trabajador:"",tiempoModo:"directo",anios:1,meses:0,dias:0,mesesAguinaldo:6,motivo:"despido_responsabilidad",preavisoEstado:"no",preavisoDias:0,salarioModo:"mensual",salarioMensual:500000,vacDisfrutadas:0,vacAnteriores:0,salarios:[]});
const MP_EMPS=()=>[{nombre:"Colaborador 1",base:650000,horasExtra:0,comisiones:0,diasAusencia:0,hijos:0,conyuge:false},{nombre:"Colaborador 2",base:1100000,horasExtra:0,comisiones:0,diasAusencia:0,hijos:0,conyuge:false}];
// Cada acierto vale 1 punto: casillas del machote + cuentas del asiento.
const mpArmar=it=>{if(typeof plArmarMachote==="function"){Object.assign(it.mp,plArmarMachote(it.mp.empleados||[]));it.mp.ptsHoja=it.mp.emps.length*it.mp.campos.length;it.mp.ptsAsiento=it.mp.asiento.length;it.pts=it.mp.ptsHoja+it.mp.ptsAsiento}return it};
const nuevoItem=t=>t==="as"?asDeMision((typeof SEG_MISIONES!=="undefined"&&SEG_MISIONES[0])||{id:"x",t:"",historia:"",datos:[],lineas:[]}):t==="mp"?mpArmar({id:uid(),txt:"Complete el machote de la planilla del mes y registre el asiento de la planilla (el neto se paga por Bancos).",pts:10,mp:{empresa:"",empleados:MP_EMPS(),ptsHoja:6,ptsAsiento:4}}):t==="lq"?{id:uid(),txt:"Resuelva la liquidación del caso.",pts:10,lq:{caso:LQ_CASO(),partes:["salario","preaviso","cesantia","vacaciones","aguinaldo"]}}:({id:uid(),txt:"",pts:1,...(t==="sel"?{o:["","",""],r:0}:t==="fv"?{r:true}:t==="pareo"?{a:"",b:""}:t==="corta"?{acepta:[""]}:t==="num"?{r:0,tol:0.01}:{guia:""})});
const nuevaParte=t=>({id:uid(),tipo:t,titulo:TIPOS[t].n,instrucciones:TIPOS[t].ins,items:[nuevoItem(t)],extras:[]});
const ENC_DEF={institucion:"CTP Mercedes Norte",especialidad:"Contabilidad",subarea:"",unidad:"",nivel:"",docente:"",periodo:"II Período",tipo:"Prueba escrita",resultado:"",nota:""};
const ENC_CAMPOS=[["institucion","Centro educativo"],["especialidad","Especialidad"],["subarea","Subárea o módulo"],["unidad","Unidad de estudio"],["nivel","Nivel"],["docente","Persona docente"],["periodo","Período"],["tipo","Tipo de prueba"]];
const encDe=ex=>({...ENC_DEF,...(ex.encabezado||{})});
// Encabezado del examen (lo ven el estudiante, la vista previa y la versión impresa).
function encabezadoHTML(ex,{imprimir}={}){const E=encDe(ex),td=imprimir?' style="border:1px solid #888;padding:4px 8px"':"";
  const celdas=[...ENC_CAMPOS.filter(([k])=>!["institucion","especialidad","tipo","periodo"].includes(k)&&String(E[k]||"").trim()).map(([k,n])=>[n,esc(E[k])]),
    ["Sección",esc(nomMat(ex.materia_id))],["Fecha",esc(ex.fecha||"")],["Tiempo",ex.duracion?ex.duracion+" minutos":"—"],["Puntos totales",fmtPts(totalPts(ex))],["Porcentaje",fmtPts(ex.peso)+" %"]];
  if(imprimir)celdas.unshift(["Nombre de la persona estudiante",""],["Puntuación obtenida",""],["Calificación obtenida",""],["Porcentaje obtenido",""],["Firma de la persona encargada legal",""]);
  const filas=[];for(let i=0;i<celdas.length;i+=3)filas.push(`<tr>${celdas.slice(i,i+3).map(([n,v])=>`<td${td}><span class="small muted">${n}:</span> <b>${v}</b></td>`).join("")}</tr>`);
  return `<div style="text-align:center"><div style="font-weight:800;font-size:1.05rem">${esc(E.institucion)}</div>${E.especialidad?`<div>Especialidad de ${esc(E.especialidad)}</div>`:""}<h2 style="margin:6px 0 2px;text-transform:uppercase">${esc(E.tipo||"Prueba escrita")}</h2>${E.periodo?`<div class="small muted">${esc(E.periodo)}</div>`:""}</div>
    <div class="tbl" style="margin:10px 0"><table style="font-size:.88rem${imprimir?";border-collapse:collapse;width:100%":""}"><tbody>${filas.join("")}</tbody></table></div>
    ${E.resultado?`<p class="small" style="margin:4px 0"><b>Resultado de aprendizaje:</b> ${nl(E.resultado)}</p>`:""}${E.nota?`<p class="small" style="margin:4px 0">${nl(E.nota)}</p>`:""}`}
// Lo que ve la persona estudiante como nombre de la prueba (el título interno no se muestra).
const titEst=ex=>{const E=encDe(ex);return [E.tipo||"Prueba escrita",E.subarea,E.periodo].filter(x=>String(x||"").trim()).join(" · ")};
const casoHTML=p=>String(p.caso||"").trim()?`<div class="aviso" style="background:var(--card);border-color:var(--line);border-left:4px solid var(--warn);white-space:pre-wrap;margin:6px 0 10px"><b>📂 ${esc(p.casoTitulo||"Caso")}</b><br>${esc(p.caso)}</div>`:"";
const nuevoEx=()=>({encabezado:{...ENC_DEF},materia_id:null,titulo:"",instrucciones:"Lea con atención cada parte. Trabaje en forma individual. Al terminar, presione «Entregar examen».",fecha:hoyISO(),inicio:null,cierre:null,duracion:80,peso:20,mezclar:true,mostrar_resultados:false,publicado:false,indicador_id:null,partes:[]});
const itemsDe=ex=>(ex.partes||[]).flatMap(p=>(p.items||[]).map(it=>({p,it})));
const totalPts=ex=>itemsDe(ex).reduce((s,{it})=>s+(+it.pts||0),0);

// ═══ Machote de planilla (Aula de Conta) y liquidación (Liquidaciones laborales) ═══
const money=n=>"₡ "+new Intl.NumberFormat("es-CR",{minimumFractionDigits:2,maximumFractionDigits:2}).format(+n||0);
const hayValor=o=>Object.values(o||{}).some(x=>x&&typeof x==="object"?hayValor(x):String(x??"").trim()!=="");
const cerca=(v,sol)=>!isNaN(v)&&Math.abs(v-sol)<=1.0001;
// it.mp = {empresa, campos:[[q,etiqueta]], emps:[{nombre,datos,sol:{q:monto}}], asiento:[{code,name,d,c}], ptsHoja, ptsAsiento}
function mpEval(it,v){const M=it.mp,V=v&&typeof v==="object"?v:{},H=V.h||{},A=V.a||{};let okH=0,totH=0,okA=0,totA=0;const celdas={},cuentas={};
  M.emps.forEach((e,i)=>M.campos.forEach(([q])=>{totH++;const raw=(H[i]||{})[q],n=parseNum(raw),sol=e.sol[q],ok=cerca(q==="rebaus"?Math.abs(n):n,sol);if(ok)okH++;celdas[i+"|"+q]={ok,lleno:String(raw??"").trim()!==""}}));
  if(M.asientoLibre){const filas=(V.r||[]).map(f=>({cta:f.cta,d:String(f.d??"").trim()===""?0:parseNum(f.d),c:String(f.c??"").trim()===""?0:parseNum(f.c)})),usadas=new Set();
    M.asiento.forEach(l=>{totA++;const j=filas.findIndex((f,k)=>!usadas.has(k)&&f.cta===l.code&&cerca(f.d,l.d)&&cerca(f.c,l.c));if(j>-1){usadas.add(j);okA++}cuentas[l.code]={ok:j>-1}});
    filas.forEach((f,k)=>{cuentas["fila"+k]={ok:usadas.has(k)}})}

  const lc=s.lastIndexOf(","),lp=s.lastIndexOf(".");
  if(lc>-1&&lp>-1){if(lc>lp)s=s.replace(/\./g,"").replace(",",".");else s=s.replace(/,/g,"")}
  else if(lc>-1){s=/^-?\d{1,3}(,\d{3})+$/.test(s)?s.replace(/,/g,""):s.replace(",",".")}
  else if(lp>-1&&/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,"");
  return Number(s)}
const respondido=v=>v&&typeof v==="object"?hayValor(v):!(v===undefined||v===null||String(v).trim()==="");
// Devuelve los puntos automáticos de un ítem, o null si se califica a mano.
function autoItem(p,it,v){const pts=+it.pts||0;
  if(!respondido(v))return 0;
  if(p.tipo==="mp")return mpEval(it,v).pts;
  if(p.tipo==="lq")return lqEval(it,v).pts;
  if(p.tipo==="as")return asEval(it,v).pts;
  if(p.tipo==="des")return null;
  if(p.tipo==="sel")return +v===+it.r?pts:0;
  if(p.tipo==="fv")return (v==="V")===!!it.r?pts:0;
  if(p.tipo==="pareo"){const el=p.items.find(x=>x.id===v);return v===it.id||(el&&norm(el.b)===norm(it.b))?pts:0}
  if(p.tipo==="num"){const n=parseNum(v);return !isNaN(n)&&Math.abs(n-(+it.r||0))<=Math.max(+it.tol||0,0.005)?pts:0}
  if(p.tipo==="corta"){const a=norm(v);return (it.acepta||[]).some(x=>norm(x)&&norm(x)===a)?pts:null} // si no coincide, lo revisa el profe
  return 0}
function calificar(ex,resp,manual){const auto={},pend=[];let tot=0;
  for(const {p,it} of itemsDe(ex)){const m=manual&&manual[it.id];
    const a=autoItem(p,it,resp[it.id]);auto[it.id]=a;
    const v=m!==undefined&&m!==null&&m!==""?+m:a;
    if(v===null){pend.push(it.id);continue}tot+=v}
  return {auto,pend,total:Math.round(tot*100)/100}}
const verResp=(p,it,v)=>{if(!respondido(v))return '<span class="muted">(sin responder)</span>';
  if(p.tipo==="sel")return esc(it.o[+v]??"—");if(p.tipo==="fv")return v==="V"?"Verdadero":"Falso";
  if(p.tipo==="pareo"){const b=p.items.find(x=>x.id===v);return esc(b?b.b:(p.extras||[])[+String(v).replace("x","")]??"—")}
  return nl(v)};
const verCorrecta=(p,it)=>p.tipo==="sel"?esc(it.o[it.r]):p.tipo==="fv"?(it.r?"Verdadero":"Falso"):p.tipo==="pareo"?esc(it.b):p.tipo==="num"?fmtPts(it.r)+(+it.tol?` <small class="muted">(± ${fmtPts(it.tol)})</small>`:""):p.tipo==="corta"?(it.acepta||[]).filter(Boolean).map(esc).join(" · "):(it.guia?nl(it.guia):'<span class="muted">Se califica a mano</span>');

function rng(seed){let h=1779033703^seed.length;for(let i=0;i<seed.length;i++){h=Math.imul(h^seed.charCodeAt(i),3432918353);h=h<<13|h>>>19}
  return()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return((h^=h>>>16)>>>0)/4294967296}}
function mezclar(arr,r){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

async function generarExamenIA(){const P=PL,sel=P.temas.filter(t=>t.incluir&&+t.preguntas>0),tipos=Object.keys(P.tipos).filter(k=>P.tipos[k].on);

        tema:{titulo:t.titulo,subtemas:t.subtemas,indicadores:t.indicadores,contenido:t.contenido}})});const d=await r.json().catch(()=>({}));
      if(r.ok&&d.reactivos){reac=reac.concat(d.reactivos.map(x=>({...x,tema:x.tema||t.titulo})));ok=true}else if(!d.reintentar)break}catch(e){}}

  if(!reac.length){b.disabled=false;pr.textContent="";return alert("La IA no pudo generar las preguntas. Intente de nuevo en un momento.")}
  const PARTES={seleccion_unica:"Selección única",correspondencia:"Correspondencia",respuesta_corta:"Respuesta corta",resolucion_ejercicios:"Resolución de ejercicios",respuesta_restringida:"Respuesta restringida",resolucion_problemas:"Resolución de problemas"};
  const orden=Object.keys(PARTES);reac.sort((a,b)=>orden.indexOf(a.tipo_pregunta)-orden.indexOf(b.tipo_pregunta));reac.forEach((x,i)=>{x.id_pregunta=i+1;x.parte=PARTES[x.tipo_pregunta]});

  try{const ex=exDesdeJSON({examen:{titulo,peso:P.peso,duracion:P.duracion},reactivos:reac},P.mid);ex.plan={temas:sel.map(t=>({titulo:t.titulo,preguntas:+t.preguntas})),creado:new Date().toISOString()};
    ex.ptsPre=+P.ptsPre||null;ex.tabla=sel.map(t=>({aprendizaje:t.titulo,lecciones:+t.lecciones||0}));
    // Ejercicios aparte con los machotes de Aula de Conta y Liquidaciones (datos de ejemplo que el docente puede cambiar).

      it.mp.empresa="Comercial Mercedes S.A.";it.mp.empleados=[{nombre:"Laura Vargas",base:az(450000,800000,10000)},{nombre:"Diego Castro",base:az(950000,1500000,10000),hijos:1}].map(e=>({horasExtra:0,comisiones:0,diasAusencia:0,hijos:0,conyuge:false,...e}));mpArmar(it);
      ex.partes.push({id:uid(),tipo:"mp",titulo:"Ejercicio de planilla",instrucciones:`Complete el machote de la planilla y el machote del asiento igual que en Aula de Conta. Use dos decimales; se acepta una diferencia de ₡1 por redondeo. Vale ${it.pts} puntos.`,items:[it],extras:[]});ex.tabla.push({aprendizaje:it.tema,lecciones:0})}

// ═══════════ Lineamientos técnicos del MEP para la prueba escrita (DDC/DEVA) ═══════════
// Tabla de especificaciones: constante = puntos preliminares ÷ lecciones (2 decimales);
// puntos de cada aprendizaje = constante × lecciones, redondeado (0,50 o más hacia arriba).
function tablaMEP(filas,ptsPre){const lec=filas.reduce((s,f)=>s+(+f.lecciones||0),0);const c=lec?Math.round(ptsPre/lec*100)/100:0;
  const out=filas.map(f=>({...f,puntos:Math.floor(c*(+f.lecciones||0)+0.5+1e-9)}));return {filas:out,constante:c,lecciones:lec,total:out.reduce((s,f)=>s+f.puntos,0)}}
const PROHIBIDAS=/todas las anteriores|ninguna de las anteriores|seg[uú]n su opini[oó]n|qu[eé] piensa usted|cite y explique|escriba y justifique|mencione y explique/i;
function revisarMEP(ex){const av=[],E=encDe(ex),its=itemsDe(ex);
  if(!E.subarea||!E.docente||!E.nivel)av.push("Encabezado: complete subárea o módulo, nivel y persona docente (parte administrativa).");
  if(!String(ex.instrucciones||"").trim())av.push("Faltan las instrucciones generales.");
  if(!ex.partes.some(p=>p.tipo==="sel"||p.tipo==="pareo"))av.push("Debe haber al menos un ítem de selección, identificación o correspondencia.");
  if(!ex.partes.some(p=>["corta","num","des","mp","lq","as"].includes(p.tipo)))av.push("Debe haber al menos un ítem de respuesta construida (respuesta corta, restringida, ejercicios o problemas).");
  ex.partes.forEach((p,pi)=>{const n=`Parte ${pi+1} (${p.titulo})`;
    if(!String(p.instrucciones||"").trim())av.push(`${n}: faltan las instrucciones específicas con la puntuación.`);
    if(p.tipo==="fv")av.push(`${n}: el falso o verdadero no está entre los ítems de los lineamientos; conviene pasarlo a selección única.`);
    if(p.tipo==="pareo"){if(p.items.length>5)av.push(`${n}: la correspondencia lleva máximo 5 relaciones (5 puntos); tiene ${p.items.length}.`);if(p.items.some(i=>+i.pts!==1))av.push(`${n}: en correspondencia cada relación vale 1 punto.`)}
    p.items.forEach((it,ii)=>{const k=`${n}, ítem ${ii+1}`;
      if(!Number.isInteger(+it.pts))av.push(`${k}: la puntuación debe ser un número entero.`);
      if(p.tipo==="sel"&&(it.o||[]).filter(o=>String(o).trim()).length>3)av.push(`${k}: selección única con máximo 3 opciones.`);
      if(p.tipo==="corta"&&(+it.pts<1||+it.pts>5))av.push(`${k}: la respuesta corta vale de 1 a 5 puntos.`);
      if(p.tipo==="des"&&!String(it.rubrica||"").trim())av.push(`${k}: agregue la escala de calificación visible para el estudiante.`);
      if(PROHIBIDAS.test([it.txt,...(it.o||[])].join(" ")))av.push(`${k}: usa una expresión que los lineamientos no permiten («todas/ninguna de las anteriores», «según su opinión», «cite y explique»…).`)})});
  if((ex.tabla||[]).length){const t=tablaMEP(ex.tabla,+ex.ptsPre||totalPts(ex));if(t.total!==totalPts(ex))av.push(`La tabla de especificaciones suma ${t.total} puntos y los ítems suman ${fmtPts(totalPts(ex))}.`)}
  else av.push("Falta la tabla de especificaciones (aprendizaje esperado, lecciones, puntos y tipo de ítem).");
  return av}
function tablaEspHTML(ex,{editable}={}){const filas=ex.tabla||[],T=tablaMEP(filas,+ex.ptsPre||totalPts(ex)||0);

  return `<div class="tbl"><table><thead><tr><th>Aprendizaje esperado</th><th class="r">Lecciones</th><th class="r">Puntos (tabla)</th>${editable?'<th class="r">En el examen</th>':""}<th>Tipo de ítem</th>${editable?"<th></th>":""}</tr></thead><tbody>
    ${T.filas.map((f,i)=>`<tr><td>${editable?`<input data-ta="${i}" value="${esc(f.aprendizaje)}">`:esc(f.aprendizaje)}</td><td class="r">${editable?`<input type="number" min="0" data-tl="${i}" value="${esc(f.lecciones)}" style="width:70px">`:f.lecciones}</td><td class="r"><b>${f.puntos}</b></td>${editable?`<td class="r">${real(f.aprendizaje)!==f.puntos?`<span class="chip warn">${fmtPts(real(f.aprendizaje))}</span>`:`<span class="chip ok">${f.puntos}</span>`}</td>`:""}<td class="small">${esc(f.tipo||tipos(f.aprendizaje)||"")}</td>${editable?`<td><button class="sm" data-tdel="${i}">✕</button></td>`:""}</tr>`).join("")}
    <tr><th>Total</th><th class="r">${T.lecciones}</th><th class="r">${T.total}</th>${editable?`<th class="r">${fmtPts(totalPts(ex))}</th>`:""}<th class="small">Constante: ${String(T.constante).replace(".",",")}</th>${editable?"<th></th>":""}</tr></tbody></table></div>`}

function exDesdeJSON(J,materiaId){const meta=J.examen||{},reac=Array.isArray(J)?J:(J.reactivos||J.preguntas||[]);if(!reac.length)throw new Error("El JSON no trae reactivos.");

    if(p.tipo==="pareo"){const vistos=new Set(),B=mezclar([...p.items.map(i=>({v:i.id,t:i.b})),...(p.extras||[]).map((x,k)=>({v:"x"+k,t:x}))].filter(o=>{const k=norm(o.t);if(vistos.has(k))return false;vistos.add(k);return true}),R);
      cuerpo=`${appHTML(p.items.find(i=>i.app)||{},p)}<div class="grid" style="grid-template-columns:1fr 1fr"><div>${(ex.mezclar?mezclar(p.items,R):p.items).map((it,k)=>`<div class="item"><p class="q">${k+1}. ${esc(it.a)} <span class="muted small">(${fmtPts(it.pts)} pts)</span></p><select data-resp="${it.id}"><option value="">— Elija —</option>${B.map((b,j)=>`<option value="${esc(b.v)}" ${resp[it.id]===b.v?"selected":""}>${letras[j]}. ${esc(b.t.length>60?b.t.slice(0,60)+"…":b.t)}</option>`).join("")}</select></div>`).join("")}</div>
       <div class="item"><b>Columna B</b>${B.map((b,j)=>`<p style="margin:6px 0"><b>${letras[j]}.</b> ${esc(b.t)}</p>`).join("")}</div></div>`}
    else cuerpo=its.map((it,k)=>{const v=resp[it.id];let ctl="";
      if(p.tipo==="sel"){const ord=ex.mezclar?mezclar(it.o.map((o,j)=>j).filter(j=>String(it.o[j]).trim()),R):it.o.map((o,j)=>j).filter(j=>String(it.o[j]).trim());
        ctl=ord.map((j,n)=>`<label class="opc ${+v===j&&respondido(v)?"sel":""}"><input type="radio" name="o_${it.id}" data-resp="${it.id}" value="${j}" ${+v===j&&respondido(v)?"checked":""}><span><b>${letras[n]})</b> ${esc(it.o[j])}</span></label>`).join("")}
      else if(p.tipo==="fv")ctl=`<div class="row">${["V","F"].map(x=>`<label class="opc ${v===x?"sel":""}" style="flex:0 0 auto"><input type="radio" name="o_${it.id}" data-resp="${it.id}" value="${x}" ${v===x?"checked":""}><span>${x==="V"?"Verdadero":"Falso"}</span></label>`).join("")}</div>`;
      else if(p.tipo==="num")ctl=`<input data-resp="${it.id}" inputmode="decimal" value="${esc(v??"")}" placeholder="Resultado" style="max-width:260px">`;
      else if(p.tipo==="corta")ctl=`<input data-resp="${it.id}" value="${esc(v??"")}" placeholder="Respuesta">`;
      else if(p.tipo==="mp")ctl=mpHTML(it,v);
      else if(p.tipo==="lq")ctl=lqHTML(it,v);
      else if(p.tipo==="as")ctl=asHTML(it,v);
      else ctl=`${it.rubrica?`<div class="small" style="border:1px dashed var(--line);border-radius:8px;padding:6px 9px;margin:0 0 6px;white-space:pre-wrap"><b>📏 Escala de calificación:</b><br>${esc(it.rubrica)}</div>`:""}<textarea data-resp="${it.id}" rows="6" placeholder="Escriba aquí su respuesta">${esc(v??"")}</textarea>`;
      return `<div class="item"><p class="q">${k+1}. ${nl(it.txt)} <span class="muted small">(${fmtPts(it.pts)} pts)</span></p>${appHTML(it,p)}${ctl}</div>`}).join("");
    return `<section class="parte"><h2>Parte ${pi+1}. ${esc(p.titulo)} <span class="muted small">(${fmtPts(p.items.reduce((s,i)=>s+(+i.pts||0),0))} pts)</span></h2><p class="muted" style="margin:0 0 6px"><i>${nl(p.instrucciones)}</i></p>${casoHTML(p)}${cuerpo}</section>`}).join("");
  document.querySelector("header.top").classList.add("hidden");
  $("#app").innerHTML=`<div class="barra" style="margin:-16px -16px 14px">${previa?`<span class="chip warn">👁 Vista previa: así lo ven los estudiantes. No se guarda nada.</span>`:""}<b style="margin-right:auto">${esc(titEst(ex))}</b><span id="prog" class="small muted"></span>${fin?`<span class="reloj" id="reloj"></span>`:""}<span id="estGuard" class="small muted"></span>
     ${previa?`<button onclick="salirPrevia()">← Salir</button>`:""}<button class="pri" id="entregar">${previa?"Revisar como entregado":"📤 Entregar examen"}</button></div>
    <div class="card">${encabezadoHTML(ex)}<p style="margin:8px 0 0"><b>Instrucciones generales:</b><br>${nl(ex.instrucciones)}</p></div>
    <div class="card ${previa?"":"no-sel"}" id="cuerpo">${partesHTML}</div>
    <div class="row noprint" style="justify-content:flex-end;margin-bottom:40px"><button class="pri" id="entregar2">${previa?"Revisar como entregado":"📤 Entregar examen"}</button></div>`;
  const prog=()=>{const n=itemsDe(ex).length,r=itemsDe(ex).filter(({it})=>respondido(resp[it.id])).length;$("#prog").textContent=`${r} de ${n} respondidos`};prog();
  $$("[data-resp]").forEach(el=>{const h=()=>{const id=el.dataset.resp;
      if(el.type==="radio"){if(!el.checked)return;resp[id]=el.value;$$(`input[name="${el.name}"]`).forEach(x=>x.closest(".opc").classList.toggle("sel",x.checked))}else resp[id]=el.value;
      prog();if(!previa)programarGuardado()};el.addEventListener(el.tagName==="SELECT"||el.type==="radio"?"change":"input",h)});
  $$("[data-app]").forEach(x=>x.addEventListener("click",()=>{if(RUN)RUN.appHasta=Date.now()+4000}));
  // Machote de planilla y liquidación: guardan un objeto por ítem.
  $$("[data-mp]").forEach(el=>el.addEventListener("input",()=>{const [id,zona,a,b]=el.dataset.mp.split("|");const o=resp[id]=resp[id]&&typeof resp[id]==="object"?resp[id]:{h:{},a:{}};
    if(zona==="h"){o.h=o.h||{};(o.h[a]=o.h[a]||{})[b]=el.value}else{o.a=o.a||{};(o.a[a]=o.a[a]||{})[b]=el.value;
      let D=0,C=0;Object.values(o.a).forEach(x=>{D+=parseNum(x.d)||0;C+=parseNum(x.c)||0});const d=$(`[data-mpd="${id}"]`),c=$(`[data-mpc="${id}"]`);if(d)d.textContent=money(D);if(c)c.textContent=money(C)}
    prog();if(!previa)programarGuardado()}));
  $$("[data-mpr]").forEach(el=>el.addEventListener(el.tagName==="SELECT"?"change":"input",()=>{const [id,k,campo]=el.dataset.mpr.split("|");const o=resp[id]=resp[id]&&typeof resp[id]==="object"?resp[id]:{h:{},r:[]};o.r=o.r||[];
    while(o.r.length<=+k)o.r.push({});o.r[+k][campo]=el.value;let D=0,C=0;o.r.forEach(f=>{D+=parseNum(f.d)||0;C+=parseNum(f.c)||0});
    const d=$(`[data-mpd="${id}"]`),c=$(`[data-mpc="${id}"]`);if(d)d.textContent=money(D);if(c)c.textContent=money(C);prog();if(!previa)programarGuardado()}));
  itemsDe(ex).forEach(({p,it})=>{if(p.tipo==="as")ligarAs(it,resp,()=>{prog();if(!previa)programarGuardado()})});
  $$("[data-lq]").forEach(el=>el.addEventListener("input",()=>{const [id,k]=el.dataset.lq.split("|");const o=resp[id]=resp[id]&&typeof resp[id]==="object"?resp[id]:{};o[k]=el.value;prog();if(!previa)programarGuardado()}));
  if(!previa){document.addEventListener("contextmenu",bloq);document.addEventListener("copy",bloq);document.addEventListener("visibilitychange",salida)}
  const ent=()=>entregar();$("#entregar").onclick=ent;$("#entregar2").onclick=ent;
  if(fin){const tick=()=>{const ms=fin-Date.now(),el=$("#reloj");if(!el)return clearInterval(RUN.timer);
      if(ms<=0){clearInterval(RUN.timer);el.textContent="⏱ 0:00";if(!RUN.entregado){alert("⏱ Se terminó el tiempo. Su examen se entrega ahora con lo que respondió.");entregar(true)}return}
      const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;el.textContent="⏱ "+(h?h+":"+String(m).padStart(2,"0"):m)+":"+String(ss).padStart(2,"0");el.classList.toggle("poco",ms<5*60000)};
    tick();RUN.timer=setInterval(tick,1000)}
  window.scrollTo(0,0)}
const bloq=e=>{if(RUN&&!RUN.previa)e.preventDefault()};
function salida(){if(!RUN||RUN.previa||RUN.entregado||document.visibilityState!=="hidden")return;if(RUN.appHasta&&Date.now()<RUN.appHasta){RUN.apps=(RUN.apps||0)+1;return}RUN.salidas++;programarGuardado(true)}
let tGuard=null;
function programarGuardado(ya){if(!RUN||RUN.previa)return;try{localStorage.setItem("examen_"+RUN.t.id+"_"+EST_ID,JSON.stringify({t:Date.now(),r:RUN.resp}))}catch(e){}
  const e=$("#estGuard");if(e)e.textContent="Guardando…";clearTimeout(tGuard);tGuard=setTimeout(guardarAvance,ya?10:1200)}
async function guardarAvance(){if(!RUN||RUN.entregado)return;const r=await upsertSinConflicto("actividades_estudiante",{trabajo_id:RUN.t.id,estudiante_id:EST_ID},{respuestas:RUN.resp,intentos_salida:RUN.salidas,completado:false,actualizado_en:new Date().toISOString()});
  const e=$("#estGuard");if(e)e.textContent=r.error?"⚠️ Sin conexión: se guarda en este equipo":"✓ Guardado"}
async function entregar(forzado){if(!RUN||RUN.entregado)return;const {t,ex,resp,previa}=RUN;
  const sin=itemsDe(ex).filter(({it})=>!respondido(resp[it.id])).length;
  if(!forzado&&!confirm((sin?`Le faltan ${sin} ítem(s) por responder.\n\n`:"")+(previa?"¿Ver la revisión como si se hubiera entregado?":"¿Entregar el examen? Ya no podrá cambiar sus respuestas.")))return;
  const c=calificar(ex,resp,{}),tot=totalPts(ex);
  if(previa){RUN.entregado=true;clearInterval(RUN.timer);$("#app").innerHTML=`<div class="barra" style="margin:-16px -16px 14px"><span class="chip warn">👁 Vista previa</span><b style="margin-right:auto">${esc(titEst(ex))}</b><button onclick="salirPrevia()">← Salir</button></div>
     <div class="card"><h2>Resultado automático: ${fmtPts(c.total)} / ${fmtPts(tot)} pts${c.pend.length?` · ${c.pend.length} ítem(s) se califican a mano`:""}</h2>${revisionHTML(ex,resp,{})}</div>`;window.scrollTo(0,0);return}
  RUN.entregado=true;clearInterval(RUN.timer);clearTimeout(tGuard);
  const b=$("#entregar");if(b){b.disabled=true;b.textContent="Entregando…"}
  const dp={...(RUN.dp||{}),entregado_ts:new Date().toISOString(),puntos_obtenidos_total:c.total,puntos_totales:tot,por_calificar:c.pend.length,auto_entrega:!!forzado};
  const r=await upsertSinConflicto("actividades_estudiante",{trabajo_id:t.id,estudiante_id:EST_ID},{respuestas:resp,completado:true,puntaje:c.total,porcentaje:tot?Math.round(c.total/tot*1000)/10:0,intentos_salida:RUN.salidas,datos_prueba:dp,actualizado_en:new Date().toISOString()});
  if(r.error){RUN.entregado=false;if(b){b.disabled=false;b.textContent="📤 Entregar examen"}return alert("No se pudo entregar (revise la conexión) y vuelva a tocar «Entregar». Sus respuestas siguen guardadas en este equipo.\n\n"+r.error.message)}
  if(!c.pend.length)await registrarNota(ex,EST_ID,c.total);
  try{localStorage.removeItem("examen_"+t.id+"_"+EST_ID)}catch(e){}
  document.removeEventListener("visibilitychange",salida);document.querySelector("header.top").classList.remove("hidden");
  $("#app").innerHTML=`<div class="card"><h1>✅ Examen entregado</h1><p>${esc(titEst(ex))} · ${fmtFH(dp.entregado_ts)}</p>${ex.mostrar_resultados?`<h2>Resultado: ${fmtPts(c.total)} / ${fmtPts(tot)} pts</h2>${c.pend.length?'<p class="muted">Algunos ítems los califica su profe.</p>':""}`:'<p>Su profe le dará el resultado cuando lo revise.</p>'}<button onclick="location.hash='#/'">← Mis exámenes</button></div>`;window.scrollTo(0,0)}
window.salirPrevia=()=>{clearInterval(RUN&&RUN.timer);RUN=null;document.querySelector("header.top").classList.remove("hidden");location.hash="#/"};
iniciar();
</script>
