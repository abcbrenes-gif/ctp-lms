<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Exámenes · CTP Mercedes Norte</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js?v=20261030i"></script>
<script src="js/actividades.js?v=20261105e"></script>
<script src="js/bitacora.js?v=20261105g"></script>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#17202a;--mut:#5d6b78;--line:#d9e0e6;--pri:#0e6e5c;--pri2:#e3f3ef;--bad:#c0392b;--bad2:#fbeaea;--warn:#a66a00;--warn2:#fff4dc;--ok:#1e8449;--ok2:#e7f6ec;--sh:0 1px 3px rgba(0,0,0,.08),0 4px 14px rgba(0,0,0,.05)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11161b;--card:#1a2128;--tx:#e8edf1;--mut:#9aa8b4;--line:#2d3842;--pri:#38c2a3;--pri2:#173a33;--bad:#ff7b6b;--bad2:#3a1f1d;--warn:#f2b84b;--warn2:#3a2f17;--ok:#5fd38d;--ok2:#17331f;--sh:0 1px 3px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#11161b;--card:#1a2128;--tx:#e8edf1;--mut:#9aa8b4;--line:#2d3842;--pri:#38c2a3;--pri2:#173a33;--bad:#ff7b6b;--bad2:#3a1f1d;--warn:#f2b84b;--warn2:#3a2f17;--ok:#5fd38d;--ok2:#17331f;--sh:0 1px 3px rgba(0,0,0,.4)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 "Segoe UI",system-ui,Roboto,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
header.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
header.top .wrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px}
.brand{font-weight:800;margin-right:auto;display:flex;align-items:center;gap:8px}
.brand small{display:block;font-weight:500;color:var(--mut);font-size:.75rem}
h1,h2,h3{line-height:1.25;margin:0 0 8px}h1{font-size:1.5rem}h2{font-size:1.2rem}h3{font-size:1.05rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--sh);margin:0 0 14px}
.muted{color:var(--mut)}.small{font-size:.85rem}
button,.btn{font:inherit;font-weight:600;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:9px;padding:8px 14px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
button:hover{border-color:var(--pri)}
button.pri{background:var(--pri);border-color:var(--pri);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.pri{color:#06201a}}
button.danger{color:var(--bad);border-color:var(--bad)}
button.sm{padding:4px 10px;font-size:.85rem}
button:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.88rem}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%}
textarea{min-height:60px;resize:vertical}
input[type=checkbox],input[type=radio]{width:auto}
.chip{display:inline-block;font-size:.78rem;font-weight:700;padding:2px 9px;border-radius:999px;border:1px solid var(--line);background:var(--bg)}
.chip.ok{background:var(--ok2);color:var(--ok);border-color:transparent}.chip.warn{background:var(--warn2);color:var(--warn);border-color:transparent}.chip.bad{background:var(--bad2);color:var(--bad);border-color:transparent}.chip.pri{background:var(--pri2);color:var(--pri);border-color:transparent}
.tbl{overflow:auto}table{border-collapse:collapse;width:100%;font-size:.9rem}th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}th{background:var(--bg);font-size:.8rem;text-transform:uppercase;letter-spacing:.03em;color:var(--mut)}
td.r,th.r{text-align:right}
.parte{border-left:4px solid var(--pri);padding-left:12px;margin:18px 0}
.item{border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0;background:var(--card)}
.item .q{font-weight:600;margin:0 0 8px;white-space:pre-wrap}
.opc{display:flex;gap:10px;align-items:flex-start;padding:7px 9px;border:1px solid var(--line);border-radius:8px;margin:5px 0;cursor:pointer}
.opc:hover{border-color:var(--pri)}.opc input{margin-top:4px}
.opc.sel{border-color:var(--pri);background:var(--pri2)}
.ed-item{border:1px dashed var(--line);border-radius:10px;padding:10px;margin:8px 0}
.barra{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:2px solid var(--pri);padding:8px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.reloj{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.15rem}
.reloj.poco{color:var(--bad)}
.ok-t{color:var(--ok);font-weight:700}.bad-t{color:var(--bad);font-weight:700}
.aviso{border-radius:10px;padding:10px 12px;margin:0 0 12px;background:var(--warn2);color:var(--tx);border:1px solid var(--warn)}
.aviso.ok{background:var(--ok2);border-color:var(--ok)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--tx);width:min(900px,96vw);max-height:90vh;padding:0}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog .dh{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:8px}
dialog .db{padding:14px 16px}
.no-sel{user-select:none;-webkit-user-select:none}
.hidden{display:none!important}
@media (max-width:600px){.wrap{padding:12px}.card{padding:12px}}
@media print{header.top,.noprint{display:none!important}body{background:#fff;color:#000}.card{box-shadow:none;border:0}}
</style>
</head>
<body>
<header class="top noprint"><div class="wrap">
  <div class="brand">📝 <span>Exámenes<small>CTP Mercedes Norte · Contabilidad</small></span></div>
  <span id="quien" class="muted small"></span>
  <a class="btn" href="index.html">← Plataforma</a>
</div></header>
<main class="wrap" id="app"><p class="muted">Cargando…</p></main>
<dialog id="dlg"><div class="dh"><b id="dlgT" style="margin-right:auto"></b><button class="sm" id="dlgX">✕ Cerrar</button></div><div class="db" id="dlgB"></div></dialog>

<script>
"use strict";
// ═══════════════════════════════════════════════════════════════════
// Exámenes: el profe arma el examen (borrador), lo revisa como estudiante
// y después lo publica en la sección. Se califica con puntos reales y
// aporta su propio porcentaje en «Pruebas» (no es indicador: no lleva letra
// ni resultado de aprendizaje).
// Se guarda en trabajos_cotidianos (contenido_actividad.estrategia = "examen_modulo")
// y las respuestas en actividades_estudiante.
// ═══════════════════════════════════════════════════════════════════
const SES=(()=>{try{return JSON.parse(sessionStorage.getItem("ctp_lms_session_v2")||"null")}catch(e){return null}})();
const DOC=!!(SES&&SES.role&&SES.role!=="estudiante"),EST_ID=SES&&SES.role==="estudiante"?String(SES.id):null;
const ESTR="examen_modulo";
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nl=s=>esc(s).replace(/\n/g,"<br>");
const uid=()=>Math.random().toString(36).slice(2,10);
const clone=o=>JSON.parse(JSON.stringify(o));
const NF=new Intl.NumberFormat("es-CR",{maximumFractionDigits:2});
const fmtPts=n=>NF.format(Math.round((+n||0)*100)/100);
const fmtFH=iso=>{if(!iso)return"—";try{return new Date(iso).toLocaleString("es-CR",{weekday:"short",day:"numeric",month:"short",hour:"numeric",minute:"2-digit"})}catch(e){return iso}};
const aLocal=iso=>{if(!iso)return"";const d=new Date(iso);const p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`};
const deLocal=v=>v?new Date(v).toISOString():null;
const hoyISO=()=>{const d=new Date(),p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`};
function toast(t){const d=document.createElement("div");d.textContent=t;d.style.cssText="position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#17202a;color:#fff;padding:10px 16px;border-radius:10px;z-index:99;font-weight:600;box-shadow:0 4px 18px rgba(0,0,0,.3)";document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
const dlg=$("#dlg");$("#dlgX").onclick=()=>dlg.close();
function abrirDlg(t,html){$("#dlgT").textContent=t;$("#dlgB").innerHTML=html;if(!dlg.open)dlg.showModal()}

const TIPOS={
  sel:{ic:"🔘",n:"Selección única",ins:"Marque con una X la opción correcta."},
  fv:{ic:"✅",n:"Falso o verdadero",ins:"Escriba V si el enunciado es verdadero o F si es falso."},
  pareo:{ic:"🔗",n:"Pareo",ins:"Asocie cada enunciado de la columna A con la opción correcta de la columna B."},
  corta:{ic:"✏️",n:"Respuesta corta",ins:"Responda en forma breve."},
  num:{ic:"🔢",n:"Respuesta numérica (cálculo)",ins:"Realice el cálculo y escriba el resultado."},
  des:{ic:"📝",n:"Desarrollo (se califica a mano)",ins:"Resuelva en forma clara y ordenada."}
};
const nuevoItem=t=>({id:uid(),txt:"",pts:1,...(t==="sel"?{o:["","","",""],r:0}:t==="fv"?{r:true}:t==="pareo"?{a:"",b:""}:t==="corta"?{acepta:[""]}:t==="num"?{r:0,tol:0.01}:{guia:""})});
const nuevaParte=t=>({id:uid(),tipo:t,titulo:TIPOS[t].n,instrucciones:TIPOS[t].ins,items:[nuevoItem(t)],extras:[]});
const nuevoEx=()=>({materia_id:null,titulo:"",instrucciones:"Lea con atención cada parte. Trabaje en forma individual. Al terminar, presione «Entregar examen».",fecha:hoyISO(),inicio:null,cierre:null,duracion:80,peso:20,mezclar:true,mostrar_resultados:false,publicado:false,indicador_id:null,partes:[]});
const itemsDe=ex=>(ex.partes||[]).flatMap(p=>(p.items||[]).map(it=>({p,it})));
const totalPts=ex=>itemsDe(ex).reduce((s,{it})=>s+(+it.pts||0),0);

// ── Corrección automática ──
const norm=s=>String(s??"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^\w\s%]/g," ").replace(/\s+/g," ").trim();
function parseNum(v){let s=String(v??"").replace(/[₡$\s]/g,"").replace(/[^\d.,-]/g,"");if(!s)return NaN;
  const lc=s.lastIndexOf(","),lp=s.lastIndexOf(".");
  if(lc>-1&&lp>-1){if(lc>lp)s=s.replace(/\./g,"").replace(",",".");else s=s.replace(/,/g,"")}
  else if(lc>-1){s=/^-?\d{1,3}(,\d{3})+$/.test(s)?s.replace(/,/g,""):s.replace(",",".")}
  else if(lp>-1&&/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,"");
  return Number(s)}
const respondido=v=>!(v===undefined||v===null||String(v).trim()==="");
// Devuelve los puntos automáticos de un ítem, o null si se califica a mano.
function autoItem(p,it,v){const pts=+it.pts||0;
  if(!respondido(v))return 0;
  if(p.tipo==="des")return null;
  if(p.tipo==="sel")return +v===+it.r?pts:0;
  if(p.tipo==="fv")return (v==="V")===!!it.r?pts:0;
  if(p.tipo==="pareo")return v===it.id?pts:0;
  if(p.tipo==="num"){const n=parseNum(v);return !isNaN(n)&&Math.abs(n-(+it.r||0))<=Math.max(+it.tol||0,0.005)?pts:0}
  if(p.tipo==="corta"){const a=norm(v);return (it.acepta||[]).some(x=>norm(x)&&norm(x)===a)?pts:null} // si no coincide, lo revisa el profe
  return 0}
function calificar(ex,resp,manual){const auto={},pend=[];let tot=0;
  for(const {p,it} of itemsDe(ex)){const m=manual&&manual[it.id];
    const a=autoItem(p,it,resp[it.id]);auto[it.id]=a;
    const v=m!==undefined&&m!==null&&m!==""?+m:a;
    if(v===null){pend.push(it.id);continue}tot+=v}
  return {auto,pend,total:Math.round(tot*100)/100}}
const verResp=(p,it,v)=>{if(!respondido(v))return '<span class="muted">(sin responder)</span>';
  if(p.tipo==="sel")return esc(it.o[+v]??"—");if(p.tipo==="fv")return v==="V"?"Verdadero":"Falso";
  if(p.tipo==="pareo"){const b=p.items.find(x=>x.id===v);return esc(b?b.b:(p.extras||[])[+String(v).replace("x","")]??"—")}
  return nl(v)};
const verCorrecta=(p,it)=>p.tipo==="sel"?esc(it.o[it.r]):p.tipo==="fv"?(it.r?"Verdadero":"Falso"):p.tipo==="pareo"?esc(it.b):p.tipo==="num"?fmtPts(it.r)+(+it.tol?` <small class="muted">(± ${fmtPts(it.tol)})</small>`:""):p.tipo==="corta"?(it.acepta||[]).filter(Boolean).map(esc).join(" · "):(it.guia?nl(it.guia):'<span class="muted">Se califica a mano</span>');

// ── Orden mezclado (el mismo para cada estudiante en cada intento) ──
function rng(seed){let h=1779033703^seed.length;for(let i=0;i<seed.length;i++){h=Math.imul(h^seed.charCodeAt(i),3432918353);h=h<<13|h>>>19}
  return()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return((h^=h>>>16)>>>0)/4294967296}}
function mezclar(arr,r){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

// ── Datos ──
const S={mats:[],exs:[]};
async function cargarMaterias(){
  if(DOC){const {data}=await sb.from("materias").select("*").order("nombre");S.mats=data||[]}
  else if(EST_ID){const {data:em}=await sb.from("estudiante_materias").select("materia_id").eq("estudiante_id",EST_ID);const ids=(em||[]).map(x=>x.materia_id);
    const {data}=ids.length?await sb.from("materias").select("*").in("id",ids):{data:[]};S.mats=data||[]}}
const nomMat=id=>{const m=S.mats.find(x=>+x.id===+id);return m?String(m.nombre||"").trim()+(m.seccion?" · "+m.seccion:""):"(sin sección)"};
async function cargarExamenes(){const {data,error}=await sb.from("trabajos_cotidianos").select("id,titulo,fecha,habilitado,indicador_id,contenido_actividad").eq("contenido_actividad->>estrategia",ESTR).order("id",{ascending:false});
  if(error)throw error;S.exs=(data||[]).map(t=>({...t,ex:{...nuevoEx(),...((t.contenido_actividad||{}).ex||{})}}));return S.exs}
async function guardarExamen(t){const ex=t.ex;const fila={titulo:ex.titulo||"Examen",fecha:ex.fecha||hoyISO(),habilitado:!!ex.publicado,tipo_actividad:"rubrica_directa",contenido_actividad:{...(t.contenido_actividad||{}),estrategia:ESTR,ex}};
  if(ex.indicador_id)fila.indicador_id=ex.indicador_id;
  if(t.id){const {error}=await sb.from("trabajos_cotidianos").update(fila).eq("id",t.id);if(error)throw error}
  else{const {data,error}=await sb.from("trabajos_cotidianos").insert(fila).select("id").maybeSingle();if(error)throw error;t.id=data.id}
  // Mantiene al día el total de puntos y el porcentaje de su registro en «Pruebas».
  if(ex.indicador_id)await sb.from("indicadores").update({descripcion:ex.titulo,puntaje_maximo:totalPts(ex),peso_prueba:+ex.peso||0,fecha_evaluacion:ex.fecha}).eq("id",ex.indicador_id);
  return t}

// ── Arranque ──
async function iniciar(){
  if(!SES){$("#app").innerHTML=`<div class="card"><h2>Inicie sesión en la plataforma</h2><p>Para entrar a los exámenes, primero ingrese a la plataforma con su usuario y vuelva a abrir <b>📝 Exámenes</b> desde ahí.</p><a class="btn" href="index.html">Ir a la plataforma</a></div>`;return}
  $("#quien").textContent=DOC?"👩‍🏫 Profesor":"👤 "+(SES.nombre||EST_ID);
  try{if(typeof bitacoraRegistrar==="function")bitacoraRegistrar("examenes")}catch(e){}
  await cargarMaterias();window.addEventListener("hashchange",ruta);ruta()}
async function ruta(){const h=location.hash.replace(/^#\/?/,"").split("/");
  if(RUN&&!RUN.entregado&&!RUN.previa&&h[0]!=="hacer")guardarAvance();
  if(RUN){clearInterval(RUN.timer);RUN=null}document.removeEventListener("visibilitychange",salida);document.querySelector("header.top").classList.remove("hidden");
  try{
    if(DOC){if(h[0]==="nuevo")return editor(null);if(h[0]==="editar")return editor(+h[1]);if(h[0]==="previa")return previa(+h[1]);if(h[0]==="resultados")return resultados(+h[1]);return listaProfe()}
    if(h[0]==="hacer")return hacer(+h[1]);return listaEst()
  }catch(e){console.error(e);$("#app").innerHTML=`<div class="card"><b>No se pudo cargar.</b><p class="muted">${esc(e.message||e)}</p><button onclick="location.reload()">Reintentar</button></div>`}}

// ═══════════════════ PROFESOR ═══════════════════
async function listaProfe(){$("#app").innerHTML='<p class="muted">Cargando exámenes…</p>';await cargarExamenes();
  const ids=S.exs.map(t=>t.id);const {data:ae}=ids.length?await sb.from("actividades_estudiante").select("trabajo_id,completado").in("trabajo_id",ids):{data:[]};
  const cnt={};(ae||[]).forEach(a=>{cnt[a.trabajo_id]=cnt[a.trabajo_id]||{e:0,c:0};cnt[a.trabajo_id][a.completado?"e":"c"]++});
  $("#app").innerHTML=`<div class="row" style="margin:4px 0 14px"><div style="margin-right:auto"><h1>📝 Exámenes</h1><p class="muted" style="margin:0">Arme el examen como borrador, revíselo como estudiante y publíquelo cuando esté listo.</p></div><button class="pri" onclick="location.hash='#/nuevo'">＋ Nuevo examen</button></div>
  ${S.exs.length?S.exs.map(t=>{const ex=t.ex,c=cnt[t.id]||{e:0,c:0},n=itemsDe(ex).length;
    return `<div class="card"><div class="row" style="align-items:flex-start"><div style="margin-right:auto;min-width:220px">
      <h2 style="margin:0 0 4px">${esc(ex.titulo||"(sin título)")}</h2>
      <div class="row small"><span class="chip ${ex.publicado?"ok":"warn"}">${ex.publicado?"📢 Publicado":"✏️ Borrador (los estudiantes no lo ven)"}</span><span class="chip">${esc(nomMat(ex.materia_id))}</span><span class="chip">${n} ítems · ${fmtPts(totalPts(ex))} pts</span><span class="chip">${fmtPts(ex.peso)} %</span></div>
      <p class="small muted" style="margin:6px 0 0">Inicia: ${fmtFH(ex.inicio)}${ex.cierre?" · Cierra: "+fmtFH(ex.cierre):""}${ex.duracion?" · "+ex.duracion+" min":""}${ex.publicado||c.e||c.c?` · <b>${c.e}</b> entregados${c.c?`, ${c.c} en curso`:""}`:""}</p></div>
      <div class="row"><button onclick="location.hash='#/editar/${t.id}'">✏️ Editar</button><button onclick="location.hash='#/previa/${t.id}'">👁 Ver como estudiante</button><button onclick="location.hash='#/resultados/${t.id}'">📊 Resultados</button>
      <button class="${ex.publicado?"":"pri"}" data-pub="${t.id}">${ex.publicado?"🙈 Ocultar":"📢 Publicar"}</button><button data-print="${t.id}">🖨️ Imprimir</button><button data-dup="${t.id}">⧉ Duplicar</button>${!ex.publicado&&!ex.indicador_id&&!(c.e||c.c)?`<button class="danger" data-del="${t.id}">🗑</button>`:""}</div></div></div>`}).join(""):`<div class="card"><p>Todavía no hay exámenes. Toque <b>＋ Nuevo examen</b> para armar el primero.</p></div>`}`;
  $$("[data-pub]").forEach(b=>b.onclick=()=>publicar(S.exs.find(t=>t.id===+b.dataset.pub),b));
  $$("[data-print]").forEach(b=>b.onclick=()=>imprimir(S.exs.find(t=>t.id===+b.dataset.print)));
  $$("[data-dup]").forEach(b=>b.onclick=async()=>{const t=S.exs.find(x=>x.id===+b.dataset.dup);const ex=clone(t.ex);ex.titulo+=" (copia)";ex.publicado=false;ex.indicador_id=null;
    const sel=prompt("¿Para qué sección es la copia?\n"+S.mats.map((m,i)=>`${i+1}. ${nomMat(m.id)}`).join("\n"),"1");if(sel===null)return;const m=S.mats[(+sel||1)-1];if(m)ex.materia_id=m.id;
    try{await guardarExamen({ex});toast("Copia creada como borrador");listaProfe()}catch(e){alert("No se pudo: "+e.message)}});
  $$("[data-del]").forEach(b=>b.onclick=async()=>{if(!confirm("¿Borrar este borrador? No tiene entregas ni notas."))return;await sb.from("trabajos_cotidianos").delete().eq("id",+b.dataset.del);listaProfe()})}

function validar(ex){const e=[];if(!ex.titulo.trim())e.push("Falta el título.");if(!ex.materia_id)e.push("Falta la sección.");if(!ex.inicio)e.push("Falta la fecha y hora de inicio.");if(!(+ex.peso>0))e.push("Falta el porcentaje de la prueba.");
  const its=itemsDe(ex);if(!its.length)e.push("El examen no tiene preguntas.");
  its.forEach(({p,it},i)=>{const n=`Parte «${p.titulo}», ítem ${p.items.indexOf(it)+1}`;
    if(!(+it.pts>0))e.push(n+": falta el puntaje.");
    if(p.tipo==="pareo"){if(!it.a.trim()||!it.b.trim())e.push(n+": falta la columna A o la B.")}else if(!String(it.txt||"").trim())e.push(n+": falta el enunciado.");
    if(p.tipo==="sel"&&(it.o.filter(o=>o.trim()).length<2||!String(it.o[it.r]||"").trim()))e.push(n+": revise las opciones y la correcta.");
    if(p.tipo==="corta"&&!(it.acepta||[]).some(x=>x.trim()))e.push(n+": escriba al menos una respuesta aceptada.");});
  return e}

  const er=validar(ex);if(er.length)return alert("Antes de publicar, corrija:\n\n• "+er.join("\n• "));
  if(!confirm(`¿Publicar «${ex.titulo}» en ${nomMat(ex.materia_id)}?\n\n• ${itemsDe(ex).length} ítems · ${fmtPts(totalPts(ex))} puntos · ${fmtPts(ex.peso)} %\n• Inicia: ${fmtFH(ex.inicio)}${ex.cierre?"\n• Cierra: "+fmtFH(ex.cierre):""}\n\nSe registra en «Pruebas» con sus puntos reales.`))return;

      const base={materia_id:ex.materia_id,categoria:"Pruebas",descripcion:ex.titulo,puntaje_maximo:totalPts(ex),fecha_evaluacion:ex.fecha,peso_prueba:+ex.peso||0,orden:((o&&o[0]&&o[0].orden)||0)+1,resultado_id:null};
      let r=await sb.from("indicadores").insert({...base,letra:""}).select("id").maybeSingle();

    ex.publicado=true;ex.publicado_el=new Date().toISOString();await guardarExamen(t);toast("📢 Examen publicado");listaProfe()}
  catch(e){btn.disabled=false;alert("No se pudo publicar: "+(e.message||e))}}

  try{localStorage.removeItem("examen_"+t.id+"_"+EST_ID)}catch(e){}
  document.removeEventListener("visibilitychange",salida);document.querySelector("header.top").classList.remove("hidden");
  $("#app").innerHTML=`<div class="card"><h1>✅ Examen entregado</h1><p>${esc(ex.titulo)} · ${fmtFH(dp.entregado_ts)}</p>${ex.mostrar_resultados?`<h2>Resultado: ${fmtPts(c.total)} / ${fmtPts(tot)} pts</h2>${c.pend.length?'<p class="muted">Algunos ítems los califica su profe.</p>':""}`:'<p>Su profe le dará el resultado cuando lo revise.</p>'}<button onclick="location.hash='#/'">← Mis exámenes</button></div>`;window.scrollTo(0,0)}
window.salirPrevia=()=>{clearInterval(RUN&&RUN.timer);RUN=null;document.querySelector("header.top").classList.remove("hidden");location.hash="#/"};
iniciar();
</script>
