function caso(p){const c={...liqCasoVacio(),tiempoModo:"fechas",salarioModo:"mensual",...p.c};
  c.salarios=liqMeses12(c.fechaSalida).map(mes=>({mes,extra:(p.c.extras||{})[mes]||0,incap:false}));return c}
// Pasos (respuestas) de cada práctica: [{k, et, tipo, ok, ayuda, grupo}]
function pasosDe(p){
  const L=[];
  if(p.tipo==="pl"){
    const M=plArmarMachote(p.emps);p._M=M;
    M.emps.forEach((e,i)=>M.campos.forEach(([k,et])=>L.push({k:"e"+i+"_"+k,et,tipo:"monto",ok:e.sol[k],grupo:e.nombre})));
    if(p.asiento) M.asiento.forEach((a,i)=>L.push({k:"as"+i,et:a.code+" "+a.name+(a.d?" · Debe":" · Haber"),tipo:"monto",ok:a.d||a.c,grupo:"Asiento de diario de la planilla"}));
  }else if(p.tipo==="cc"){
    const R=CONV_CALC.cajaChica(p.ops);
    R.asientos.forEach((as,i)=>as.lineas.forEach((l,j)=>L.push({k:`a${i}_${j}`,et:l[0]+(l[1]?" · Debe":" · Haber"),tipo:"monto",ok:l[1]||l[2],grupo:`${as.f} · ${as.n}`})));
    R.revisiones.forEach((r,i)=>{L.push({k:`r${i}t`,et:"Gastos + vales + efectivo",tipo:"monto",ok:r.total,grupo:`Revisión del ${r.f} (fondo de ${col(r.fondo)})`});
      L.push({k:`r${i}d`,et:"Faltante o sobrante (escriba 0 si el fondo está completo)",tipo:"monto",ok:Math.abs(r.dif),grupo:`Revisión del ${r.f} (fondo de ${col(r.fondo)})`})});
  }else if(p.tipo==="cb"){
    if(p.asientosCb) p.asientos.forEach((as,i)=>as.l.forEach((l,j)=>L.push({k:`a${i}_${j}`,et:l[0]+(l[1]?" · Debe":" · Haber"),tipo:"monto",ok:l[1]||l[2],grupo:`Asiento ${i+1}`})));
    else{const R=CONV_CALC.conciliacion(p.c);
      L.push({k:"subB",et:"Subtotal (saldo del banco + lo que se suma)",tipo:"monto",ok:R.subB,grupo:"Partiendo del saldo del banco"},{k:"realB",et:"Saldo real disponible en bancos",tipo:"monto",ok:R.realB,grupo:"Partiendo del saldo del banco"},
        {k:"subL",et:"Subtotal (saldo en libros + lo que se suma)",tipo:"monto",ok:R.subL,grupo:"Partiendo del saldo en libros"},{k:"realL",et:"Saldo real disponible en libros",tipo:"monto",ok:R.realL,grupo:"Partiendo del saldo en libros"});}
  }else if(p.tipo==="inv"){
    const R=CONV_CALC.kardex(MOVS_TUCAN,p.metodo);p._K=R;
    if(p.metodo==="PP") R.filas.forEach((f,i)=>{if(f.ent)L.push({k:"cu"+i,et:`Costo unitario promedio después de la compra del ${f.f}`,tipo:"cu",ok:CONV_CALC.r2(f.capas[0].c),grupo:"Costo promedio"})});
    R.ventas.forEach((v,i)=>L.push({k:"v"+i,et:`Costo de la salida del ${v.f} (${v.u} unidades)`,tipo:"monto",ok:v.costo,grupo:"Costo de las salidas"}));
    L.push({k:"cv",et:"Costo total de las salidas del mes",tipo:"monto",ok:R.costoVentas,grupo:"Resultados"},{k:"uf",et:"Unidades en existencia al 31 de marzo",tipo:"unid",ok:R.uFin,grupo:"Resultados"},{k:"vf",et:"Valor del inventario final",tipo:"monto",ok:R.vFin,grupo:"Resultados"});
  }else{
    const R=liqCalcularCaso(caso(p));p._R=R;const P=liqPasosPractica(R);
    [["salario","Salario"],["preaviso","Preaviso"],["cesantia","Cesantía"],["vacaciones","Vacaciones"],["aguinaldo","Aguinaldo"]].forEach(([s,g])=>P[s].forEach(x=>L.push({...x,grupo:g})));
    L.push({k:"total",et:"Total de la liquidación",tipo:"monto",ok:R.total,grupo:"Total"});
    if(p.asiento){const A=liqAsientoDe(R,{provisiones:true});A.lineas.forEach((l,i)=>L.push({k:"as"+i,et:l.cod+" "+l.cuenta+(l.debe?" · Debe":" · Haber"),tipo:"monto",ok:l.debe||l.haber,grupo:"Asiento de diario (la empresa tenía provisiones)"}))}
  }
  return L;
}
function enunciado(p){
  if(p.tipo==="cc"||p.tipo==="cb"){let h=p.texto.map(t=>`<p>${esc(t)}</p>`).join("");
    if(p.gastos)h+=`<div class="dato"><b>Facturas presentadas</b><table style="margin-top:6px">${Object.entries(p.gastos).map(([k,v])=>`<tr><td>${esc(k)}</td><td style="text-align:right">${col(v)}</td></tr>`).join("")}</table></div>`;
    if(p.lista)h+=`<div class="dato"><ol style="margin:0;padding-left:1.2rem">${p.lista.map(t=>`<li>${esc(t)}</li>`).join("")}</ol></div>`;
    return h+`<p class="mut">Escriba los montos con dos decimales (puede usar coma o punto). ${p.tipo==="cc"?"Los gastos van todos juntos en Gastos Administrativos.":""}</p>`}
  if(p.tipo==="inv")return `<p>Ferretería El Tucán lleva su inventario de un producto con el sistema perpetuo. Estos fueron los movimientos de marzo. Valúe el inventario por <b>${{PEPS:"PEPS (primeras entradas, primeras salidas)",UEPS:"UEPS (últimas entradas, primeras salidas)",PP:"Promedio Ponderado"}[p.metodo]}</b>.</p>
    <div class="dato"><table><tr><th>Fecha</th><th>Movimiento</th><th style="text-align:right">Unidades</th><th style="text-align:right">Costo unitario</th></tr>${MOVS_TUCAN.map(m=>`<tr><td>${m.f}</td><td>${m.tipo==="E"?"Compra":"Venta"}</td><td style="text-align:right">${m.u}</td><td style="text-align:right">${m.c?col(m.c):"—"}</td></tr>`).join("")}</table></div>
    <p class="mut">Le conviene armar el cuadro (fecha, entradas, salidas, existencias, costo unitario y saldo) en su cuaderno o en una hoja de cálculo y luego escribir aquí los resultados.${p.metodo==="PP"?" Redondee el costo promedio a dos decimales.":""}</p>`;
  if(p.tipo==="pl"){const M=p._M;
    return `<p>${esc(p.intro)}</p>`+M.emps.map(e=>`<div class="dato"><b>${esc(e.nombre)}</b><br>${esc(e.datos)}</div>`).join("")+
      `<p class="mut">Jornada diurna y pago mensual si no se dice otra cosa. Escriba los montos con dos decimales (puede usar coma o punto).</p>`}
  const c=p.c,R=p._R;
  let ext="";if(c.salarioModo==="meses"){ext=`<br>Salario ordinario de ${col(c.salarioMensual)} por mes. Además ganó horas extra: `+Object.entries(c.extras).map(([m,v])=>liqMesNombre(m)+" "+col(v)).join(", ")+". Use los últimos 6 meses para el promedio."}
  const pre={no:"no trabajó el preaviso",completo:"trabajó el preaviso completo",parcial:`trabajó ${c.preavisoDias} días de preaviso`}[c.preavisoEstado];
  return `<div class="dato"><b>${esc(c.trabajador)}</b><br>Ingresó el ${fechaL(c.fechaIngreso)} y salió el ${fechaL(c.fechaSalida)}.<br>Motivo: <b>${esc(MOT[c.motivo])}</b>; ${pre}.<br>`+
    (c.salarioModo==="meses"?"":`Salario mensual: ${col(c.salarioMensual)}.`)+ext+`<br>Vacaciones disfrutadas en total durante la relación laboral: ${c.vacDisfrutadasTotal} días.</div>`+
    `<p class="mut">Tiempo laborado: ${R.antiguedad.anios} año(s), ${R.antiguedad.meses} mes(es) y ${R.antiguedad.dias} día(s). Si un rubro no corresponde, escriba 0.</p>`;
}
function revisar(paso,v){const n=liqNumero(v);if(n===null)return null;const tol=paso.tipo==="dias"||paso.tipo==="unid"?0.011:paso.tipo==="cu"?0.02:Math.max(1,Math.abs(paso.ok)*0.0005);return Math.abs(n-paso.ok)<=tol}

// ───────── Datos guardados ─────────
let EST=null,GUARD={};
async function cargar(id){const {data}=await sb.from("convocatoria_practicas").select("*").eq("estudiante_id",id);GUARD={};(data||[]).forEach(r=>GUARD[r.practica]=r)}
async function guardar(n,resp,ac,tot){const prev=GUARD[n];const fila={estudiante_id:EST,practica:n,respuestas:resp,aciertos:ac,total:tot,intentos:(prev?.intentos||0)+1,actualizado:new Date().toISOString()};
  const {error}=await sb.from("convocatoria_practicas").upsert(fila,{onConflict:"estudiante_id,practica"});if(!error)GUARD[n]=fila;return !error}

// ───────── Pantallas ─────────
async function inicio(){
  if(!SES){app.innerHTML='<section class="card"><h2>Entre primero a la plataforma</h2><a class="btn" href="/">Ir a la plataforma</a></section>';return}
  if(SES.role==="docente") return vistaDocente();
  if(!CONVOCADOS[SES.id]){app.innerHTML='<section class="card"><h2>Este apartado no está asignado a su usuario</h2><a class="btn sec" href="/">← Volver</a></section>';return}
  EST=SES.id;await cargar(EST);lista();
}
function lista(){
  const hechas=PRACTICAS.filter(p=>GUARD[p.n]).length;
  app.innerHTML=`<section class="card"><h2>Hola, ${esc(CONVOCADOS[EST]||"profe (vista de estudiante)")}</h2>
   <p>Estas ${PRACTICAS.length} prácticas le preparan para la convocatoria. Cada una se revisa sola: escriba sus respuestas y toque <b>Revisar</b>. Puede intentarlo las veces que quiera; queda guardado su mejor resultado.</p>
   <p class="mut">Avance: ${hechas} de ${PRACTICAS.length} prácticas revisadas.</p>${SES.role==="docente"?'<button class="btn sec" id="vd">← Volver al resumen del profe</button>':'<a class="btn sec" href="/">← Volver a la plataforma</a>'}</section>
   <div class="grid">${PRACTICAS.map(p=>{const g=GUARD[p.n];const t=g?`<span class="tag ${g.aciertos===g.total?"ok":"wa"}">${g.aciertos}/${g.total}</span>`:'<span class="tag">Pendiente</span>';
    return `<button class="pr" data-n="${p.n}"><span class="mut">Práctica ${p.n}</span><b>${esc(p.tit)}</b><span class="mut">${esc(p.tema)}</span><br>${t}</button>`}).join("")}</div>`;
  app.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>abrir(+b.dataset.n));
  const vd=document.getElementById("vd");if(vd)vd.onclick=vistaDocente;
  scrollTo(0,0);
}
function abrir(n){
  const p=PRACTICAS.find(x=>x.n===n),L=pasosDe(p),prev=(GUARD[n]||{}).respuestas||{};
  let g="",h="";
  L.forEach(x=>{if(x.grupo!==g){g=x.grupo;h+=`<h3>${esc(g)}</h3>`}
    h+=`<div class="paso" id="ps_${x.k}"><label for="in_${x.k}">${esc(x.et)}</label><input id="in_${x.k}" inputmode="decimal" autocomplete="off" value="${esc(prev[x.k]??"")}"><span id="mk_${x.k}"></span>`+
       (x.ayuda?`<div class="ayuda">💡 ${esc(x.ayuda)}</div>`:"")+`<div class="sol" id="sl_${x.k}" ${SES.role==="docente"?"":"hidden"}>Respuesta: ${x.tipo==="dias"?num(x.ok)+" días":x.tipo==="unid"?num(x.ok)+" unidades":col(x.ok)}</div></div>`});
  app.innerHTML=`<section class="card"><span class="mut">Práctica ${p.n} de ${PRACTICAS.length} · ${esc(p.tema)}</span><h2>${esc(p.tit)}</h2>${enunciado(p)}
   <div class="recuerde"><b>Recuerde:</b> ${RECUERDE[p.tipo]}</div>${SES.role==="docente"?'<p class="mut" style="color:#1f8a4c">👁 Como docente ve la respuesta debajo de cada casilla.</p>':""}</section>
   <section class="card">${h}<div id="res"></div>
   <button class="btn" id="rv">✅ Revisar</button><button class="btn sec" id="vs" hidden>👁 Ver respuestas</button><button class="btn sec" id="vl">← Volver a la lista</button></section>`;
  document.getElementById("vl").onclick=lista;
  document.getElementById("vs").onclick=()=>L.forEach(x=>document.getElementById("sl_"+x.k).hidden=false);
  document.getElementById("rv").onclick=async()=>{
    let ac=0;const resp={};
    L.forEach(x=>{const v=document.getElementById("in_"+x.k).value;resp[x.k]=v;const r=revisar(x,v);const d=document.getElementById("ps_"+x.k);
      d.classList.toggle("bien",r===true);d.classList.toggle("mal",r!==true);document.getElementById("mk_"+x.k).textContent=r===true?"✔️":"❌";if(r===true)ac++});
    const ok=SES.role==="docente"?true:await guardar(n,resp,ac,L.length);
    const res=document.getElementById("res");
    res.innerHTML=`<div class="res ${ac===L.length?"ok":"wa"}">${ac===L.length?"🎉 ¡Excelente! Todo correcto.":`Tiene ${ac} de ${L.length} correctas. Corrija las que están en rojo y vuelva a revisar.`}${ok?"":" (No se pudo guardar; revise su conexión.)"}</div>`;
    document.getElementById("vs").hidden=false;
  };
  scrollTo(0,0);
}
async function vistaDocente(){
  const {data}=await sb.from("convocatoria_practicas").select("*");const T={};(data||[]).forEach(r=>{(T[r.estudiante_id]=T[r.estudiante_id]||{})[r.practica]=r});
  app.innerHTML=`<section class="card"><h2>Resumen del profe</h2><p class="mut">Aciertos de cada estudiante en cada práctica (la última vez que tocó Revisar). Las prácticas 1 a 10 usan los mismos cálculos de Aula Contable y de Liquidaciones; de la 11 a la 17 son de caja chica, conciliación bancaria e inventarios.</p>
   <div style="overflow-x:auto"><table><thead><tr><th>Estudiante</th>${PRACTICAS.map(p=>`<th class="n">P${p.n}</th>`).join("")}</tr></thead><tbody>
   ${Object.entries(CONVOCADOS).map(([id,nom])=>`<tr><td>${esc(nom)}</td>${PRACTICAS.map(p=>{const r=(T[id]||{})[p.n];return `<td class="n" title="${r?"Intentos: "+r.intentos:""}">${r?r.aciertos+"/"+r.total:"—"}</td>`}).join("")}</tr>`).join("")}
   </tbody></table></div>
   <button class="btn" id="ve">👀 Ver las prácticas con sus respuestas</button><a class="btn sec" href="solucionario-folleto.html">📘 Solucionario del folleto (caja chica e inventarios)</a><a class="btn sec" href="/">← Volver a la plataforma</a></section>`;
  document.getElementById("ve").onclick=()=>{EST="docente";GUARD={};lista()};
}
inicio();
</script>
</body>
</html>
