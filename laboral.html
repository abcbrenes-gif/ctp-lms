<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ruta Laboral CR · Juego de derechos laborales</title>
<!-- Conexión con la plataforma (si el archivo se abre suelto, el juego funciona igual sin esto). -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js?v=20261030i" onerror="void 0"></script>

<style>
:root{
  --bg:#0d0f1f;--bg2:#14173a;--card:#1a1e44;--card2:#20255a;--line:rgba(255,255,255,.09);
  --tx:#eef0ff;--mut:#a3a9d6;--pink:#ff8fd8;--cyan:#7af0ff;--lila:#b9a2ff;--mint:#7dffc4;--amber:#ffd27a;--red:#ff7a8f;
  --sh1:8px 8px 22px rgba(0,0,0,.45),-6px -6px 18px rgba(120,110,255,.06);--r:22px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:16px/1.5 "Segoe UI",system-ui,Roboto,"Helvetica Neue",sans-serif;overflow-x:hidden}
body:before{content:"";position:fixed;inset:-20%;z-index:-1;background:radial-gradient(600px 400px at 15% 10%,rgba(255,143,216,.18),transparent 70%),radial-gradient(700px 500px at 85% 20%,rgba(122,240,255,.14),transparent 70%),radial-gradient(600px 500px at 50% 100%,rgba(185,162,255,.16),transparent 70%);animation:flota 18s ease-in-out infinite alternate}
@keyframes flota{to{transform:translate(2%,-3%) rotate(3deg)}}
button{font:inherit;cursor:pointer;border:0;border-radius:16px;padding:12px 18px;font-weight:800;color:#120f2a;background:linear-gradient(135deg,var(--cyan),var(--lila));box-shadow:0 6px 18px rgba(122,240,255,.25);transition:transform .15s,box-shadow .15s,filter .15s}
button:hover{transform:translateY(-2px);filter:brightness(1.05)}
button:active{transform:translateY(1px)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
button:disabled{opacity:.4;cursor:not-allowed;transform:none}
button.sec{background:var(--card2);color:var(--tx);box-shadow:var(--sh1);border:1px solid var(--line)}
button.pink{background:linear-gradient(135deg,var(--pink),var(--lila))}
button.ok{background:linear-gradient(135deg,var(--mint),var(--cyan))}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.hidden{display:none!important}
/* barra superior */
.top{position:sticky;top:0;z-index:30;background:rgba(13,15,31,.75);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;font-weight:900;letter-spacing:.02em}
.logo{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-size:1.3rem;background:linear-gradient(135deg,var(--pink),var(--cyan));box-shadow:0 0 18px rgba(255,143,216,.4)}
.brand small{display:block;font-weight:600;color:var(--mut);font-size:.72rem}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:800;box-shadow:var(--sh1)}
.xpbar{width:120px;height:9px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden}
.xpbar>span{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--cyan));transition:width .6s}
.ib{padding:8px 11px;border-radius:12px;font-size:1.05rem}
.ib[aria-pressed="false"]{opacity:.55}
/* tarjetas */
.card{background:linear-gradient(160deg,rgba(32,37,90,.9),rgba(22,25,60,.9));border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh1);padding:20px}
h1{font-size:clamp(1.6rem,4vw,2.4rem);margin:8px 0 4px;background:linear-gradient(90deg,var(--pink),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mut);margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.mis{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:10px;transition:transform .2s}
.mis:hover:not(.lock){transform:translateY(-4px)}
.mis .ic{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-size:1.8rem;background:rgba(255,255,255,.06);box-shadow:inset 3px 3px 8px rgba(0,0,0,.35),inset -3px -3px 8px rgba(255,255,255,.05)}
.mis h3{margin:0;font-size:1.08rem}.mis p{margin:0;color:var(--mut);font-size:.9rem}
.mis.lock{opacity:.5}.mis.done{border-color:rgba(125,255,196,.45)}
.prog{height:10px;border-radius:10px;background:rgba(255,255,255,.07);overflow:hidden}
.prog>span{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--cyan));transition:width .6s}
.medals{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.medal{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:.88rem}
.medal.off{opacity:.35;filter:grayscale(1)}
.medal b{font-size:1.3rem}
/* escena */
.scene{display:grid;grid-template-columns:200px minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:760px){.scene{grid-template-columns:1fr}}
.avatar{text-align:center}
.avatar .face{width:150px;height:150px;margin:0 auto;border-radius:40px;display:grid;place-items:center;font-size:5rem;background:linear-gradient(145deg,#262c6b,#171a45);box-shadow:var(--sh1),0 0 30px rgba(185,162,255,.25);animation:respira 4s ease-in-out infinite}
@media(max-width:760px){.avatar{display:flex;align-items:center;gap:12px;text-align:left}.avatar .face{width:72px;height:72px;font-size:2.4rem;border-radius:22px;margin:0}}
@keyframes respira{50%{transform:translateY(-4px)}}
.avatar b{display:block;margin-top:10px}.avatar small{color:var(--mut)}
.bubble{position:relative}
.stepbar{display:flex;gap:6px;margin-bottom:12px}.stepbar i{flex:1;height:6px;border-radius:6px;background:rgba(255,255,255,.08)}.stepbar i.on{background:linear-gradient(90deg,var(--pink),var(--cyan))}
.kicker{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--cyan);font-weight:900}
.txt{font-size:1.08rem;margin:6px 0 14px}
.txt b{color:var(--amber)}
.datos{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.datos span{background:rgba(122,240,255,.09);border:1px solid rgba(122,240,255,.25);color:var(--cyan);padding:5px 10px;border-radius:10px;font-weight:700;font-size:.9rem}
.tabla{width:100%;border-collapse:collapse;margin:0 0 14px;font-size:.92rem}
.tabla td,.tabla th{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left}.tabla td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);color:var(--tx);border:1px solid var(--line);box-shadow:var(--sh1);padding:14px 16px;font-weight:700}
.opt .l{flex:0 0 32px;height:32px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.07);font-weight:900}
.opt.good{border-color:var(--mint);background:rgba(125,255,196,.12)}
.opt.bad{border-color:var(--red);background:rgba(255,122,143,.12);animation:tiembla .35s}
@keyframes tiembla{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.numrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.numrow input{flex:1 1 220px;font:inherit;font-size:1.2rem;font-weight:800;color:var(--tx);background:#0f1230;border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:inset 3px 3px 8px rgba(0,0,0,.4)}
.numrow .u{color:var(--mut);font-weight:700}
.fb{margin-top:14px;border-radius:16px;padding:12px 14px;font-weight:600;animation:entra .3s}
@keyframes entra{from{opacity:0;transform:translateY(6px)}}
.fb.ok{background:rgba(125,255,196,.1);border:1px solid rgba(125,255,196,.4)}
.fb.bad{background:rgba(255,122,143,.1);border:1px solid rgba(255,122,143,.4)}
.fb.tip{background:rgba(255,210,122,.1);border:1px solid rgba(255,210,122,.4)}
.fb small{display:block;color:var(--mut);margin-top:4px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.law{display:inline-block;font-size:.75rem;font-weight:800;color:var(--lila);border:1px solid rgba(185,162,255,.4);border-radius:8px;padding:2px 8px;margin-top:6px}
/* final de misión */
.win{text-align:center;padding:30px 20px}
.win .big{font-size:4.5rem;animation:pop .7s}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15)}}
.toast{position:fixed;left:50%;top:76px;transform:translate(-50%,-140px);z-index:60;background:linear-gradient(135deg,var(--pink),var(--lila));color:#160f2d;font-weight:900;padding:12px 18px;border-radius:16px;box-shadow:0 10px 30px rgba(255,143,216,.4);transition:transform .4s;max-width:92vw;text-align:center}
.toast.on{transform:translate(-50%,0)}
.toast:empty{display:none}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.actrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border:1px solid var(--line);border-radius:16px;margin-bottom:8px;background:rgba(255,255,255,.03)}
.ins table.tir-ins,#guiaB table.tir-ins{width:100%;border-collapse:collapse;font-size:.85rem;margin-bottom:8px}table.tir-ins th,table.tir-ins td{border:1px solid var(--line);padding:7px;vertical-align:top;text-align:left}table.tir-ins thead th{background:rgba(122,240,255,.1)}.ins{overflow-x:auto}
.ef{display:flex;flex-direction:column;gap:3px;font-size:.82rem;font-weight:800;color:var(--mut);margin-top:8px}.ef input,.ef textarea{font:inherit;font-weight:600;color:var(--tx);background:#0f1230;border:1px solid var(--line);border-radius:12px;padding:8px 10px}
dialog{width:min(980px,96vw)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
dialog{border:0;border-radius:22px;padding:0;width:min(760px,94vw);max-height:86vh;background:var(--bg2);color:var(--tx);box-shadow:0 30px 80px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(5,6,20,.6);backdrop-filter:blur(4px)}
.dh{display:flex;align-items:center;padding:14px 18px;background:linear-gradient(135deg,rgba(255,143,216,.25),rgba(122,240,255,.2))}.dh h3{margin:0;margin-right:auto}
.db{padding:16px 18px;overflow:auto;max-height:calc(86vh - 70px)}
.db h4{color:var(--cyan);margin:14px 0 4px}.db ul{margin:4px 0;padding-left:20px}.db li{margin:3px 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="top"><div class="wrap">
  <div class="brand"><div class="logo">⚖️</div><div>Ruta Laboral CR<small>Contratos · Aguinaldo · Vacaciones · Preaviso · Cesantía</small></div></div>
  <div class="chip" title="Puntos de experiencia">⭐ <span id="xp">0 XP</span><div class="xpbar"><span id="xpb" style="width:0"></span></div></div>
  <div class="chip" title="Medallas">🏅 <span id="med">0</span></div>
  <button class="sec ib" id="bMus" aria-pressed="false" title="Música de fondo">🎵</button>
  <button class="sec ib" id="bSfx" aria-pressed="true" title="Efectos de sonido">🔔</button>
  <button class="sec ib" id="bVoz" aria-pressed="true" title="Narrador (lee en voz alta)">🗣️</button>
  <button class="sec ib" id="bGuia" title="Guía rápida de la ley">📘</button>
</div></div>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="sr" id="live" aria-live="assertive"></div>
<dialog id="guia" aria-labelledby="gt"><div class="dh"><h3 id="gt">📘 Guía rápida (MTSS)</h3><button class="sec" onclick="document.getElementById('guia').close()">Cerrar ✕</button></div><div class="db" id="guiaB"></div></dialog>

<script>
"use strict";
// ═══════════════════════════════════════════════════════════════════════
// Contenido: Código de Trabajo de Costa Rica (arts. 28, 29, 153 y ss.),
// Ley 2412 (aguinaldo) y las publicaciones del MTSS: «Preaviso y cesantía»,
// «Aguinaldo: preguntas frecuentes», «Manual básico de aplicación del derecho
// laboral», el compendio de dudas y los criterios DAJ-AE-083-09 y
// DAJ-AER-OFP-758-2023.
// ═══════════════════════════════════════════════════════════════════════
const C=n=>"₡"+Number(n).toLocaleString("es-CR",{minimumFractionDigits:Number.isInteger(n)?0:2,maximumFractionDigits:2});
const MISIONES=[
{id:"contrato",ic:"📝",t:"El Primer Contrato de Karla",d:"Cuándo hay contrato de trabajo, sus tipos, cómo se prueba y cómo puede terminar.",medalla:["📝","Experta en Contratos"],
 pj:{n:"Karla",r:"Su primer trabajo, en una cafetería",f:"👩🏻‍🍳"},
 pasos:[
  {k:"intro",txt:"¡Hola! Soy Karla y acabo de conseguir <b>mi primer trabajo</b> en una cafetería. Me dijeron que empiezo el lunes, pero nadie me ha dado ningún papel para firmar. ¿Tengo un contrato de trabajo de verdad?"},
  {k:"mc",txt:"¿Cuáles son los tres elementos que hacen que exista un contrato de trabajo?",o:["Firma, sello y fecha","Prestación personal del servicio, salario y subordinación","Uniforme, horario y gafete","Título, experiencia y recomendación"],r:1,ex:"Hay contrato de trabajo cuando la persona presta el servicio personalmente, recibe un salario y depende de un patrono (subordinación jurídica: horario, indicaciones).",ley:"Código de Trabajo, art. 18"},
  {k:"tf",txt:"Verdadero o falso: si no firmo nada, no tengo contrato de trabajo.",r:false,ex:"Falso. No es necesario que sea escrito: la ley permite el contrato oral, con los mismos derechos y obligaciones.",ley:"MTSS · Manual básico"},
  {k:"mc",txt:"Si mi contrato es oral y hay un problema, ¿cómo pruebo que existe?",o:["No se puede probar","Con testigos: tres compañeros, o dos si el patrono tiene cuatro trabajadores o menos","Solo con un abogado","Con una foto en el trabajo"],r:1,ex:"Se prueba con testigos. Si son compañeros del mismo patrono, se necesitan tres; si el patrono emplea cuatro trabajadores o menos, bastan dos.",ley:"MTSS · Manual básico"},
  {k:"mc",txt:"Mi primo diseña logos para varias empresas, sin horario ni jefe, y cobra por cada trabajo. ¿Qué lo diferencia de un contrato de trabajo?",o:["Que gana más","Que no hay subordinación jurídica: es por servicios profesionales","Que trabaja desde la casa","Nada, es lo mismo"],r:1,ex:"La subordinación jurídica (poder de dirección y mando, deber de obediencia) es lo que distingue el contrato de trabajo de un contrato por servicios profesionales.",ley:"MTSS · Manual básico"},
  {k:"mc",txt:"A mi amiga la contrataron solo para la temporada de diciembre, del 1 al 31. ¿Qué tipo de contrato es?",o:["Por tiempo indefinido","A plazo fijo (tiempo determinado)","Por servicios profesionales","No es un contrato"],r:1,ex:"Los contratos de tiempo determinado pueden ser a plazo fijo (con fecha de terminación) o por obra determinada (para una obra específica).",ley:"Código de Trabajo, art. 26"},
  {k:"mc",txt:"Si se vence el plazo fijo pero el trabajo sigue siendo permanente, ¿qué pasa con el contrato?",o:["Termina sí o sí","Se tiene como contrato por tiempo indefinido","Se convierte en servicios profesionales","Hay que firmar otro igual cada mes"],r:1,ex:"Si al vencer subsisten las causas que le dieron origen o la naturaleza del trabajo es permanente, se tiene como contrato por tiempo indefinido.",ley:"Código de Trabajo, art. 26"},
  {k:"mc",txt:"¿Qué derechos da un contrato a plazo fijo cuando termina?",o:["Preaviso y cesantía","Vacaciones y aguinaldo proporcionales","Ninguno","Solo el preaviso"],r:1,ex:"Los contratos por tiempo definido dan derecho a vacaciones y aguinaldo proporcionales (y a daños y perjuicios si se terminan antes de tiempo). El preaviso y la cesantía son de los contratos por tiempo indefinido.",ley:"MTSS · Compendio de dudas"},
  {k:"mc",txt:"¿Cuál de estas es una causa de despido SIN responsabilidad patronal?",o:["Pedir vacaciones","Faltar dos días consecutivos sin permiso ni causa justificada","Enfermarse con incapacidad","Pedir la carta de despido"],r:1,ex:"Entre las causas del art. 81 están faltar 2 días consecutivos o más de 2 alternos en el mismo mes, revelar secretos técnicos o cometer una falta grave.",ley:"Código de Trabajo, art. 81"},
  {k:"tf",txt:"Verdadero o falso: si el patrono no me paga el salario en la fecha acordada, puedo dar por terminado el contrato con responsabilidad patronal.",r:true,ex:"Verdadero. La falta de pago en la cantidad, fecha y lugar acordados es una de las causas del art. 83 para terminar la relación con responsabilidad para el patrono.",ley:"Código de Trabajo, art. 83"},
  {k:"tf",txt:"Verdadero o falso: cuando termina el contrato, el patrono debe darme una carta o certificado si yo se lo pido.",r:true,ex:"Verdadero. A pedido de la persona trabajadora, el patrono debe darle un certificado de conclusión del contrato, sea cual sea la causa.",ley:"Código de Trabajo, art. 35"}
 ]},
{id:"aguinaldo",ic:"🎁",t:"El Aguinaldo de Sofía",d:"El salario adicional de diciembre: quién lo recibe, cómo se calcula y qué se le puede rebajar.",medalla:["🎁","Maestro del Aguinaldo"],
 pj:{n:"Sofía",r:"Vendedora en una tienda",f:"👩🏽‍💼"},
 pasos:[
  {k:"intro",txt:"¡Hola! Soy Sofía. Trabajo en una tienda de zapatos desde hace dos años. Ya viene diciembre y quiero saber <b>cuánto me toca de aguinaldo</b>. ¿Me ayudas?"},
  {k:"mc",txt:"Primero lo básico: ¿qué es el aguinaldo?",o:["Un regalo voluntario del patrono","Un salario adicional que todo patrono debe pagar","Un bono solo para quienes tienen más de un año","Un pago que sustituye las vacaciones"],r:1,ex:"Es un «salario adicional» obligatorio que toda persona empleadora debe pagar, sin importar la actividad.",ley:"Ley 2412"},
  {k:"mc",txt:"¿Hasta cuándo tiene plazo mi patrono para pagármelo?",o:["Hasta el 31 de diciembre","Dentro de los primeros 20 días de diciembre","En la segunda quincena de noviembre","Cuando el patrono decida"],r:1,ex:"Debe pagarse dentro de los primeros veinte días de diciembre de cada año.",ley:"Ley 2412"},
  {k:"mc",txt:"¿Qué período de salarios se suma para calcularlo?",o:["Del 1 de enero al 31 de diciembre","Del 1 de diciembre del año anterior al 30 de noviembre","Solo los últimos 6 meses","Solo el salario de noviembre"],r:1,ex:"Se suman los salarios ordinarios y extraordinarios del 1 de diciembre del año anterior al 30 de noviembre, y se divide entre 12.",ley:"Ley 2412"},
  {k:"mc",txt:"En julio hice horas extra por ₡45 000. ¿Se toman en cuenta?",o:["No, solo cuenta el salario base","Sí: entran los salarios ordinarios y extraordinarios","Solo si son más de 10 horas","Solo la mitad"],r:1,ex:"Se incluyen las horas ordinarias, las extraordinarias y cualquier otro pago salarial del período, también el salario en especie.",ley:"Ley 2412"},
  {k:"num",txt:"Estos fueron mis salarios del período. ¿Cuánto suman en total?",tabla:[["Diciembre a marzo (₡360 000 × 4)",1440000],["Abril a noviembre (₡380 000 × 8)",3040000],["Horas extra de julio",45000]],ok:4525000,ayuda:"Suma las tres filas: 1 440 000 + 3 040 000 + 45 000."},
  {k:"num",txt:"Ahora sí: ¿cuánto es mi <b>aguinaldo</b>?",datos:["Total del período: ₡4 525 000"],ok:4525000/12,ayuda:"Aguinaldo = total de salarios del período ÷ 12.",sol:"4 525 000 ÷ 12 = ₡377 083,33"},
  {k:"mc",txt:"Mi jefe dice que me va a rebajar la CCSS del aguinaldo. ¿Puede?",o:["Sí, como a cualquier salario","No: solo se le puede rebajar la pensión alimentaria","Sí, pero solo el Banco Popular","Solo si yo firmo"],r:1,ex:"Al aguinaldo solo se le puede rebajar la pensión alimentaria. No se le aplica ninguna otra rebaja, ni cargas sociales.",ley:"Ley 2412"},
  {k:"num",txt:"Mi compañero Marco entró el 1 de junio y gana ₡300 000 al mes. ¿Cuánto aguinaldo proporcional le toca al 30 de noviembre?",datos:["Junio a noviembre: 6 meses","₡300 000 por mes"],ok:150000,ayuda:"Suma lo que ganó en los meses que trabajó y divide entre 12 (no entre 6).",sol:"(₡300 000 × 6) ÷ 12 = ₡150 000"},
  {k:"tf",txt:"Verdadero o falso: si el contrato termina antes de diciembre, la persona pierde el derecho al aguinaldo.",r:false,ex:"Falso. Se le paga un doceavo de lo que ganó en los meses trabajados. El derecho se puede reclamar hasta un año después de terminado el contrato.",ley:"Ley 2412"}
 ]},
{id:"vacaciones",ic:"🏖️",t:"Las Vacaciones de Daniel",d:"Cuántos días tocan, cómo se pagan según la forma de pago y cuándo se pueden compensar.",medalla:["🏖️","Guardián de las Vacaciones"],
 pj:{n:"Daniel",r:"Técnico en una empresa de cómputo",f:"👨🏻‍🔧"},
 pasos:[
  {k:"intro",txt:"¡Qué tal! Soy Daniel. Cumplí un año en la empresa y quiero irme a la playa. Pero no tengo claro <b>cuántos días me tocan ni cuánto me pagan</b>."},

// ═══ Audio: música lo-fi y efectos generados en el navegador (sin archivos externos) ═══
let AC=null,master=null,musGain=null,sfxGain=null,musTimer=null;
function audio(){if(AC)return AC;AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.9;master.connect(AC.destination);
  musGain=AC.createGain();musGain.gain.value=0;const lp=AC.createBiquadFilter();lp.type="lowpass";lp.frequency.value=2400;musGain.connect(lp).connect(master);sfxGain=AC.createGain();sfxGain.gain.value=.5;sfxGain.connect(master);return AC}
const hz=m=>440*Math.pow(2,(m-69)/12);
function tono(f,t,d,v,tipo,dest,ataque){const o=AC.createOscillator(),g=AC.createGain();o.type=tipo||"sine";o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+(ataque||.01));g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g).connect(dest);o.start(t);o.stop(t+d+.05)}
function ruido(t,d,v,dest,f){const n=AC.createBufferSource(),b=AC.createBuffer(1,AC.sampleRate*d,AC.sampleRate),x=b.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=(Math.random()*2-1)*Math.pow(1-i/x.length,2);n.buffer=b;const bf=AC.createBiquadFilter();bf.type=f?"highpass":"bandpass";bf.frequency.value=f||1800;const g=AC.createGain();g.gain.value=v;n.connect(bf).connect(g).connect(dest);n.start(t)}
// Acordes de 7.ª suaves (Fmaj7 – Em7 – Dm7 – Cmaj7) a 78 bpm, con bombo, caja y hi-hat suaves.
const PROG=[[53,57,60,64],[52,55,59,62],[50,53,57,60],[48,52,55,59]],BAJO=[41,40,38,36],MEL=[[72,69,67,64],[71,67,64,62],[69,65,62,60],[67,64,62,59]];
let paso16=0,proxT=0;
function programar(){const sp=60/78/4;while(proxT<AC.currentTime+.25){const s=paso16%64,c=Math.floor(s/16)%4,t=proxT;
  if(s%16===0){PROG[c].forEach((m,i)=>tono(hz(m),t+i*.015,3.1,.035,"triangle",musGain,.08));tono(hz(BAJO[c]),t,1.4,.09,"sine",musGain,.02)}
  if(s%16===8)tono(hz(BAJO[c]+7),t,.9,.06,"sine",musGain,.02);
  if(s%4===0&&(s%16===0||s%16===10)){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(42,t+.18);g.gain.setValueAtTime(.22,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(g).connect(musGain);o.start(t);o.stop(t+.3)}
  if(s%16===4||s%16===12)ruido(t,.18,.06,musGain);
  if(s%2===0)ruido(t,.04,.025,musGain,7000);
  if(s%4===2&&Math.random()<.45)tono(hz(MEL[c][(s/4|0)%4]),t,.6,.03,"sine",musGain,.02);
  paso16++;proxT+=sp}}
function musica(on){if(on){audio();AC.resume();if(!musTimer){proxT=AC.currentTime+.1;musTimer=setInterval(programar,80)}musGain.gain.setTargetAtTime(.55,AC.currentTime,.5)}
  else if(AC){musGain.gain.setTargetAtTime(0,AC.currentTime,.3);setTimeout(()=>{if(!E.mus&&musTimer){clearInterval(musTimer);musTimer=null}},1200)}}
function sfx(tipo){if(!E.sfx)return;try{audio();AC.resume();const t=AC.currentTime;
  if(tipo==="clic")tono(880,t,.08,.12,"triangle",sfxGain);
  else if(tipo==="ok")[659,784,988].forEach((f,i)=>tono(f,t+i*.08,.25,.18,"triangle",sfxGain));
  else if(tipo==="mal"){tono(220,t,.25,.15,"sawtooth",sfxGain);tono(185,t+.12,.3,.12,"sawtooth",sfxGain)}
  else if(tipo==="nivel")[523,659,784,1047,1319].forEach((f,i)=>tono(f,t+i*.1,.45,.2,"square",sfxGain))}catch(e){}}

// ═══ Narrador: SpeechSynthesis en español latino ═══
let VOZ=null;
function elegirVoz(){const vs=(window.speechSynthesis&&speechSynthesis.getVoices())||[];const pref=["es-CR","es-MX","es-419","es-US","es-CO","es-PE","es-AR","es-CL"];
  VOZ=pref.map(l=>vs.find(v=>v.lang&&v.lang.replace("_","-").toLowerCase()===l.toLowerCase())).find(Boolean)||vs.find(v=>/^es/i.test(v.lang)&&!/es-ES/i.test(v.lang))||vs.find(v=>/^es/i.test(v.lang))||null}
if(window.speechSynthesis){elegirVoz();speechSynthesis.onvoiceschanged=elegirVoz}
function hablar(t){if(!E.voz||!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(limpio(t));u.lang=VOZ?VOZ.lang:"es-MX";if(VOZ)u.voice=VOZ;u.rate=1;u.pitch=1.05;
  if(E.mus&&musGain){musGain.gain.setTargetAtTime(.22,AC.currentTime,.2);u.onend=()=>{if(E.mus)musGain.gain.setTargetAtTime(.55,AC.currentTime,.6)}}speechSynthesis.speak(u)}catch(e){}}
function callar(){try{window.speechSynthesis&&speechSynthesis.cancel()}catch(e){}}

// ═══ Confeti ═══
function confeti(){if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;const c=$("#fx"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
  const col=["#ff8fd8","#7af0ff","#b9a2ff","#7dffc4","#ffd27a"],P=Array.from({length:160},()=>({x:innerWidth/2,y:innerHeight*.4,vx:(Math.random()-.5)*16,vy:-Math.random()*15-4,s:Math.random()*7+4,c:col[Math.random()*5|0],a:Math.random()*6}));
  let k=0;(function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.38;p.x+=p.vx;p.y+=p.vy;p.a+=.15;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});if(++k<140)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})()}

    return `<section class="card mis ${ab?"":"lock"} ${st.hecha?"done":""}"><div style="display:flex;gap:12px;align-items:center"><div class="ic">${ab?m.ic:"🔒"}</div><div><small style="color:var(--cyan);font-weight:900;letter-spacing:.1em">MISIÓN ${i+1}</small><h3>${m.t}</h3></div></div>
      <p>${m.d}</p><div class="prog" role="progressbar" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100" aria-label="Avance de la misión ${i+1}"><span style="width:${p}%"></span></div>
      <small style="color:var(--mut);font-weight:700">${st.hecha?"✅ Completada · "+(st.xp||0)+" XP":p?p+" % de avance":"Sin empezar"}</small>
      ${ab?`<button ${st.hecha?'class="sec"':""} onclick="sfx('clic');irA('#/m/${m.id}')">${st.hecha?"🔁 Repetir":p?"▶ Continuar":"▶ Empezar"}</button>`:`<small style="color:var(--mut)">🔒 Completa la misión ${i} para desbloquearla</small>`}</section>`}).join("")}</div>
  <section class="card" style="margin-top:18px"><b>🏅 Medallas</b><div class="medals">${M.map(m=>`<div class="medal ${m.on?"":"off"}" title="${m.d}"><b>${m.i}</b>${m.n}</div>`).join("")}</div></section>
  <p class="sub" style="margin-top:14px;font-size:.85rem">🎵 música · 🔔 efectos · 🗣️ narrador · 📘 guía de la ley. Tu avance se guarda en este dispositivo.</p>`;

}
function jugar(mi){
  const m=MISIONES[mi],st=E.mis[m.id]=E.mis[m.id]||{paso:0,fallos:0,xp:0};
  if(st.hecha&&st.paso>=m.pasos.length){st.paso=0;st.fallos=0;st.repite=true}
  guardar();jugarMision(m,{modo:"libre",st,mi,titulo:`Misión ${mi+1}: ${m.t}`,back:"#/"});
}
// Motor de cada misión. modo: "libre" (juego), "diaria" (práctica del profe, con
// pistas) o "evaluativa" (trabajo cotidiano: una sola respuesta por paso, sin pistas).
function jugarMision(m,ctx){
  const st=ctx.st,mi=ctx.mi,EVAL=ctx.modo==="evaluativa";let intentos=0,resuelto=false;
  const pinta=()=>{
    const p=m.pasos[st.paso];if(!p)return fin();
    intentos=0;resuelto=p.k==="intro";
    $("#app").innerHTML=`<div class="actions" style="margin:0 0 12px"><button class="sec" onclick="irA('${ctx.back}')">← Volver</button><span class="chip">${m.ic} ${ctx.titulo}</span>${EVAL?'<span class="chip" style="color:var(--amber)">📝 Trabajo cotidiano · una sola respuesta por paso</span>':""}</div>
    <div class="scene"><div class="avatar"><div class="face" aria-hidden="true">${m.pj.f}</div><div><b>${m.pj.n}</b><small>${m.pj.r}</small></div></div>
    <div class="card bubble"><div class="stepbar" aria-hidden="true">${m.pasos.map((_,i)=>`<i class="${i<=st.paso?"on":""}"></i>`).join("")}</div>
      <div class="kicker">${p.k==="intro"?"Historia":p.k==="num"?"Calcula":p.k==="tf"?"Verdadero o falso":"Decide"} · ${st.paso+1}/${m.pasos.length}</div>
      <p class="txt" id="pTxt">${p.txt}</p>
      ${p.datos?`<div class="datos">${p.datos.map(d=>`<span>${d}</span>`).join("")}</div>`:""}
      ${p.tabla?`<table class="tabla">${p.tabla.map(([a,b])=>`<tr><td>${a}</td><td>${C(b)}</td></tr>`).join("")}</table>`:""}
      <div id="zona">${zona(p)}</div><div id="fb"></div>
      <div class="actions"><button id="sig" ${p.k==="intro"?"":"disabled"}>${p.k==="intro"?"Continuar ▶":"Siguiente ▶"}</button><button class="sec" id="rep" title="Escuchar de nuevo">🔊 Escuchar</button></div></div></div>`;
    $("#sig").onclick=async()=>{sfx("clic");st.paso++;guardar();if(ctx.onAvance){$("#sig").disabled=true;await ctx.onAvance(st)}pinta()};
    $("#rep").onclick=()=>hablar(textoPaso(p));
    activar(p);
    setTimeout(()=>hablar(textoPaso(p)),250);
    const f=document.querySelector("#zona button, #zona input");if(f&&p.k!=="intro")f.focus({preventScroll:true});
  };
  const textoPaso=p=>p.txt+(p.k==="mc"?" Opciones: "+p.o.map((o,i)=>"ABCD"[i]+", "+o).join(". "):"")+(p.k==="tf"?" ¿Verdadero o falso?":"");
  const zona=p=>p.k==="mc"?`<div class="opts">${p.o.map((o,i)=>`<button class="opt" data-o="${i}"><span class="l">${"ABCD"[i]}</span>${o}</button>`).join("")}</div>`
    :p.k==="tf"?`<div class="opts" style="grid-template-columns:1fr 1fr"><button class="opt" data-tf="1"><span class="l">✔</span>Verdadero</button><button class="opt" data-tf="0"><span class="l">✘</span>Falso</button></div>`
    :p.k==="num"?`<div class="numrow"><input id="num" inputmode="decimal" placeholder="${p.u?"Escribe los "+p.u:"Escribe el monto en colones"}" aria-label="Respuesta"><span class="u">${p.u||"₡"}</span><button id="chk">${EVAL?"📌 Registrar respuesta":"✅ Comprobar"}</button></div>`:"";
  const registrar=rec=>{ctx.onRes&&ctx.onRes(st.paso,{...rec,c:m.pasos[st.paso].c||null})};
  const premio=()=>{registrar({ok:intentos===1,intentos});const g=intentos===1?20:intentos===2?12:6;E.xp+=g;st.xp=(st.xp||0)+g;E.racha++;E.mejorRacha=Math.max(E.mejorRacha,E.racha);resuelto=true;$("#sig").disabled=false;$("#sig").focus();
    const antes=medallas().filter(x=>x.on).length;guardar();stats();sfx("ok");if(E.racha>0&&E.racha%5===0)toast(`🔥 ¡Racha de ${E.racha}!`);
    const ahora=medallas().filter(x=>x.on).length;if(ahora>antes)toast("🏅 ¡Nueva medalla desbloqueada!");return g};
  const fallo=()=>{E.racha=0;st.fallos++;guardar();stats();sfx("mal")};
  const fb=(tipo,html,voz)=>{$("#fb").innerHTML=`<div class="fb ${tipo}">${html}</div>`;if(voz)hablar(voz);$("#live").textContent=limpio(html)};
  const leerNum=v=>{let s=String(v).replace(/[₡\s]/g,"");if(/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(s))s=s.replace(/\./g,"").replace(",",".");else if(/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(s))s=s.replace(/,/g,"");else s=s.replace(",",".");return Number(s)};
  const activar=p=>{
    if(EVAL){
      const lista=()=>{resuelto=true;$("#sig").disabled=false;$("#sig").focus();sfx("clic");fb("tip","📌 Respuesta registrada. Tu profe verá el resultado cuando entregues el trabajo.","Respuesta registrada.")};
      if(p.k==="mc"||p.k==="tf")document.querySelectorAll("#zona .opt").forEach(b=>b.onclick=()=>{if(resuelto)return;
        const v=p.k==="mc"?+b.dataset.o:b.dataset.tf==="1",ok=p.k==="mc"?v===p.r:v===p.r;b.style.borderColor="var(--amber)";b.style.background="rgba(255,210,122,.12)";
        document.querySelectorAll("#zona .opt").forEach(x=>x.disabled=true);registrar({v,ok});lista()});
      if(p.k==="num"){const inp=$("#num"),chk=$("#chk");const go=()=>{if(resuelto)return;const v=leerNum(inp.value);if(!inp.value||!isFinite(v)){fb("tip","✍️ Escribe un número.");return}
        if(!confirm("¿Registrar esta respuesta? Solo tienes una oportunidad."))return;inp.disabled=true;chk.disabled=true;registrar({v,ok:Math.abs(v-p.ok)<=(p.tol||1)});lista()};
        chk.onclick=go;inp.onkeydown=e=>{if(e.key==="Enter")go()}}
      return}
    if(p.k==="mc"||p.k==="tf"){document.querySelectorAll("#zona .opt").forEach(b=>b.onclick=()=>{if(resuelto)return;intentos++;
      const ok=p.k==="mc"?+b.dataset.o===p.r:(b.dataset.tf==="1")===p.r;
      if(ok){b.classList.add("good");document.querySelectorAll("#zona .opt").forEach(x=>x.disabled=true);const g=premio();fb("ok",`🎉 ¡Correcto! +${g} XP<small>${p.ex}</small>${p.ley?`<span class="law">📜 ${p.ley}</span>`:""}`,"¡Correcto! "+p.ex)}
      else{b.classList.add("bad");b.disabled=true;fallo();fb("bad",`😬 No es esa. ¡Inténtalo otra vez!${intentos>=2?`<small>Pista: ${p.ex.split(".")[0]}.</small>`:""}`,"No es esa. Inténtalo otra vez.")}})}
    if(p.k==="num"){const inp=$("#num"),chk=$("#chk");const leer=v=>{let s=String(v).replace(/[₡\s]/g,"");if(/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(s))s=s.replace(/\./g,"").replace(",",".");else if(/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(s))s=s.replace(/,/g,"");else s=s.replace(",",".");return Number(s)};
      const go=()=>{if(resuelto)return;const v=leer(inp.value);if(!inp.value||!isFinite(v)){fb("tip","✍️ Escribe un número.");return}intentos++;
        if(Math.abs(v-p.ok)<=(p.tol||1)){inp.disabled=true;chk.disabled=true;const g=premio();fb("ok",`🎉 ¡Exacto! ${p.u?p.ok+" "+p.u:C(Math.round(p.ok*100)/100)} · +${g} XP${p.sol?`<small>${p.sol}</small>`:""}`,"¡Exacto! "+(p.sol||""))}
        else{fallo();if(intentos>=3){inp.disabled=true;chk.disabled=true;resuelto=true;$("#sig").disabled=false;registrar({ok:false,intentos});fb("tip",`💡 La respuesta era <b>${p.u?p.ok+" "+p.u:C(Math.round(p.ok*100)/100)}</b>.<small>${p.ayuda}${p.sol?" · "+p.sol:""}</small>`,"La respuesta era "+(p.u?p.ok+" "+p.u:C(Math.round(p.ok*100)/100)))}
          else fb("bad",`🤔 Todavía no.<small>Pista: ${p.ayuda}</small>`,"Todavía no. Pista: "+p.ayuda)}};
      chk.onclick=go;inp.onkeydown=e=>{if(e.key==="Enter")go()}}
  };
  const fin=()=>{if(ctx.onFin)return ctx.onFin(st);const prim=!st.hecha;st.hecha=true;if(prim){E.xp+=100;st.xp=(st.xp||0)+100}guardar();stats();sfx("nivel");confeti();
    const sig=MISIONES[mi+1];
    $("#app").innerHTML=`<div class="card win"><div class="big">${m.medalla[0]}</div><h1>¡Misión cumplida!</h1>
      <p class="sub">Desbloqueaste la medalla <b style="color:var(--amber)">${m.medalla[1]}</b>${prim?" · +100 XP de bonificación":""}</p>
      <p>Errores en esta misión: <b>${st.fallos}</b> ${st.fallos===0?"· 💎 ¡perfecta!":""}</p>
      <div class="actions" style="justify-content:center">${sig?`<button class="pink" onclick="irA('#/m/${sig.id}')">Siguiente: ${sig.t} ▶</button>`:`<button class="pink" onclick="irA('#/')">👑 Ver mis medallas</button>`}<button class="sec" onclick="irA('#/')">← Mapa</button></div></div>`;
    hablar(`¡Misión cumplida! Ganaste la medalla ${m.medalla[1]}.`)};
  pinta();
}

const nomMat=id=>{const m=ACT.mats.find(x=>x.id===Number(id));return m?m.nombre.trim()+(m.seccion?" · "+m.seccion:""):"Sin materia"};
const progDe=t=>{const a=ACT.mias[t.id];return (a&&a.datos_prueba&&a.datos_prueba.laboral)||{paso:0,resp:{}}};
const misionDe=t=>{const C=t.contenido_actividad||{};return {id:"act"+t.id,ic:C.lab_ic||"📘",t:t.titulo,pj:C.lab_pj||{n:"Caso",r:"",f:"🧑"},pasos:C.lab_pasos||[],medalla:["🏅",t.titulo]}};
const critDe=t=>{const C=t.contenido_actividad||{};return C.criterios&&C.criterios.length?C.criterios:LAB_CRIT};
function metricasDe(t,prog){const M=misionDe(t),out={};
  LAB_CRIT.forEach(c=>{const idx=M.pasos.map((p,i)=>[p,i]).filter(([p])=>p.c===c.cat);if(!idx.length)return;
    const ok=idx.filter(([,i])=>prog.resp&&prog.resp[i]&&prog.resp[i].ok).length;out[c.auto]=Math.round(1000*ok/idx.length)/10});return out}

async function crearIndicador(materiaId,desc,fecha){
  const {data:ex}=await sb.from("indicadores").select("id,letra").eq("materia_id",materiaId).eq("categoria","Trabajo cotidiano");
  const us=new Set((ex||[]).map(e=>String(e.letra||"").trim().toUpperCase()));let i=0,letra="";
  for(;;){let n=i,l="";do{l=String.fromCharCode(65+(n%26))+l;n=Math.floor(n/26)-1}while(n>=0);if(!us.has(l)){letra=l;break}i++}
  const {data,error}=await sb.from("indicadores").insert({materia_id:materiaId,categoria:"Trabajo cotidiano",letra,descripcion:desc,puntaje_maximo:3,fecha_evaluacion:fecha,orden:(ex||[]).length+1}).select().maybeSingle();
  if(error||!data)throw new Error(error?error.message:"no se pudo crear el indicador");
  try{await sb.from("criterios_indicador").insert([[0,"Sin evidencia","No realiza el trabajo o logra menos del 35 % de los criterios."],[1,"Inicial","Logra entre el 35 % y el 59 % de los conceptos, casos y cálculos."],[2,"Intermedio","Logra entre el 60 % y el 84 % de los conceptos, casos y cálculos."],[3,"Avanzado","Logra el 85 % o más de los conceptos, casos y cálculos."]].map(([puntaje,nivel,descripcion])=>({indicador_id:data.id,puntaje,nivel,descripcion})))}catch(e){}
  return data}
async function crearPaqueteLab(btn,materiaId){

    const C={estrategia:ESTR,lab_tipo:P.tipo,materia_id:materiaId,lab_desc:P.desc,lab_ic:P.ic,lab_pj:P.pj,lab_pasos:P.pasos,
      criterios:ev?LAB_CRIT.map(c=>({...c,niveles:typeof tiraderaNivelesDe==="function"?tiraderaNivelesDe(c):undefined})):[],
      lab_instrumento:{componente:ev?"Trabajo cotidiano":"Práctica",tipo:"Escala de desempeño",subarea:"",unidad:"Legislación laboral: contratos, aguinaldo, vacaciones, preaviso y cesantía",resultado:"",indicador:P.desc}};

    if(error||!data){if(ind)await sb.from("indicadores").delete().eq("id",ind.id);throw new Error(error?error.message:"sin respuesta")}ids.push(data.id)}}
  catch(e){alert("No se pudo crear todo: "+(e.message||e))}

    ${K.map((c,i)=>{const nv=typeof tiraderaNivelesDe==="function"?tiraderaNivelesDe(c):(c.niveles||{});return `<div class="card" style="padding:10px;margin-top:10px"><label class="ef"><span>Criterio ${i+1}</span><textarea rows="2" data-cr="${i}|nombre">${escH(c.nombre)}</textarea></label>${[["avanzado","Avanzado (3)"],["intermedio","Intermedio (2)"],["inicial","Inicial (1)"]].map(([k,l])=>`<label class="ef"><span>${l}</span><textarea rows="2" data-cr="${i}|${k}">${escH(nv[k]||"")}</textarea></label>`).join("")}</div>`}).join("")}
    <div class="actions"><button class="ok" id="insG">💾 Guardar</button><button class="sec" id="insV">Cancelar</button><span id="insE" class="sub" style="margin:0"></span></div>`;
  $("#insV").onclick=()=>verInstrumento(t);
  $("#insG").onclick=async()=>{const ni={...I};document.querySelectorAll("[data-ins]").forEach(x=>ni[x.dataset.ins]=x.value.trim());
    const nk=K.map(c=>({...c,niveles:{...(typeof tiraderaNivelesDe==="function"?tiraderaNivelesDe(c):(c.niveles||{}))}}));
    document.querySelectorAll("[data-cr]").forEach(x=>{const [i,k]=x.dataset.cr.split("|");if(k==="nombre")nk[+i].nombre=x.value.trim();else nk[+i].niveles[k]=x.value.trim()});
    $("#insG").disabled=true;const {data:a}=await sb.from("trabajos_cotidianos").select("contenido_actividad").eq("id",t.id).maybeSingle();
    const C={...((a&&a.contenido_actividad)||t.contenido_actividad),lab_instrumento:ni,criterios:nk};
    const {error}=await sb.from("trabajos_cotidianos").update({contenido_actividad:C}).eq("id",t.id);
    if(error){$("#insE").textContent="No se pudo: "+error.message;$("#insG").disabled=false;return}t.contenido_actividad=C;toast("✓ Evaluación guardada");verInstrumento(t)}}
// Página de una actividad: reglas, evaluación MEP (antes de empezar) y entrega.
async function paginaAct(id,jugarYa){
  $("#app").innerHTML='<p class="sub">Cargando actividad…</p>';await cargarActs();
  let t=(ACT.lista||[]).find(x=>x.id===id);
  if(!t){$("#app").innerHTML='<p class="sub">No se encontró la actividad (entra desde la plataforma).</p><button onclick="irA(\'#/\')">← Mapa</button>';return}
  const C=t.contenido_actividad||{},ev=C.lab_tipo==="evaluativa",M=misionDe(t),mi=ACT.mias[t.id];
  let prog=EST_ID?progDe(t):(ACT.prueba&&ACT.prueba.id===t.id?ACT.prueba.prog:(ACT.prueba={id:t.id,prog:{paso:0,resp:{}}}).prog);
  prog.resp=prog.resp||{};prog.fallos=prog.fallos||0;prog.paso=prog.paso||0;
  if(!DOC&&t.habilitado===false&&!(mi&&mi.completado)){$("#app").innerHTML=`<div class="card"><h3>${escH(t.titulo)}</h3><p>Esta actividad todavía no está abierta (o ya se cerró). Consulta con tu profe.</p><button onclick="irA('#/')">← Mapa</button></div>`;return}
  const entregado=!!(mi&&mi.completado);
  if(jugarYa&&!(entregado&&ev)){
    if(prog.paso>=M.pasos.length&&!ev){prog.paso=0;}
    jugarMision(M,{modo:ev?"evaluativa":"diaria",st:prog,titulo:t.titulo,back:"#/a/"+t.id,
      onRes:(i,rec)=>{prog.resp[i]=rec;if(ev)guardarProg(t,prog)},
      onAvance:async st=>{await guardarProg(t,st)},
      onFin:async st=>{
        if(!ev){const P=M.pasos.filter(p=>p.k!=="intro").length,prim=Object.values(st.resp).filter(r=>r.ok).length,pct=P?Math.round(100*prim/P):0;
          await guardarProg(t,st,EST_ID?{completado:true,puntaje:null,porcentaje:pct}:null);sfx("nivel");confeti();toast("🏆 ¡Práctica completada!")}
        irA("#/a/"+t.id)}});
    return}
  if(ev&&EST_ID&&!entregado&&!prog.vio_instrumento){
    $("#app").innerHTML=`<div class="actions" style="margin:0 0 12px"><button class="sec" onclick="irA('#/')">← Mapa</button><span class="chip">📋 Antes de empezar: así te vamos a evaluar</span></div><div class="card ins">${instrumentoHTML(t)}</div><div class="actions"><button class="ok" id="insOk">✅ Leí la evaluación, empezar el trabajo</button></div>`;
    hablar("Antes de empezar, lee cómo te vamos a evaluar.");
    $("#insOk").onclick=async()=>{$("#insOk").disabled=true;prog.vio_instrumento=new Date().toISOString();await guardarProg(t,prog);irA("#/a/"+t.id+"/jugar")};return}
  const P=M.pasos.filter(p=>p.k!=="intro").length,hechos=Object.keys(prog.resp).length,pct=P?Math.round(100*hechos/P):0;
  const met=ev&&(entregado||DOC)?(prog.metricas||metricasDe(t,prog)):null,terminado=prog.paso>=M.pasos.length;
  $("#app").innerHTML=`<div class="actions" style="margin:0 0 12px"><button class="sec" onclick="irA('#/')">← Mapa</button><span class="chip">${ev?"📝 Trabajo cotidiano":"🟢 Práctica interactiva"}${t.indicador_id?" · con indicador":" · sin nota"}</span>${ev?'<button class="sec" id="verIns">📋 Evaluación (formato MEP)</button>':""}</div>
   <div class="card"><div style="display:flex;gap:14px;align-items:center"><div class="ic" style="width:64px;height:64px;border-radius:20px;display:grid;place-items:center;font-size:2rem;background:rgba(255,255,255,.06)">${M.ic}</div><div><h2 style="margin:0">${escH(t.titulo)}</h2><p class="sub" style="margin:4px 0 0">${escH(C.lab_desc||"")}</p></div></div>
    ${DOC?'<div class="fb tip">🧪 Vista del profe: puede resolverla para probarla; no se guarda nada.</div>':""}
    <p style="margin:14px 0 6px">${ev?"<b>Reglas:</b> cada paso se responde <b>una sola vez</b>, sin pistas ni ver si está bien. Al final toca <b>📤 Entregar</b>: la nota se calcula sola con el % de conceptos, casos y cálculos correctos (85 % o más = 3 · 60–84 % = 2 · 35–59 % = 1).":"<b>Práctica sin nota:</b> tienes pistas, varios intentos, narrador y XP. Termínala para completarla."}</p>
    <div class="prog"><span style="width:${entregado?100:pct}%"></span></div><small class="sub">${hechos}/${P} pasos respondidos</small>
    ${met?`<div class="grid" style="margin-top:14px">${LAB_CRIT.filter(c=>met[c.auto]!=null).map(c=>`<div class="card" style="padding:12px"><b style="font-size:1.4rem;color:var(--cyan)">${Math.round(met[c.auto])} %</b><br><small>${escH(c.nombre)}</small></div>`).join("")}</div>`:""}
    ${entregado&&ev?`<p style="font-size:1.2rem;font-weight:900;margin:14px 0 0">Nota del indicador: ${mi.puntaje!=null?mi.puntaje+" / 3":"—"} ${mi.porcentaje!=null?`(${Math.round(mi.porcentaje)} %)`:""}</p>`:""}
    ${entregado&&!ev?'<p style="font-weight:900;color:var(--mint)">🏆 Práctica completada</p>':""}
    <div class="actions">${entregado&&ev?"":`<button class="pink" onclick="sfx('clic');irA('#/a/${t.id}/jugar')">${entregado?"🔁 Repetir la práctica":terminado&&ev?"👁️ Revisar":hechos?"▶ Seguir":"▶ Empezar"}</button>`}${ev&&EST_ID&&!entregado?`<button class="ok" id="entregar">📤 Entregar trabajo</button>`:""}</div></div>`;
  const vi=$("#verIns");if(vi)vi.onclick=()=>verInstrumento(t);
  const eb=$("#entregar");if(eb)eb.onclick=async()=>{const falt=P-hechos;
    if(!confirm(`${falt?`Te faltan ${falt} paso(s) por responder: cuentan como incorrectos.\n\n`:""}¿Entregar el trabajo? Ya no podrás cambiarlo.`))return;
    eb.disabled=true;const met2=metricasDe(t,prog),crit=critDe(t).filter(c=>met2[c.auto]!=null),nota=memoriaNotaDesdeMetricas(crit,met2,[]);
    prog.metricas=met2;prog.entregado_en=new Date().toISOString();
    const {error}=await guardarNotaManualActividad(t,EST_ID,nota.puntaje,{respuestas:nota.puntos,porcentaje:nota.porcentaje,datos_prueba:{laboral:prog}});
    if(error){eb.disabled=false;alert("No se pudo entregar: "+error);return}
    ACT.mias[t.id]={completado:true,puntaje:nota.puntaje,porcentaje:nota.porcentaje,datos_prueba:{laboral:prog}};sfx("nivel");confeti();hablar("¡Trabajo entregado!");paginaAct(t.id)};
}
// El profe revisa lo que respondió un estudiante, paso por paso.
async function verTrabajoEst(id,est){await cargarActs();const t=(ACT.lista||[]).find(x=>x.id===id);if(!t||!DOC){irA("#/");return}
  const {data:a}=await sb.from("actividades_estudiante").select("completado,puntaje,porcentaje,datos_prueba").eq("trabajo_id",id).eq("estudiante_id",est).maybeSingle();
  const pr=(a&&a.datos_prueba&&a.datos_prueba.laboral)||{resp:{}},M=misionDe(t),ev=(t.contenido_actividad||{}).lab_tipo==="evaluativa";
  const resp=(p,r)=>!r?"—":p.k==="mc"?escH(p.o[r.v]??(r.ok?p.o[p.r]:"(varios intentos)")):p.k==="tf"?(r.v===undefined?(r.ok?(p.r?"Verdadero":"Falso"):"(varios intentos)"):r.v?"Verdadero":"Falso"):r.v!=null?(p.u?r.v+" "+p.u:C(r.v)):r.ok?"Correcto":"(varios intentos)";
  const corr=p=>p.k==="mc"?escH(p.o[p.r]):p.k==="tf"?(p.r?"Verdadero":"Falso"):p.u?Math.round(p.ok*100)/100+" "+p.u:C(Math.round(p.ok*100)/100);
  $("#app").innerHTML=`<div class="actions" style="margin:0 0 12px"><button class="sec" onclick="irA('#/a/${id}')">← ${escH(t.titulo)}</button><span class="chip">👁️ ${escH(ACT.nombres[est]||est)}</span>${a&&a.completado?`<span class="chip" style="color:var(--mint)">✅ ${ev?"Nota "+(a.puntaje!=null?a.puntaje+"/3":"—"):"Completó"}</span>`:""}</div>
   <div class="card" style="overflow-x:auto"><table class="tabla"><thead><tr><th>#</th><th>Tipo</th><th>Pregunta</th><th>Respondió</th><th>Correcta</th><th></th></tr></thead><tbody>
   ${M.pasos.map((p,i)=>p.k==="intro"?"":`<tr><td>${i}</td><td>${CAT_NOM[p.c]||""}</td><td>${p.txt}</td><td>${resp(p,pr.resp[i])}</td><td>${corr(p)}</td><td style="font-size:1.2rem">${pr.resp[i]?(pr.resp[i].ok?"✅":"❌"):"—"}</td></tr>`).join("")}</tbody></table></div>`}
async function verEntregas(t){const d=$("#guia"),C=t.contenido_actividad||{},ev=C.lab_tipo==="evaluativa",M=misionDe(t),P=M.pasos.filter(p=>p.k!=="intro").length;
  $("#gt").textContent="📥 Entregas · "+t.titulo;$("#guiaB").innerHTML="<p>Cargando…</p>";if(!d.open)d.showModal();
  const [{data:em},{data:ae}]=await Promise.all([sb.from("estudiante_materias").select("estudiante_id").eq("materia_id",C.materia_id),sb.from("actividades_estudiante").select("estudiante_id,completado,puntaje,porcentaje,datos_prueba").eq("trabajo_id",t.id)]);
  const ids=(em||[]).map(x=>x.estudiante_id),{data:es}=ids.length?await sb.from("estudiantes").select("id,nombre,apellido1,apellido2").in("id",ids):{data:[]};
  const por={};(ae||[]).forEach(x=>por[x.estudiante_id]=x);
  const lista=(es||[]).map(e=>({id:e.id,nombre:[e.apellido1,e.apellido2,e.nombre].filter(Boolean).join(" ")})).sort((a,b)=>a.nombre.localeCompare(b.nombre,"es"));lista.forEach(e=>ACT.nombres[e.id]=e.nombre);
  const pc=v=>v==null?"—":`<b style="color:${v>=85?"var(--mint)":v>=60?"var(--amber)":"var(--red)"}">${Math.round(v)} %</b>`;const crits=LAB_CRIT.filter(c=>M.pasos.some(p=>p.c===c.cat));let ent=0,trab=0;
  const filas=lista.map(e=>{const a=por[e.id],pr=(a&&a.datos_prueba&&a.datos_prueba.laboral)||{resp:{}},h=Object.keys(pr.resp||{}).length,ok=a&&a.completado;if(ok)ent++;else if(h)trab++;
    const met=ev&&(ok||h)?(pr.metricas||metricasDe(t,pr)):null;
    return `<tr><td>${escH(e.nombre)}</td><td>${ok?"✅ "+(ev?(pr.calificado_por_docente?"Calificado":"Entregó"):"Completó"):h?`⏳ ${h}/${P}`:"— Sin empezar"}</td>${ev?crits.map(c=>`<td>${met?pc(met[c.auto]):"—"}</td>`).join("")+`<td><b>${ok&&a.puntaje!=null?a.puntaje+"/3":"—"}</b></td>`:`<td>${h}/${P}</td><td>${ok&&a.porcentaje!=null?Math.round(a.porcentaje)+" % a la primera":"—"}</td>`}
      <td>${h||ok?`<button class="sec" style="padding:6px 10px" data-ver="${escH(e.id)}">👁️ Ver</button>`:""}${ev&&!ok&&h?` <button class="sec" style="padding:6px 10px" data-nota="${escH(e.id)}">Poner nota con lo que lleva</button>`:""}</td></tr>`}).join("");
  $("#guiaB").innerHTML=`<p class="sub" style="margin:0 0 8px">${ev?"Trabajo cotidiano":"Práctica"} · ${escH(nomMat(C.materia_id))} · ${ent} de ${lista.length} ${ev?"entregaron":"completaron"}${trab?` · ${trab} trabajando`:""}.</p>
    <div style="overflow-x:auto"><table class="tabla"><thead><tr><th>Estudiante</th><th>Estado</th>${ev?crits.map(c=>`<th>${CAT_NOM[c.cat]}s</th>`).join("")+"<th>Nota</th>":"<th>Pasos</th><th>Resultado</th>"}<th></th></tr></thead><tbody>${filas||'<tr><td colspan="7">No hay estudiantes en esta materia.</td></tr>'}</tbody></table></div><p id="entE" class="sub"></p>`;
  d.querySelectorAll("[data-ver]").forEach(b=>b.onclick=()=>{d.close();irA(`#/a/${t.id}/e/${encodeURIComponent(b.dataset.ver)}`)});
  d.querySelectorAll("[data-nota]").forEach(b=>b.onclick=async()=>{const a=por[b.dataset.nota],pr=(a.datos_prueba&&a.datos_prueba.laboral)||{resp:{}};
    if(!confirm("¿Poner la nota con lo que lleva? Lo que no respondió cuenta como incorrecto."))return;b.disabled=true;
    const met=metricasDe(t,pr),nota=memoriaNotaDesdeMetricas(critDe(t).filter(c=>met[c.auto]!=null),met,[]);
    const {error}=await guardarNotaManualActividad(t,b.dataset.nota,nota.puntaje,{respuestas:nota.puntos,porcentaje:nota.porcentaje,datos_prueba:{laboral:{...pr,metricas:met,calificado_por_docente:true,entregado_en:new Date().toISOString()}}});
    if(error){$("#entE").textContent="No se pudo: "+error;b.disabled=false;return}verEntregas(t)})}
// ═══ Guía rápida ═══
const GUIA_HTML=`<p style="color:var(--mut);margin-top:0">Resumen de las publicaciones del Ministerio de Trabajo y Seguridad Social (MTSS) y del Código de Trabajo.</p>
<h4>📝 Contratos de trabajo</h4><ul><li>Hay contrato cuando existen prestación personal del servicio, salario y subordinación jurídica (horario, indicaciones). Puede ser escrito u oral.</li><li>Tipos: por tiempo determinado (a plazo fijo o por obra determinada) y por tiempo indefinido. Si al vencer el plazo el trabajo sigue siendo permanente, se tiene como indefinido.</li><li>Plazo fijo: da vacaciones y aguinaldo proporcionales. Preaviso y cesantía solo en contratos por tiempo indefinido.</li><li>Despido sin responsabilidad patronal: causas del art. 81 (p. ej., faltar 2 días consecutivos). Terminación con responsabilidad patronal por faltas del patrono: art. 83 (p. ej., no pagar el salario a tiempo). Carta de conclusión del contrato a pedido del trabajador (art. 35).</li></ul>
<h4>📢 Preaviso (art. 28)</h4><ul><li>Lo da quien termina la relación sin justa causa: la persona trabajadora al renunciar o el patrono al despedir sin justa causa. Solo en contratos por tiempo indefinido.</li><li>Menos de 3 meses: no hay (período de prueba) · 3 a 6 meses: 1 semana · 6 meses a 1 año: 15 días · más de 1 año: 1 mes.</li><li>Debe darse en tiempo; si no, se paga en dinero. Durante el preaviso hay un día libre pagado por semana para buscar trabajo.</li><li>Cálculo: promedio de los últimos 6 meses ÷ 30 (pago mensual) o ÷ 26 (pago semanal, excepto comercio).</li></ul>
<h4>🛟 Cesantía (art. 29)</h4><ul><li>Se paga cuando el contrato por tiempo indefinido termina con responsabilidad patronal.</li><li>3 a 6 meses: 7 días · 6 meses a 1 año: 14 días · más de 1 año: tabla (año 1: 19,5 · año 2: 20 · año 3: 20,5 · año 4: 21 · año 5: 21,24 · año 6: 21,5 · años 7 a 9: 22 · año 10: 21,5 · año 11: 21 · año 12: 20,5 · año 13 y más: 20 días por año laborado o fracción superior a seis meses).</li><li>Tope: los últimos 8 años. No se le rebajan cargas sociales.</li></ul>
<h4>🏖️ Vacaciones (art. 153 y ss.)</h4><ul><li>Mínimo 2 semanas por cada 50 semanas continuas: 14 días con pago mensual o quincenal (salario ÷ 30 × 14), 12 con pago semanal (salario semanal ÷ 6 × 12); en comercio con pago semanal, salario semanal ÷ 7 × 14.</li><li>Si la relación termina antes de las 50 semanas: 1 día por cada mes trabajado.</li><li>Las fija el patrono dentro de las 15 semanas siguientes. Son incompensables salvo excepciones de ley.</li></ul>
<h4>🎁 Aguinaldo (Ley 2412)</h4><ul><li>Salarios ordinarios y extraordinarios del 1 de diciembre al 30 de noviembre ÷ 12. Se paga en los primeros 20 días de diciembre.</li><li>Solo se le rebaja la pensión alimentaria. Si el contrato termina antes, se paga proporcional.</li></ul>
<h4>🧾 Al terminar la relación</h4><ul><li>Despido con responsabilidad patronal: preaviso, cesantía, vacaciones y aguinaldo proporcionales.</li><li>Renuncia o despido sin responsabilidad patronal: aguinaldo y vacaciones proporcionales.</li><li>Consultas: 800 TRABAJO (800 872 2256) · www.mtss.go.cr</li></ul>`;
$("#bGuia").onclick=()=>{sfx("clic");$("#gt").textContent="📘 Guía rápida (MTSS)";$("#guiaB").innerHTML=GUIA_HTML;$("#guia").showModal()};
$("#bMus").onclick=()=>{E.mus=!E.mus;guardar();stats();musica(E.mus);toast(E.mus?"🎵 Música activada":"🎵 Música en silencio")};
$("#bSfx").onclick=()=>{E.sfx=!E.sfx;guardar();stats();sfx("clic")};
$("#bVoz").onclick=()=>{E.voz=!E.voz;guardar();stats();if(!E.voz)callar();else{if(!window.speechSynthesis)toast("Este navegador no tiene narrador de voz");else hablar("Narrador activado.")}};

document.addEventListener("pointerdown",function una(){if(E.mus)musica(true);document.removeEventListener("pointerdown",una)},{once:true});
stats();render();
