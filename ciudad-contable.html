<style>
/* ═══════════ Ciudad Contable · prototipo 2027 (solo docente) ═══════════
   Empresas de estudiantes y de la IA que transan con documentos comerciales
   (factura y nota de crédito). Calcula descuento e IVA por línea y arma los
   asientos del vendedor y del comprador (inventario perpetuo).
   Prototipo: los datos viven en este navegador (localStorage). */
:root{--bg:#eef3f8;--card:#fff;--ink:#14213d;--mut:#5b6b80;--line:#d9e2ee;--pri:#1d63e8;--pri2:#e7efff;
  --com:#e8590c;--comBg:#fff1e7;--ser:#7048e8;--serBg:#f1edff;--ia:#0b7285;--iaBg:#e3f6f8;--ok:#1f8f55;--okBg:#e5f6ec;--bad:#c2410c;--badBg:#fdeee5;
  --road:#cfd8e3;--grass:#dff0d8}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 30% -10%,#26386b 0%,#0f1830 60%) fixed,#0f1830;color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
header{display:flex;align-items:center;gap:14px;padding:14px 20px;background:rgba(10,16,34,.85);border-bottom:1px solid #26365e;flex-wrap:wrap;color:#fff;position:sticky;top:0;z-index:5;backdrop-filter:blur(6px)}
header .sub{color:#b8c4dc}
header button.ghost{color:#dbe4ff;border-color:#3a4c7d}

h1{font:800 1.45rem/1.1 Lexend,Inter,sans-serif;margin:0}
.sub{color:var(--mut);margin:2px 0 0;font-size:.9rem}
.pill{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:999px;background:#fff6dc;color:#8a6100;margin-left:6px;vertical-align:middle}
.hdr-btns{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
button,.btn{font:600 .9rem Inter,sans-serif;border:0;border-radius:10px;padding:9px 14px;cursor:pointer;background:var(--pri);color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
button.sec,.btn.sec{background:var(--pri2);color:var(--pri)}
button.ghost{background:transparent;color:var(--mut);border:1px solid var(--line)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #9cc0ff;outline-offset:2px}
main{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:18px;padding:18px 20px 90px;max-width:1500px;margin:0 auto}
@media(max-width:980px){main{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}

/* ── Mapa de la ciudad ── */
.city{position:relative;border-radius:14px;overflow:hidden;background:var(--grass);padding:14px;
  background-image:linear-gradient(var(--road),var(--road)),linear-gradient(var(--road),var(--road));

.blocks{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:22px}
.bld{position:relative;text-align:left;background:#fff;color:var(--ink);border:2px solid transparent;border-radius:12px;padding:10px 10px 9px;
  box-shadow:0 2px 0 rgba(20,33,61,.08);display:block;width:100%;font-weight:500}
.bld:hover{transform:translateY(-1px)}
.bld.sel{border-color:var(--pri);box-shadow:0 0 0 3px #cfe0ff}
.bld .roof{height:8px;border-radius:6px 6px 0 0;margin:-10px -10px 8px}
.bld.com .roof{background:var(--com)} .bld.ser .roof{background:var(--ser)} .bld.ia .roof{background:var(--ia)}
.bld .ico{font-size:1.5rem;line-height:1}

@media (prefers-reduced-motion: reduce){.lote .marco{animation:none}.lote .edif,.lote .cartel{transition:none}}
/* ── Panel de empresa ── */
.co-hd{display:flex;gap:12px;align-items:flex-start}

/* ── Editor y comprobante ── */
dialog{border:0;border-radius:18px;padding:0;width:min(980px,calc(100vw - 16px));max-width:calc(100vw - 16px);max-height:92vh;box-shadow:0 30px 80px rgba(20,33,61,.35)}

.dlg-hd h2{margin:0}
.dlg-hd .x{margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
label{display:block;font-size:.8rem;font-weight:600;color:var(--mut)}
select,input{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);margin-top:3px}
.lines td input,.lines td select{margin:0;padding:6px 8px}
.tot{margin-left:auto;width:min(340px,100%);margin-top:10px}
.tot div{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:3px 0;font-variant-numeric:tabular-nums}
.tot .big{font:800 1.1rem Lexend,Inter,sans-serif;border-top:2px solid var(--ink);margin-top:4px;padding-top:6px}
.msg{padding:9px 12px;border-radius:10px;margin:10px 0;font-size:.88rem}
.msg.bad{background:var(--badBg);color:var(--bad)} .msg.ok{background:var(--okBg);color:var(--ok)}
.comp{border:1px solid #b9c6d6;border-radius:12px;padding:16px;background:#fff;font-size:.86rem}
.comp-hd{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:10px}
.comp-hd .t{font:800 1.15rem Lexend,Inter,sans-serif}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.74rem;word-break:break-all}
.water{font-size:.72rem;font-weight:700;color:var(--bad);text-transform:uppercase;letter-spacing:.06em}
.partes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px}
@media(max-width:620px){.partes{grid-template-columns:1fr}}
.partes div{background:#f6f9fc;border-radius:8px;padding:8px 10px}

@media(max-width:760px){.asientos{grid-template-columns:1fr}}
.asiento{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.asiento h4{margin:0 0 6px;font:700 .9rem Lexend,Inter,sans-serif}
.asiento td.hab{padding-left:26px}
.nota{font-size:.78rem;color:var(--mut);margin-top:6px}
@media print{header,.hdr-btns,main,.no-print,#volver-plataforma{display:none!important}dialog{box-shadow:none;width:100%;max-height:none}.dlg{max-height:none}}
</style>

<body>
<header>
  <img src="img/logo-ctp-mercedes-norte.png" alt="Escudo del CTP Mercedes Norte" width="38" height="54">
  <div><h1>🏙️ Ciudad Contable <span class="pill">Prototipo 2027 · solo profe</span></h1>
    <p class="sub">Empresas de estudiantes y de la IA que compran y venden con documentos comerciales</p></div>
  <div class="hdr-btns"><button class="ghost" id="reiniciar" type="button">↺ Reiniciar ciudad</button><a class="btn sec" href="index.html#/2027">← 2027</a></div>
</header>
<main id="app"><p class="muted">Cargando…</p></main>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>

<script>
const SES=(()=>{try{return JSON.parse(sessionStorage.getItem("ctp_lms_session_v2")||"null")}catch(e){return null}})();
const DOCENTE=!!(SES&&SES.role==="docente");
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r2=n=>Math.round((+n||0)*100)/100;
const fm=n=>"₡"+r2(n).toLocaleString("es-CR",{minimumFractionDigits:2,maximumFractionDigits:2});
const hoyISO=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};

/* ═══════════ Catálogo de cuentas (mismos códigos que Aula Contable) ═══════════ */
const CTA={"1101":"Caja general","1102":"Bancos","1103":"Cuentas por cobrar comerciales","1105":"Inventario de mercadería","1106":"IVA soportado (crédito fiscal)",
  "1203":"Mobiliario y equipo","1204":"Vehículos","2101":"Cuentas por pagar comerciales","2102":"IVA por pagar","4101":"Ventas","4102":"Devoluciones y descuentos sobre ventas",
  "4201":"Ingresos por servicios","5101":"Costo de ventas","6106":"Publicidad","6112":"Suministros y materiales","6113":"Fletes y acarreos","6114":"Servicios profesionales y técnicos"};

/* ═══════════ La ciudad inicial (10.°: 2 comerciales + 2 de servicios, y las empresas de la IA) ═══════════
   clase de cada producto: mercaderia | servicio | flete | activo_eq | activo_veh | publicidad */
function ciudadInicial(){
  return {version:1,consec:{},docs:[],empresas:[
   {id:"ferre",tipo:"com",ico:"🔨",nombre:"Ferretería El Clavo S.A.",ced:"3-101-700101",giro:"Venta de materiales y herramientas",bancos:3000000,
    prods:[{id:"f1",det:"Martillo de uña 16 oz",cabys:"4621001000100",tarifa:13,precio:6500,costo:4200,clase:"mercaderia",stock:40},
           {id:"f2",det:"Caja de tornillos 1\" (100 u)",cabys:"4621002000200",tarifa:13,precio:3200,costo:1900,clase:"mercaderia",stock:60},
           {id:"f3",det:"Saco de cemento 50 kg",cabys:"4621003000300",tarifa:13,precio:7800,costo:6100,clase:"mercaderia",stock:30}]},
   {id:"libre",tipo:"com",ico:"📚",nombre:"Librería La Pluma S.A.",ced:"3-101-700202",giro:"Venta de útiles y libros",bancos:2500000,
    prods:[{id:"l1",det:"Resma de papel carta",cabys:"4649001000100",tarifa:13,precio:3900,costo:2700,clase:"mercaderia",stock:80},
           {id:"l2",det:"Libro de texto de Contabilidad",cabys:"4761001000200",tarifa:0,precio:12000,costo:8000,clase:"mercaderia",stock:25,exento:"Libro exento de IVA en este caso de práctica"},
           {id:"l3",det:"Caja de lapiceros (12 u)",cabys:"4649002000300",tarifa:13,precio:2400,costo:1500,clase:"mercaderia",stock:50}]},
   {id:"conta",tipo:"ser",ico:"🧮",nombre:"Conta Express S.A.",ced:"3-101-700303",giro:"Servicios de contabilidad",bancos:1800000,
    prods:[{id:"c1",det:"Servicio de contabilidad mensual",cabys:"8211001000100",tarifa:13,precio:85000,clase:"servicio"},
           {id:"c2",det:"Declaración de IVA",cabys:"8211002000200",tarifa:13,precio:30000,clase:"servicio"}]},
   {id:"mante",tipo:"ser",ico:"🛠️",nombre:"Mantenimiento Total S.A.",ced:"3-101-700404",giro:"Mantenimiento de edificios",bancos:1600000,
    prods:[{id:"m1",det:"Mantenimiento eléctrico (visita)",cabys:"4321001000100",tarifa:13,precio:45000,clase:"servicio"},
           {id:"m2",det:"Pintura de local (por día)",cabys:"4334001000200",tarifa:13,precio:60000,clase:"servicio"}]},
   {id:"mayo",tipo:"ia",ico:"🏭",nombre:"Mayorista del Norte (IA)",ced:"3-101-900001",giro:"Venta al por mayor de mercadería",
    prods:[{id:"y1",det:"Martillo de uña 16 oz (mayoreo)",cabys:"4621001000100",tarifa:13,precio:4200,clase:"mercaderia",para:"ferre",ref:"f1"},
           {id:"y2",det:"Saco de cemento 50 kg (mayoreo)",cabys:"4621003000300",tarifa:13,precio:6100,clase:"mercaderia",para:"ferre",ref:"f3"},
           {id:"y3",det:"Resma de papel carta (mayoreo)",cabys:"4649001000100",tarifa:13,precio:2700,clase:"mercaderia",para:"libre",ref:"l1"},
           {id:"y4",det:"Libro de texto de Contabilidad (mayoreo)",cabys:"4761001000200",tarifa:0,precio:8000,clase:"mercaderia",para:"libre",ref:"l2"}]},
   {id:"trans",tipo:"ia",ico:"🚚",nombre:"Transportes Rápidos (IA)",ced:"3-101-900002",giro:"Transporte de carga",
    prods:[{id:"t1",det:"Flete de mercadería (por viaje)",cabys:"4923001000100",tarifa:13,precio:25000,clase:"flete"}]},
   {id:"equip",tipo:"ia",ico:"🖥️",nombre:"Equipos y Más (IA)",ced:"3-101-900003",giro:"Venta de mobiliario, equipo y vehículos",
    prods:[{id:"e1",det:"Computadora de escritorio",cabys:"4651001000100",tarifa:13,precio:450000,clase:"activo_eq"},
           {id:"e2",det:"Escritorio de oficina",cabys:"4659001000200",tarifa:13,precio:120000,clase:"activo_eq"},
           {id:"e3",det:"Motocicleta de reparto",cabys:"4540001000300",tarifa:13,precio:1800000,clase:"activo_veh"}]},
   {id:"publi",tipo:"ia",ico:"📣",nombre:"Publicidad Creativa (IA)",ced:"3-101-900004",giro:"Servicios de publicidad",
    prods:[{id:"p1",det:"Campaña en redes sociales (mes)",cabys:"7310001000100",tarifa:13,precio:70000,clase:"publicidad"}]},
   {id:"clien",tipo:"ia",ico:"👥",nombre:"Clientes de la ciudad (IA)",ced:"",giro:"Personas y negocios que compran a las empresas",prods:[]},
   {id:"banco",tipo:"ia",ico:"🏦",nombre:"Banco de la Ciudad (IA)",ced:"4-000-900005",giro:"Depósitos y préstamos (próxima etapa)",prods:[]},
   {id:"hacie",tipo:"ia",ico:"🏛️",nombre:"Hacienda (IA)",ced:"",giro:"Revisa documentos y audita (próxima etapa)",prods:[]}
  ]};
}
const TIPO={com:["Comercial","com"],ser:["Servicios","ser"],ia:["Empresa de la IA","ia"]};
const KEY="ciudad_contable_proto_v1";
let S=null; try{S=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){S=null}
if(!S||S.version!==1)S=ciudadInicial();
const guardar=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const emp=id=>S.empresas.find(e=>e.id===id);
const lleva=e=>e&&e.tipo!=="ia";   // las empresas de la IA no llevan contabilidad en el juego
let SEL="ferre", TAB="emitidos";

/* ═══════════ Cálculo de un documento ═══════════
   Por línea: cantidad × precio = monto; − descuento = subtotal; subtotal × tarifa = IVA; subtotal + IVA = total. */
function calcular(lineas){
  const L=lineas.map(l=>{const monto=r2(l.cant*l.precio),desc=r2(monto*(l.descPct||0)/100),sub=r2(monto-desc),iva=r2(sub*l.tarifa/100);return {...l,monto,desc,sub,iva,total:r2(sub+iva)}});
  const s=k=>r2(L.reduce((t,x)=>t+x[k],0));
  return {lineas:L,monto:s("monto"),desc:s("desc"),sub:s("sub"),iva:s("iva"),total:s("total"),
    gravado:r2(L.filter(x=>x.tarifa>0).reduce((t,x)=>t+x.sub,0)),exento:r2(L.filter(x=>!x.tarifa).reduce((t,x)=>t+x.sub,0))};
}

/* ═══════════ Asientos que salen de cada documento ═══════════ */
function ctaCompra(clase,comprador){
  if(clase==="mercaderia")return comprador.tipo==="com"?"1105":"6112";
  if(clase==="flete")return comprador.tipo==="com"?"1105":"6113";   // NIC 2: el flete de la mercadería es parte del costo
  if(clase==="activo_eq")return "1203";
  if(clase==="activo_veh")return "1204";
  if(clase==="publicidad")return "6106";
  return "6114";
}
const ctaVenta=clase=>clase==="mercaderia"?"4101":"4201";
function agrupar(L){const m={};L.forEach(([c,d,h])=>{const k=c+(d?"D":"H");m[k]=m[k]||[c,0,0];m[k][1]+=d;m[k][2]+=h});
  return Object.values(m).map(([c,d,h])=>[c,r2(d),r2(h)]).filter(x=>x[1]||x[2]).sort((a,b)=>(b[1]?1:0)-(a[1]?1:0));}
function asientos(doc){
  const V=emp(doc.emisor),C=emp(doc.receptor),T=doc.calc,cred=doc.condicion==="credito",nc=doc.tipo==="NC",out={};
  const cobro=cred?"1103":"1102",pago=cred?"2101":"1102";
  if(lleva(V)){
    const L=[];
    if(!nc){L.push([cobro,T.total,0]);T.lineas.forEach(l=>L.push([ctaVenta(l.clase),0,l.sub]));if(T.iva)L.push(["2102",0,T.iva]);}
    else{T.lineas.forEach(l=>L.push(["4102",l.sub,0]));if(T.iva)L.push(["2102",T.iva,0]);L.push([cobro,0,T.total]);}
    const costo=r2(T.lineas.filter(l=>l.clase==="mercaderia").reduce((t,l)=>t+l.cant*(l.costo||0),0));
    const out2=costo?(nc?[["1105",costo,0],["5101",0,costo]]:[["5101",costo,0],["1105",0,costo]]):null;
    out.vendedor={emp:V,lineas:agrupar(L),costo:out2,costoMonto:costo};
  }
  if(lleva(C)){
    const L=[];
    if(!nc){T.lineas.forEach(l=>L.push([ctaCompra(l.clase,C),l.sub,0]));if(T.iva)L.push(["1106",T.iva,0]);L.push([pago,0,T.total]);}
    else{L.push([pago,T.total,0]);T.lineas.forEach(l=>L.push([ctaCompra(l.clase,C),0,l.sub]));if(T.iva)L.push(["1106",0,T.iva]);}
    out.comprador={emp:C,lineas:agrupar(L)};
  }
  return out;
}

/* ═══════════ Clave y consecutivo (formato de práctica, inspirado en la versión 4.4) ═══════════ */
function numerar(doc){
  const t=doc.tipo==="NC"?"03":"01";S.consec[doc.emisor+t]=(S.consec[doc.emisor+t]||0)+1;
  const consecutivo="001"+"00001"+t+String(S.consec[doc.emisor+t]).padStart(10,"0");
  const [y,m,d]=doc.fecha.split("-"),ced=(emp(doc.emisor).ced||"").replace(/\D/g,"").padStart(12,"0");
  let h=0;for(const ch of doc.emisor+consecutivo+doc.fecha)h=(h*31+ch.charCodeAt(0))>>>0;
  return {consecutivo,clave:"506"+d+m+y.slice(2)+ced+consecutivo+"1"+String(h%1e8).padStart(8,"0")};
}

/* ═══════════ Vista principal ═══════════ */
function saldoDe(e){ // saldos rápidos que salen de los documentos (prototipo)
  let cxc=0,cxp=0,ivaP=0,ivaS=0,vent=0;
  S.docs.forEach(d=>{const s=d.tipo==="NC"?-1:1,T=d.calc;
    if(d.emisor===e.id){vent+=s*T.sub;ivaP+=s*T.iva;if(d.condicion==="credito")cxc+=s*T.total}
    if(d.receptor===e.id){ivaS+=s*T.iva;if(d.condicion==="credito")cxp+=s*T.total}});
  return {cxc:r2(cxc),cxp:r2(cxp),ivaP:r2(ivaP),ivaS:r2(ivaS),vent:r2(vent)};
}

  return g+`<text x="${cx}" y="${y+BH-6}" text-anchor="middle" font-size="11" font-weight="700" fill="#1b4332">Parque central</text>`;

function calles(){
  let g=`<rect width="${MW}" height="${MH}" fill="#4b5260"/>`;
  const hy=[0,1,2,3].map(r=>RD/2+r*(BH+RD)),vx=[0,1,2,3,4].map(c=>RD/2+c*(BW+RD));
  hy.forEach(y=>g+=`<line x1="0" y1="${y}" x2="${MW}" y2="${y}" stroke="#f8d548" stroke-width="2" stroke-dasharray="16 12"/>`);
  vx.forEach(x=>g+=`<line x1="${x}" y1="0" x2="${x}" y2="${MH}" stroke="#f8d548" stroke-width="2" stroke-dasharray="16 12"/>`);
  vx.forEach(x=>hy.forEach(y=>{g+=`<rect x="${x-RD/2}" y="${y-RD/2}" width="${RD}" height="${RD}" fill="#4b5260"/>`;
    for(let i=0;i<5;i++){const o=-RD/2+4+i*7.5;
      g+=`<rect x="${x+o}" y="${y-RD/2-12}" width="4" height="10" fill="#f1f3f5"/><rect x="${x+o}" y="${y+RD/2+2}" width="4" height="10" fill="#f1f3f5"/>`;

function carros(){
  const hy=r=>RD/2+r*(BH+RD),vx=c=>RD/2+c*(BW+RD),C=[];
  const car=(col,path,dur,beg)=>{const body=`<rect x="-13" y="-7" width="26" height="14" rx="4" fill="${col}"/><rect x="2" y="-5.5" width="7" height="11" rx="2" fill="#1c2a3a" opacity=".8"/><rect x="-10" y="-5.5" width="5" height="11" rx="2" fill="#1c2a3a" opacity=".55"/>`;
    if(reducido){const m=path.match(/M\s*(-?[\d.]+)\s+(-?[\d.]+)/);return `<g transform="translate(${Math.max(30,Math.min(MW-30,+m[1]))},${Math.max(30,Math.min(MH-30,+m[2]))})">${body}</g>`}
    return `<g>${body}<animateMotion dur="${dur}s" begin="${beg}s" repeatCount="indefinite" rotate="auto" path="${path}"/></g>`;};
  C.push(car("#fa5252",`M -40 ${hy(1)+9} H ${MW+40}`,11,0),car("#228be6",`M ${MW+40} ${hy(1)-9} H -40`,13,-4),car("#fcc419",`M -40 ${hy(2)+9} H ${MW+40}`,9,-2),

function peatones(){

    ["clien",20,-3,"#f76707"],["banco",27,-17,"#0ca678"],["hacie",25,-11,"#d6336c"],["publi",23,-8,"#228be6"],["equip",29,-20,"#fab005"]];
  return P.map(([id,dur,beg,col],i)=>{const [c,r]=MAPA[id],x=bx(c)+4,y=by(r)+4,w=BW-8,h=BH-8,inv=i%2;
    const path=inv?`M ${x} ${y} V ${y+h} H ${x+w} V ${y} Z`:`M ${x} ${y} H ${x+w} V ${y+h} H ${x} Z`;
    const cuerpo=`<ellipse cx="1.5" cy="2" rx="7" ry="5.5" fill="rgba(0,0,0,.2)"/><ellipse cx="0" cy="0" rx="7" ry="5.5" fill="${col}" stroke="#fff" stroke-width="1.2"/><circle cx="0" cy="0" r="3.6" fill="#f3c48c" stroke="#5c3d1e" stroke-width="1"/>`;

    return `<g>${cuerpo}<animateMotion dur="${dur}s" begin="${beg}s" repeatCount="indefinite" path="${path}"/></g>`;}).join("");
}
/* Animación al emitir: el documento viaja de quien vende a quien compra y las monedas vuelven con el monto. */
function centroLote(id){const m=MAPA[id];return m?[bx(m[0])+BW/2,by(m[1])+56]:null}
function animarTransaccion(doc,listo){
  const svg=document.querySelector("svg.mapa"),A=centroLote(doc.emisor),B=centroLote(doc.receptor);
  if(reducido||!svg||!A||!B){listo();return}
  const NS="http://www.w3.org/2000/svg",capa=document.createElementNS(NS,"g");capa.setAttribute("pointer-events","none");svg.appendChild(capa);
  const nc=doc.tipo==="NC",cred=doc.condicion==="credito";
  const anillo=([x,y],col)=>{const c=document.createElementNS(NS,"circle");c.setAttribute("cx",x);c.setAttribute("cy",y);c.setAttribute("fill","none");c.setAttribute("stroke",col);c.setAttribute("stroke-width","6");capa.appendChild(c);return c};
  const emoji=(t,size)=>{const e=document.createElementNS(NS,"text");e.textContent=t;e.setAttribute("font-size",size);e.setAttribute("text-anchor","middle");e.setAttribute("dominant-baseline","middle");capa.appendChild(e);return e};
  const arco=(P,Q,t)=>{const mx=(P[0]+Q[0])/2,my=Math.min(P[1],Q[1])-110,u=1-t;return [u*u*P[0]+2*u*t*mx+t*t*Q[0],u*u*P[1]+2*u*t*my+t*t*Q[1]]};
  const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
  const r1=anillo(A,"#ffd43b"),r2=anillo(B,"#ffd43b");
  const papel=emoji(nc?"↩️":"🧾",40);
  const monedas=[0,1,2,3,4].map(()=>emoji(cred?"⏳":"🪙",28));
  const etiqueta=emoji("",22);etiqueta.setAttribute("font-weight","800");etiqueta.setAttribute("stroke","#14213d");etiqueta.setAttribute("stroke-width","5");etiqueta.setAttribute("paint-order","stroke");
  // la factura va al comprador; el dinero (o la cuenta por cobrar) va al vendedor. En la nota de crédito, al revés.
  const desdeDoc=A,haciaDoc=B,desdeDin=nc?A:B,haciaDin=nc?B:A;
  etiqueta.textContent=(nc?"− ":cred?"Por cobrar ":"+ ")+fm(doc.calc.total);etiqueta.setAttribute("fill",nc?"#ff8787":cred?"#ffd43b":"#69db7c");
  const T0=performance.now(),DUR=2300;
  const paso=now=>{const t=(now-T0)/DUR;
    [[r1,0],[r2,.35]].forEach(([r,d])=>{const k=Math.max(0,Math.min(1,(t-d)/.4));r.setAttribute("r",20+k*60);r.setAttribute("opacity",k?1-k:0)});
    const kd=Math.max(0,Math.min(1,t/.45)),pd=arco(desdeDoc,haciaDoc,ease(kd));papel.setAttribute("x",pd[0]);papel.setAttribute("y",pd[1]);papel.setAttribute("opacity",kd<1?1:Math.max(0,1-(t-.45)*6));
    monedas.forEach((m,i)=>{const k=Math.max(0,Math.min(1,(t-.42-i*.06)/.42)),pm=arco(desdeDin,haciaDin,ease(k));m.setAttribute("x",pm[0]+(i-2)*6);m.setAttribute("y",pm[1]);m.setAttribute("opacity",k>0&&k<1?1:0)});
    const ke=Math.max(0,Math.min(1,(t-.8)/.2));etiqueta.setAttribute("x",haciaDin[0]);etiqueta.setAttribute("y",Math.max(26,haciaDin[1]-30-ke*30));etiqueta.setAttribute("opacity",t<.8?0:t>.97?Math.max(0,(1-t)/.03):1);
    if(t<1)requestAnimationFrame(paso);else{capa.remove();listo()}};
  requestAnimationFrame(paso);
}

function editorFactura(){
  const E=emp(SEL);
  const receptores=S.empresas.filter(x=>x.id!==E.id&&x.id!=="hacie"&&x.id!=="banco");
  const sugerido=E.tipo==="ia"?(receptores.find(x=>x.tipo!=="ia"&&E.prods.some(p=>p.para===x.id))||receptores.find(x=>x.tipo!=="ia")):emp("clien");
  let L=[{prod:E.prods[0].id,cant:1,descPct:0}];
  const prod=id=>E.prods.find(p=>p.id===id);
  const html=()=>{
    const lin=L.map(l=>{const p=prod(l.prod);return {...l,det:p.det,cabys:p.cabys,precio:p.precio,tarifa:p.tarifa,clase:p.clase,costo:p.costo}}),T=calcular(lin);
    return `<div class="dlg-hd"><span style="font-size:1.6rem">🧾</span><h2>Factura electrónica · ${esc(E.nombre)}</h2><button type="button" class="ghost x">Cerrar ✕</button></div>
      <div class="grid"><label>Cliente (receptor)<select id="fRec">${receptores.map(x=>`<option value="${x.id}" ${x.id===(html.rec||sugerido.id)?"selected":""}>${esc(x.nombre)}</option>`).join("")}</select></label>
        <label>Fecha<input id="fFecha" type="date" value="${html.fecha||hoyISO()}"></label>
        <label>Condición de venta<select id="fCond"><option value="contado" ${html.cond!=="credito"?"selected":""}>Contado</option><option value="credito" ${html.cond==="credito"?"selected":""}>Crédito a 30 días</option></select></label>
        <label>Medio de pago<select id="fMedio">${["Transferencia","SINPE Móvil","Efectivo","Tarjeta"].map(m=>`<option ${m===html.medio?"selected":""}>${m}</option>`).join("")}</select></label></div>
      <h3>Líneas</h3><div style="overflow-x:auto"><table class="lines"><thead><tr><th style="min-width:220px">Producto o servicio</th><th class="r" style="width:80px">Cant.</th><th class="r">Precio</th><th class="r" style="width:90px">Desc. %</th><th class="r">Subtotal</th><th class="r">IVA</th><th class="r">Total</th><th></th></tr></thead><tbody>
      ${T.lineas.map((l,i)=>`<tr><td><select data-l="${i}" data-k="prod">${E.prods.map(p=>`<option value="${p.id}" ${p.id===l.prod?"selected":""}>${esc(p.det)}</option>`).join("")}</select><div class="nota">CABYS ${esc(l.cabys)} · ${l.tarifa?"IVA "+l.tarifa+" %":"Exento"}</div></td>
        <td><input data-l="${i}" data-k="cant" type="number" min="1" step="1" value="${l.cant}" inputmode="numeric" style="text-align:right"></td><td class="r">${fm(l.precio)}</td>
        <td><input data-l="${i}" data-k="descPct" type="number" min="0" max="100" step="any" value="${l.descPct}" inputmode="decimal" style="text-align:right"></td>
        <td class="r">${fm(l.sub)}</td><td class="r">${fm(l.iva)}</td><td class="r"><b>${fm(l.total)}</b></td><td>${L.length>1?`<button type="button" class="ghost" data-del="${i}" aria-label="Quitar línea">✕</button>`:""}</td></tr>`).join("")}</tbody></table></div>
      <button type="button" class="sec" id="fAdd" style="margin-top:8px">＋ Agregar línea</button>
      <div class="tot"><div><span>Monto</span><span>${fm(T.monto)}</span></div><div><span>Descuentos</span><span>− ${fm(T.desc)}</span></div><div><span>Subtotal neto</span><span>${fm(T.sub)}</span></div>
        <div class="muted"><span>Gravado · Exento</span><span>${fm(T.gravado)} · ${fm(T.exento)}</span></div><div><span>IVA</span><span>${fm(T.iva)}</span></div><div class="big"><span>Total</span><span>${fm(T.total)}</span></div></div>
      <div id="fMsg"></div><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px"><button type="button" id="fEmitir">✅ Emitir factura</button></div>`;
  };
  const leer=()=>{html.rec=$("#fRec").value;html.fecha=$("#fFecha").value;html.cond=$("#fCond").value;html.medio=$("#fMedio").value};
  const repintar=()=>{abrir(html());ligar()};
  const ligar=()=>{
    document.querySelectorAll("#dlgBody [data-l]").forEach(inp=>inp.onchange=()=>{leer();const l=L[+inp.dataset.l],k=inp.dataset.k;l[k]=k==="prod"?inp.value:Math.max(0,+inp.value||0);if(k==="descPct")l[k]=Math.min(100,l[k]);if(k==="cant")l[k]=Math.max(1,Math.round(l[k]));repintar()});
    document.querySelectorAll("#dlgBody [data-del]").forEach(b=>b.onclick=()=>{leer();L.splice(+b.dataset.del,1);repintar()});
    ["#fRec","#fFecha","#fCond","#fMedio"].forEach(s=>$(s).onchange=leer);
    $("#fAdd").onclick=()=>{leer();L.push({prod:E.prods[0].id,cant:1,descPct:0});repintar()};
    $("#fEmitir").onclick=()=>{leer();
      const lin=L.map(l=>{const p=prod(l.prod);return {prod:p.id,det:p.det,cabys:p.cabys,precio:p.precio,tarifa:p.tarifa,clase:p.clase,costo:p.costo||0,cant:l.cant,descPct:l.descPct||0}});
      if(E.tipo==="com"){const falta=lin.find(l=>{const p=prod(l.prod);return l.clase==="mercaderia"&&lin.filter(x=>x.prod===l.prod).reduce((t,x)=>t+x.cant,0)>p.stock});
        if(falta){$("#fMsg").innerHTML=`<div class="msg bad">No hay suficiente existencia de «${esc(falta.det)}» (quedan ${prod(falta.prod).stock}).</div>`;return}}
      const doc={id:"d"+Date.now(),tipo:"FE",emisor:E.id,receptor:html.rec,fecha:html.fecha||hoyISO(),condicion:html.cond,medio:html.medio,calc:calcular(lin)};
      Object.assign(doc,numerar(doc));
      moverExistencias(doc,1);S.docs.push(doc);guardar();$("#dlg").close();pintar();animarTransaccion(doc,()=>verDoc(doc.id,true));
    };
  };
  repintar();
}
/* Inventario perpetuo: la venta saca existencias del vendedor; la compra de mercadería al mayorista las suma al comprador. */
function moverExistencias(doc,signo){
  const V=emp(doc.emisor),C=emp(doc.receptor),nc=doc.tipo==="NC"?-1:1;
  doc.calc.lineas.forEach(l=>{if(l.clase!=="mercaderia")return;
    if(V.tipo==="com"){const p=V.prods.find(x=>x.id===l.prod);if(p)p.stock-=nc*signo*l.cant}
    if(C&&C.tipo==="com"){const src=V.prods.find(x=>x.id===l.prod),p=src&&src.ref?C.prods.find(x=>x.id===src.ref):null;if(p)p.stock+=nc*signo*l.cant}});
}

/* ═══════════ Nota de crédito (devolución sobre una factura) ═══════════ */
function editorNC(){
  const E=emp(SEL),facts=S.docs.filter(d=>d.emisor===E.id&&d.tipo==="FE");
  let F=facts[facts.length-1],dev={};
  const html=()=>{
    const ya=id=>S.docs.filter(d=>d.tipo==="NC"&&d.ref===F.id).reduce((t,d)=>t+(d.calc.lineas.find(x=>x.prod===id)||{cant:0}).cant,0);
    const lin=F.calc.lineas.map(l=>({...l,cant:Math.min(+dev[l.prod]||0,l.cant-ya(l.prod))})).filter(l=>l.cant>0);
    const T=calcular(lin);
    return `<div class="dlg-hd"><span style="font-size:1.6rem">↩️</span><h2>Nota de crédito · ${esc(E.nombre)}</h2><button type="button" class="ghost x">Cerrar ✕</button></div>
      <div class="grid"><label>Factura que se corrige<select id="nFac">${facts.map(d=>`<option value="${d.id}" ${d.id===F.id?"selected":""}>…${d.consecutivo.slice(-6)} · ${esc(emp(d.receptor).nombre)} · ${fm(d.calc.total)}</option>`).join("")}</select></label>
        <label>Motivo<select id="nMot"><option>Devolución de mercadería</option><option>Servicio no prestado completo</option><option>Error en la factura</option></select></label></div>
      <h3>¿Cuánto se devuelve o se rebaja?</h3><div class="scroll"><table><thead><tr><th>Línea de la factura</th><th class="r">Facturado</th><th class="r">Ya devuelto</th><th class="r" style="width:110px">Cantidad</th></tr></thead><tbody>
      ${F.calc.lineas.map(l=>`<tr><td>${esc(l.det)}<div class="nota">${fm(l.precio)} c/u${l.descPct?` · desc. ${l.descPct} %`:""} · ${l.tarifa?"IVA "+l.tarifa+" %":"Exento"}</div></td><td class="r">${l.cant}</td><td class="r">${ya(l.prod)}</td>
        <td><input data-dev="${l.prod}" type="number" min="0" max="${l.cant-ya(l.prod)}" step="1" value="${dev[l.prod]||0}" inputmode="numeric" style="text-align:right"></td></tr>`).join("")}</tbody></table></div>
      <p class="nota">La nota de crédito usa el mismo precio, descuento y tarifa de IVA de la factura original, en la proporción devuelta.</p>
      <div class="tot"><div><span>Subtotal neto</span><span>${fm(T.sub)}</span></div><div><span>IVA</span><span>${fm(T.iva)}</span></div><div class="big"><span>Total de la nota</span><span>${fm(T.total)}</span></div></div>
      <div id="nMsg"></div><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px"><button type="button" id="nEmitir" ${T.total?"":"disabled"}>✅ Emitir nota de crédito</button></div>`;
  };
  const repintar=()=>{abrir(html());
    $("#nFac").onchange=ev=>{F=facts.find(d=>d.id===ev.target.value);dev={};repintar()};
    document.querySelectorAll("#dlgBody [data-dev]").forEach(i=>i.onchange=()=>{dev[i.dataset.dev]=Math.max(0,Math.min(+i.max,Math.round(+i.value||0)));repintar()});
    $("#nEmitir").onclick=()=>{
      const ya=id=>S.docs.filter(d=>d.tipo==="NC"&&d.ref===F.id).reduce((t,d)=>t+(d.calc.lineas.find(x=>x.prod===id)||{cant:0}).cant,0);
      const lin=F.calc.lineas.map(l=>({prod:l.prod,det:l.det,cabys:l.cabys,precio:l.precio,tarifa:l.tarifa,clase:l.clase,costo:l.costo,descPct:l.descPct,cant:Math.min(+dev[l.prod]||0,l.cant-ya(l.prod))})).filter(l=>l.cant>0);
      if(!lin.length)return;
      const doc={id:"d"+Date.now(),tipo:"NC",ref:F.id,refConsec:F.consecutivo,motivo:$("#nMot").value,emisor:E.id,receptor:F.receptor,fecha:hoyISO(),condicion:F.condicion,medio:F.medio,calc:calcular(lin)};
      Object.assign(doc,numerar(doc));moverExistencias(doc,1);S.docs.push(doc);guardar();$("#dlg").close();pintar();animarTransaccion(doc,()=>verDoc(doc.id,true));
    };
  };
  repintar();
}

/* ═══════════ Ver el comprobante y sus asientos ═══════════ */
function tablaAsiento(L){
  const td=r2(L.reduce((t,x)=>t+x[1],0)),th=r2(L.reduce((t,x)=>t+x[2],0));
  return `<div class="scroll"><table><thead><tr><th>Cuenta</th><th class="r">Debe</th><th class="r">Haber</th></tr></thead><tbody>
    ${L.map(([c,d,h])=>`<tr><td class="${h?"hab":""}">${c} ${esc(CTA[c]||"")}</td><td class="r">${d?fm(d):""}</td><td class="r">${h?fm(h):""}</td></tr>`).join("")}
    <tr><td><b>Sumas iguales</b></td><td class="r"><b>${fm(td)}</b></td><td class="r"><b>${fm(th)}</b></td></tr></tbody></table></div>`;
}
function verDoc(id,recien){
  const d=S.docs.find(x=>x.id===id),V=emp(d.emisor),C=emp(d.receptor),T=d.calc,A=asientos(d),nc=d.tipo==="NC";
  abrir(`<div class="dlg-hd no-print"><span style="font-size:1.6rem">${nc?"↩️":"🧾"}</span><h2>${nc?"Nota de crédito":"Factura"} emitida</h2><button type="button" class="sec" id="imp">🖨️ Imprimir</button><button type="button" class="ghost x">Cerrar ✕</button></div>
    ${recien?`<div class="msg ok no-print">✅ ${nc?"Nota de crédito":"Factura"} emitida. Abajo están los asientos que le tocan a cada empresa.</div>`:""}
    <div class="comp"><div class="comp-hd"><div><div class="t">${nc?"NOTA DE CRÉDITO ELECTRÓNICA":"FACTURA ELECTRÓNICA"}</div><div class="water">Documento didáctico · sin validez tributaria</div></div>
      <div style="text-align:right"><div><b>Consecutivo</b> <span class="mono">${d.consecutivo}</span></div><div><b>Fecha</b> ${d.fecha}</div></div></div>
      <div class="mono" style="margin-bottom:10px"><b>Clave:</b> ${d.clave}</div>
      <div class="partes"><div><small class="muted">EMISOR</small><br><b>${esc(V.nombre)}</b><br>Cédula jurídica ${esc(V.ced)}<br>${esc(V.giro)}</div>
        <div><small class="muted">RECEPTOR</small><br><b>${esc(C.nombre)}</b><br>${C.ced?"Cédula jurídica "+esc(C.ced):"Consumidor final"}</div></div>
      ${nc?`<div style="margin-bottom:8px"><b>Referencia:</b> factura <span class="mono">${d.refConsec}</span> · <b>Motivo:</b> ${esc(d.motivo)}</div>`:""}
      <div style="margin-bottom:8px"><b>Condición:</b> ${d.condicion==="credito"?"Crédito a 30 días":"Contado"} · <b>Medio de pago:</b> ${esc(d.medio)}</div>
      <div style="overflow-x:auto"><table><thead><tr><th>Cant.</th><th>Detalle</th><th>CABYS</th><th class="r">Precio</th><th class="r">Desc.</th><th class="r">Subtotal</th><th class="r">IVA</th><th class="r">Total</th></tr></thead><tbody>
        ${T.lineas.map(l=>`<tr><td>${l.cant}</td><td>${esc(l.det)}</td><td class="mono">${esc(l.cabys)}</td><td class="r">${fm(l.precio)}</td><td class="r">${l.desc?fm(l.desc):""}</td><td class="r">${fm(l.sub)}</td><td class="r">${l.tarifa?fm(l.iva)+` <small class="muted">(${l.tarifa} %)</small>`:"Exento"}</td><td class="r">${fm(l.total)}</td></tr>`).join("")}</tbody></table></div>
      <div class="tot"><div><span>Total gravado</span><span>${fm(T.gravado)}</span></div><div><span>Total exento</span><span>${fm(T.exento)}</span></div><div><span>Total descuentos</span><span>${fm(T.desc)}</span></div><div><span>Total IVA</span><span>${fm(T.iva)}</span></div><div class="big"><span>Total del comprobante</span><span>${fm(T.total)}</span></div></div></div>
    <h3>Asientos contables</h3>
    <div class="asientos">
      ${A.vendedor?`<div class="asiento"><h4>${esc(V.nombre)} · ${nc?"devolución sobre venta":"venta"}</h4>${tablaAsiento(A.vendedor.lineas)}
        ${A.vendedor.costo?`<div class="nota">Inventario perpetuo: ${nc?"vuelve al inventario":"sale del inventario"} el costo de la mercadería (${fm(A.vendedor.costoMonto)}).</div>${tablaAsiento(A.vendedor.costo)}`:""}</div>`
        :`<div class="asiento"><h4>${esc(V.nombre)}</h4><p class="muted" style="font-size:.86rem">Empresa de la IA: no lleva contabilidad en el juego.</p></div>`}
      ${A.comprador?`<div class="asiento"><h4>${esc(C.nombre)} · ${nc?"devolución sobre compra":"compra"}</h4>${tablaAsiento(A.comprador.lineas)}
        ${T.lineas.some(l=>l.clase==="flete")&&C.tipo==="com"?'<div class="nota">El flete se suma al costo del inventario (NIC 2).</div>':""}
        ${T.lineas.some(l=>l.clase.startsWith("activo"))?'<div class="nota">El activo se registra sin el IVA, que se recupera como crédito fiscal (NIC 16).</div>':""}</div>`
        :`<div class="asiento"><h4>${esc(C.nombre)}</h4><p class="muted" style="font-size:.86rem">${C.id==="clien"?"Clientes de la ciudad: no llevan contabilidad.":"Empresa de la IA: no lleva contabilidad en el juego."}</p></div>`}
    </div>`);
  $("#imp").onclick=()=>window.print();
}

$("#reiniciar").onclick=()=>{if(!confirm("¿Reiniciar la ciudad del prototipo? Se borran los documentos de prueba de este navegador."))return;
  try{localStorage.removeItem(KEY)}catch(e){} S=ciudadInicial();SEL="ferre";TAB="emitidos";pintar()};
pintar();
</script>
