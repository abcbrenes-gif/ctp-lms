<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Entregas por OneDrive · 2027</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="img/logo-ctp-mercedes-norte.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js?v=20261116b"></script>
<style>
:root{--bg:#F5F7FB;--sf:#fff;--ink:#0F172A;--mut:#5B6B80;--line:#DCE3EE;--pri:#1F3864;--acc:#1d63e8;--okS:#DDF1DC;--wa:#FFF2D6;--bad:#FDE2E2}
@media (prefers-color-scheme:dark){:root{--bg:#0B1020;--sf:#121A30;--ink:#E8EDFB;--mut:#9AA9CC;--line:#26324F;--pri:#9DB7F5;--okS:#173A28;--wa:#3A2E10;--bad:#4a1616}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,"Segoe UI",system-ui,sans-serif;padding-bottom:90px}
header{background:#14213d;color:#fff;padding:14px 20px}header h1{margin:0;font-size:1.25rem}header p{margin:2px 0 0;opacity:.85;font-size:.88rem}
.pill{background:#ffd43b;color:#14213d;border-radius:999px;padding:2px 10px;font-size:.72rem;font-weight:800;vertical-align:middle}
main{max-width:960px;margin:0 auto;padding:16px}.card{background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:18px;margin:0 0 14px}
h2{margin:0 0 8px;font-size:1.1rem;color:var(--pri)}.mut{color:var(--mut);font-size:.86rem}
.btn{display:inline-block;background:var(--acc);color:#fff;border:0;border-radius:10px;padding:8px 13px;font:600 .88rem inherit;cursor:pointer;margin:4px 6px 4px 0;text-decoration:none}.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.sm{padding:4px 9px;font-size:.8rem}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--sf);color:var(--ink);width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}label{font-size:.85rem;color:var(--mut)}
.tag{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.75rem;font-weight:700;background:var(--line)}.tag.ok{background:var(--okS)}.tag.wa{background:var(--wa)}.tag.bad{background:var(--bad)}
table{border-collapse:collapse;width:100%;font-size:.86rem}th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}th{color:var(--mut);font-weight:600}
details.t{border:1px solid var(--line);border-radius:12px;margin:8px 0}details.t>summary{cursor:pointer;padding:10px 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}details.t>div{padding:0 14px 12px}
ol li{margin:4px 0}.msg{border-radius:10px;padding:8px 12px;margin:8px 0;font-size:.9rem}.msg.wa{background:var(--wa)}.msg.ok{background:var(--okS)}.msg.bad{background:var(--bad)}
</style>
</head>
<body>
<header><h1>📤 Entregas por OneDrive <span class="pill">2027 · solo profe</span></h1><p>Tareas y proyectos: el archivo queda en su OneDrive del MEP y la plataforma registra quién entregó y cuándo</p></header>
<main id="app"><p class="mut">Cargando…</p></main>
<script>
let SES=null;try{SES=JSON.parse(sessionStorage.getItem("ctp_lms_session_v2")||"null")}catch(e){}
const app=document.getElementById("app"),$=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=d=>d?new Date(d).toLocaleString("es-CR",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit",timeZone:"America/Costa_Rica"}):"—";
// datetime-local (hora de Costa Rica) <-> ISO
const aISO=v=>v?new Date(v+":00-06:00").toISOString():null;
const aLocal=iso=>iso?new Date(new Date(iso).getTime()-6*3600e3).toISOString().slice(0,16):"";
let SECS=[],MAT={},EST=[],TAR=[],ENT=[],editando=null;

async function cargar(){
  const [l,e,t,x]=await Promise.all([sb.from("lecciones").select("seccion,materia_id"),sb.from("estudiantes").select("id,nombre,apellido1,apellido2,seccion").order("apellido1"),
    sb.from("entregas_tareas").select("*").order("creado_en",{ascending:false}),sb.from("entregas_estudiantes").select("*")]);
  const err=l.error||e.error||t.error||x.error;if(err){app.innerHTML='<div class="card msg bad">No se pudo cargar: '+esc(err.message)+'</div>';return}
  (l.data||[]).forEach(r=>{MAT[r.seccion]=r.materia_id});SECS=Object.keys(MAT).sort();
  EST=(e.data||[]).filter(s=>s.id!=="0-0000-0001");TAR=t.data||[];ENT=x.data||[];pintar();
}
function form(){const t=editando||{};
  return '<section class="card"><h2>'+(editando?"✏️ Editar":"➕ Nueva")+' tarea o proyecto</h2><div class="grid">'+
  '<div><label>Sección</label><select id="fSec">'+SECS.map(s=>'<option '+(s===t.seccion?"selected":"")+'>'+esc(s)+'</option>').join("")+'</select></div>'+
  '<div><label>Tipo</label><select id="fTipo"><option value="tarea">Tarea</option><option value="proyecto" '+(t.tipo==="proyecto"?"selected":"")+'>Proyecto</option></select></div>'+
  '<div><label>Fecha y hora límite</label><input id="fLim" type="datetime-local" value="'+esc(aLocal(t.fecha_limite))+'"></div></div>'+
  '<label>Título</label><input id="fTit" value="'+esc(t.titulo||"")+'" placeholder="Tarea 3 · Conciliación bancaria">'+
  '<label>Instrucciones para el estudiante</label><textarea id="fIns" rows="2">'+esc(t.instrucciones||"")+'</textarea>'+
  '<label>Enlace de la carpeta de OneDrive del MEP</label><input id="fEnl" value="'+esc(t.enlace_onedrive||"")+'" placeholder="https://adminmepcr-my.sharepoint.com/…">'+
  '<label style="display:flex;gap:8px;align-items:center;margin-top:8px;color:var(--ink)"><input type="checkbox" id="fVis" style="width:auto" '+(t.visible?"checked":"")+'> Visible para los estudiantes</label>'+
  '<button class="btn" id="fGuardar">'+(editando?"Guardar cambios":"Crear")+'</button>'+(editando?'<button class="btn sec" id="fCancelar">Cancelar</button>':'')+'<div id="fMsg"></div></section>'}
function pintar(){
  app.innerHTML=`<section class="card"><h2>Cómo funciona</h2><ol>
   <li>En su OneDrive del MEP cree una carpeta por tarea o proyecto (por ejemplo «10-1 · Tarea 3»).</li>
   <li>En esa carpeta use <b>«Solicitar archivos»</b>: los estudiantes suben sin ver los archivos de los demás. Si su cuenta no tiene esa opción, use <b>Compartir → Personas de su organización · Puede editar</b>.</li>
   <li>Copie el enlace y péguelo aquí. El estudiante ve el botón «📤 Abrir la carpeta de entrega», sube su archivo y confirma en la plataforma.</li>
   <li>Usted revisa el archivo en OneDrive y lo marca como <b>Recibido</b> o lo <b>Devuelve</b> con un comentario.</li></ol>
   <div class="msg wa"><b>Pendiente para febrero de 2027:</b> probar con un estudiante que «Solicitar archivos» funcione con las cuentas del MEP (depende de cómo lo tenga configurado el MEP).</div>
   <a class="btn sec" href="entregas.html">👀 Ver lo que verá el estudiante</a></section>`+form()+
   '<section class="card"><h2>Tareas y proyectos</h2>'+(TAR.length?TAR.map(tarea).join(""):'<p class="mut">Todavía no hay ninguna.</p>')+'</section>';
  $("#fGuardar").onclick=guardar;const c=$("#fCancelar");if(c)c.onclick=()=>{editando=null;pintar()};
  document.querySelectorAll("[data-ed]").forEach(b=>b.onclick=()=>{editando=TAR.find(t=>t.id==b.dataset.ed);pintar();scrollTo(0,0)});
  document.querySelectorAll("[data-vis]").forEach(b=>b.onclick=async()=>{const t=TAR.find(x=>x.id==b.dataset.vis);const {error}=await sb.from("entregas_tareas").update({visible:!t.visible}).eq("id",t.id);if(error)alert(error.message);else{t.visible=!t.visible;pintar()}});
  document.querySelectorAll("[data-rec]").forEach(b=>b.onclick=()=>marcar(+b.dataset.rec,"recibido"));
  document.querySelectorAll("[data-dev]").forEach(b=>b.onclick=()=>{const c=prompt("Comentario para el estudiante (qué debe corregir):");if(c!==null)marcar(+b.dataset.dev,"devuelto",c)});
}
function tarea(t){
  const est=EST.filter(s=>s.seccion===t.seccion),en=ENT.filter(x=>x.tarea_id===t.id),m={};en.forEach(x=>m[x.estudiante_id]=x);
  const tarde=x=>t.fecha_limite&&new Date(x.entregado_en)>new Date(t.fecha_limite);
  const n=en.length,nt=en.filter(tarde).length;
  return '<details class="t"><summary><b>'+(t.tipo==="proyecto"?"📁":"📝")+' '+esc(t.titulo)+'</b><span class="tag">'+esc(t.seccion)+'</span><span class="tag '+(t.visible?"ok":"wa")+'">'+(t.visible?"Visible":"Oculta")+'</span>'+
   '<span class="tag">'+n+'/'+est.length+' entregaron'+(nt?' · '+nt+' tarde':'')+'</span><span class="mut">Límite: '+esc(fmt(t.fecha_limite))+'</span></summary><div>'+
   '<p>'+(t.enlace_onedrive?'<a class="btn sm" href="'+esc(t.enlace_onedrive)+'" target="_blank" rel="noopener">📂 Abrir la carpeta en OneDrive</a>':'<span class="tag wa">Falta el enlace de OneDrive</span>')+
   '<button class="btn sm sec" data-ed="'+t.id+'">✏️ Editar</button><button class="btn sm sec" data-vis="'+t.id+'">'+(t.visible?"🙈 Ocultar":"👁 Mostrar")+'</button></p>'+
   '<div style="overflow-x:auto"><table><thead><tr><th>Estudiante</th><th>Estado</th><th>Entregó</th><th>Archivo</th><th></th></tr></thead><tbody>'+
   est.map(s=>{const x=m[s.id];return'<tr><td>'+esc(s.apellido1+" "+(s.apellido2||"")+" "+s.nombre)+'</td><td>'+(!x?'<span class="tag">Pendiente</span>':x.estado==="recibido"?'<span class="tag ok">Recibido</span>':x.estado==="devuelto"?'<span class="tag bad">Devuelto</span>':'<span class="tag '+(tarde(x)?"wa":"ok")+'">'+(tarde(x)?"Tarde":"A tiempo")+'</span>')+'</td>'+
    '<td>'+(x?esc(fmt(x.entregado_en))+(x.veces>1?' <span class="mut">('+x.veces+' veces)</span>':''):'—')+'</td><td>'+(x?esc(x.archivo_nombre||""):"")+'</td>'+
    '<td>'+(x&&x.estado!=="recibido"?'<button class="btn sm" data-rec="'+x.id+'">✓ Recibido</button>':'')+(x&&x.estado!=="devuelto"?'<button class="btn sm sec" data-dev="'+x.id+'">↩ Devolver</button>':'')+'</td></tr>'}).join("")+
   '</tbody></table></div></div></details>'}
async function guardar(){
  const fila={seccion:$("#fSec").value,materia_id:MAT[$("#fSec").value]||null,tipo:$("#fTipo").value,titulo:$("#fTit").value.trim(),instrucciones:$("#fIns").value.trim()||null,
    fecha_limite:aISO($("#fLim").value),enlace_onedrive:$("#fEnl").value.trim()||null,visible:$("#fVis").checked};
  if(!fila.titulo){$("#fMsg").innerHTML='<div class="msg bad">Escriba el título.</div>';return}
  if(fila.enlace_onedrive&&!/^https:\/\//i.test(fila.enlace_onedrive)){$("#fMsg").innerHTML='<div class="msg bad">El enlace debe empezar con https://</div>';return}
  const r=editando?await sb.from("entregas_tareas").update(fila).eq("id",editando.id):await sb.from("entregas_tareas").insert(fila);
  if(r.error){$("#fMsg").innerHTML='<div class="msg bad">'+esc(r.error.message)+'</div>';return}
  editando=null;cargar();
}
async function marcar(id,estado,comentario){
  const {error}=await sb.from("entregas_estudiantes").update({estado,comentario:comentario??null}).eq("id",id);
  if(error){alert(error.message);return}const x=ENT.find(e=>e.id===id);x.estado=estado;x.comentario=comentario??null;pintar();
}
if(!(SES&&SES.role==="docente"))app.innerHTML='<section class="card"><h2>Solo para el profe</h2><p class="mut">Se abre desde la plataforma, en 📅 2027.</p><a class="btn" href="index.html">Ir a la plataforma</a></section>';
else cargar();
</script>
<script src="js/volver-plataforma.js?v=20261117a"></script>
</body>
</html>
