<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Aula Contable NIIF</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: barra superior con empresa activa → riel del ciclo contable (pasos reales en orden) → área de trabajo */
:root{
  --bg:#ECF2F0; --surface:#FFFFFF; --surface2:#F6FAF8; --ink:#10282C; --muted:#56706E; --line:#D3DFDB;
  --accent:#0E7C66; --accent-ink:#FFFFFF; --pop:#F2B63D; --pop-ink:#2B1E00;
  --debe:#2457B8; --haber:#C2501C; --ok:#1E8A4C; --bad:#C23A3A; --okbg:#E3F4EA; --badbg:#FBE7E6;
  --tA:#1F7A8C; --tP:#C2501C; --tPT:#7A4FB0; --tI:#1E8A4C; --tC:#A86F00; --tG:#B03A5B;
  --shadow:0 3px 0 rgba(16,40,44,.18);
  --f-display:"Bricolage Grotesque", "Trebuchet MS", sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --f-num:"JetBrains Mono", ui-monospace, "Consolas", monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1B1D; --surface:#14272A; --surface2:#183034; --ink:#E4F0EC; --muted:#93AEAA; --line:#2A4448;
  --accent:#2BB596; --accent-ink:#06201A; --pop:#F5C45A; --pop-ink:#2B1E00;
  --debe:#7FA6F0; --haber:#F08A5A; --ok:#5ACB89; --bad:#F07A7A; --okbg:#173A28; --badbg:#3E1C1C;
  --tA:#5CC3D6; --tP:#F08A5A; --tPT:#B597E8; --tI:#5ACB89; --tC:#E0B048; --tG:#EE7FA0;
  --shadow:0 3px 0 rgba(0,0,0,.45); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0D1B1D; --surface:#14272A; --surface2:#183034; --ink:#E4F0EC; --muted:#93AEAA; --line:#2A4448;
  --accent:#2BB596; --accent-ink:#06201A; --pop:#F5C45A; --pop-ink:#2B1E00;
  --debe:#7FA6F0; --haber:#F08A5A; --ok:#5ACB89; --bad:#F07A7A; --okbg:#173A28; --badbg:#3E1C1C;
  --tA:#5CC3D6; --tP:#F08A5A; --tPT:#B597E8; --tI:#5ACB89; --tC:#E0B048; --tG:#EE7FA0;
  --shadow:0 3px 0 rgba(0,0,0,.45); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h2{font-size:1.65rem;font-weight:800}
h3{font-size:1.1rem;font-weight:600}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--muted)}

/* Top bar */
.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.logo{width:38px;height:38px;border-radius:10px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-family:var(--f-display);font-weight:800;font-size:1.05rem;box-shadow:var(--shadow)}
.brand b{font-family:var(--f-display);font-size:1.25rem;font-weight:800;display:block;line-height:1}
.brand small{color:var(--muted);font-size:.78rem}
.cosel{display:flex;align-items:center;gap:8px}
select,input,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
select:focus,input:focus,textarea:focus{outline:3px solid color-mix(in srgb,var(--accent) 35%,transparent);border-color:var(--accent)}

/* Riel del ciclo */
.rail{overflow-x:auto;padding-block:18px 6px}
.steps{display:flex;gap:8px;min-width:max-content}
.step{display:flex;align-items:center;gap:10px;padding:10px 16px 10px 10px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font:inherit;color:var(--ink);box-shadow:var(--shadow);transition:transform .12s, box-shadow .12s}
.step:hover{transform:translateY(-2px)}
.step:active{transform:translateY(2px);box-shadow:none}
.step:focus-visible{outline:3px solid var(--pop);outline-offset:2px}
.step .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;background:var(--surface2);border:1.5px solid var(--line)}
.step.done .n{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.step.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.step.on .n{background:var(--pop);border-color:var(--pop);color:var(--pop-ink)}
.step .t{text-align:left;line-height:1.15}
.step .t b{display:block;font-weight:700}
.step .t small{font-size:.72rem;opacity:.8}
.arrow{align-self:center;color:var(--muted);font-weight:700}

main{padding-block:18px 60px}
.head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.head > div{margin-right:auto;min-width:0}
.head p{margin:4px 0 0;color:var(--muted);max-width:70ch}

/* Buttons */
.btn{font:inherit;font-weight:700;border:1.5px solid var(--ink);background:var(--surface);color:var(--ink);padding:9px 16px;border-radius:12px;cursor:pointer;box-shadow:var(--shadow);transition:transform .1s, box-shadow .1s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn:focus-visible{outline:3px solid var(--pop);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pop{background:var(--pop);border-color:var(--pop);color:var(--pop-ink)}
.btn.ghost{box-shadow:none;border-color:var(--line)}
.btn.danger{color:var(--bad);border-color:var(--bad);box-shadow:none}
.btn.danger.arm{background:var(--bad);color:#fff}
.btn.sm{padding:5px 10px;font-size:.85rem;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 140px}
.field label{font-size:.8rem;font-weight:600;color:var(--muted)}
.check{display:flex;gap:8px;align-items:center;font-size:.9rem}

/* Chips */
.chip{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;border:1.5px solid currentColor;white-space:nowrap}
.tA{color:var(--tA)}.tP{color:var(--tP)}.tPT{color:var(--tPT)}.tI{color:var(--tI)}.tC{color:var(--tC)}.tG{color:var(--tG)}
.niif{font-family:var(--f-num);font-size:.75rem;background:var(--surface2);border:1px solid var(--line);padding:1px 6px;border-radius:6px;white-space:nowrap}

/* Tables */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface2);font-weight:700}
td.r,th.r{text-align:right}
tr.grp td{background:var(--surface2);font-weight:700;font-family:var(--f-display)}
tr.tot td{font-weight:700;border-top:2px solid var(--ink)}
.dcol{color:var(--debe)}.hcol{color:var(--haber)}
.indent{padding-left:40px}

/* Status */
.status{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:12px;font-weight:600}
.status.ok{background:var(--okbg);color:var(--ok)}
.status.bad{background:var(--badbg);color:var(--bad)}
.dot{width:10px;height:10px;border-radius:50%;background:currentColor;flex:none}

/* Company cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:14px}
.co{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.co.on{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.co h3{font-size:1.15rem}
.co .stats{display:flex;gap:16px;font-size:.85rem;color:var(--muted)}
.co .stats b{font-family:var(--f-display);font-size:1.3rem;color:var(--ink);display:block}
.co .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}

/* Journal */
.lines{display:flex;flex-direction:column;gap:8px}
.line{display:grid;grid-template-columns:minmax(0,1fr) 130px 130px 36px;gap:8px;align-items:center}
.line input.amt{text-align:right;font-family:var(--f-num)}
.line .d{border-color:color-mix(in srgb,var(--debe) 45%,var(--line))}
.line .h{border-color:color-mix(in srgb,var(--haber) 45%,var(--line))}
.xbtn{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;font-size:1.1rem}
.xbtn:hover{color:var(--bad);border-color:var(--bad)}
.lhead{display:grid;grid-template-columns:minmax(0,1fr) 130px 130px 36px;gap:8px;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.totals{display:grid;grid-template-columns:minmax(0,1fr) 130px 130px 36px;gap:8px;align-items:center;padding-top:8px;border-top:2px dashed var(--line);font-weight:700}
.totals .num{text-align:right;padding-right:10px}
@media (max-width:640px){
  .line,.lhead,.totals{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 36px}
  .line select{grid-column:1 / -1}
  .lhead span:first-child,.totals span:first-child{grid-column:1 / -1}
  .lhead span:last-child,.totals span:last-child{display:none}
}
.entry-desc td{font-style:italic;color:var(--muted);font-size:.85rem;border-bottom:2px solid var(--line)}
.badge-n{font-family:var(--f-display);font-weight:800;background:var(--pop);color:var(--pop-ink);border-radius:8px;padding:1px 8px}

/* Cuentas T */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.tacc{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.tacc header{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:6px}
.tacc header h3{font-size:1rem}
.tbody{display:grid;grid-template-columns:1fr 1fr;border-top:3px solid var(--ink)}
.tbody > div{padding:6px 8px;min-width:0}
.tbody > div:first-child{border-right:3px solid var(--ink)}
.tline{display:flex;justify-content:space-between;gap:6px;font-size:.86rem}
.tline small{color:var(--muted);font-family:var(--f-num)}
.tsum{border-top:1px solid var(--line);margin-top:4px;padding-top:4px;font-weight:700}
.tsaldo{margin-top:8px;display:flex;justify-content:space-between;align-items:center;padding:6px 10px;border-radius:10px;background:var(--surface2);font-weight:700}

/* Estados */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tab{font:inherit;font-weight:700;padding:8px 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stmt{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;max-width:860px}
.stmt .sh{text-align:center;margin-bottom:16px}
.stmt .sh h3{font-size:1.3rem}
.stmt .sh div{color:var(--muted);font-size:.9rem}
.stmt table td,.stmt table th{border-bottom:none;padding:5px 8px}
.stmt tr.sec td{font-family:var(--f-display);font-weight:700;padding-top:14px;font-size:1rem}
.stmt tr.sub td{font-weight:700;border-top:1px solid var(--ink)}
.stmt tr.big td{font-weight:800;border-top:1px solid var(--ink);border-bottom:3px double var(--ink);font-size:1.02rem}
.note{font-size:.82rem;color:var(--muted);margin-top:14px;max-width:75ch}

.empty{text-align:center;padding:40px 16px;border:2px dashed var(--line);border-radius:16px;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:6px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(120px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:600;transition:transform .25s;z-index:20;max-width:calc(100% - 32px)}
.toast.show{transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<style>
/* Acceso y sesión */
.login{max-width:440px;margin:40px auto 60px;display:flex;flex-direction:column;gap:16px}
.login .panel{padding:24px}
.login h2{font-size:1.8rem}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--pop);color:var(--pop-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800}
.who .nm{line-height:1.1;font-size:.88rem}
.who .nm b{display:block}
.save{font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.save.err{color:var(--bad);border-color:var(--bad)}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-radius:14px;background:var(--pop);color:var(--pop-ink);font-weight:600;margin-bottom:14px}
.banner span{margin-right:auto}
body.ro .edit-only{display:none!important}
.code{font-family:var(--f-num);font-size:.8rem;background:var(--surface2);border:1px solid var(--line);padding:1px 7px;border-radius:6px}
.loading{text-align:center;padding:80px 16px;color:var(--muted);font-weight:600}
</style>

<style>
/* Módulo de planillas */
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;width:fit-content;max-width:100%}
.subtab{font:inherit;font-weight:700;font-size:.9rem;padding:8px 14px;border-radius:10px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.subtab:hover{color:var(--ink)}
.subtab.on{background:var(--accent);color:var(--accent-ink)}
.subtab:focus-visible{outline:3px solid var(--pop);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.kpi small{display:block;color:var(--muted);font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.kpi b{font-family:var(--f-num);font-size:1rem;overflow-wrap:anywhere}
.kpi.hl{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.kpi.hl small{color:inherit;opacity:.85}
.proc{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px}
.proc li{padding-left:4px}
.formula{font-family:var(--f-num);font-size:.84rem;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px 8px;display:inline-block;margin:3px 4px 0 0;overflow-wrap:anywhere}
.case{background:var(--pop);color:var(--pop-ink);border-radius:16px;padding:18px 20px}
.case dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px 16px;margin:12px 0 0}
.case dt{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;font-weight:700;opacity:.75}
.case dd{margin:0;font-family:var(--f-num);font-weight:600}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) 190px 26px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.qrow input{text-align:right;font-family:var(--f-num)}
.qrow .ic{font-weight:800;font-size:1.15rem;text-align:center}
.qfb{grid-column:1/-1;font-size:.88rem;padding:8px 12px;border-radius:10px}
.qfb.bad{background:var(--badbg);color:var(--bad)}
.colilla{background:var(--surface);border:1px solid var(--line);border-radius:6px;max-width:780px;box-shadow:var(--shadow);overflow:hidden}
.colilla .ch{background:var(--accent);color:var(--accent-ink);padding:14px 18px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.colilla .cb{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.ccols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:18px}
.ccols table{font-size:.88rem}
.ccols td{padding:5px 4px;border-bottom:1px dashed var(--line)}
.ccols tr.tot td{border-top:2px solid var(--ink);border-bottom:none}
.cneto{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border:2px solid var(--ink);border-radius:10px;font-weight:800;font-family:var(--f-display);font-size:1.12rem}
.firmas{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding-top:28px}
.firmas div{border-top:1.5px solid var(--ink);padding-top:4px;font-size:.78rem;color:var(--muted);text-align:center}
.cfoot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.75rem;color:var(--muted);border-top:2px dashed var(--line);padding:10px 18px}
.ptable input{width:84px;text-align:right;font-family:var(--f-num);padding:6px 8px}
.ptable input.cta{width:76px;text-align:left}
.ptable input.nm{width:100%;min-width:200px;text-align:left;font-family:var(--f-body)}
.ptable td{padding:6px 8px}
.sheet input{width:120px;text-align:right;font-family:var(--f-num);padding:6px 8px}
.sheet td{vertical-align:top}
.cell-ok input{border-color:var(--ok);background:var(--okbg)}
.cell-bad input{border-color:var(--bad);background:var(--badbg)}
tr.cell-ok td,tr.cell-bad td{background:transparent}
.step.locked{opacity:.62;border-style:dashed;box-shadow:none}
.step.locked .n{background:var(--surface2)}
.pbar{height:8px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);overflow:hidden;width:110px;margin:4px 0 2px}
.pbar span{display:block;height:100%}
.lockicon{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:1.8rem;background:var(--pop);box-shadow:var(--shadow)}
.hints{margin:0;padding:12px 12px 12px 30px;background:var(--badbg);color:var(--bad);border-radius:12px;display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.hints b{color:var(--ink)}
@media (max-width:640px){.qrow{grid-template-columns:minmax(0,1fr) 130px 22px}.firmas{grid-template-columns:1fr}}
</style>
<header class="top" id="top" hidden>
  <div class="wrap">
    <div class="brand"><div class="logo">Σ</div><div><b>Aula Contable</b><small>Ciclo contable bajo NIC / NIIF</small></div></div>
    <div class="cosel"><label for="coPick" class="eyebrow">Empresa</label><select id="coPick"></select></div>
    <div class="who" id="who"></div>
  </div>
</header>
<div class="wrap" id="railWrap" hidden><nav class="rail" aria-label="Ciclo contable"><div class="steps" id="steps"></div></nav></div>

<div class="toast" id="toast" role="status"></div>

<script>

function uid(){const b=new Uint8Array(6);crypto.getRandomValues(b);return Date.now().toString(36)+[...b].map(x=>x.toString(36).padStart(2,"0")).join("").slice(0,8)}
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

/* ============ Criptografía (Web Crypto) ============ */
const TE=new TextEncoder(),TD=new TextDecoder();
const b64=buf=>{const b=new Uint8Array(buf);let s="";for(let i=0;i<b.length;i+=8192)s+=String.fromCharCode.apply(null,b.subarray(i,i+8192));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function sha256hex(txt){const b=await crypto.subtle.digest("SHA-256",TE.encode(txt));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}

const aplicaVentana=c=>!!(c&&c.categoria==="practica"&&!isTeacher()&&!APP.comoEstudiante&&!APP.demo);
function ventanaEstado(c){
  if(!aplicaVentana(c))return null;const v=c.evalCfg&&c.evalCfg.ventana;if(!v||(!v.inicio&&!v.fin))return null;
  const now=Date.now(),ini=v.inicio?new Date(v.inicio).getTime():null,fin=v.fin?new Date(v.fin).getTime():null;
  const f=x=>new Date(x).toLocaleString("es-CR",{dateStyle:"full",timeStyle:"short"});
  if(ini&&now<ini)return {estado:"antes",msg:"Esta práctica todavía no está abierta. Abre el "+f(v.inicio)+"."+(v.fin?" Cierra el "+f(v.fin)+".":"")};
  if(fin&&now>fin)return {estado:"cerrada",msg:"Esta práctica ya cerró el "+f(v.fin)+". Puedes ver tu trabajo, pero ya no se puede guardar ni entregar."};
  return {estado:"abierta",msg:"Práctica abierta"+(v.fin?" hasta el "+f(v.fin)+".":".")};
}
const ventanaBloqueada=c=>{const e=ventanaEstado(c);return !!e&&e.estado!=="abierta"};
const tareaBloqueada=c=>!isTeacher()&&!!(c&&c.categoria==="tarea"&&c.entregado);

/* Guardado agrupado: una escritura a la vez */
const pending=new Set();let saveTimer=null,flushing=false;
function touch(c){if(APP.readOnly||!c)return;if(ventanaBloqueada(c)){toast("⏰ Fuera del horario de la práctica: no se puede guardar");return}pending.add(c.id);setSave("Guardando…");clearTimeout(saveTimer);saveTimer=setTimeout(flush,600)}
async function flush(){
  if(!APP.me||APP.demo||APP.readOnly||!pending.size)return;
  if(flushing){clearTimeout(saveTimer);saveTimer=setTimeout(flush,400);return}
  flushing=true;
  try{
    const ids=[...pending];pending.clear();
    if(APP.store.mode==="local"){await evRefrescarCfg();await APP.store.saveWork(APP.me.usuario,APP.dk,APP.companies)}
    else for(const id of ids){const c=APP.companies.find(x=>x.id===id);if(c)await APP.store.saveCompany(c)}
    setSave("Guardado ✓");
  }catch(e){setSave("No se pudo guardar",true);toast(e&&e.code==="quota_exceeded"?"El espacio del aula está lleno. Elimina entregas o empresas que ya no uses.":"No se pudo guardar. Inténtalo de nuevo.")}
  flushing=false;
}

/* ============ Cálculos ============ */
function money(n,sym=true){n=r2(n);const s=NF.format(Math.abs(n));const p=(sym?((co()&&co().currency)||"₡")+" ":"")+s;return n<0?`(${p})`:p}
const acc=code=>co().accounts.find(a=>a.code===code);
const sortAcc=a=>[...a].sort((x,y)=>x.code.localeCompare(y.code,undefined,{numeric:true}));
function movs(c=co()){const m={};for(const e of c.entries)for(const l of e.lines){m[l.code]??={d:0,c:0};m[l.code].d+=+l.d||0;m[l.code].c+=+l.c||0}return m}
function signed(a,m){const x=m[a.code]||{d:0,c:0};return ["A","C","G"].includes(a.type)?x.d-x.c:x.c-x.d}
function sumWhere(m,f){return co().accounts.filter(f).reduce((s,a)=>s+signed(a,m),0)}
function results(m=movs()){
  const ing=sumWhere(m,a=>a.type==="I"&&a.cls==="ORD"),cv=sumWhere(m,a=>a.type==="C"),ub=ing-cv;
  const gop=sumWhere(m,a=>a.type==="G"&&a.cls==="OP"),uop=ub-gop;
  const otr=sumWhere(m,a=>a.type==="I"&&a.cls==="OTR"),gfin=sumWhere(m,a=>a.type==="G"&&a.cls==="FIN");
  const uai=uop+otr-gfin,isr=sumWhere(m,a=>a.type==="G"&&a.cls==="ISR"),un=uai-isr;
  return {ing,cv,ub,gop,uop,otr,gfin,uai,isr,un};
}
function trial(m=movs()){let d=0,c=0;for(const k in m){d+=m[k].d;c+=m[k].c}return {d:r2(d),c:r2(c),ok:r2(d)===r2(c)}}
function position(m=movs()){
  const A=sumWhere(m,a=>a.type==="A"),P=sumWhere(m,a=>a.type==="P"),PT=sumWhere(m,a=>a.type==="PT")+results(m).un;
  return {A,P,PT,ok:r2(A)===r2(P+PT)};
}

const PREFIX="AULA-ENTREGA:";
async function buildDelivery(companies){
  const payload={v:1,usuario:APP.me.usuario,nombre:APP.me.nombre,fecha:new Date().toISOString(),desbloqueos:APP.unlocked||[],companies};
  const body=JSON.stringify(payload);
  const check=await sha256hex(body);
  return {code:PREFIX+b64(TE.encode(JSON.stringify({p:body,h:check}))),check,payload};
}
async function readDelivery(txt){
  txt=String(txt||"").trim();
  if(!txt.startsWith(PREFIX))throw new Error("Eso no es un código de entrega de Aula Contable.");
  let w;try{w=JSON.parse(TD.decode(unb64(txt.slice(PREFIX.length).replace(/\s+/g,""))))}catch(e){throw new Error("El código está incompleto o dañado. Pide que lo copien completo.")}
  if(await sha256hex(w.p)!==w.h)throw new Error("El código fue modificado: la verificación no coincide.");
  const p=JSON.parse(w.p);if(!Array.isArray(p.companies))throw new Error("El código no contiene empresas.");
  return {payload:p,check:w.h};
}

function plResumen(cs,unl){
  const R={empresas:cs.length,empTareas:cs.filter(c=>c.categoria==="tarea").length,empPracticas:cs.filter(c=>c.categoria!=="tarea").length,
    asientos:0,planillas:0,colab:0,casOk:0,casTot:0,asPlIntentos:0,asPlOk:0,solucion:0,evalBest:null,evals:0,practicas:0};
  for(const c of cs){R.asientos+=(c.entries||[]).length;const p=c.payroll;if(!p)continue;
    try{const P=p.params;R.colab+=(p.employees||[]).length;
      if(p.sheet&&p.employees?.length){const wr=p.employees.some(e=>plCalc(e,P).totReb>0);
        for(const e of p.employees){const k=plCalc(e,P),ans=p.sheet[e.id]||{};for(const [q] of plSheetFields(k,wr)){R.casTot++;const v=parseNum(ans[q]);if(!isNaN(v)&&near(v,plSol(k,q)))R.casOk++}}}
      for(const r of [...(p.runs||[]),...(p.draft?[p.draft]:[])]){if(r.entryId)R.planillas++;R.asPlIntentos+=r.intentos||0;if(r.machoteOk)R.asPlOk++;if(r.vioSolucion)R.solucion++}
      for(const ev of p.evals||[]){if(ev.modo==="evaluacion"){R.evals++;const pc=Math.round(100*ev.puntaje/ev.total);R.evalBest=Math.max(R.evalBest??0,pc)}else R.practicas++}
    }catch(err){}}
  return R;
}

function revisionDePractica(g){
  const pct=(n,t)=>t?Math.round(100*n/t):0;
  const st=g.rows.map(({w,c})=>{let R=null;try{R=plResumen([c])}catch(e){}
    const avance=!!(R&&(R.asientos>0||R.casOk>0||R.asPlIntentos>0||R.evals>0||R.practicas>0));
    const eM=c.payroll&&c.payroll.evalM&&c.payroll.evalM.resultado||null,eA=c.payroll&&c.payroll.evalA&&c.payroll.evalA.resultado||null;
    return {w,c,R,avance,eM,eA,machote:!!(R&&R.casTot>0&&R.casOk===R.casTot),asiento:!!(R&&R.asPlOk>0),ev:R&&R.evalBest!=null?R.evalBest:null,casPct:R&&R.casTot?pct(R.casOk,R.casTot):0}});
  const avg=a=>a.length?Math.round(a.reduce((t,x)=>t+x.pct,0)/a.length)+" %":"—";
  const aM=st.filter(x=>x.eM).map(x=>x.eM),aA=st.filter(x=>x.eA).map(x=>x.eA);
  const n=st.length,av=st.filter(x=>x.avance).length,ma=st.filter(x=>x.machote).length,as=st.filter(x=>x.asiento).length;
  const evs=st.filter(x=>x.ev!=null),prom=evs.length?Math.round(evs.reduce((t,x)=>t+x.ev,0)/evs.length):null;
  const chip=(t,v,sub)=>`<div class="panel" style="flex:1 1 140px;padding:10px;text-align:center"><div class="muted" style="font-size:.75rem">${t}</div><div style="font-size:1.4rem;font-weight:700" class="num">${v}</div><small class="muted">${sub}</small></div>`;
  const ordenados=[...st].sort((x,y)=>(y.avance-x.avance)||(y.casPct-x.casPct)||x.w.nombre.localeCompare(y.w.nombre));
  return `<div class="stack" style="margin-top:10px;border:2px solid var(--pop);border-radius:12px;padding:12px">
   <div class="row" style="align-items:center"><h4 style="margin:0;margin-right:auto">📊 Revisión de ${esc(g.name)}</h4><button class="btn sm ghost" data-act="reloadEmp" data-key="${esc(g.key)}">↻ Actualizar resultados</button></div>
   ${(()=>{const T=(APP.revTab&&APP.revTab[g.key])||"res";const tb=(k,l)=>`<button class="tab ${T===k?"on":""}" data-act="revTab" data-key="${esc(g.key)}" data-t="${k}">${l}</button>`;
     return `<div class="tabs" style="margin:0">${tb("res","📊 Resultados")}${tb("eval","📝 Evaluaciones")}${tb("sol","✅ Solucionario y PDF")}${tb("hor","⏰ Horario")}</div>${T==="res"?"":evControlesHTML(g,T)}`})()}
   ${((APP.revTab&&APP.revTab[g.key])||"res")==="res"?`   <div class="row" style="gap:8px;flex-wrap:wrap">${chip("Con avance",`${av}/${n}`,pct(av,n)+" %")}${chip("Machote completo",`${ma}/${n}`,pct(ma,n)+" %")}${chip("Asiento resuelto",`${as}/${n}`,pct(as,n)+" %")}${chip("Evaluación (promedio)",prom!=null?prom+" %":"—",evs.length+" evaluó")}${chip("Eval. machote (promedio)",avg(aM),aM.length+"/"+n+" entregaron")}${chip("Eval. asiento (promedio)",avg(aA),aA.length+"/"+n+" entregaron")}</div>
   <div class="tbl"><table><thead><tr><th>Estudiante</th><th>Machote</th><th>Asiento planilla</th><th>Evaluación</th><th>Eval. machote</th><th>Eval. asiento</th><th>PDF resultados</th><th>Diagnóstico</th></tr></thead><tbody>
   ${ordenados.map(x=>{const dx=!x.avance?'<span class="chip tG" style="font-size:.7rem">⏳ Sin empezar</span>':(x.machote&&x.asiento&&x.ev!=null?'<span class="chip tI" style="font-size:.7rem">✓ Completa</span>':'<span class="chip tG" style="font-size:.7rem">En proceso</span>');
     return `<tr><td><b>${esc(x.w.nombre)}</b><br><span class="code">${esc(x.w.id)}</span></td><td class="num">${x.R&&x.R.casTot?x.casPct+" %":"—"}</td><td>${x.asiento?"✓ Resuelto":(x.R&&x.R.asPlIntentos?x.R.asPlIntentos+" intento(s)":"—")}</td><td class="num">${x.ev!=null?x.ev+" %":"—"}</td><td>${x.eM?evBadge(x.eM):evPend(x.c,"machote")}${x.eM?` <button class="btn sm ghost" data-act="evDetalle" data-key="${esc(g.key)}" data-est="${esc(x.w.id)}" data-co="${esc(x.c.id)}" data-k="machote" title="Ver detalle">🔍</button>`:""}</td><td>${x.eA?evBadge(x.eA):evPend(x.c,"asiento")}${x.eA?` <button class="btn sm ghost" data-act="evDetalle" data-key="${esc(g.key)}" data-est="${esc(x.w.id)}" data-co="${esc(x.c.id)}" data-k="asiento" title="Ver detalle">🔍</button>`:""}</td><td>${pdfResultadosLink(x.c)}</td><td>${dx}</td></tr>${(()=>{const d=APP.evDet;if(!d||d.est!==x.w.id||d.co!==x.c.id)return "";const r=d.k==="machote"?x.eM:x.eA;return r?`<tr><td colspan="8" style="background:var(--surface2)"><b>${d.k==="machote"?"Evaluación del machote":"Evaluación del asiento"} · ${esc(x.w.nombre)} · ${r.pct} % (${r.ok}/${r.total})</b>${evDetalleHTML(r,true)}</td></tr>`:""})()}`}).join("")}
   </tbody></table></div>`:""}
   </div>`;

      </tbody></table></div></details>`}).join("")}

VIEWS.catalogo=()=>{

  const ed=APP.editAcc?acc(APP.editAcc):null;
  const t0=ed?ed.type:"A";
  let rows="",last="";
  for(const a of sortAcc(co().accounts)){
    const g=a.type+a.cls;
    if(g!==last){rows+=`<tr class="grp"><td colspan="6">${TYPES[a.type]} · ${CLS[a.type][a.cls]||""}</td></tr>`;last=g}
    rows+=`<tr><td class="num">${esc(a.code)}</td><td>${esc(a.name)}</td><td>${chip(a.type)}</td>
     <td>${a.nature==="D"?'<span class="dcol">Deudora</span>':'<span class="hcol">Acreedora</span>'}${a.nature!==DEFNAT[a.type]?' <small class="muted">(correctora)</small>':""}</td>
     <td><span class="niif">${esc(a.niif||"—")}</span></td>
     <td class="r"><div class="row edit-only" style="justify-content:flex-end;flex-wrap:nowrap"><button class="btn sm ghost" data-act="editAcc" data-code="${esc(a.code)}">Editar</button>${used.has(a.code)?'<small class="muted" style="align-self:center">En uso</small>':`<button class="btn sm danger" data-act="delAcc" data-code="${esc(a.code)}">Eliminar</button>`}</div></td></tr>`;
  }
  return `<div class="head"><div><div class="eyebrow">Paso 1 · NIC 1 Presentación de estados financieros</div><h2>Catálogo de cuentas</h2>
   <p>Codifica tus cuentas a tu gusto: el primer dígito suele indicar el elemento (1 Activo, 2 Pasivo, 3 Patrimonio, 4 Ingresos, 5 Costos, 6 Gastos). La clasificación corriente / no corriente sigue la NIC 1.</p></div></div>
  <div class="stack">
   <form class="panel stack edit-only" id="fAcc">
    <h3>${ed?`Editar cuenta ${esc(ed.code)}`:"Agregar cuenta"}</h3>
    <div class="row">
      <div class="field" style="flex:0 1 120px"><label for="aCode">Código</label><input id="aCode" required placeholder="1108" value="${esc(ed?ed.code:"")}"></div>
      <div class="field" style="flex:2 1 220px"><label for="aName">Nombre de la cuenta</label><input id="aName" required placeholder="Ej.: Documentos por cobrar" value="${esc(ed?ed.name:"")}"></div>
      <div class="field"><label for="aType">Elemento</label><select id="aType">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${k===t0?"selected":""}>${v}</option>`).join("")}</select></div>
      <div class="field"><label for="aCls">Clasificación</label><select id="aCls">${Object.entries(CLS[t0]).map(([k,v])=>`<option value="${k}" ${ed&&ed.cls===k?"selected":""}>${v}</option>`).join("")}</select></div>
      <div class="field" style="flex:0 1 120px"><label for="aNiif">Norma</label><input id="aNiif" placeholder="NIC 16" value="${esc(ed?ed.niif:"")}"></div>

   </form>
   ${co().accounts.length?`<div class="tbl"><table><thead><tr><th>Código</th><th>Cuenta</th><th>Elemento</th><th>Naturaleza</th><th>Norma</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`
     :`<div class="empty"><h3>El catálogo está vacío</h3><p>Agrega tu primera cuenta o carga el catálogo base.</p><button class="btn pop edit-only" data-act="loadBase">Cargar catálogo base NIIF</button></div>`}

};

function draftLinesHTML(){
  return draft.lines.map((l,i)=>`<div class="line" data-i="${i}">
    <select data-f="code" aria-label="Cuenta, línea ${i+1}">${acctOptions(l.code)}</select>
    <input class="amt d" data-f="d" type="number" min="0" step="0.01" placeholder="0,00" value="${l.d}" aria-label="Debe, línea ${i+1}">
    <input class="amt h" data-f="c" type="number" min="0" step="0.01" placeholder="0,00" value="${l.c}" aria-label="Haber, línea ${i+1}">
    <button type="button" class="xbtn" data-act="rmLine" data-i="${i}" aria-label="Quitar línea" ${draft.lines.length<=2?"disabled":""}>×</button></div>`).join("");
}
function draftTotals(){
  let d=0,c=0,bad=false;for(const l of draft.lines){d+=+l.d||0;c+=+l.c||0;if((+l.d&&+l.c))bad=true}
  const valid=draft.lines.filter(l=>l.code&&(+l.d||+l.c)).length>=2;
  const ok=r2(d)===r2(c)&&d>0&&!bad&&valid;
  const msg=ok?"Partida doble correcta: Debe = Haber":bad?"Una línea no puede tener Debe y Haber a la vez":d===0&&c===0?"Escribe los montos del asiento":r2(d)!==r2(c)?`Diferencia de ${money(d-c)}`:"Elige la cuenta de cada línea con monto";
  return {d,c,ok,msg};
}
function updateTotals(){
  const t=draftTotals();
  document.getElementById("tD").textContent=money(t.d);document.getElementById("tC").textContent=money(t.c);
  const st=document.getElementById("tSt");st.className="status "+(t.ok?"ok":"bad");st.innerHTML=`<span class="dot"></span>${t.msg}`;
  document.getElementById("saveEntry").disabled=!t.ok;
}
VIEWS.diario=()=>{
  const c=co(),t=draftTotals();
  let rows="";
  for(const e of [...c.entries].sort((a,b)=>a.date.localeCompare(b.date)||a.n-b.n)){
    const ls=[...e.lines.filter(l=>+l.d),...e.lines.filter(l=>+l.c)];
    rows+=ls.map((l,i)=>{const a=acc(l.code);return `<tr>
      ${i===0?`<td rowspan="${ls.length+1}" class="num">${e.date}</td><td rowspan="${ls.length+1}"><span class="badge-n">${e.n}</span></td>`:""}
      <td class="${+l.c?"indent":""}">${esc(l.code)} · ${esc(a?a.name:"(cuenta eliminada)")}</td>
      <td class="r num dcol">${+l.d?money(l.d,false):""}</td><td class="r num hcol">${+l.c?money(l.c,false):""}</td>
      ${i===0?`<td rowspan="${ls.length+1}" class="r"><button class="btn sm danger edit-only" data-act="delEntry" data-id="${e.id}">Eliminar</button></td>`:""}</tr>`}).join("")
      +`<tr class="entry-desc"><td colspan="3">p/r ${esc(e.desc)}</td></tr>`;
  }
  const tr=trial();
  return `<div class="head"><div><div class="eyebrow">Paso 2 · Marco Conceptual: base de acumulación (devengo)</div><h2>Libro Diario</h2>
    <p>Registra cada transacción en orden cronológico con partida doble: el total del Debe siempre debe ser igual al total del Haber.</p></div></div>
  <div class="stack">
   <form class="panel stack edit-only" id="fEntry">
    <div class="row"><h3 style="margin-right:auto">Asiento N.° ${c.entries.length+1}</h3></div>
    <div class="row">
      <div class="field" style="flex:0 1 170px"><label for="eDate">Fecha</label><input id="eDate" type="date" value="${draft.date}" required></div>
      <div class="field" style="flex:3 1 260px"><label for="eDesc">Descripción (p/r…)</label><input id="eDesc" value="${esc(draft.desc)}" placeholder="Ej.: Compra de mercadería al contado" required></div>
    </div>
    <div class="lhead"><span>Cuenta</span><span class="dcol" style="text-align:right">Debe</span><span class="hcol" style="text-align:right">Haber</span><span></span></div>
    <div class="lines" id="lines">${draftLinesHTML()}</div>
    <div class="totals"><span>Totales</span><span class="num dcol" id="tD">${money(t.d)}</span><span class="num hcol" id="tC">${money(t.c)}</span><span></span></div>
    <div class="status ${t.ok?"ok":"bad"}" id="tSt"><span class="dot"></span>${t.msg}</div>
    <div class="row"><button type="button" class="btn" data-act="addLine">＋ Agregar línea</button>
      <button type="button" class="btn ghost" data-act="clearDraft">Limpiar</button>
      <span style="margin-left:auto"></span><button type="submit" class="btn primary" id="saveEntry" ${t.ok?"":"disabled"}>Registrar asiento ✓</button></div>
   </form>
   ${c.entries.length?`<div class="tbl"><table><thead><tr><th>Fecha</th><th>N.°</th><th>Cuenta</th><th class="r">Debe</th><th class="r">Haber</th><th></th></tr></thead>
     <tbody>${rows}<tr class="tot"><td colspan="3">Sumas iguales</td><td class="r num dcol">${money(tr.d)}</td><td class="r num hcol">${money(tr.c)}</td><td></td></tr></tbody></table></div>`
     :`<div class="empty"><h3>Aún no hay asientos</h3><p>Registra la primera transacción con el formulario de arriba.</p></div>`}
   ${c.entries.length?`<div class="row"><span style="margin-left:auto"></span><button class="btn pop" data-go="mayor">Pasar al Libro Mayor →</button></div>`:""}
  </div>`;
};

VIEWS.mayor=()=>{
  const c=co(),m=movs();
  const list=sortAcc(c.accounts.filter(a=>m[a.code]));
  const f=APP.mayorF||"";
  const shown=f?list.filter(a=>a.type===f):list;
  const cards=shown.map(a=>{
    const dl=[],cl=[];
    for(const e of c.entries)for(const l of e.lines)if(l.code===a.code){if(+l.d)dl.push([e.n,+l.d]);if(+l.c)cl.push([e.n,+l.c])}
    const x=m[a.code];
    const side=r2(x.d-x.c)>=0?"deudor":"acreedor";
    const li=arr=>arr.map(([n,v])=>`<div class="tline"><small>#${n}</small><span class="num">${money(v,false)}</span></div>`).join("")||'<div class="tline muted">—</div>';
    return `<article class="tacc"><header><div><div class="eyebrow">${esc(a.code)}</div><h3>${esc(a.name)}</h3></div>${chip(a.type)}</header>
      <div class="tbody"><div><div class="eyebrow dcol">Debe</div>${li(dl)}<div class="tline tsum dcol"><span>Σ</span><span class="num">${money(x.d,false)}</span></div></div>
      <div><div class="eyebrow hcol">Haber</div>${li(cl)}<div class="tline tsum hcol"><span>Σ</span><span class="num">${money(x.c,false)}</span></div></div></div>
      <div class="tsaldo"><span>Saldo ${r2(x.d-x.c)===0?"":side}</span><span class="num ${side==="acreedor"?"hcol":"dcol"}">${money(Math.abs(x.d-x.c))}</span></div></article>`;
  }).join("");
  return `<div class="head"><div><div class="eyebrow">Paso 3 · Pase al Mayor</div><h2>Libro Mayor</h2>
    <p>Cada asiento del Diario se traslada a su cuenta T. El número pequeño indica de qué asiento viene el monto.</p></div>
    <div class="field" style="flex:0 1 220px"><label for="mayorF">Ver cuentas de</label><select id="mayorF"><option value="">Todos los elementos</option>${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${f===k?"selected":""}>${v}</option>`).join("")}</select></div></div>
  ${list.length?`<div class="tgrid">${cards||'<div class="empty">No hay cuentas con movimiento en este elemento.</div>'}</div>
   <div class="row" style="margin-top:16px"><span style="margin-left:auto"></span><button class="btn pop" data-go="balanza">Pasar a la Balanza →</button></div>`
   :`<div class="empty"><h3>El Mayor está vacío</h3><p>Primero registra asientos en el Libro Diario.</p><button class="btn pop" data-go="diario">Ir al Libro Diario</button></div>`}`;
};

VIEWS.balanza=()=>{
  const c=co(),m=movs(),list=sortAcc(c.accounts.filter(a=>m[a.code]));
  let td=0,tc=0,sd=0,sc=0;
  const rows=list.map(a=>{const x=m[a.code],b=r2(x.d-x.c);td+=x.d;tc+=x.c;if(b>0)sd+=b;else sc+=-b;
    return `<tr><td class="num">${esc(a.code)}</td><td>${esc(a.name)}</td><td>${chip(a.type)}</td>
      <td class="r num">${money(x.d,false)}</td><td class="r num">${money(x.c,false)}</td>
      <td class="r num dcol">${b>0?money(b,false):""}</td><td class="r num hcol">${b<0?money(-b,false):""}</td></tr>`}).join("");
  const ok1=r2(td)===r2(tc),ok2=r2(sd)===r2(sc);
  return `<div class="head"><div><div class="eyebrow">Paso 4 · Comprobación aritmética</div><h2>Balanza de comprobación</h2>
    <p>Reúne los totales y saldos del Mayor. Si las sumas del Debe y del Haber coinciden, el registro es aritméticamente correcto y puedes preparar los estados financieros.</p></div></div>
  ${list.length?`<div class="stack">
    <div class="status ${ok1&&ok2?"ok":"bad"}"><span class="dot"></span>${ok1&&ok2?"La balanza cuadra: movimientos y saldos están en equilibrio":"La balanza no cuadra: revisa los asientos del Diario"}</div>
    <div class="tbl"><table><thead><tr><th rowspan="2">Código</th><th rowspan="2">Cuenta</th><th rowspan="2">Elemento</th><th colspan="2" class="r">Movimientos</th><th colspan="2" class="r">Saldos</th></tr>
     <tr><th class="r">Debe</th><th class="r">Haber</th><th class="r">Deudor</th><th class="r">Acreedor</th></tr></thead>
     <tbody>${rows}<tr class="tot"><td colspan="3">Totales</td><td class="r num">${money(td)}</td><td class="r num">${money(tc)}</td><td class="r num dcol">${money(sd)}</td><td class="r num hcol">${money(sc)}</td></tr></tbody></table></div>
    <div class="row"><span style="margin-left:auto"></span><button class="btn pop" data-go="estados">Emitir estados financieros →</button></div></div>`
   :`<div class="empty"><h3>Sin datos para la balanza</h3><p>Registra asientos para ver la balanza.</p><button class="btn pop" data-go="diario">Ir al Libro Diario</button></div>`}`;
};

function sh(title){const c=co();return `<div class="sh"><div class="eyebrow">${esc(c.code||"")} · ${esc(c.name)} · Céd. ${esc(c.cedula||"—")}</div><h3>${title}</h3>
  <div>${title.includes("Situación")?`Al 31 de diciembre de ${c.period}`:longDate(c.period)}</div><div>Expresado en ${curName(c.currency)}</div></div>`}
const L=(label,v,cls="",ind=false)=>`<tr class="${cls}"><td${ind?' class="indent"':""}>${label}</td><td class="r num">${v===null?"":money(v,false)}</td></tr>`;

function stmtER(){
  const m=movs(),r=results(m);
  const det=f=>sortAcc(co().accounts.filter(a=>f(a)&&m[a.code])).map(a=>L(esc(a.name),signed(a,m),"",true)).join("");
  return `<div class="stmt">${sh("Estado de Resultados Integral")}<div class="tbl" style="border:none"><table>
   <tr class="sec"><td colspan="2">Ingresos de actividades ordinarias <span class="niif">NIIF 15</span></td></tr>${det(a=>a.type==="I"&&a.cls==="ORD")}
   ${L("Total ingresos ordinarios",r.ing,"sub")}
   ${L("(−) Costo de ventas",-r.cv)}
   ${L("Utilidad bruta",r.ub,"sub")}
   <tr class="sec"><td colspan="2">Gastos de operación</td></tr>${det(a=>a.type==="G"&&a.cls==="OP")}
   ${L("Total gastos de operación",-r.gop,"sub")}
   ${L("Utilidad de operación",r.uop,"sub")}
   ${L("(+) Otros ingresos",r.otr)}${L("(−) Gastos financieros",-r.gfin)}
   ${L("Utilidad antes de impuesto",r.uai,"sub")}
   ${L('(−) Gasto por impuesto sobre la renta <span class="niif">NIC 12</span>',-r.isr)}
   ${L(r.un>=0?"Utilidad neta del periodo":"Pérdida neta del periodo",r.un,"big")}
   ${L("Otro resultado integral",0)}
   ${L("Resultado integral total del periodo",r.un,"big")}
  </table></div><p class="note">Presentado según NIC 1, párrafos 81A a 105, con los gastos clasificados por su función. El impuesto sobre la renta corresponde al registrado en el Libro Diario.</p></div>`;
}
function stmtESF(){
  const m=movs(),r=results(m),p=position(m);
  const det=f=>sortAcc(co().accounts.filter(a=>f(a)&&m[a.code]&&r2(signed(a,m))!==0)).map(a=>L(esc(a.name),signed(a,m),"",true)).join("")||'<tr><td class="indent muted">Sin saldo</td><td></td></tr>';
  const s=f=>sumWhere(m,f);
  return `<div class="stmt">${sh("Estado de Situación Financiera")}
   <div class="status ${p.ok?"ok":"bad"}" style="margin-bottom:10px"><span class="dot"></span>${p.ok?"Activo = Pasivo + Patrimonio":"No cuadra: Activo ≠ Pasivo + Patrimonio"}</div>
   <div class="tbl" style="border:none"><table>
   <tr class="sec"><td colspan="2">ACTIVO</td></tr>
   <tr><td><b>Activo corriente</b></td><td></td></tr>${det(a=>a.type==="A"&&a.cls==="C")}${L("Total activo corriente",s(a=>a.type==="A"&&a.cls==="C"),"sub")}
   <tr><td><b>Activo no corriente</b></td><td></td></tr>${det(a=>a.type==="A"&&a.cls==="NC")}${L("Total activo no corriente",s(a=>a.type==="A"&&a.cls==="NC"),"sub")}
   ${L("TOTAL ACTIVO",p.A,"big")}
   <tr class="sec"><td colspan="2">PASIVO</td></tr>
   <tr><td><b>Pasivo corriente</b></td><td></td></tr>${det(a=>a.type==="P"&&a.cls==="C")}${L("Total pasivo corriente",s(a=>a.type==="P"&&a.cls==="C"),"sub")}
   <tr><td><b>Pasivo no corriente</b></td><td></td></tr>${det(a=>a.type==="P"&&a.cls==="NC")}${L("Total pasivo no corriente",s(a=>a.type==="P"&&a.cls==="NC"),"sub")}
   ${L("TOTAL PASIVO",p.P,"sub")}
   <tr class="sec"><td colspan="2">PATRIMONIO</td></tr>${det(a=>a.type==="PT")}
   ${L("Utilidad (pérdida) del periodo",r.un,"",true)}
   ${L("TOTAL PATRIMONIO",p.PT,"sub")}
   ${L("TOTAL PASIVO + PATRIMONIO",p.P+p.PT,"big")}
  </table></div><p class="note">Clasificación corriente / no corriente según NIC 1, párrafos 60 a 76. Las cuentas correctoras (por ejemplo, depreciación acumulada) se muestran entre paréntesis restando a su activo.</p></div>`;
}
function stmtECP(){
  const m=movs(),r=results(m);

function plCedulaAleatoria(){const r=()=>Math.floor(1000+Math.random()*9000);return `${1+Math.floor(Math.random()*9)}-${r()}-${r()}`}
function plBarajar(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function plPick(arr){return arr[Math.floor(Math.random()*arr.length)]}
function plMontoAzar(min,max){return Math.max(min,Math.round((min+Math.random()*(max-min))/1000)*1000)}
// Nivel 1 = rangos básicos; a partir de nivel 2-3 suben los topes de horas
// extra, ausencias, tardías y la probabilidad de tener rebajos — cada
// práctica nueva queda, a propósito, un poco más complicada que la
// anterior, además de tener gente y puestos distintos.
function generarColaboradoresPractica(n,nivel=1){
  const cant=Math.max(1,n);
  const nombres=plBarajar(NOMBRES_PRACTICA).slice(0,cant);
  while(nombres.length<cant)nombres.push(plPick(NOMBRES_PRACTICA)); // por si piden más de los que hay en el catálogo
  const puestos=PUESTOS_PRACTICA.length>=cant?plBarajar(PUESTOS_PRACTICA).slice(0,cant):Array.from({length:cant},()=>plPick(PUESTOS_PRACTICA));
  const topeExtra=2+nivel*(nivel>=4?2:1),topeAusencia=nivel>=5?4:nivel>=4?3:(nivel>=3?2:(nivel>=2?1:0)),topeTarde=nivel>=5?5:nivel>=4?4:(nivel>=3?2:(nivel>=2?1:0));
  const probRebajo=Math.min(0.3+Math.min(nivel,6)*0.1,0.95);
  const probHijos=nivel>=4?0.85:0.6,maxHijos=nivel>=4?4:3;
  return nombres.map((nombre,i)=>{
    const pu=puestos[i];
    const horasExtra=Math.random()<0.75?Math.floor(Math.random()*(topeExtra+1)):0;
    const diasAusencia=topeAusencia?Math.floor(Math.random()*(topeAusencia+1)):0;
    const horasTarde=topeTarde?Math.floor(Math.random()*(topeTarde+1)):0;
    const comisiones=(pu.conComision&&Math.random()<(nivel>=4?0.95:0.7))?plMontoAzar(20000,90000+nivel*15000):0;
    const hijos=Math.random()<probHijos?Math.floor(Math.random()*maxHijos):0;
    const conyuge=Math.random()<0.45;
    const jornada=nivel>=4?plPick(["mixta","nocturna","nocturna","diurna"]):plPick(["diurna","diurna","mixta","nocturna"]);
    const tipoPago=nivel>=4?plPick(["quincenal","quincenal","mensual"]):plPick(["mensual","mensual","quincenal"]);
    const rebajos={};
    if(Math.random()<probRebajo)rebajos.asoc={on:true,valor:nivel>=4?plPick([3,5,5,6]):5};
    if(Math.random()<probRebajo)rebajos.ahorro={on:true,valor:plMontoAzar(10000,30000)};
    return {id:uid(),cedula:plCedulaAleatoria(),nombre,puesto:pu.puesto,base:plMontoAzar(pu.min,pu.max),horasExtra,comisiones,diasAusencia,horasTarde,hijos,conyuge,jornada,tipoPago,rebajos};
  });
}

async function subirPdfPractica(blob,companyId){

// Crea una empresa de práctica con colaboradores ya cargados y su PDF de
// instrucciones ya lleno: una copia para el profesor (para revisar/tener
// la solución) y la MISMA empresa, con los mismos datos y el mismo PDF,
// directo en la cuenta de cada estudiante — así nadie tiene que digitarla
// a mano ni armar el PDF aparte, y no hay margen de error de copiado.
async function crearPracticaParaClase({nombreEmpresa,cantidad,seccion,nivel:nivelElegido}){
  const nivel=nivelElegido||proximoNivelPractica();
  const colaboradoresBase=generarColaboradoresPractica(cantidad,nivel);
  const anio=new Date().getFullYear();
  const armarEmpresa=(code,pdfUrl)=>({
    id:uid(),code,name:nombreEmpresa,cedula:"",currency:"₡",period:anio,categoria:"practica",entregado:false,
    nivelPractica:nivel,pdfInstrucciones:pdfUrl||null,
    accounts:BASE.map(a=>({...a})),entries:[],
    payroll:{params:clone(PL_DEFAULT),employees:colaboradoresBase.map(e=>({...e,id:uid()})),runs:[],evals:[]}
  });
  // 0) PDF de instrucciones, con los datos reales de esta práctica
  let pdfUrl=null;
  try{
    const blob=await generarPdfInstruccionesPractica({name:nombreEmpresa,payroll:{employees:colaboradoresBase}},nivel);
    pdfUrl=await subirPdfPractica(blob,uid());
  }catch(e){/* si falla el PDF, la práctica se crea igual sin él */}
  // 1) Copia de referencia para el profesor
  const refCo=armarEmpresa(nextCoCode(),pdfUrl);
  await APP.store.saveCompany(refCo);
  APP.companies.push(refCo);
  APP.activeId=refCo.id;APP.view="empresas";
  // 2) Misma empresa (y mismo PDF) para cada estudiante de la sección elegida, o todos
  let q=sb.from("estudiantes").select("id,nombre,apellido1,apellido2,seccion");
  if(seccion&&seccion!=="todas")q=q.eq("seccion",seccion);
  const {data:estudiantes,error}=await q;
  if(error)throw error;
  let ok=0;const fallidos=[];
  for(const est of (estudiantes||[])){
    try{
      const store=supabaseStudentStore(est.id);
      const companias=await store.loadWork();
      companias.push(armarEmpresa(nextCodeFor(companias),pdfUrl));
      await store.saveWork(null,null,companias);
      ok++;
    }catch(e){fallidos.push(`${est.nombre} ${est.apellido1}`)}
  }
  return {ok,total:(estudiantes||[]).length,fallidos,nivel,pdfUrl};
}
// Sube un PDF propio (del profesor) y lo adjunta a una práctica que ya
// existe — en su propia cuenta y en la de cada estudiante que tenga una
// empresa con el mismo nombre.
async function adjuntarPdfPracticaDeClase(companiaId,file){
  const c=APP.companies.find(x=>x.id===companiaId);
  if(!c)throw new Error("No se encontró esa empresa.");
  const url=await subirPdfPractica(file,c.id);
  c.pdfInstrucciones=url;await APP.store.saveCompany(c);
  const nombreNorm=String(c.name||"").trim().toLowerCase();
  const {data:estudiantes}=await sb.from("estudiantes").select("id");
  let ok=0;
  for(const est of (estudiantes||[])){

      let cambiado=false;
      for(const x of companias)if(String(x.name||"").trim().toLowerCase()===nombreNorm){x.pdfInstrucciones=url;cambiado=true}

// Elimina, por nombre exacto, una empresa de la cuenta del profesor y de
// la cuenta de cada estudiante que la tenga — el "deshacer" de
// crearPracticaParaClase, para cuando una práctica se creó mal.
async function eliminarPracticaDeClase({nombreEmpresa,seccion}){
  const nombreNorm=String(nombreEmpresa||"").trim().toLowerCase();
  let propiasEliminadas=0;
  for(const c of APP.companies.filter(x=>String(x.name||"").trim().toLowerCase()===nombreNorm)){
    try{await APP.store.deleteCompany(c.id);propiasEliminadas++}catch(e){/* seguimos igual */}
  }
  APP.companies=APP.companies.filter(x=>String(x.name||"").trim().toLowerCase()!==nombreNorm);
  if(!APP.companies.some(x=>x.id===APP.activeId))APP.activeId=APP.companies[0]?.id||null;
  let q=sb.from("estudiantes").select("id,nombre,apellido1");
  if(seccion&&seccion!=="todas")q=q.eq("seccion",seccion);
  const {data:estudiantes,error}=await q;
  if(error)throw error;
  let ok=0,sinCambio=0;const fallidos=[];
  for(const est of (estudiantes||[])){
    try{
      const store=supabaseStudentStore(est.id);
      const companias=await store.loadWork();
      const nuevas=companias.filter(c=>String(c.name||"").trim().toLowerCase()!==nombreNorm);
      if(nuevas.length!==companias.length){await store.saveWork(null,null,nuevas);ok++}else sinCambio++;
    }catch(e){fallidos.push(`${est.nombre} ${est.apellido1}`)}
  }
  return {ok,sinCambio,total:(estudiantes||[]).length,fallidos,propiasEliminadas};
}

/* B · Motor de cálculo */
const plAct=l=>(l||[]).filter(x=>x.activa!==false);
function plRentaTramos(bruto,P,div){let prev=0,rb=0;for(const t of P.renta.tramos){const lim=(t.hasta===null||t.hasta===""||t.hasta===undefined)?Infinity:+t.hasta/div;const b=Math.max(0,Math.min(bruto,lim)-prev);rb+=r2(b*(+t.pct)/100);prev=lim;if(bruto<=lim)break}return r2(rb)}
function plCalc(e,P){
  const J=P.jornada,base0=r2(+e.base||0);
  const jor=(P.jornadas||[]).find(j=>j.id===(e.jornada||"diurna"))||(P.jornadas||[])[0]||{id:"diurna",nombre:"Diurna",horas:J.horas||8};
  const pg=(P.pagos||[]).find(x=>x.id===(e.tipoPago||"mensual"))||(P.pagos||[])[0]||{id:"mensual",nombre:"Mensual",divisor:1};
  const div=+pg.divisor||1,horas=+jor.horas||8;
  const base=r2(base0/div);
  const vDia=r2(base0/J.dias),vHora=r2(base0/J.dias/horas);
  const he=+e.horasExtra||0,extra=r2(he*vHora*J.factorExtra);
  const comis=r2(+e.comisiones||0);
  const ausen=r2((+e.diasAusencia||0)*vDia),tarde=r2((+e.horasTarde||0)*vHora);
  const bruto=r2(base+extra+comis-ausen-tarde);
  const obrero=plAct(P.obrero).map(x=>({id:x.id,nombre:x.nombre,pct:+x.pct,cuenta:x.cuenta,monto:r2(bruto*x.pct/100)}));
  const totObr=r2(obrero.reduce((s,x)=>s+x.monto,0));
  let prev=0,rb=0;const tramos=[];
  for(const t of P.renta.tramos){
    const lim=(t.hasta===null||t.hasta===""||t.hasta===undefined)?Infinity:+t.hasta/div;
    const b=Math.max(0,Math.min(bruto,lim)-prev),imp=r2(b*(+t.pct)/100);
    tramos.push({desde:prev,hasta:lim,pct:+t.pct,base:r2(b),imp});rb+=imp;prev=lim;if(bruto<=lim)break;
  }
  const rentaBruta=r2(rb);
  const creditos=r2(((+e.hijos||0)*P.renta.hijo+(e.conyuge?P.renta.conyuge:0))/div);
  const credAplic=Math.min(creditos,rentaBruta);
  const renta=r2(rentaBruta-credAplic);
  const rebajos=plAct(P.rebajos).filter(r=>e.rebajos?.[r.id]?.on).map(r=>{const val=+(e.rebajos[r.id].valor??r.valor)||0;
    return {id:r.id,nombre:r.nombre,modo:r.modo,valor:val,cuenta:r.cuenta,monto:r.modo==="pct"?r2(bruto*val/100):r2(val)}});
  const totReb=r2(rebajos.reduce((s,x)=>s+x.monto,0));
  const totDed=r2(totObr+renta+totReb),neto=r2(bruto-totDed);
  const patronal=plAct(P.patronal).map(x=>({id:x.id,nombre:x.nombre,pct:+x.pct,cuenta:x.cuenta,monto:r2(bruto*x.pct/100)}));
  const totPat=r2(patronal.reduce((s,x)=>s+x.monto,0));
  const prov=plAct(P.prov).map(x=>({id:x.id,nombre:x.nombre,pct:+x.pct,gasto:x.gasto,pasivo:x.pasivo,monto:r2(bruto*x.pct/100)}));
  const totProv=r2(prov.reduce((s,x)=>s+x.monto,0));
  return {base0,base,div,jor:{id:jor.id,nombre:jor.nombre,horas},pago:{id:pg.id,nombre:pg.nombre,divisor:div},vDia,vHora,he,extra,comis,dias:+e.diasAusencia||0,ausen,ht:+e.horasTarde||0,tarde,bruto,obrero,totObr,tramos,rentaBruta,creditos,credAplic,renta,rebajos,totReb,totDed,neto,patronal,totPat,prov,totProv,costo:r2(bruto+totPat+totProv),J};
}
function plRunLabel(r){const m=plMes(r.periodo);if(!r.nPago)return m;return r.div===2?`${r.nPago}.ª quincena de ${m}`:`${r.nPago}.° pago ${String(r.tipoNombre||"").toLowerCase()} de ${m}`}
function plRunKey(r){return r.periodo+"|"+(r.nPago||0)+"|"+(r.tipo||"mensual")}
function plPayDate(r){const last=plLastDay(r.periodo);if(!r.nPago)return last;const ld=+last.slice(8);const d=r.div===2?(r.nPago===1?15:ld):Math.min(ld,Math.round(7*r.nPago));return r.periodo+"-"+String(d).padStart(2,"0")}

function plEntryLines(run){
  const M=new Map();const add=(code,d,c)=>{const x=M.get(code)||{code,d:0,c:0};x.d+=d;x.c+=c;M.set(code,x)};
  for(const r of run.res){const k=r.calc;
    add("6101",k.bruto,0);if(k.totPat)add("6102",k.totPat,0);
    for(const x of k.prov){add(x.gasto,x.monto,0);add(x.pasivo,0,x.monto)}
    for(const x of k.obrero)add(x.cuenta,0,x.monto);
    for(const x of k.patronal)add(x.cuenta,0,x.monto);
    if(k.renta)add("2110",0,k.renta);
    for(const x of (k.rebajos||[]))add(x.cuenta,0,x.monto);
    add(run.pago||"1102",0,k.neto);
  }
  let lines=[...M.values()].map(x=>{const n=r2(x.d-x.c);return {code:x.code,d:n>0?n:0,c:n<0?-n:0}}).filter(l=>l.d||l.c);
  lines.sort((a,b)=>(b.d>0)-(a.d>0)||a.code.localeCompare(b.code,undefined,{numeric:true}));
  const D=r2(lines.reduce((s,l)=>s+l.d,0)),C=r2(lines.reduce((s,l)=>s+l.c,0));
  if(D!==C){const n=lines.find(l=>l.code===(run.pago||"1102"));if(n)n.c=r2(n.c+D-C)}
  return lines;
}
function plEnsureAccounts(c){let n=0;for(const a of PL_ACCOUNTS)if(!c.accounts.some(x=>x.code===a.code)){c.accounts.push({...a});n++}

document.addEventListener("submit",e=>{
  const id=e.target.id;if(id!=="evMForm"&&id!=="evAForm")return;
  e.preventDefault();e.stopImmediatePropagation();

  if(id==="evMForm"){

    p.evalM=p.evalM||{resp:{}};p.evalM.resultado={ok,total,pct:total?Math.round(100*ok/total):0,fecha:new Date().toISOString(),detalle};

    p.evalA=p.evalA||{resp:{}};p.evalA.resultado={ok,total:sol.length,pct:sol.length?Math.round(100*ok/sol.length):0,fecha:new Date().toISOString(),detalle};

// Guarda la empresa actual (colaboradores, planilla procesada, asiento y
// colillas tal como están en este momento) directamente en las "Entregas
// recibidas" del profesor — sin que el estudiante tenga que generar un
// código y mandarlo por Teams. Usa las mismas tablas y el mismo formato
// de "meta" (con resumen) que ya usa el flujo de código, para que salga
// igual en el panel del profesor.
async function registrarDocenteActual(docenteId){
  // Deja registrado, en un lugar fijo y compartido, cuál es el id del
  // profesor que está usando el sistema ahora mismo — así, cuando un
  // estudiante guarda una entrega directa, no tiene que adivinar a cuál
  // profesor pertenece: lee este mismo valor.
  try{await sb.from("aula_conta_modulos").upsert({id:"global",docente_id:String(docenteId)})}catch(e){/* no bloquea el ingreso */}
}
async function obtenerDocenteIdActual(){
  const {data:cfg}=await sb.from("aula_conta_modulos").select("docente_id").eq("id","global").maybeSingle();
  if(cfg&&cfg.docente_id)return cfg.docente_id;
  // Respaldo por si el profesor nunca entró desde que existe este registro.
  const {data:doc}=await sb.from("docentes").select("id").limit(1).maybeSingle();
  return doc?doc.id:null;
}
async function guardarEntregaDirecta(companies){
  const docenteId=await obtenerDocenteIdActual();
  if(!docenteId)throw new Error("No se encontró el perfil del profesor.");
  const ahora=new Date().toISOString();
  const meta={id:uid(),usuario:APP.me.usuario,nombre:APP.me.nombre,fecha:ahora,recibida:ahora,check:null,
    resumen:plResumen(companies,APP.modulosHabilitados||[]),empresas:companies.length,asientos:companies.reduce((s,x)=>s+(x.entries||[]).length,0)};
  const {error:e1}=await sb.from("aula_conta_entregas").upsert({id:meta.id,docente_id:docenteId,usuario:meta.usuario,nombre:meta.nombre,fecha:meta.fecha,meta});
  if(e1)throw e1;
  for(const c0 of companies){
    const {error:e2}=await sb.from("aula_conta_entregas_empresas").upsert({entrega_id:meta.id,empresa_id:c0.id,data:c0});
    if(e2)throw e2;
  }
  return meta;
}

function plEvaluarTrabajo(p){
  const st=plSheetStatus(p);
  const runs=(p.runs||[]).filter(r=>r.entryId);
  const asTotal=runs.length,asOk=runs.filter(r=>r.machoteOk).length;
  const evs=(p.evals||[]).filter(e=>e.modo==="evaluacion");
  const evalPct=evs.length?Math.round(100*evs.reduce((s,e)=>s+e.puntaje/e.total,0)/evs.length):null;
  const detalles=[];
  if(st.total>0)detalles.push({ok:st.all,texto:st.all?`Machote de planilla: ${st.ok}/${st.total} casillas correctas`:`Machote de planilla: ${st.ok}/${st.total} casillas correctas — todavía tiene errores`});
  if(asTotal>0)detalles.push({ok:asOk===asTotal,texto:asOk===asTotal?`Asiento(s) de diario: ${asOk}/${asTotal} correcto(s)`:`Asiento(s) de diario: ${asOk}/${asTotal} correcto(s) — todavía tiene errores`});
  if(evs.length)detalles.push({ok:evalPct>=70,texto:`Práctica y evaluación: ${evalPct}% en promedio`});
  const bueno=detalles.length>0&&detalles.every(d=>d.ok);
  return {bueno,detalles,fecha:new Date().toISOString()};
}

function parseNum(s){
  s=String(s??"").replace(/[₡\s]/g,"").replace(/[^\d.,-]/g,"");if(!s)return NaN;
  const lc=s.lastIndexOf(","),ld=s.lastIndexOf(".");

  else if(lc>-1){s=/,\d{1,2}$/.test(s)&&s.split(",").length===2?s.replace(",","."):s.replace(/,/g,"")}
  else if(ld>-1&&!(/\.\d{1,2}$/.test(s)&&s.split(".").length===2))s=s.replace(/\./g,"");
  return parseFloat(s);
}

function plFeedback(key,v,k,P,ans){

  if(key==="ausen")return "Cada día de ausencia rebaja el valor de un día: salario mensual ÷ 30.";
  if(key==="bruto"){if(d>1&&near(v,k.base0+k.extra+k.comis-k.ausen-k.tarde))return "En pago quincenal se parte del salario de la quincena (mensual ÷ 2), no del mensual.";

  if(key.startsWith("o:")){const x=k.obrero.find(o=>o.id===key.slice(2));
    if(k.base!==k.bruto&&near(v,r2(k.base*x.pct/100)))return "Usaste el salario base. Las cuotas obreras se calculan sobre el salario bruto.";

    if(pp&&near(v,r2(k.bruto*pp.pct/100)))return `Ese es el porcentaje patronal (${pct(pp.pct)}). Al colaborador se le rebaja ${pct(x.pct)}.`;
    return `Revisa el cálculo: ${x.nombre.split("·")[0].trim()} obrero = salario bruto × ${pct(x.pct)}.`}

    if(d>1&&near(v,r2(Math.max(0,plRentaTramos(k.bruto,P,1)-k.creditos*d))))return `En pago ${String(k.pago.nombre).toLowerCase()} los tramos de renta y los créditos se dividen entre ${d}.`;
    if(near(v,r2(k.bruto*.10))||near(v,r2(k.bruto*.15)))return "La tarifa no se aplica a todo el salario. Cada tarifa se aplica solo a la parte del salario que cae en su tramo.";
    if(k.credAplic>0&&near(v,k.rentaBruta))return "Calculaste bien los tramos, pero te faltó restar los créditos fiscales por hijos o cónyuge.";
    return `Calcula tramo por tramo${d>1?" con los tramos ÷ "+d:""}: el primer tramo está exento y cada tarifa aplica solo al exceso. Al final resta los créditos fiscales.`}
  if(key.startsWith("r:")){const x=(k.rebajos||[]).find(o=>o.id===key.slice(2));
    if(x.modo==="pct"&&k.base!==k.bruto&&near(v,r2(k.base*x.valor/100)))return "Este rebajo se calcula sobre el salario bruto, no sobre el base.";

  if(key==="reb")return (k.rebajos||[]).length?"Suma los rebajos autorizados: "+k.rebajos.map(x=>x.nombre+(x.modo==="pct"?" (bruto × "+pct(x.valor)+")":" ("+money(x.valor)+")")).join(" + ")+".":"Este colaborador no tiene otros rebajos: escribe 0.";

/* Machote del asiento */
const plType=(code)=>(acc(code)||PL_ACCOUNTS.find(a=>a.code===code)||{type:code.startsWith("6")?"G":code.startsWith("1")?"A":"P"}).type;
function plAsientoFb(code,d,cr,sol,run,P){
  const side=sol.d?"d":"c",amt=sol.d||sol.c,given=d||cr,t=plType(code);
  if(!d&&!cr)return "Esta cuenta lleva un monto. Decide si va al Debe o al Haber.";
  if(d&&cr)return "Escribe el monto en una sola columna: Debe o Haber.";
  if((side==="d"&&cr)||(side==="c"&&d)){
    if(t==="G")return "Es una cuenta de gasto: los gastos aumentan en el Debe.";
    if(t==="A")return "Bancos es un activo y aquí disminuye porque sale el dinero para pagar los salarios: va al Haber.";
    return "Es un pasivo: la empresa ahora debe ese dinero, y los pasivos aumentan en el Haber.";
  }
  if(near(given,amt))return "";
  const S=f=>r2(run.res.reduce((s,r)=>s+f(r.calc),0));
  if(code==="6101"){if(near(given,S(k=>k.base)))return "Usaste el salario base. El gasto por salarios es la suma de los salarios brutos.";
    if(near(given,S(k=>k.neto)))return "Ese es el total neto. El gasto es el salario bruto: lo que se retiene al trabajador también es gasto de la empresa.";
    return "Suma los salarios brutos de todos los colaboradores."}
  if(code==="6102"){if(near(given,S(k=>k.totObr)))return "Esas son las cuotas obreras, que se rebajan al trabajador. El gasto de la empresa son las cuotas patronales.";
    return `Suma todas las cuotas patronales: total de salarios brutos × ${pct(plAct(P.patronal).reduce((s,x)=>s+(+x.pct),0))}.`}
  const pv=plAct(P.prov).find(x=>x.gasto===code||x.pasivo===code);
  if(pv)return `${pv.nombre}: total de salarios brutos × ${pct(pv.pct)}. El mismo monto va al gasto (Debe) y a la provisión (Haber).`;
  if(code==="2110")return "Suma la renta retenida a todos los colaboradores. Los salarios que no superan el tramo exento no retienen.";
  if(code===(run.pago||"1102")){if(near(given,S(k=>k.bruto)))return "Ese es el total bruto. Al colaborador se le paga el neto: bruto menos cuotas obreras y renta.";
    return "Suma los salarios netos de todos los colaboradores."}
  const rbs=plAct(P.rebajos||[]).filter(x=>x.cuenta===code);
  if(rbs.length)return "Suma lo rebajado a todos los colaboradores por: "+rbs.map(x=>x.nombre).join(", ")+". Es dinero del trabajador que la empresa debe entregar, por eso es un pasivo.";
  const ob=plAct(P.obrero).filter(x=>x.cuenta===code),pa=plAct(P.patronal).filter(x=>x.cuenta===code);
  const sumOf=list=>S(k=>[...k.obrero,...k.patronal].filter(x=>list.some(l=>l.id===x.id)).reduce((s,x)=>s+x.monto,0));
  if(ob.length&&near(given,sumOf(ob)))return "Solo pusiste las cuotas obreras. Esta deuda incluye también las cuotas patronales que van a la misma institución.";
  if(pa.length&&near(given,sumOf(pa)))return "Solo pusiste las cuotas patronales. Suma también lo que se retuvo a los trabajadores para esta institución.";
  if(ob.length||pa.length)return "Esta cuenta reúne: "+[...ob.map(x=>x.nombre.split("·")[0].trim()+" obrero "+pct(x.pct)),...pa.map(x=>x.nombre.split("·")[0].split("(")[0].trim()+" patronal "+pct(x.pct))].join(", ")+". Suma esos montos de todos los colaboradores.";
  return "Revisa el monto de esta cuenta.";
}
function plMachoteAsiento(c,p,run){

  const codes=sol.map(l=>l.code).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
  run.mach??={};const chk=APP.plEntryChk&&APP.plEntryChk.run===run.id?APP.plEntryChk.res:null;
  const val=(code,s)=>(run.mach[code]||{})[s]??"";
  let D=0,C=0;for(const code of codes){D+=parseNum(val(code,"d"))||0;C+=parseNum(val(code,"c"))||0}
  const allOk=chk&&codes.every(k=>chk[k].ok);

      <td class="r"><input data-ma="${run.id}|${code}|d" inputmode="decimal" placeholder="0,00" value="${esc(val(code,"d"))}" aria-label="Debe de ${esc(name(code))}"></td>
      <td class="r"><input data-ma="${run.id}|${code}|c" inputmode="decimal" placeholder="0,00" value="${esc(val(code,"c"))}" aria-label="Haber de ${esc(name(code))}"></td>
      <td class="ic" style="font-weight:800;color:${x&&puedeVerRespuestas()?(x.ok?"var(--ok)":"var(--bad)"):"var(--muted)"}">${x&&puedeVerRespuestas()?(x.ok?"✓":"✗"):""}</td></tr>`}).join("")}
    <tr class="entry-desc"><td colspan="4">p/r Registro de la planilla de ${esc(plRunLabel(run))} · ${run.res.length} colaborador(es)</td></tr>
    <tr class="tot"><td>Tus sumas</td><td class="r num dcol" id="maD">${money(D)}</td><td class="r num hcol" id="maC">${money(C)}</td><td></td></tr></tbody></table></div>
    <div class="status ${r2(D)===r2(C)&&D>0?"ok":"bad"}" id="maSt"><span class="dot"></span>${r2(D)===r2(C)&&D>0?"Tus sumas son iguales":"Tus sumas todavía no son iguales"}</div>
    ${chk?`<div class="status ${allOk?"ok":"bad"}"><span class="dot"></span>${allOk?"¡Asiento correcto! Ya puedes registrarlo en el Libro Diario.":`${codes.filter(k=>chk[k].ok).length} de ${codes.length} cuentas correctas. Revisá tus montos y volvé a intentar.`}</div>`:""}
    <div class="row">
      ${allOk?`<button type="button" class="btn primary" data-pact="register" data-id="${run.id}">Registrar en el Libro Diario ✓</button>`:`<button class="btn primary" type="submit">Revisar mi asiento</button>`}
      ${puedeVerRespuestas()&&!allOk&&(run.intentos||0)>=3?`<button type="button" class="btn ghost" data-pact="showSol">${APP.plShowSol?"Ocultar la solución":"Ver la solución"}</button>`:""}
      <span class="muted" style="align-self:center;font-size:.85rem">Intentos: ${run.intentos||0}${puedeVerRespuestas()&&(run.intentos||0)<3&&!allOk?" · la solución se habilita después de 3 intentos":""}</span>
    </div>
    ${puedeVerRespuestas()&&APP.plShowSol&&!allOk?`<div class="tbl"><table><thead><tr><th>Solución</th><th class="r">Debe</th><th class="r">Haber</th></tr></thead><tbody>${sol.map(l=>`<tr><td class="${l.c?"indent":""}">${esc(l.code)} · ${esc(name(l.code))}</td><td class="r num dcol">${l.d?money(l.d,false):""}</td><td class="r num hcol">${l.c?money(l.c,false):""}</td></tr>`).join("")}</tbody></table></div>`:""}
  </form>`;
}
function plNextPer(c,p){const last=p.runs.map(r=>r.periodo).sort().pop();if(!last)return `${c.period}-01`;let [y,m]=last.split("-").map(Number);m++;if(m>12){m=1;y++}return `${y}-${String(m).padStart(2,"0")}`}
function plDraftRun(p){
  const c=co();p.draft??={id:"draft",periodo:plNextPer(c,p),tipo:"mensual",nPago:null,pago:"1102",mach:{},intentos:0};
  const d=p.draft,tp=p.params.pagos.find(x=>x.id===d.tipo)||p.params.pagos[0]||{id:"mensual",nombre:"Mensual",divisor:1};

    if(!P.pagos.length||P.pagos.some(x=>!(x.divisor>=1))){toast("Cada tipo de pago necesita 1 o más pagos por mes");return}

  if(id==="plProc"){

const MODULOS_DEFAULT=["diario","mayor","balanza","estados","planillas"];
const LOCK_NAMES={planillas:"Planillas",diario:"Libro Diario",mayor:"Libro Mayor",balanza:"Balanza de comprobación",estados:"Estados financieros"};
const isUnlocked=k=>isTeacher()||!LOCK_NAMES[k]||(APP.modulosHabilitados||MODULOS_DEFAULT).includes(k);
async function loadModulosHabilitados(){
  try{
    const {data,error}=await sb.from("aula_conta_modulos").select("habilitados").eq("id","global").maybeSingle();
    if(error||!data||!Array.isArray(data.habilitados))return [...MODULOS_DEFAULT];
    return data.habilitados;
  }catch(e){return [...MODULOS_DEFAULT]}
}
async function guardarModulosHabilitados(arr){
  const {error}=await sb.from("aula_conta_modulos").upsert({id:"global",habilitados:arr,actualizado_en:new Date().toISOString()});
  if(error)throw error;
}

  if(a==="cancelEditAcc"){APP.editAcc=null;render();return}
  if(a==="delAcc"){armDelete(b,()=>{c.accounts=c.accounts.filter(x=>x.code!==b.dataset.code);touch(c);render();toast("Cuenta eliminada")});return}
  if(a==="addLine"){draft.lines.push({code:"",d:"",c:""});document.getElementById("lines").innerHTML=draftLinesHTML();updateTotals();return}
  if(a==="rmLine"){draft.lines.splice(+b.dataset.i,1);document.getElementById("lines").innerHTML=draftLinesHTML();updateTotals();return}
  if(a==="clearDraft"){resetDraft();render();return}
  if(a==="delEntry"){armDelete(b,()=>{c.entries=c.entries.filter(x=>x.id!==b.dataset.id);c.entries.sort((x,y)=>x.date.localeCompare(y.date)||x.n-y.n).forEach((x,i)=>x.n=i+1);touch(c);render();toast("Asiento eliminado y renumerado")});return}
  }catch(err){b.disabled=false;toast(err&&err.message&&!err.code?err.message:"No se pudo completar. Inténtalo de nuevo.")}
});
async function stopViewing(){
  APP.viewing=null;APP.readOnly=false;APP.companies=await APP.store.listCompanies();
  APP.activeId=sortCos(APP.companies)[0]?.id||null;APP.view="entregas";resetDraft();loadEntregas();
}
document.addEventListener("input",e=>{
  const ln=e.target.closest(".line");
  if(ln){const i=+ln.dataset.i,f=e.target.dataset.f;draft.lines[i][f]=e.target.value;
    if(f==="d"&&e.target.value){draft.lines[i].c="";ln.querySelector('[data-f="c"]').value=""}
    if(f==="c"&&e.target.value){draft.lines[i].d="";ln.querySelector('[data-f="d"]').value=""}
    updateTotals();return}
  if(e.target.id==="eDate")draft.date=e.target.value;
  if(e.target.id==="eDesc")draft.desc=e.target.value;
  if(e.target.id==="entF"){APP.entF=e.target.value;const pos=e.target.selectionStart;render();const el=document.getElementById("entF");if(el){el.focus();el.setSelectionRange(pos,pos)}}
});
document.addEventListener("change",e=>{
  if(e.target.id==="empSec"){APP.empSec=e.target.value;render();return}
  if(e.target.id==="coPick"){APP.activeId=e.target.value;APP.editAcc=null;resetDraft();if(["entregas","entregar"].includes(APP.view))APP.view="diario";render();toast("Trabajando en: "+co().name)}
  if(e.target.id==="mayorF"){APP.mayorF=e.target.value;render()}
  if(e.target.id==="aType"){const t=e.target.value;document.getElementById("aCls").innerHTML=Object.entries(CLS[t]).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}
});
document.addEventListener("change",async e=>{
  if(!e.target.matches("[data-adjuntar-pdf]"))return;
  const file=e.target.files[0];if(!file)return;
  const id=e.target.dataset.adjuntarPdf,label=e.target.closest("label");
  if(label)label.textContent="Subiendo…";
  try{
    const r=await adjuntarPdfPracticaDeClase(id,file);
    toast(`PDF adjuntado ✓ — actualizado en ${r.ok} estudiante(s)`);render();
  }catch(err){toast("No se pudo subir el PDF: "+(err.message||err));if(label)label.textContent="📎 Adjuntar PDF"}
});
document.addEventListener("submit",async e=>{
  e.preventDefault();const c=co(),id=e.target.id;
  if(id==="formCrearPractica"){
    const nombre=val("ppNombre").trim(),cantidad=+val("ppCantidad")||4,seccion=val("ppSeccion")||"todas";
    const estadoEl=document.getElementById("crearPracticaEstado"),btn=e.target.querySelector("button[type=submit]");
    if(!nombre){if(estadoEl)estadoEl.textContent="Ponele un nombre a la empresa.";return}
    if(btn)btn.disabled=true;if(estadoEl)estadoEl.textContent="Creando la empresa y repartiéndola entre los estudiantes…";
    try{
      const r=await crearPracticaParaClase({nombreEmpresa:nombre,cantidad,seccion,nivel:+val("ppNivel")||0});
      APP.plCrearPracticaAbierto=false;render();
      toast(`Práctica "${nombre}" creada ✓ — ${r.ok} de ${r.total} estudiante(s)`+(r.fallidos.length?`. No se pudo con: ${r.fallidos.join(", ")}`:""));
    }catch(err){
      if(estadoEl)estadoEl.textContent="No se pudo crear la práctica: "+(err.message||err);
      if(btn)btn.disabled=false;
    }
    return;
  }
  if(id==="formEliminarPractica"){
    const nombre=val("epNombre").trim(),seccion=val("epSeccion")||"todas";
    const estadoEl=document.getElementById("eliminarPracticaEstado"),btn=e.target.querySelector("button[type=submit]");
    if(!nombre){if(estadoEl)estadoEl.textContent="Escribí el nombre exacto de la empresa.";return}
    if(!confirm(`¿Eliminar la empresa "${nombre}" de tu cuenta y de la cuenta de cada estudiante${seccion==="todas"?"":" de la sección "+seccion} que la tenga? Esto no se puede deshacer.`))return;
    if(btn)btn.disabled=true;if(estadoEl)estadoEl.textContent="Eliminando…";
    try{
      const r=await eliminarPracticaDeClase({nombreEmpresa:nombre,seccion});
      APP.plEliminarPracticaAbierto=false;render();
      toast(`Empresa "${nombre}" eliminada ✓ — de ${r.ok} de ${r.total} estudiante(s)`+(r.fallidos.length?`. No se pudo con: ${r.fallidos.join(", ")}`:""));
    }catch(err){
      if(estadoEl)estadoEl.textContent="No se pudo eliminar: "+(err.message||err);
      if(btn)btn.disabled=false;
    }
    return;
  }
  if(id==="fCo"){
    const code=val("coCode").trim().toUpperCase(),name=val("coName").trim();if(!name||!code)return;
    if(APP.companies.some(x=>x.code===code&&x.id!==APP.editCo)){toast("Ya tienes una empresa con el código "+code);return}
    if(APP.editCo){const x=APP.companies.find(y=>y.id===APP.editCo);
      if(tareaBloqueada(x)){toast("Esta tarea ya fue entregada y no se puede editar");APP.editCo=null;render();return}
      Object.assign(x,{code,name,cedula:val("coCed").trim(),currency:val("coCur"),period:+val("coPer")||x.period,categoria:val("coCat")==="tarea"?"tarea":"practica"});touch(x);APP.editCo=null;render();toast("Datos actualizados");return}
    const n=newCompany({name,code,cedula:val("coCed").trim(),currency:val("coCur"),period:val("coPer")||2026,base:document.getElementById("coBase").checked,sample:document.getElementById("coSample").checked,categoria:val("coCat")});
    APP.companies.push(n);APP.activeId=n.id;APP.view="catalogo";touch(n);resetDraft();render();toast(`Empresa ${code} creada`);
  }
  if(id==="fAcc"){
    const code=val("aCode").trim(),name=val("aName").trim(),type=val("aType");if(!code||!name)return;
    const old=APP.editAcc;
    if(c.accounts.some(a=>a.code===code&&a.code!==old)){toast("Ya existe una cuenta con el código "+code);return}
    const nat=document.getElementById("aContra").checked?(DEFNAT[type]==="D"?"A":"D"):DEFNAT[type];
    const data={code,name,type,cls:val("aCls"),nature:nat,niif:val("aNiif").trim()};
    if(old){const x=acc(old);Object.assign(x,data);if(old!==code)for(const en of c.entries)for(const l of en.lines)if(l.code===old)l.code=code;APP.editAcc=null;toast("Cuenta "+code+" actualizada")}
    else{c.accounts.push(data);toast("Cuenta "+code+" agregada")}
    touch(c);render();
  }
  if(id==="fEntry"){
    const t=draftTotals();if(!t.ok)return;
    if(!draft.desc.trim()){toast("Escribe la descripción del asiento");document.getElementById("eDesc").focus();return}
    const lines=draft.lines.filter(l=>l.code&&(+l.d||+l.c)).map(l=>({code:l.code,d:r2(l.d),c:r2(l.c)}));
    c.entries.push({id:uid(),n:c.entries.length+1,date:draft.date,desc:draft.desc.trim(),lines});
    c.entries.sort((x,y)=>x.date.localeCompare(y.date)||x.n-y.n).forEach((x,i)=>x.n=i+1);
    const d=draft.date;resetDraft();draft.date=d;touch(c);render();toast("Asiento registrado");
  }
});
window.addEventListener("pagehide",()=>{flush()});

async function boot(){
  const SESSION_KEY="ctp_lms_session_v2";
  let session=null;
  try{session=JSON.parse(sessionStorage.getItem(SESSION_KEY))}catch(e){session=null}
  if(!session||!session.id||!session.role){
    document.getElementById("top").hidden=true;
    document.getElementById("railWrap").hidden=true;
    document.getElementById("main").innerHTML='<div class="empty"><h3>No hay sesión</h3><p>Abrí Aula de Conta desde adentro de ctp-lms (la pestaña Materias, si sos estudiante, o el acceso rápido del profesor).</p><p><a class="btn primary" href="./index.html">Ir a ctp-lms</a></p></div>';
    return;
  }
  APP.modulosHabilitados=await loadModulosHabilitados();
  if(session.role==="docente"){
    // Si el profesor llega con ?como_estudiante=<cédula> (desde el perfil
    // de un estudiante en ctp-lms), entra DIRECTO a la cuenta real de ese
    // estudiante en Aula de Conta, con el mismo acceso que tendría él —
    // en vez de abrir siempre la cuenta del profesor.
    const comoEstudianteId=new URLSearchParams(location.search).get("como_estudiante");
    if(comoEstudianteId){
      const {data:est}=await sb.from("estudiantes").select("id,nombre,apellido1").eq("id",comoEstudianteId).maybeSingle();
      if(est){
        APP.store=supabaseStudentStore(est.id);
        APP.comoEstudiante=true;
        await enter({usuario:est.id,nombre:`${est.nombre} ${est.apellido1}`,rol:"estudiante"});
        return;
      }
    }
    APP.store=supabaseTeacherStore(session.id);
    registrarDocenteActual(session.id);
    await enter({usuario:session.id,nombre:session.nombre||"Profesor",rol:"profesor"});
    return;
  }
  APP.store=supabaseStudentStore(session.id);
  await enter({usuario:session.id,nombre:session.nombre||"Estudiante",rol:"estudiante"});
}
boot();
