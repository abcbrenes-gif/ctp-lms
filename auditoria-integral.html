<section class="card"><h2>1. Resumen ejecutivo</h2>
<p>El control interno de la entidad simulada es <b>deficiente</b> y la ejecución de egresos del I semestre 2026 recibe <b>opinión con salvedades</b>: los pagos improcedentes o sin respaldo suman ₡24,1 millones, 2,55 % de los egresos y 2,5 veces la materialidad (₡9,5 millones).</p>
<p class="aviso">Ejercicio simulado: la Municipalidad de Valle Sereno, sus personas, proveedores y cifras son ficticios. Las pruebas sí se ejecutaron sobre 1 701 registros generados para el caso.</p>
<div class="kpis"><div><b>8</b><span>hallazgos (2 críticos, 3 altos, 3 medios)</span></div><div><b>18</b><span>rutinas tipo IDEA sobre el 100 % de los registros</span></div><div><b>₡24,1 M</b><span>en ajustes propuestos</span></div><div><b>7 de 10</b><span>obligaciones de la Ley 8292 incumplidas</span></div></div>
<p><a class="btn" href="media/auditoria-valle-sereno-papeles-de-trabajo.xlsx" download>⬇️ Descargar base de datos y papeles de trabajo (Excel)</a> <button class="btn sec" type="button" onclick="window.print()">🖨️ Imprimir informe</button></p></section>
<section class="card"><h2>2. Alcance y metodología</h2>
<p>Auditoría combinada (financiera, operativa y administrativa) del I semestre 2026 de una municipalidad ficticia, escogida porque la Ley 8292 rige para el sector público.</p>
<div class="tw"><table class=""><thead><tr><th>Tabla</th><th>Registros</th><th>Campos clave</th></tr></thead><tbody><tr><td>Empleados</td><td>85</td><td>código, departamento, puesto, salario base, fecha de salida, cuenta IBAN</td></tr><tr><td>Planilla</td><td>509</td><td>período, horas extra, bruto, deducciones, neto, usuario y hora de registro</td></tr><tr><td>Proveedores</td><td>18</td><td>cédula jurídica, giro, fecha de registro, cuenta IBAN</td></tr><tr><td>Compras</td><td>428</td><td>orden, fecha, proveedor, monto, factura, quién registra y quién aprueba</td></tr><tr><td>Caja (bancos)</td><td>661</td><td>fecha y hora, tipo, concepto, referencia, beneficiario, usuario</td></tr></tbody></table></div>
<p><b>Parámetros simulados</b> (supuestos del caso, no cifras oficiales): tope de ₡3 000 000 por contratación que adjudica la jefatura de Proveeduría; horario hábil de lunes a viernes de 6:00 a 19:00; materialidad de 1 % de los egresos (₡9 472 188); deducciones de planilla con tasa única de 10,67 %.</p>
<p><b>Condiciones del proceso simulado:</b> última autoevaluación del control interno en 2023; SEVRI sin actualizar desde 2022; manual de Proveeduría de 2014; auditoría interna con una plaza y 7 de 12 recomendaciones pendientes; sin código de ética ni declaración de conflictos de interés; el sistema no valida cuentas ni facturas repetidas ni la fecha de salida.</p></section>
<section class="card"><h2>3. Control interno: COSO y Ley 8292</h2>
<p>Ninguno de los cinco componentes funciona de forma efectiva. Los cinco componentes de COSO 2013 coinciden con los artículos 13 a 17 de la Ley 8292.</p>
<h3>Cédula CI-1. Componentes COSO frente a la Ley 8292</h3><div class="tw"><table class=""><thead><tr><th>Componente COSO</th><th>Artículo</th><th>Debilidad encontrada</th><th>Evidencia</th><th>Calificación</th></tr></thead><tbody><tr><td>Entorno de control</td><td>13</td><td>Sin código de ética ni declaración de conflictos de interés; un técnico de Proveeduría comparte cuenta con un proveedor</td><td>CO-6</td><td>Deficiente</td></tr><tr><td>Evaluación de riesgos</td><td>14 y 18</td><td>SEVRI sin actualizar desde 2022; no incluye riesgo de fraude en compras ni en planilla</td><td>CI-2</td><td>Deficiente</td></tr><tr><td>Actividades de control</td><td>15</td><td>Mismo usuario registra y aprueba; sin validación de duplicados; manual de 2014</td><td>CO-1, CO-5, PL-1, CJ-1</td><td>Deficiente</td></tr><tr><td>Información y comunicación</td><td>16</td><td>Saltos en el consecutivo; egresos sin referencia; el maestro de empleados no se actualiza con las salidas</td><td>CO-8, CJ-2, PL-2</td><td>Débil</td></tr><tr><td>Supervisión (seguimiento)</td><td>17</td><td>Sin autoevaluación anual desde 2023; 7 de 12 recomendaciones de auditoría interna pendientes</td><td>CI-2</td><td>Débil</td></tr></tbody></table></div>
<h3>Cédula CI-2. Obligaciones del jerarca y de los titulares subordinados</h3><div class="tw"><table class=""><thead><tr><th>Obligación</th><th>Artículo</th><th>Situación en la entidad</th><th>Cumple</th></tr></thead><tbody><tr><td>Establecer, mantener, perfeccionar y evaluar el sistema de control interno</td><td>10</td><td>Existe en papel, sin evaluación desde 2023</td><td>Parcial</td></tr><tr><td>Tomar acciones inmediatas ante desviaciones o irregularidades</td><td>12 b)</td><td>Pagos a exfuncionarios durante dos meses sin corrección</td><td>No</td></tr><tr><td>Atender de inmediato las recomendaciones de auditoría</td><td>12 c)</td><td>7 de 12 recomendaciones pendientes</td><td>No</td></tr><tr><td>Mantener y demostrar integridad y valores éticos</td><td>13 a)</td><td>Sin código de ética ni gestión de conflictos de interés</td><td>No</td></tr><tr><td>Identificar y analizar los riesgos y decidir cómo administrarlos</td><td>14 y 18</td><td>SEVRI desactualizado e incompleto</td><td>No</td></tr><tr><td>Documentar políticas de autorización, protección de activos, registros y conciliaciones</td><td>15 b)</td><td>Manual de 2014; sin conciliación entre compras y pagos</td><td>No</td></tr><tr><td>Contar con sistemas de información confiables y oportunos</td><td>16 a)</td><td>El sistema acepta duplicados y registros sin referencia</td><td>Parcial</td></tr><tr><td>Hacer al menos una autoevaluación anual</td><td>17 b)</td><td>Última autoevaluación: 2023</td><td>No</td></tr><tr><td>Implantar los resultados de las evaluaciones en diez días hábiles</td><td>17 c)</td><td>Sin plan de implantación</td><td>No</td></tr><tr><td>Contar con auditoría interna y dotarla de recursos</td><td>20 y 39</td><td>Una sola plaza</td><td>Parcial</td></tr></tbody></table></div>
<p>De 10 obligaciones revisadas, 7 se incumplen y 3 se cumplen en parte. El artículo 39 prevé responsabilidad administrativa para quien incumpla estos deberes sin justificación; determinarla exige el debido proceso y queda fuera de esta auditoría.</p></section>
<section class="card"><h2>4. Pruebas analíticas masivas (CAATs)</h2>
<p>Se corrieron 18 rutinas y 2 conciliaciones sobre el 100 % de los registros: 17 rutinas produjeron excepciones; la prueba de Benford y las dos conciliaciones salieron limpias.</p>

e o fin de semana</td><td>8 órdenes, pv.dquesada</td><td>₡4 508 765</td></tr><tr><td>CO-8</td><td>Saltos de secuencia</td><td>Consecutivos faltantes</td><td>6 números</td><td>—</td></tr></tbody></table></div><h3>Flujo de caja (661 movimientos)</h3><div class="tw"><table class=""><thead><tr><th>Ref.</th><th>Rutina</th><th>Criterio</th><th>Excepciones</th><th>Monto</th></tr></thead><tbody><tr><td>CJ-1</td><td>Duplicados</td><td>Misma orden y monto pagados dos veces</td><td>3 pagos</td><td>₡2 795 374</td></tr><tr><td>CJ-2</td><td>Campos vacíos</td><td>Egreso sin referencia</td><td>7 egresos redondos, ts.rmendez</td><td>₡7 000 000</td></tr><tr><td>CJ-3</td><td>Fuera de horario</td><td>Noche o fin de semana</td><td>9 egresos, ts.rmendez</td><td>₡11 456 754</td></tr><tr><td>CJ-4</td><td>Cruce con compras</td><td>Pago sin orden de compra</td><td>2 pagos al proveedor de CO-6</td><td>₡5 422 519</td></tr></tbody></table></div>
<p><b>Conciliaciones (sin excepciones).</b> CJ-5: el neto de planilla coincide con la transferencia bancaria en los seis meses (₡424 470 724). CJ-6: de 428 órdenes, 395 están pagadas (₡363 791 374) y 33 quedan por pagar (₡41 325 249).</p></section>

<section class="card"><h2>6. Informe de hallazgos</h2>
<article class="hz cr"><h3>H-1. Proveedor vinculado a un funcionario de Proveeduría <span class="chip cr">crítico</span></h3><dl><dt>Condición</dt><dd>Inversiones Brisas del Sereno S.A. se inscribió el 9 de enero de 2026 con la misma cuenta IBAN de un técnico de Proveeduría. Recibió 13 órdenes por ₡31 022 842, todas registradas por pv.dquesada y aprobadas por jf.proveeduria, más 2 pagos sin orden por ₡5 422 519 (CO-6, CJ-4).</dd><dt>Criterio</dt><dd>Ley 8292, artículo 13 a); régimen de prohibiciones de la Ley 9986; deber de probidad de la Ley 8422.</dd><dt>Causa</dt><dd>El registro de proveedores no se cruza con la planilla y no hay declaración de conflictos de interés.</dd><dt>Efecto</dt><dd>Posible contratación con un funcionario de la propia institución y ₡5,4 millones pagados sin orden.</dd><dt>Recomendación</dt><dd>Suspender pagos al proveedor, trasladar el caso a la auditoría interna y programar el cruce automático de cuentas.</dd></dl></article><article class="hz cr"><h3>H-2. Fraccionamiento de compras <span class="chip cr">crítico</span></h3><dl><dt>Condición</dt><dd>6 grupos de órdenes (20 órdenes, ₡47 566 865) superan el tope sumados en 7 días o menos; 3 grupos por ₡30 977 227 tienen patrón fuerte. Hay 14 órdenes entre 95 % y 100 % del tope y solo 2 justo encima (CO-2, CO-3).</dd><dt>Criterio</dt><dd>Ley 9986, artículo 33 (prohibición de fragmentación); Ley 8292, artículo 15 b).</dd><dt>Causa</dt><dd>No hay plan de compras consolidado y el sistema no acumula montos por proveedor y objeto.</dd><dt>Efecto</dt><dd>Se evita el concurso y la aprobación de la Alcaldía; se pierde economía de escala.</dd><dt>Recomendación</dt><dd>Plan anual de compras y alerta cuando un proveedor acumule más del tope en 30 días.</dd></dl></article><article class="hz al"><h3>H-3. Pagos de planilla indebidos <span class="chip al">alto</span></h3><dl><dt>Condición</dt><dd>6 pagos a 3 exfuncionarios por ₡3 501 226, 4 pagos duplicados por ₡2 218 861, 3 salarios brutos que no recalculan (₡390 000) y 2 cuentas bancarias compartidas por 4 funcionarios (PL-1, PL-2, PL-3, PL-6).</dd><dt>Criterio</dt><dd>Ley 8292, artículos 12 b), 15 b) y 16 a).</dd><dt>Causa</dt><dd>Recursos Humanos no comunica las salidas a tiempo y el sistema no bloquea al inactivo ni el segundo pago.</dd><dt>Efecto</dt><dd>₡6 068 474 netos pagados de más, por recuperar.</dd><dt>Recomendación</dt><dd>Gestionar el reintegro, bloquear pagos con fecha de salida y conciliar el maestro antes de cada planilla.</dd></dl></article><article class="hz me"><h3>H-4. Horas extra atípicas sin autorización <span class="chip me">medio</span></h3><dl><dt>Condición</dt><dd>5 pagos con 95 a 129 horas extra en un mes, por ₡4 295 027; los demás no pasan de 16 horas (PL-4).</dd><dt>Criterio</dt><dd>Ley 8292, artículo 15 b).</dd><dt>Causa</dt><dd>Las extras se digitan sin boleta aprobada y sin límite en el sistema.</dd><dt>Efecto</dt><dd>Gasto no justificado y riesgo de pagos por tiempo no laborado.</dd><dt>Recomendación</dt><dd>Boleta firmada, límite mensual en el sistema y revisión de los cinco casos.</dd></dl></article><article class="hz al"><h3>H-5. Facturas duplicadas y pagos repetidos <span class="chip al">alto</span></h3><dl><dt>Condición</dt><dd>5 facturas registradas dos veces por ₡5 576 970 (3 ya pagadas, ₡2 835 494) y 3 pagos repetidos sobre la misma orden por ₡2 795 374 (CO-1, CJ-1).</dd><dt>Criterio</dt><dd>Ley 8292, artículo 15 b).</dd><dt>Causa</dt><dd>El sistema no valida proveedor + factura y Tesorería no concilia pagos contra órdenes.</dd><dt>Efecto</dt><dd>₡5 630 868 pagados dos veces y ₡2 741 476 en riesgo de pagarse.</dd><dt>Recomendación</dt><dd>Detener las 2 facturas pendientes, cobrar los pagos dobles y validar factura única por proveedor.</dd></dl></article><article class="hz al"><h3>H-6. Egresos sin respaldo y operaciones fuera de horario <span class="chip al">alto</span></h3><dl><dt>Condición</dt><dd>7 egresos sin referencia por ₡7 000 000, en montos redondos y del usuario ts.rmendez. Además, 9 egresos (₡11 456 754), 8 órdenes y 6 registros de planilla se digitaron de noche o en fin de semana (CJ-2, CJ-3, CO-7, PL-5).</dd><dt>Criterio</dt><dd>Ley 8292, artículos 15 b) y 16 a).</dd><dt>Causa</dt><dd>El sistema permite egresos sin documento y no restringe el horario.</dd><dt>Efecto</dt><dd>₡7 millones sin sustento y tres usuarios que operan sin supervisión.</dd><dt>Recomendación</dt><dd>Referencia obligatoria, acceso en horario hábil y revisión mensual de bitácoras.</dd></dl></article><article class="hz me"><h3>H-7. Falta de segregación de funciones y saltos de consecutivo <span class="chip me">medio</span></h3><dl><dt>Condición</dt><dd>9 órdenes por ₡3 689 939 registradas y aprobadas por el mismo usuario, y 6 números faltantes en el consecutivo (CO-5, CO-8).</dd><dt>Criterio</dt><dd>Ley 8292, artículo 15 b); Normas de control interno para el Sector Público.</dd><dt>Causa</dt><dd>Los perfiles acumulan permisos y no hay bitácora de anulaciones.</dd><dt>Efecto</dt><dd>Una sola persona puede crear y aprobar una compra.</dd><dt>Recomendación</dt><dd>Separar perfiles de registro y aprobación, y documentar cada orden anulada.</dd></dl></article><article class="hz me"><h3>H-8. Control interno sin evaluación ni valoración de riesgos <span class="chip me">medio</span></h3><dl><dt>Condición</dt><dd>Sin autoevaluación anual desde 2023, SEVRI desactualizado desde 2022 y 7 de 12 recomendaciones pendientes (CI-1, CI-2).</dd><dt>Criterio</dt><dd>Ley 8292, artículos 10, 12 c), 14, 17 b) y 18.</dd><dt>Causa</dt><dd>El jerarca no ha asignado responsables ni plazos; la auditoría interna tiene una sola plaza.</dd><dt>Efecto</dt><dd>Los hallazgos anteriores no se detectaron a tiempo; exposición a la responsabilidad del artículo 39.</dd><dt>Recomendación</dt><dd>Cronograma de autoevaluación y SEVRI, y seguimiento trimestral en el Concejo.</dd></dl></article></section>
