<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Taller del Ciclo Contable</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="img/logo-ctp-mercedes-norte.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#F5F7FB;--surface:#fff;--surface2:#F1F4F9;--ink:#0F172A;--muted:#5B6B80;--line:#DCE3EE;
  --accent:#4F46E5;--accent2:#7C3AED;--accent-soft:#EEF0FF;
  --debe:#2457B8;--haber:#C2501C;--ok:#1E8A4C;--okbg:#E3F7EA;--bad:#C23A3A;--badbg:#FDECEC;--warn:#A86F00;--warnbg:#FFF6DB;
  --m1:#4F46E5;--m2:#0E8A7E;--m3:#C2501C;--m4:#7C3AED;
  --f:"Plus Jakarta Sans",Inter,"Segoe UI",system-ui,sans-serif;--fn:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --shadow:0 6px 20px rgba(15,23,42,.08);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1020;--surface:#121A30;--surface2:#182340;--ink:#E8EDFB;--muted:#9AA9CC;--line:#26324F;--accent-soft:#1E2550;
  --debe:#7FA6F0;--haber:#F08A5A;--ok:#5ACB89;--okbg:#173A28;--bad:#F07A7A;--badbg:#3E1C1C;--warn:#E0B048;--warnbg:#3A2E10;--shadow:0 6px 20px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1020;--surface:#121A30;--surface2:#182340;--ink:#E8EDFB;--muted:#9AA9CC;--line:#26324F;--accent-soft:#1E2550;
  --debe:#7FA6F0;--haber:#F08A5A;--ok:#5ACB89;--okbg:#173A28;--bad:#F07A7A;--badbg:#3E1C1C;--warn:#E0B048;--warnbg:#3A2E10;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f);padding-bottom:80px}
.wrap{max-width:1240px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left)) 0 max(16px,env(safe-area-inset-right))}
h1,h2,h3,h4{margin:0;line-height:1.2}
.num,input.n{font-family:var(--fn);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
button,.btn{font:600 .9rem var(--f);border:0;border-radius:10px;padding:9px 14px;cursor:pointer;background:var(--accent);color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
button.sec,.btn.sec{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
button.ghost{background:transparent;color:var(--muted);border:1px dashed var(--line)}
button.sm{padding:5px 10px;font-size:.8rem}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 40%,transparent);outline-offset:1px}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0;width:100%}
input.n{text-align:right}
input.ok,select.ok{border-color:var(--ok);background:var(--okbg)}
input.bad,select.bad{border-color:var(--bad);background:var(--badbg)}
/* barra superior */
.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top .wrap{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding-block:10px}
@media(max-width:700px){.top{position:static}.mod .i{display:none}}
.brand{display:flex;gap:10px;align-items:center;margin-right:auto}
.brand img{height:44px;width:auto}
.brand b{font-size:1.2rem;font-weight:800;display:block}
.brand small{color:var(--muted);font-size:.8rem}
.caso{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.caso label{font-size:.78rem;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.caso select{width:auto}.caso input{width:110px}
/* módulos */
.mods{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:16px 0}
@media(max-width:820px){.mods{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mod{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 14px;text-align:left;color:var(--ink);display:block;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s}
.mod:hover{transform:translateY(-2px)}
.mod.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 8%,var(--surface))}
.mod .t{display:flex;gap:8px;align-items:center;font-weight:800;font-size:1rem}
.mod .i{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--c);color:#fff;font-size:1.1rem;flex:none}
.mod small{display:block;color:var(--muted);font-size:.78rem;margin-top:4px}
.bar{height:6px;border-radius:9px;background:var(--surface2);margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--c);border-radius:9px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card h3{font-size:1.05rem;margin-bottom:6px}
.empresa{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;margin-bottom:10px}
.empresa b{font-size:1.05rem}
.chip{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.chip.A{background:#e0f2f1;color:#0f766e}.chip.P{background:#fdeee5;color:#c2410c}.chip.PT{background:#f3e8ff;color:#7e22ce}.chip.I{background:#e5f6ec;color:#1f8f55}.chip.C{background:#fff4d6;color:#a16207}.chip.G{background:#fde7ef;color:#be185d}
table{border-collapse:collapse;width:100%}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700}
td.r,th.r{text-align:right}
.scroll{overflow-x:auto}
.fb{border-radius:10px;padding:10px 12px;margin-top:10px;font-size:.9rem}
.fb.ok{background:var(--okbg);color:var(--ok)}.fb.bad{background:var(--badbg);color:var(--bad)}.fb.warn{background:var(--warnbg);color:var(--warn)}
.fb ul{margin:4px 0 0;padding-left:1.2rem}
.acc{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.sol{margin-top:12px;border:2px dashed var(--accent);border-radius:12px;padding:10px 12px;background:var(--accent-soft)}
.sol h4{font-size:.9rem;margin-bottom:6px}
/* módulo 1 */
.m1{display:grid;grid-template-columns:250px minmax(0,1fr);gap:14px}
@media(max-width:860px){.m1{grid-template-columns:minmax(0,1fr)}}
.tlist{display:flex;flex-direction:column;gap:6px;max-height:70vh;overflow:auto}
@media(max-width:860px){.tlist{flex-direction:row;max-height:none;overflow-x:auto;padding-bottom:4px}.tlist button{flex:none}}
.tlist button{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);justify-content:flex-start;text-align:left;font-weight:600}
.tlist button.on{border-color:var(--m1);background:var(--accent-soft)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line);flex:none}.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}
.trx{font-size:1.02rem;background:var(--surface2);border-left:4px solid var(--m1);border-radius:10px;padding:12px 14px;margin:8px 0 12px}
.lines td{padding:4px}.lines td.x{width:36px}
.tots{display:flex;gap:16px;justify-content:flex-end;font-weight:700;margin-top:6px;font-size:.9rem}
.tots .d{color:var(--debe)}.tots .h{color:var(--haber)}
details.catal summary{cursor:pointer;font-weight:700;color:var(--accent)}
.catal-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:2px 16px;font-size:.84rem;margin-top:8px}
/* asiento estilo SAP Business One */
.sap{border:1px solid #b9c6d6;border-radius:10px;overflow:hidden;background:var(--surface)}
.sap-tit{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(#f4f7fb,#e3eaf3);border-bottom:1px solid #b9c6d6;padding:8px 12px;font-weight:800;color:#1c3d6e}
:root[data-theme="dark"] .sap-tit{background:var(--surface2);color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sap-tit{background:var(--surface2);color:var(--ink)}}
.sap-n{font-weight:600;font-size:.9rem}
.sap-hd{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 12px;padding:10px 12px;border-bottom:1px solid var(--line)}
@media(max-width:700px){.sap-hd{grid-template-columns:minmax(0,1fr)}}
.sap-hd label{display:flex;flex-direction:column;gap:3px;font-size:.78rem;font-weight:700;color:var(--muted)}
.sap-hd small{font-weight:400}
.sap-hd .sap-com{grid-column:1/-1}
.sap-grid th{background:var(--surface2)}
.sap-grid td.nm{font-size:.88rem}
.sap-pie{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);background:var(--surface2);font-size:.86rem}
.sap-nota{font-size:.76rem;color:var(--muted);padding:6px 12px;border-top:1px solid var(--line)}
.sap-pie .dif{padding:3px 10px;border-radius:8px;background:var(--surface)}.sap-pie .dif.ok{background:var(--okbg);color:var(--ok)}.sap-pie .dif.bad{background:var(--badbg);color:var(--bad)}
/* libro mayor en columnas */
.lm-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap;border-bottom:3px solid var(--ink);padding-bottom:8px;margin-bottom:6px}
table.lm td input{padding:5px 6px;font-size:.86rem}
.lm-todas{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(460px,100%),1fr));gap:14px}
.lm-todas table{font-size:.82rem}
.t-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;border-bottom:3px solid var(--ink);padding-bottom:6px;margin-bottom:4px}
.t-hd small{display:block;color:var(--muted);font-size:.74rem}.t-hd b{font-size:.95rem}
/* asientos a la mano (panel fijo) */
.m2lay{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;align-items:start}
@media(max-width:1000px){.m2lay{grid-template-columns:minmax(0,1fr)}.dpanel{position:static!important;max-height:420px!important;order:-1}}
.dpanel{position:sticky;top:84px;max-height:calc(100vh - 100px);overflow:auto;background:var(--surface);border:2px solid var(--m1);border-radius:14px;padding:10px;box-shadow:var(--shadow)}
.dp-hd{position:sticky;top:-10px;background:var(--surface);padding:4px 0 8px;margin-bottom:4px;border-bottom:1px solid var(--line);z-index:1}
.dp-hd b{display:block}.dp-hd small{color:var(--muted);font-size:.74rem}
.dp-as{border-bottom:1px dashed var(--line);padding:6px 0}
.dp-t{display:flex;gap:8px;align-items:center;font-size:.8rem;margin-bottom:2px}.dp-t .dp-ok,.dp-t .dp-ej{margin-left:auto}
.dp-as table{font-size:.76rem}.dp-as td{padding:2px 4px;border:0}.dp-as td.d{color:var(--debe)}.dp-as td.h{color:var(--haber)}
.cchips{display:flex;flex-wrap:wrap;gap:6px}.cchips button{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);font-family:var(--fn)}.cchips button.on{border-color:var(--m2);background:color-mix(in srgb,var(--m2) 12%,var(--surface))}
.tam{display:block;font-size:.74rem;color:var(--m2);font-weight:700;margin:2px 0 4px}
.m2lay .tgrid{grid-template-columns:repeat(auto-fill,minmax(min(380px,100%),1fr))}
/* modo digital */
.modo{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.modo button{border-radius:0;background:var(--surface);color:var(--ink)}.modo button.on{background:var(--m2);color:#fff}
.pick-bar{position:sticky;top:76px;z-index:6;background:#fff8db;color:#5c4400;border:2px solid #ffd43b;border-radius:12px;padding:8px 12px;margin-bottom:10px;font-size:.9rem}
:root[data-theme="dark"] .pick-bar{background:#3a2e10;color:#ffe9a8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pick-bar{background:#3a2e10;color:#ffe9a8}}
@media(max-width:700px){.pick-bar{top:0}}
tr.pickable{cursor:pointer}tr.pickable:hover td{background:color-mix(in srgb,var(--m2) 10%,transparent)}
tr.pickable.sel td{background:#ffe066!important;color:#14213d}tr.pickable.usado{opacity:.45}
tr.pickable:focus-visible{outline:3px solid var(--m2)}
.drop{cursor:copy;border-radius:8px}.drop.armado{outline:2px dashed var(--m2);outline-offset:-2px;background:color-mix(in srgb,var(--m2) 7%,transparent)}
.drop.armado:hover{background:color-mix(in srgb,var(--m2) 18%,transparent)}
/* balanza tipo Excel */
.xl-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 6px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.xl-fx{font-style:italic;font-weight:800;color:var(--m3);font-family:var(--fn)}
.xl-bar #fxDir{min-width:36px;font-family:var(--fn)}.xl-bar #fx{flex:1 1 260px;font-family:var(--fn)}
table.xl th.xl-n{width:30px;text-align:center;color:var(--muted);background:var(--surface2);font-family:var(--fn)}
table.xl tr.xl-let th{text-align:center;background:var(--surface2);font-family:var(--fn);padding:2px}
table.xl th.aux,table.xl td.aux{background:color-mix(in srgb,var(--m3) 6%,transparent)}
table.xl .xl-nom{font-size:.78rem;padding:4px 6px}
table.xl tr.xl-tot td{border-top:2px solid var(--ink)}
.row.rcc{grid-template-columns:minmax(0,1fr) minmax(110px,190px) minmax(90px,150px) 30px}
@media(max-width:620px){.row.rcc{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 30px}.row.rcc input{grid-column:1/3}}
tr.subc td{font-size:.84rem;color:var(--muted);padding-left:22px}tr.subc td:first-child{padding-left:22px}
/* actividades, facturas y diálogos */
.act-bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;border:2px solid #ffd43b;background:linear-gradient(135deg,#fff8db,var(--surface));margin-top:16px}
:root[data-theme="dark"] .act-bar{background:var(--surface)}
.act-bar small{display:block;color:var(--muted);font-size:.84rem}
.ab-btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.ab-ok{background:var(--okbg);color:var(--ok);font-weight:800;border-radius:999px;padding:6px 12px}
.entres{display:flex;flex-direction:column;gap:10px;margin:10px 0}.entres-g{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;font-size:.9rem}.entres-g b{justify-self:end}.entres-g .entbar{grid-column:1/-1}
.entcards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}@media(max-width:900px){.entcards{grid-template-columns:repeat(2,minmax(0,1fr))}}
.entcard{display:flex;flex-direction:column;align-items:stretch;gap:3px;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);cursor:pointer;font:inherit;min-width:0}
.entcard.on{border:2px solid var(--accent);box-shadow:var(--shadow)}.entcard:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.entcard-t{font-weight:700;font-size:.84rem}.entcard-n{font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}.entcard-n small{font-size:.95rem;color:var(--muted);font-weight:600}
.entcard-s{font-size:.76rem;color:var(--muted)}.entcard-s b{color:var(--ink)}
.entbar{display:block;height:6px;border-radius:4px;background:var(--surface2);overflow:hidden}.entbar i{display:block;height:100%;background:var(--accent)}
.hubbox>summary{cursor:pointer;list-style-position:inside}.hub-top{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-top:10px}.hub-top label{display:flex;flex-direction:column;font-size:.8rem;font-weight:600;color:var(--muted);min-width:220px}
.resn{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:8px 12px}.resn>summary{cursor:pointer;font-weight:800}.resn-t th{font-size:.78rem}.resn-p td{border-top:2px solid var(--ink)}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.bad{background:var(--badbg);color:var(--bad)}.chip.warn{background:var(--warnbg);color:var(--warn)}
.ia-box{background:var(--accent-soft);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:.88rem}.ev-h{margin:14px 0 4px}
.ejs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}@media(max-width:700px){.ejs{grid-template-columns:minmax(0,1fr)}}.ej{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.84rem;min-width:0}.ejt{width:100%;margin-top:4px}.ejt td{padding:2px 4px;border-bottom:1px solid var(--line)}
.hub-f{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px}
.hub-f small{display:block;color:var(--muted);font-size:.8rem}.hub-g{margin:14px 0 2px;font-size:.92rem}.hub-g small{font-weight:600;color:var(--muted)}
dialog#dlgT{border:0;border-radius:16px;padding:16px;width:min(960px,96vw);max-height:92vh;overflow:auto;background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog#dlgT::backdrop{background:rgba(15,23,42,.55)}
.dlg-hd{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:8px}
.ins-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:8px 12px}
.ins-g label,#dlgB>label{display:flex;flex-direction:column;gap:3px;font-size:.8rem;font-weight:700;color:var(--muted)}
#dlgB textarea{font:inherit;font-size:.84rem;width:100%;padding:6px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.na-mods{border:1px solid var(--line);border-radius:10px;margin-top:10px;display:flex;flex-wrap:wrap;gap:6px 16px}.na-mods label{display:flex;gap:6px;align-items:center;font-size:.9rem}.na-mods input{width:auto}
.ins table{border-collapse:collapse;width:100%;font-size:.82rem}.ins td,.ins th{border:1px solid var(--line);padding:5px;vertical-align:top}
.fe{border:2px solid #9fb3c8;border-radius:12px;background:#fff;color:#14213d;margin:10px 0 14px;overflow:hidden;font-size:.86rem}
.fe-hd{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;background:#eef3f9;padding:10px 12px;border-bottom:1px solid #c8d4e2}
.fe-hd b{display:block;font-size:1rem;letter-spacing:.02em}.fe-hd small{display:block;color:#4a5b70}.fe-clave{font-size:.7rem;word-break:break-all}.fe-f{text-align:right}
.fe-partes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:8px 14px;padding:10px 12px;border-bottom:1px solid #e3e9f1}
.fe-partes small{display:block;font-size:.68rem;font-weight:800;color:#6b7c90;letter-spacing:.06em}.fe-partes span{display:block;color:#4a5b70;font-size:.8rem}
.fe-t th{background:#f6f8fb;color:#4a5b70}.fe-t td,.fe-t th{padding:5px 8px;border-bottom:1px solid #e3e9f1;color:#14213d}
.fe-res{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,320px);gap:12px;padding:10px 12px;align-items:end}
@media(max-width:620px){.fe-res{grid-template-columns:minmax(0,1fr)}}
.fe-res td{padding:3px 6px;border:0;color:#14213d}.fe-res tr.fe-tot td{font-weight:900;border-top:2px solid #14213d;font-size:.95rem}
body.sinrev #rev1,body.sinrev #pista,body.sinrev #revA,body.sinrev #revAll,body.sinrev #rev2,body.sinrev #rev3,body.sinrev #revEF,body.sinrev [data-sol]{display:none!important}
body.bloq #mod input,body.bloq #mod select{pointer-events:none;background:var(--surface2)}
body.bloq #mod [data-quitar],body.bloq #mod #mas,body.bloq #mod [data-ta],body.bloq #mod [data-tq],body.bloq #mod [data-ra],body.bloq #mod [data-rq],body.bloq #mod #lmMas,body.bloq #mod [data-lmq],body.bloq #mod #addCol,body.bloq #mod #delCol{display:none}
/* T de mayor */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:12px}
.tcard{border:2px solid var(--line);border-radius:14px;background:var(--surface);padding:10px}
.tcard.ok{border-color:var(--ok)}.tcard.bad{border-color:var(--bad)}
.tcard h4{font-size:.92rem;text-align:center;border-bottom:3px solid var(--ink);padding-bottom:6px;margin-bottom:4px}
.tcols{display:grid;grid-template-columns:1fr 1fr}
.tcols>div{padding:4px}.tcols>div:first-child{border-right:3px solid var(--ink)}
.tcols .hd{font-size:.72rem;font-weight:800;text-align:center;text-transform:uppercase}
.tcols .hd.d{color:var(--debe)}.tcols .hd.h{color:var(--haber)}
.tl{display:grid;grid-template-columns:44px minmax(0,1fr) 22px;gap:3px;margin-bottom:3px;align-items:center}
.tl input{padding:4px 5px;font-size:.84rem}
.tl button{padding:0;width:22px;height:22px;justify-content:center;background:transparent;color:var(--muted);font-size:.8rem}
.tfoot{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px;border-top:1px solid var(--line);padding-top:6px;font-size:.78rem}
.tfoot label{display:flex;flex-direction:column;gap:2px;color:var(--muted)}
.tfoot input,.tfoot select{padding:4px 6px;font-size:.84rem}
.tmsg{font-size:.78rem;margin-top:6px}.tmsg.ok{color:var(--ok)}.tmsg.bad{color:var(--bad)}
.tro .tl{grid-template-columns:30px minmax(0,1fr)}
.tro .v{font-family:var(--fn);font-size:.84rem;text-align:right}
.tro .ref{font-size:.74rem;color:var(--muted)}
details.ver{margin-bottom:12px}
details.ver>summary{cursor:pointer;font-weight:700;padding:8px 0}
/* estados financieros */
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.subtabs button{background:var(--surface2);color:var(--ink);border:1.5px solid var(--line)}
.subtabs button.on{background:var(--m4);color:#fff;border-color:var(--m4)}
.ef{max-width:760px;margin:0 auto;border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:var(--surface)}
.ef-hd{text-align:center;margin-bottom:12px}.ef-hd b{display:block;font-size:1.05rem}.ef-hd span{display:block;color:var(--muted);font-size:.86rem}
.sec{margin:10px 0 4px;font-weight:800;font-size:.92rem}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(90px,160px) 30px;gap:6px;margin:4px 0;align-items:center}
.row.tot{grid-template-columns:minmax(0,1fr) 160px 30px;font-weight:800}
.row.tot span{text-align:right;padding-right:6px}
.row.tot.gran{border-top:2px solid var(--ink);padding-top:6px}
.row button{padding:0;width:28px;height:28px;justify-content:center;background:transparent;color:var(--muted)}
.ecp td input{min-width:110px}
.side{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px}
@media(max-width:900px){.side{grid-template-columns:minmax(0,1fr)}}
.ayuda{font-size:.86rem;color:var(--muted)}
.pill{display:inline-block;font-size:.72rem;font-weight:800;background:#fff3bf;color:#7a5a00;border-radius:999px;padding:2px 10px;vertical-align:middle}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f2937;color:#fff;padding:10px 16px;border-radius:12px;z-index:50;box-shadow:var(--shadow);font-weight:600}
@media print{.top,.mods,.acc,#volver-plataforma{display:none!important}}

<body>
<header class="top"><div class="wrap">
  <div class="brand"><img src="img/logo-ctp-mercedes-norte.png" alt="Escudo del CTP Mercedes Norte" width="31" height="44">
    <div><b>Taller del Ciclo Contable <span class="pill">Prototipo 2027</span></b><small>Asientos · Mayorización · Balanza de comprobación · Estados financieros</small></div></div>
  <div class="caso" id="caso"></div>
</div></header>
<main class="wrap" id="app"><p class="muted">Cargando…</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js?v=20261105h"></script>

<script>
/* ══════════════════════════════════════════════════════════════════════
   Taller del Ciclo Contable: 4 módulos independientes que practican cada paso
   del ciclo con el MISMO caso (una empresa comercial y un mes de operaciones):
     1. Asientos de diario   2. Mayorización (cuentas T)
     3. Balanza de comprobación   4. Estados financieros (ER, ECP, ESF y Flujo de efectivo)
   Cada caso sale de un código (semilla): el docente puede dar el mismo código a todo
   el grupo o cada estudiante pide uno nuevo. Todo se revisa solo.
   ══════════════════════════════════════════════════════════════════════ */
const SES=(()=>{try{return JSON.parse(sessionStorage.getItem("ctp_lms_session_v2")||"null")}catch(e){return null}})();
const DOCENTE=!!(SES&&SES.role==="docente");
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const NF=new Intl.NumberFormat("es-CR",{maximumFractionDigits:2});
const fm=n=>(n<0?"(":"")+"₡"+NF.format(Math.abs(n))+(n<0?")":"");
const fn=n=>n==null?"":(n<0?"(":"")+NF.format(Math.abs(n))+(n<0?")":"");
const r2=n=>Math.round((+n||0)*100)/100;
const igual=(a,b)=>a!=null&&b!=null&&Math.abs(a-b)<.5;
function monto(v){if(v==null)return null;let s=String(v).trim();if(!s)return null;let neg=/^\(.*\)$/.test(s)||/^-/.test(s);
  s=s.replace(/[₡$\s()+-]/g,"");s=s.includes(",")?s.replace(/\./g,"").replace(",","."):/^\d+\.\d{1,2}$/.test(s)?s:s.replace(/\./g,"");if(!s||isNaN(+s))return NaN;return neg?-(+s):+s}
const montoO0=v=>{const x=monto(v);return x==null?0:x};

/* ── Catálogo de cuentas (empresa comercial, NIIF para PYMES) ──
   tipo: A activo, P pasivo, PT patrimonio, I ingreso, C costo, G gasto · grupo para los estados */
const CAT=[
 ["1101","Caja","A","AC"],["1102","Bancos","A","AC"],["1103","Cuentas por cobrar","A","AC"],["1104","Inventario de mercadería","A","AC"],["1105","Seguros pagados por adelantado","A","AC"],["1106","IVA soportado (crédito fiscal)","A","AC"],["1107","Suministros","A","AC"],
 ["1201","Mobiliario y equipo","A","ANC"],["1202","Depreciación acumulada de mobiliario y equipo","A","ANC",1],
 ["2101","Cuentas por pagar","P","PC"],["2102","Salarios por pagar","P","PC"],["2103","IVA por pagar (débito fiscal)","P","PC"],["2201","Préstamo bancario por pagar (largo plazo)","P","PNC"],
 ["3101","Capital social","PT","PAT"],["3102","Utilidades retenidas","PT","PAT"],["3103","Dividendos","PT","DIV",1],
 ["4101","Ventas","I","ING"],["4102","Ingresos por servicios","I","ING"],["4201","Ingresos por intereses","I","OI"],
 ["5101","Costo de ventas","C","CV"],
 ["6101","Gasto de salarios","G","GO"],["6102","Gasto de alquiler","G","GO"],["6103","Gasto de servicios públicos","G","GO"],["6104","Gasto de publicidad","G","GO"],["6105","Gasto de depreciación","G","GO"],["6106","Gasto de seguros","G","GO"],["6107","Gasto de mantenimiento","G","GO"],["6108","Gasto de papelería y útiles","G","GO"],["6109","Gasto de suministros","G","GO"],["6201","Gasto por intereses","G","OG"]
].map(([c,n,t,g,contra])=>({c,n,t,g,contra:!!contra,nat:(["A","C","G"].includes(t)?!contra:(t==="PT"&&contra))?"D":"A"}));
const CTA=Object.fromEntries(CAT.map(a=>[a.c,a]));
// Centros de costo (como las «normas de reparto» de SAP Business One): solo para cuentas de resultados (clases 4, 5 y 6)
const CC={ADM:"ADM – Administración",VEN:"VEN – Ventas",BOD:"BOD – Bodega",FIN:"FIN – Finanzas"};
const llevaCC=c=>/^[456]/.test(c);
const NF2=new Intl.NumberFormat("es-CR",{minimumFractionDigits:2,maximumFractionDigits:2}),fu=n=>"$"+NF2.format(n);
const TIPO={A:"Activo",P:"Pasivo",PT:"Patrimonio",I:"Ingreso",C:"Costo",G:"Gasto"};
// Subcuentas por centro de costo: 6101.01 = Gasto de salarios – Administración
const SUF={ADM:"01",VEN:"02",BOD:"03",FIN:"04"},CC_DE_SUF={"01":"ADM","02":"VEN","03":"BOD","04":"FIN"};
const esSub=c=>/^\d{4}\.\d{2}$/.test(c||"");
const nom=c=>{if(c==="UR_FIN")return "Utilidades retenidas (al cierre del período)";if(esSub(c)){const [p,s2]=c.split(".");return `${CTA[p]?CTA[p].n:p} – ${(CC[CC_DE_SUF[s2]]||"").split(" – ")[1]||s2}`}return CTA[c]?CTA[c].n:c};

/* ── Generador de casos ── */
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const EMPRESAS=["Comercial La Esquina S.A.","Distribuidora El Roble S.A.","Bazar Mercedes Norte S.A.","Almacén Los Guayabos S.A.","Comercializadora Tico S.A.","Importadora La Ceiba S.A.","Depósito El Cafetal S.A.","Tienda La Sabana S.A."];
const EMPRESAS_S=["Servicios Contables Mercedes S.A.","Taller Mecánico El Pistón S.A.","Clínica Dental Sonrisas S.A.","Academia de Idiomas Horizonte S.A.","Lavandería La Burbuja S.A.","Soluciones Informáticas Tico S.A.","Salón de Belleza Glamour S.A.","Fumigadora El Campo S.A."];
const TIPO_EMP={comercial:"Empresa comercial",servicios:"Empresa de servicios"};
const MES="marzo",ANIO=2027,DIAS_MES=31;
function generarCaso(seed,nivel,tipo){for(let k=0;k<60;k++){const c=tipo==="servicios"?intentoServicios(seed+k*7919,nivel):intentoCaso(seed+k*7919,nivel);if(c){c.seed=seed;return c}}throw new Error("No se pudo generar el caso")}
function intentoCaso(seed,nivel){
  const R=rng(seed),m=(a,b,st=5000)=>Math.round((a+R()*(b-a))/st)*st;
  const empresa=EMPRESAS[Math.floor(R()*EMPRESAS.length)];
  const ini={"1101":m(50e3,200e3),"1102":m(1.6e6,3e6,10e3),"1103":m(300e3,800e3),"1104":m(900e3,1.8e6,10e3),"1201":m(1.5e6,3e6,50e3),"1202":m(150e3,450e3),"2101":m(300e3,700e3)};
  if(nivel>=2)ini["2201"]=m(1e6,2e6,50e3);
  const act=ini["1101"]+ini["1102"]+ini["1103"]+ini["1104"]+ini["1201"]-ini["1202"],pas=ini["2101"]+(ini["2201"]||0),neto=act-pas;
  ini["3101"]=Math.floor(neto*.7/100000)*100000;ini["3102"]=neto-ini["3101"];if(ini["3102"]<=0)return null;
  const T=[],dia=(d)=>`${ANIO}-03-${String(d).padStart(2,"0")}`;
  const add=(d,desc,lines,tipo,x)=>T.push({fecha:dia(d),dia:d,desc,lines,tipo,...(x||{})});
  const RF=rng(seed^0x5f3759df),num=n=>String(Math.floor(RF()*9*10**(n-1))+10**(n-1));
  const venta=(precio,pctCosto)=>Math.round(precio*pctCosto/1000)*1000;
  // Operaciones del mes (todas por medio del banco)
  const aporte=m(300e3,900e3,50e3);add(2,`Los socios hacen un aporte adicional de capital de ${fm(aporte)}, que se deposita en la cuenta bancaria de la empresa.`,[["1102",aporte,0],["3101",0,aporte]]);
  const cc=m(400e3,900e3,10e3);add(3,`Compra mercadería al contado por ${fm(cc)} y la paga con transferencia bancaria.`,[["1104",cc,0],["1102",0,cc]]);
  if(nivel>=2){const mob=m(300e3,800e3,10e3);add(4,`Compra un mueble exhibidor para la tienda por ${fm(mob)}, pagado con transferencia bancaria.`,[["1201",mob,0],["1102",0,mob]],"mob")}
  // Compra en dólares: el asiento se registra en moneda extranjera (ME) y en colones con el tipo de cambio del día
  const usd=m(1000,2200,100),tc=Math.round((500+R()*30)*100)/100,cr=r2(usd*tc);
  add(5,`Compra mercadería a crédito a 30 días a un proveedor del exterior por ${fu(usd)} (factura en dólares). Tipo de cambio del día: ₡${NF2.format(tc)} por dólar.`,[["1104",cr,0],["2101",0,cr]],null,{mon:"USD",tc,me:[["1104",usd,0],["2101",0,usd]]});
  let prima=0;if(nivel>=2){prima=(12+Math.floor(R()*13))*12000;add(6,`Paga por adelantado la póliza de seguro del local para los próximos 12 meses: ${fm(prima)} con transferencia bancaria.`,[["1105",prima,0],["1102",0,prima]])}
  const v1=m(700e3,1.4e6,10e3),c1=venta(v1,.55+R()*.15);add(8,`Vende mercadería al contado por ${fm(v1)}; el dinero se deposita en el banco. El costo de la mercadería vendida es ${fm(c1)} (inventario permanente).`,[["1102",v1,0],["4101",0,v1],["5101",c1,0],["1104",0,c1]]);
  if(nivel>=2){const pub=m(80e3,250e3);add(9,`Recibe la factura de una campaña de publicidad en redes sociales por ${fm(pub)}, a pagar en 30 días.`,[["6104",pub,0],["2101",0,pub]])}
  const v2=m(600e3,1.3e6,10e3),c2=venta(v2,.55+R()*.15);add(11,`Vende mercadería a crédito por ${fm(v2)}. El costo de la mercadería vendida es ${fm(c2)}.`,[["1103",v2,0],["4101",0,v2],["5101",c2,0],["1104",0,c2]]);
  const cob=Math.round((ini["1103"]+v2)*(.4+R()*.3)/5000)*5000;add(14,`Cobra a varios clientes ${fm(cob)} de facturas pendientes; el dinero se deposita en el banco.`,[["1102",cob,0],["1103",0,cob]]);
  const pp=Math.round((ini["2101"]+cr)*(.35+R()*.3)/5000)*5000;add(16,`Paga a proveedores ${fm(pp)} de facturas pendientes, con transferencia bancaria.`,[["2101",pp,0],["1102",0,pp]]);
  const alq=m(250e3,450e3);add(18,`Paga el alquiler del local del mes de ${MES}: ${fm(alq)}.`,[["6102",alq,0],["1102",0,alq]]);
  let int=0,amort=0;if(nivel>=2){int=Math.round(ini["2201"]*.01/1000)*1000;amort=m(60e3,150e3);add(20,`Paga la cuota mensual del préstamo bancario: ${fm(amort+int)}, de los cuales ${fm(amort)} son amortización del principal y ${fm(int)} son intereses.`,[["2201",amort,0],["6201",int,0],["1102",0,amort+int]])}
  // Gasto repartido entre dos centros de costo: una línea por centro (subcuentas)
  const spA=m(40e3,100e3),spB=m(20e3,60e3);add(22,`Paga los servicios públicos del mes (electricidad, agua e internet): ${fm(spA)} de las oficinas (centro ADM – Administración) y ${fm(spB)} de la bodega (centro BOD – Bodega); en total ${fm(spA+spB)}.`,[["6103",spA,0,"ADM"],["6103",spB,0,"BOD"],["1102",0,spA+spB]]);
  if(nivel>=2){const ig=m(5e3,25e3,1000);add(24,`El banco le deposita ${fm(ig)} por intereses ganados en la cuenta de ahorros.`,[["1102",ig,0],["4201",0,ig]]);
    const dv=m(100e3,300e3,10e3);add(26,`La asamblea de socios acuerda y paga dividendos por ${fm(dv)} con transferencia bancaria.`,[["3103",dv,0],["1102",0,dv]])}
  const salV=m(300e3,550e3,10e3),salA=m(200e3,400e3,10e3);add(28,`Paga los salarios del mes con transferencia bancaria: ${fm(salV)} del personal de ventas (centro VEN – Ventas) y ${fm(salA)} del personal administrativo (centro ADM – Administración); en total ${fm(salV+salA)}.`,[["6101",salV,0,"VEN"],["6101",salA,0,"ADM"],["1102",0,salV+salA]]);
  if(nivel>=2){const baseDep=ini["1201"]+(T.find(t=>t.tipo==="mob")||{lines:[[0,0]]}).lines[0][1],dep=Math.round(baseDep*.10/12/1000)*1000;
    add(31,`Ajuste: registra la depreciación del mes del mobiliario y equipo (línea recta, 10 % anual sobre ${fm(baseDep)}): ${fm(dep)}.`,[["6105",dep,0],["1202",0,dep]],"aj");
    add(31,`Ajuste: registra el seguro consumido en el mes (1 de los 12 meses pagados por adelantado): ${fm(prima/12)}.`,[["6106",prima/12,0],["1105",0,prima/12]],"aj");
    const sa=m(80e3,200e3,10e3);add(31,`Ajuste: quedan pendientes de pago salarios de la última semana del mes por ${fm(sa)}.`,[["6101",sa,0],["2102",0,sa]],"aj")}
  return finCaso(empresa,ini,T,nivel,RF,num,"comercial");
}
function finCaso(empresa,ini,T,nivel,RF,num,tipo){
  T.sort((a,b)=>a.dia-b.dia);
  // Documento de respaldo de cada operación (lo que se anota en «Referencia» del asiento)
  let fe=100+Math.floor(RF()*800),aj=0;
  T.forEach(t=>{const c=t.lines.map(l=>l[0]),deb=t.lines.filter(l=>l[1]).map(l=>l[0]),cre=t.lines.filter(l=>l[2]).map(l=>l[0]);
    t.ref=t.tipo==="aj"?`AJ-${String(++aj).padStart(2,"0")}`:(c.includes("4101")||c.includes("4102"))?`FE-${String(++fe).padStart(5,"0")}`:c.includes("3101")?`DEP-${num(4)}`:c.includes("4201")?`NB-${num(4)}`:deb.includes("1102")&&cre.includes("1103")?`REC-${num(4)}`:(cre.includes("2101")||deb.includes("1105")||deb.includes("1201")||((deb.includes("1104")||deb.includes("1107"))&&cre.includes("1102")))?`FC-${num(5)}`:`TRF-${num(6)}`;
    t.desc+=` Documento de respaldo: ${t.ref}.`});
  const pick=a=>a[Math.floor(RF()*a.length)];
  const CCM={"4101":"VEN","5101":"VEN","6101":pick(["ADM","VEN"]),"6102":pick(["VEN","BOD"]),"6103":"ADM","6104":"VEN","6105":"VEN","6106":"ADM","6201":"FIN","4201":"FIN"};
  if(tipo==="servicios"){CCM["4102"]="VEN";CCM["6109"]=pick(["ADM","VEN"])}
  T.forEach(t=>{if(t.lines.some(l=>l[3])){t.multi=true;return}const rc=t.lines.map(l=>l[0]).find(c=>CCM[c]);if(rc){t.cc=CCM[rc];t.lines.forEach(l=>{if(llevaCC(l[0]))l[3]=t.cc});t.desc+=` Centro de costo: ${CC[t.cc]}.`}});
  // Validar saldos (banco e inventario nunca negativos)
  const s={...ini};for(const t of T){for(const [c,d,h] of t.lines){const a=CTA[c];s[c]=(s[c]||0)+(a.nat==="D"?d-h:h-d)}if(s["1102"]<50000||s["1104"]<0||s["1107"]<0||s["2101"]<0||s["1103"]<0)return null}
  return armar(empresa,ini,T,nivel,tipo);
}
// Empresa de servicios: no vende mercadería (no hay inventario ni costo de ventas); usa suministros que se consumen al dar el servicio
function intentoServicios(seed,nivel){
  const R=rng(seed),m=(a,b,st=5000)=>Math.round((a+R()*(b-a))/st)*st;
  const empresa=EMPRESAS_S[Math.floor(R()*EMPRESAS_S.length)];
  const ini={"1101":m(50e3,200e3),"1102":m(1.6e6,3e6,10e3),"1103":m(300e3,800e3),"1107":m(150e3,400e3),"1201":m(1.5e6,3e6,50e3),"1202":m(150e3,450e3),"2101":m(200e3,500e3)};
  if(nivel>=2)ini["2201"]=m(1e6,2e6,50e3);
  const act=ini["1101"]+ini["1102"]+ini["1103"]+ini["1107"]+ini["1201"]-ini["1202"],pas=ini["2101"]+(ini["2201"]||0),neto=act-pas;
  ini["3101"]=Math.floor(neto*.7/100000)*100000;ini["3102"]=neto-ini["3101"];if(ini["3102"]<=0)return null;
  const T=[],dia=(d)=>`${ANIO}-03-${String(d).padStart(2,"0")}`;
  const add=(d,desc,lines,tipo,x)=>T.push({fecha:dia(d),dia:d,desc,lines,tipo,...(x||{})});
  const RF=rng(seed^0x5f3759df),num=n=>String(Math.floor(RF()*9*10**(n-1))+10**(n-1));
  const aporte=m(300e3,900e3,50e3);add(2,`Los socios hacen un aporte adicional de capital de ${fm(aporte)}, que se deposita en la cuenta bancaria de la empresa.`,[["1102",aporte,0],["3101",0,aporte]]);
  const cs=m(150e3,400e3,10e3);add(3,`Compra suministros para dar los servicios (materiales y útiles que se consumen en el trabajo) al contado por ${fm(cs)} y los paga con transferencia bancaria.`,[["1107",cs,0],["1102",0,cs]]);
  if(nivel>=2){const mob=m(300e3,800e3,10e3);add(4,`Compra equipo de cómputo para la oficina por ${fm(mob)}, pagado con transferencia bancaria.`,[["1201",mob,0],["1102",0,mob]],"mob")}
  const usd=m(300,900,50),tc=Math.round((500+R()*30)*100)/100,cr=r2(usd*tc);
  add(5,`Compra suministros a crédito a 30 días a un proveedor del exterior por ${fu(usd)} (factura en dólares). Tipo de cambio del día: ₡${NF2.format(tc)} por dólar.`,[["1107",cr,0],["2101",0,cr]],null,{mon:"USD",tc,me:[["1107",usd,0],["2101",0,usd]]});
  let prima=0;if(nivel>=2){prima=(12+Math.floor(R()*13))*12000;add(6,`Paga por adelantado la póliza de seguro de la oficina para los próximos 12 meses: ${fm(prima)} con transferencia bancaria.`,[["1105",prima,0],["1102",0,prima]])}

function totalesM1(i){const r=r1(i);let d=0,h=0;r.lines.forEach((l,j)=>{d+=montoO0(l.d)||0;h+=montoO0(l.h)||0;const nm=$("#nm"+j),c=CTA[codigoDe(l.c)];if(nm)nm.innerHTML=c?esc(c.n):(l.c?'<span style="color:var(--bad)">Cuenta no existe</span>':'<span class="muted">—</span>')});

function revisarM1(i){
  const t=CASO.trans[i],r=r1(i),H=r.hdr,msgs=[],res={};const exp={},stu={};
  const K=(c,cc)=>llevaCC(c)?c+"|"+(cc||""):c,cta=k=>k.split("|")[0],lbl=k=>{const [c,cc]=k.split("|");return `${c} «${nom(c)}»${cc?` (centro ${cc})`:""}`};
  t.lines.forEach(([c,d,h,cc])=>{const k=K(c,cc),x=exp[k]||(exp[k]={d:0,h:0});x.d+=d;x.h+=h});
  const ctasExp=new Set(Object.keys(exp).map(cta));
  let malNum=false,sinCuenta=false,ctaMala=false;
  r.lines.forEach((l,j)=>{const d=monto(l.d),h=monto(l.h),c=codigoDe(l.c);if(Number.isNaN(d)||Number.isNaN(h))malNum=true;if(!l.c){if(d||h)sinCuenta=true;return}if(!CTA[c]){ctaMala=true;res["c"+j]=false;return}const k=K(c,l.cc),x=stu[k]||(stu[k]={d:0,h:0});x.d+=d||0;x.h+=h||0;res["c"+j]=ctasExp.has(c)});
  const td=Object.values(stu).reduce((s,x)=>s+x.d,0),th=Object.values(stu).reduce((s,x)=>s+x.h,0);
  // Como SAP: no deja contabilizar un asiento descuadrado o sin líneas (no cuenta como intento)
  if(!Object.keys(stu).length||Math.abs(td-th)>.5||malNum||sinCuenta||ctaMala){
    const m=[];if(!Object.keys(stu).length)m.push("El asiento no tiene líneas.");if(malNum)m.push("Hay montos que no son números (escríbalos sin letras, por ejemplo 125000).");if(sinCuenta)m.push("Hay líneas con monto pero sin cuenta.");if(ctaMala)m.push("Hay un código de cuenta que no existe en el catálogo.");
    if(Object.keys(stu).length&&Math.abs(td-th)>.5)m.push(`El asiento no cuadra: diferencia de ${fm(Math.abs(td-th))} entre débito y crédito.`);
    RES["m1."+i]={html:`<div class="fb warn">⛔ No se puede contabilizar todavía:<ul>${m.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`};return true}
  res.fc=H.fc===t.fecha;res.fd=H.fd===t.fecha;res.ref=[t.ref,...(t.refs||[])].map(x=>String(x).toUpperCase()).includes(String(H.ref||"").trim().toUpperCase().replace(/\s+/g,""));res.com=String(H.com||"").trim().length>=5;
  if(!res.fc)msgs.push("La fecha de contabilización no corresponde a la fecha de la operación.");
  if(!res.fd)msgs.push("La fecha del documento no es la del documento de respaldo.");
  if(!res.ref)msgs.push("La Referencia 1 debe ser el número del documento de respaldo.");
  if(!res.com)msgs.push("Escriba en Comentarios una explicación corta de la operación.");
  const monE=t.mon||"CRC",monS=H.mon||"CRC";res.mon=monS===monE;if(!res.mon)msgs.push(monE==="USD"?"El documento está en dólares: el asiento se registra en moneda USD.":"Esta operación es en colones: la moneda del asiento es CRC.");
  if(monE==="USD"&&res.mon){res.tc=igual(monto(H.tc),t.tc)&&Math.abs(monto(H.tc)-t.tc)<.005;if(!res.tc)msgs.push("El tipo de cambio no es el del día de la operación.")}
  let ccFalta=false,ccSobra=false,ccMal=false;
  r.lines.forEach((l,j)=>{const c=codigoDe(l.c);if(!CTA[c])return;const v=l.cc||"";
    if(!llevaCC(c)){res["cc"+j]=!v;if(v)ccSobra=true;return}
    res["cc"+j]=!!exp[K(c,v)];if(!res["cc"+j]&&ctasExp.has(c)){if(!v)ccFalta=true;else ccMal=true}});
  if(ccFalta)msgs.push("Hay cuentas de resultados sin centro de costo.");if(ccSobra)msgs.push("Las cuentas de balance (activo, pasivo y patrimonio) no llevan centro de costo.");if(ccMal)msgs.push("Hay un centro de costo que no es el que indica la operación.");
  if(monE==="USD"&&res.mon){const eM={},sM={};t.me.forEach(([c,d,h])=>{const x=eM[c]||(eM[c]={d:0,h:0});x.d+=d;x.h+=h});
    r.lines.forEach(l=>{const c=codigoDe(l.c);if(!CTA[c])return;const x=sM[c]||(sM[c]={d:0,h:0});x.d+=montoO0(l.dme)||0;x.h+=montoO0(l.hme)||0});
    const malME=Object.keys(eM).filter(c=>!sM[c]||Math.abs(eM[c].d-sM[c].d)>.005||Math.abs(eM[c].h-sM[c].h)>.005);
    r.lines.forEach((l,j)=>{const c=codigoDe(l.c);res["me"+j]=!!eM[c]&&!malME.includes(c)});
    malME.filter(c=>sM[c]).forEach(c=>msgs.push(`Los montos en dólares (ME) de la cuenta ${c} «${nom(c)}» no son correctos.`))}
  const ctasStu=new Set(Object.keys(stu).map(cta));
  const falt=Object.keys(exp).filter(k=>!stu[k]),sobra=Object.keys(stu).filter(k=>!ctasExp.has(cta(k)));
  const faltCtas=[...new Set(falt.filter(k=>!ctasStu.has(cta(k))).map(cta))],faltLin=falt.filter(k=>ctasStu.has(cta(k)));
  if(faltCtas.length)msgs.push(`Falta${faltCtas.length>1?"n":""} ${faltCtas.length} cuenta${faltCtas.length>1?"s":""} en el asiento.`);
  if(faltLin.length&&!ccMal&&!ccFalta)msgs.push(`Falta${faltLin.length>1?"n":""} ${faltLin.length} línea${faltLin.length>1?"s":""}: el gasto se reparte entre centros de costo, use una línea por centro.`);
  sobra.forEach(k=>msgs.push(`La cuenta ${lbl(k)} no interviene en esta operación.`));
  Object.keys(exp).filter(k=>stu[k]).forEach(k=>{const e=exp[k],s=stu[k];if(!igual(e.d,s.d)||!igual(e.h,s.h)){
    const lado=(e.d&&!s.d&&s.h)||(e.h&&!s.h&&s.d);msgs.push(lado?`La cuenta ${lbl(k)} está en la columna equivocada: piense si aumenta o disminuye y cuál es su naturaleza.`:`El monto de la cuenta ${lbl(k)} no es correcto.`);
    r.lines.forEach((l,j)=>{if(K(codigoDe(l.c),l.cc)===k)res["c"+j]=false})}});
  const ok=!msgs.length;r.int++;if(r.pri===null)r.pri=ok;if(ok)r.ok=true;
  res.html=ok?`<div class="fb ok">✅ ¡Asiento contabilizado! Encabezado, cuentas y montos correctos, y cuadra: débito ${fm(td)} = crédito ${fm(th)}.</div>`:`<div class="fb bad">❌ Revise:<ul>${msgs.map(m=>`<li>${esc(m)}</li>`).join("")}</ul></div>`;
  RES["m1."+i]=res;
  const T=CASO.trans;ponerNota("m1",100*T.filter((_,k)=>ST.m1.r[k]&&ST.m1.r[k].ok).length/T.length);guardar();return true;
}

function evalCelda(path,pila){pila=pila||new Set();if(!path)return NaN;if(pila.has(path))return NaN;pila.add(path);
  const raw=String(getPath(ST,path)??"").trim();let v;

function evalFormula(f,pila){f=f.toUpperCase().replace(/\s+/g,"").replace(/SUM\(/g,"SUMA(");
  // SUMA(C1:C12) → suma del rango
  f=f.replace(/SUMA\(([A-Z])(\d+):([A-Z])(\d+)\)/g,(m,c1,r1,c2,r2_)=>{let t=0;const a=Math.min(+r1,+r2_),b=Math.max(+r1,+r2_),x=Math.min(c1.charCodeAt(0),c2.charCodeAt(0)),y=Math.max(c1.charCodeAt(0),c2.charCodeAt(0));
    for(let c=x;c<=y;c++)for(let r=a;r<=b;r++){const v=evalCelda(celdaPath(String.fromCharCode(c),r),pila);if(Number.isNaN(v))return "NaN";t+=v}return "("+t+")"});
  f=f.replace(/([A-Z])(\d+)/g,(m,c,r)=>{const v=evalCelda(celdaPath(c,+r),pila);return Number.isNaN(v)?"NaN":"("+v+")"});
  if(/NaN/.test(f)||!/^[0-9.,()+\-]+$/.test(f))return NaN;
  // números escritos con coma decimal o puntos de miles
  f=f.replace(/\d[\d.,]*/g,x=>{const v=monto(x);return Number.isNaN(v)?"NaN":String(v)});if(/NaN/.test(f))return NaN;
  try{const v=Function('"use strict";return ('+f+")")();return typeof v==="number"&&isFinite(v)?r2(v):NaN}catch(e){return NaN}}

function revisarECP(){const E=CASO.ECP,r={};let b=0,n=0;ECP_F.forEach(([k])=>[0,1,2].forEach(j=>{n++;const ok=igual(montoO0(getPath(ST,`m4.ecp.${k}.${j}`)),E[k][j]);r[k+j]=ok;if(ok)b++}));

  RES["m4.ecp"]=r;ponerNota("m4ecp",100*b/n);notaM4()}

  r.html=b===n?`<div class="fb ok">✅ ¡Flujo correcto! El efectivo final (${fm(F.ef)}) coincide con Caja + Bancos.</div>`:`<div class="fb bad">❌ ${b} de ${n} líneas correctas. Revise los signos: las salidas de efectivo y los aumentos de activos corrientes van en negativo.</div>`;

  if(M.includes("m2")){CASO.cods.forEach(revisarLM);notaLM();revisarM2()}

  const met={};M.forEach(m=>met[CRIT_T[m].auto]=ST.nota[m]||0);return met}

function statCat(pares){const E=pares.filter(p=>p.a&&p.a.completado),ps=E.map(p=>pctDe(p.a)).filter(v=>v!=null),venc=pares.filter(p=>!(p.a&&p.a.completado)&&vencida(p.t)).length;
  return {tot:pares.length,ent:E.length,pct:pares.length?Math.round(E.length*100/pares.length):0,prom:ps.length?Math.round(ps.reduce((a,b)=>a+b,0)/ps.length):null,venc,pend:pares.length-E.length-venc}}

     <span class="entbar"><i style="width:${x.pct}%"></i></span>
     <span class="entcard-s">${x.prom!=null?`Resultado promedio <b>${x.prom} %</b>${T.nota?"":" (sin nota)"}`:"Resultado promedio —"}</span>
     <span class="entcard-s">${x.pend?`⏳ ${x.pend} pendiente${x.pend===1?"":"s"}`:""}${x.pend&&x.venc?" · ":""}${x.venc?`<span style="color:var(--bad)">❌ ${x.venc} no realizado${x.venc===1?"":"s"}</span>`:""}</span></button>`}).join("")}</div></div>`}

  const vista=()=>{let c;try{c=casoDesdeFacturas(D.CF,D.seed)}catch(e){$("#naMsg").innerHTML=`<div class="fb bad">Las facturas no sirvieron para armar el caso: ${esc(e.message||e)}. Genere otra vez.</div>`;return}
    const prev=CASO;CASO=c;const tit=D.titulo||`${TIPOS_T[D.tipo].et} · ${D.CF.empresa.nombre}`;
    abrirDlg("👀 Vista previa · "+tit,`<p class="ayuda"><b>${esc(D.CF.empresa.nombre)}</b> · ${TIPO_EMP[D.CF.tipo_empresa||"comercial"]} · ${esc(D.CF.empresa.actividad||"")} · ${c.trans.filter(t=>t.factura).length} facturas · ${TIPOS_T[D.tipo].et} · ${esc(nomMatT(D.materia))}</p>
      <div class="scroll"><table><thead><tr><th>Día</th><th>Tipo</th><th>Contraparte</th><th>Condición</th><th>IVA</th><th class="r">Total</th><th></th></tr></thead><tbody>${c.trans.map((t,i)=>{const f=t.factura;if(!f)return `<tr><td>${t.dia}</td><td>Ajuste</td><td colspan="4">${esc(t.gl||t.desc)}</td><td></td></tr>`;const k=f.calc;return `<tr><td>${f.dia}</td><td>${{venta:D.CF.tipo_empresa==="servicios"?"Servicio":"Venta",compra:D.CF.tipo_empresa==="servicios"?"Compra suministros":"Compra",gasto:"Gasto"}[f.tipo]}${f.moneda==="USD"?" · USD":""}</td><td>${esc(f.contraparte.nombre)}</td><td>${f.condicion==="credito"?"Crédito "+f.plazo+" d":"Contado · "+MEDIO_N[f.medio]}</td><td>${[...new Set(k.L.map(l=>l.tarifa?l.tarifa+" %":"Exento"))].join(", ")}${k.t.desc?" · desc.":""}${k.t.flete?" · flete":""}</td><td class="r num">${f.moneda==="USD"?"$"+NF2.format(k.t.total):fm(k.t.total)}</td><td><button type="button" class="ghost sm" data-vf="${i}">Ver</button></td></tr>`}).join("")}</tbody></table></div>
      <details class="resn"><summary>📋 Evaluación que se va a usar (formato MEP)</summary><div class="ins">${instrumentoTxt({titulo:tit,contenido_actividad:{taller_tipo:D.tipo,taller_modulos:D.mods,taller_caso:D.CF,taller_desc:`Registra y procesa el ciclo contable de ${D.CF.empresa.nombre} a partir de facturas electrónicas.`}})}</div><p class="ayuda">Después de crearla puede ajustarla con <b>📋 Evaluación (MEP)</b> (también con ✨ IA).</p></details>
      <div id="vfac"></div><div id="naMsg"></div><div class="acc"><button type="button" class="sec" id="naVolver">← Cambiar datos</button><span style="flex:1"></span><button type="button" class="sec" id="naOtra">🔄 Generar otra vez</button><button type="button" id="naCrear">💾 Crear actividad (cerrada)</button></div>`);
    $$("[data-vf]").forEach(b=>b.onclick=()=>{$("#vfac").innerHTML=facturaHTML(c.trans[+b.dataset.vf])});
    CASO=prev;
    $("#naVolver").onclick=form;$("#naOtra").onclick=()=>{D.seed=nuevaSemilla();form();setTimeout(()=>$("#naGen").click(),50)};
    $("#naCrear").onclick=async ev=>{ev.target.disabled=true;$("#naMsg").innerHTML='<p class="muted">Creando…</p>';
      try{await crearActividadT(D,tit);cerrarDlg();toast("✅ Actividad creada (cerrada)");await cargarHub();pintar()}catch(err){ev.target.disabled=false;$("#naMsg").innerHTML=`<div class="fb bad">No se pudo crear: ${esc(err.message||err)}</div>`}}};
  form()}
async function crearActividadT(D,titulo){const T=TIPOS_T[D.tipo],hoy=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
  const desc=`Registra y procesa el ciclo contable de ${D.CF.empresa.nombre} (${D.CF.tipo_empresa==="servicios"?"empresa de servicios":"empresa comercial"}) a partir de ${D.CF.facturas.length} facturas electrónicas (IVA, descuentos, flete, contado y crédito, moneda extranjera y centros de costo).`;
  const criterios=D.mods.map(m=>({...CRIT_T[m],puntos_max:3,niveles:typeof tiraderaNivelesDe==="function"?tiraderaNivelesDe(CRIT_T[m]):undefined}));
  let ind=null;
  if(T.nota){const {data:ex}=await sb.from("indicadores").select("id,letra").eq("materia_id",D.materia).eq("categoria",T.nota);
    const usadas=new Set((ex||[]).map(e=>String(e.letra||"").trim().toUpperCase().replace(/\d+$/,"")));let i=0,letra="";for(;;){let n=i,l="";do{l=String.fromCharCode(65+(n%26))+l;n=Math.floor(n/26)-1}while(n>=0);if(!usadas.has(l)){letra=l;break}i++}
    const r=await sb.from("indicadores").insert({materia_id:D.materia,categoria:T.nota,letra,descripcion:desc,puntaje_maximo:3,fecha_evaluacion:D.fecha||hoy,orden:(ex||[]).length+1}).select().maybeSingle();
    if(r.error||!r.data)throw new Error(r.error?r.error.message:"no se pudo crear el indicador");ind=r.data;
    const niv=[[0,"Sin evidencia","No presenta el trabajo o tiene correcto menos del 35 % de lo solicitado."],[1,"Inicial","Tiene correcto entre el 35 % y el 59 % de los asientos, traslados, balanza o estados solicitados."],[2,"Intermedio","Tiene correcto entre el 60 % y el 84 % de los asientos, traslados, balanza o estados solicitados."],[3,"Avanzado","Tiene correcto el 85 % o más de los asientos, traslados, balanza o estados solicitados."]];
    try{await sb.from("criterios_indicador").insert(niv.map(([puntaje,nivel,d])=>({indicador_id:ind.id,puntaje,nivel,descripcion:d})))}catch(e){}}
  const C={estrategia:ESTR_T,taller_tipo:D.tipo,materia_id:D.materia,taller_desc:desc,taller_modulos:D.mods,taller_caso:D.CF,taller_seed:D.seed,fecha_entrega:["tarea","casa"].includes(D.tipo)&&D.fecha?D.fecha:null,criterios,
    taller_instrumento:{componente:T.nota||"Práctica",tipo:"Escala de desempeño",subarea:"Gestión contable",unidad:"Ciclos contables",resultado:RA_T,indicador:desc}};
  const {error}=await sb.from("trabajos_cotidianos").insert({titulo,fecha:hoy,tipo_actividad:"rubrica_directa",habilitado:false,indicador_id:ind?ind.id:null,contenido_actividad:C});
  if(error){if(ind)await sb.from("indicadores").delete().eq("id",ind.id);throw new Error(error.message)}}

/* ── Vista del estudiante sin actividad: sus actividades abiertas ── */
let CAT_EST=null;
async function pintarHubEstudiante(){$("#caso").innerHTML="";$("#app").innerHTML='<p class="muted" style="margin-top:20px">Cargando sus actividades…</p>';
  if(!HAY_BD()){$("#app").innerHTML=`<div class="card" style="margin-top:20px"><h3>🧮 Taller del Ciclo Contable</h3><p class="muted">Entre a la plataforma con su usuario y abra el Taller desde ahí.</p><a class="btn" href="index.html">Ir a la plataforma</a></div>`;return}
  try{const [{data:L},{data:em}]=await Promise.all([sb.from("trabajos_cotidianos").select("id,titulo,habilitado,contenido_actividad").eq("contenido_actividad->>estrategia",ESTR_T).order("id",{ascending:false}),sb.from("estudiante_materias").select("materia_id").eq("estudiante_id",EST_ID)]);
    const mis=(em||[]).map(x=>Number(x.materia_id)),ab=(L||[]).filter(t=>mis.includes(Number((t.contenido_actividad||{}).materia_id)));
    const {data:ae}=ab.length?await sb.from("actividades_estudiante").select("trabajo_id,completado,puntaje,porcentaje").eq("estudiante_id",EST_ID).in("trabajo_id",ab.map(t=>t.id)):{data:[]};
    const mias={};(ae||[]).forEach(a=>mias[a.trabajo_id]=a);const vis=ab.filter(t=>t.habilitado!==false||mias[t.id]);
    const st={};CATS_T.forEach(k=>st[k]=statCat(vis.filter(t=>catT(t)===k).map(t=>({t,a:mias[t.id]}))));
    if(!CAT_EST)CAT_EST=CATS_T.find(k=>vis.some(t=>catT(t)===k&&!(mias[t.id]&&mias[t.id].completado)))||CATS_T.find(k=>st[k].tot)||"evaluativa";
    const T=TIPOS_T[CAT_EST],G=vis.filter(t=>catT(t)===CAT_EST);
    const estado=(t,a)=>a&&a.completado?`<span class="chip ok">✅ ${T.nota?"Entregada":"Terminada"}</span>`:vencida(t)?`<span class="chip bad">❌ No realizada</span>`:t.habilitado===false?`<span class="chip">🔒 Cerrada</span>`:a?`<span class="chip warn">⏳ En curso</span>`:`<span class="chip">🆕 Pendiente</span>`;
    const resultado=a=>{const p=pctDe(a);return p==null?'<span class="muted">—</span>':`<b style="color:${colorPct(p)}">${p} %</b>${T.nota?`<br><small class="muted">Nota ${a.puntaje!=null?a.puntaje:nivelDe(p)}/3 · ${["Sin evidencia","Inicial","Intermedio","Avanzado"][a.puntaje!=null?a.puntaje:nivelDe(p)]}</small>`:""}`};
    const accion=(t,a)=>t.habilitado===false&&!(a&&a.completado)?'<span class="muted">—</span>':`<a class="btn sm ${a&&a.completado?"sec":""}" href="taller-contable.html?a=${t.id}">${a&&a.completado?(T.nota?"👁️ Ver lo que entregué":"👁️ Ver resultados y soluciones"):a?"▶ Seguir":"▶ Empezar"}</a>`;
    $("#app").innerHTML=`<div class="card" style="margin-top:16px"><h3>🧮 Mis trabajos del Taller del Ciclo Contable</h3><p class="ayuda">Prácticas y tareas que abrió su profe, de empresas <b>comerciales</b> y <b>de servicios</b>. Todas salen de facturas electrónicas: véalas, regístrelas y siga el ciclo contable. <button type="button" class="ghost sm" id="verEstr2">📘 Comercial vs servicios</button></p>
      ${tarjetasCat(st,CAT_EST,"yo")}
      <h4 class="hub-g">${T.ic} ${T.pl} <small>· ${T.desc}</small></h4>
      ${G.length?`<div class="scroll"><table class="tbl-est"><thead><tr><th>Práctica</th><th>Empresa</th><th>Fecha de entrega</th><th>Estado</th><th class="r">Resultado</th><th>Solución</th></tr></thead><tbody>
        ${G.map(t=>{const C=t.contenido_actividad||{},a=mias[t.id];return `<tr><td><b>${esc(t.titulo)}</b></td><td>${(C.taller_caso||{}).tipo_empresa==="servicios"?"🛠️ Servicios":"🛒 Comercial"}</td><td>${C.fecha_entrega?fechaCR(C.fecha_entrega):'<span class="muted">—</span>'}</td><td>${estado(t,a)}</td><td class="r num">${resultado(a)}</td><td>${accion(t,a)}</td></tr>`}).join("")}</tbody></table></div>`:`<p class="muted">No tiene ${T.pl.toLowerCase()} por ahora.</p>`}
      <p class="ayuda" style="margin-top:10px">${T.nota?"📋 Al entregar, la plataforma revisa todo y la nota (escala MEP 0 a 3) pasa sola a la Rúbrica. Las soluciones no se muestran en las que llevan nota.":TIPOS_T[CAT_EST].rev?"Puede revisar, ver pistas y soluciones mientras trabaja.":"Como en el examen: al terminar ve su resultado y las soluciones."}</p></div>`;
    $$("#app [data-cat]").forEach(b=>b.onclick=()=>{CAT_EST=b.dataset.cat;pintarHubEstudiante()});const ve=$("#verEstr2");if(ve)ve.onclick=verEstructuras}
  catch(e){$("#app").innerHTML=`<div class="card"><p class="fb bad">No se pudieron cargar sus actividades: ${esc(e.message||e)}</p></div>`}}

/* ── Soluciones y entrada de datos ── */
function ligarSol(rep){$$("[data-sol]").forEach(b=>b.onclick=()=>{const k=b.dataset.sol;ST.sol[k]=!ST.sol[k];guardar();rep()})}
document.addEventListener("input",e=>{const p=e.target.dataset&&e.target.dataset.p;if(!p)return;setPath(ST,p,e.target.value);e.target.classList.remove("ok","bad");guardar();if(p.startsWith("m1."))totalesM1(ST.m1.sel||0)});
document.addEventListener("change",e=>{if(document.body.classList.contains("bloq")&&e.target.closest&&e.target.closest("#mod"))return;const p=e.target.dataset&&e.target.dataset.p;if(!p||e.target.tagName!=="SELECT")return;setPath(ST,p,e.target.value);e.target.classList.remove("ok","bad");guardar();if(/^m1\.r\.\d+\.hdr\.mon$/.test(p))pintarM1()});
if(ACTV.id)cargarActividad();
pintar();
</script>
